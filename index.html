<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Maladies QC">
<meta name="theme-color" content="#0f766e">
<meta name="format-detection" content="telephone=no">
<title>Maladies QC — DMV Briheche</title>
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
#gate{position:fixed;top:0;right:0;bottom:0;left:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:24px;background:linear-gradient(140deg,#064e3b 0%,#0f766e 55%,#2dd4bf 100%)}
#gate form{width:100%;max-width:360px;text-align:center;color:#fff}
.gate-ic{width:84px;height:84px;margin-bottom:10px;opacity:.95}
.gate-k{font-size:13px;font-weight:700;letter-spacing:1.5px;text-transform:uppercase;opacity:.9}
#gate h1{margin:4px 0 6px;font-size:30px}
#gate p{margin:0 0 22px;opacity:.9;font-size:15px}
#gate-pw{width:100%;border:0;border-radius:14px;padding:15px 16px;font-size:18px;text-align:center;letter-spacing:2px;color:#0f172a;background:#fff;box-shadow:0 6px 20px rgba(0,0,0,.18);-webkit-appearance:none;appearance:none;outline:none}
.gate-rem{display:flex;gap:8px;align-items:center;justify-content:center;margin:14px 0;font-size:14px;opacity:.95}
.gate-rem input{width:18px;height:18px;accent-color:#fff}
#gate-btn{width:100%;border:0;border-radius:14px;padding:14px;font-size:17px;font-weight:700;background:#064e3b;color:#fff;box-shadow:0 6px 20px rgba(0,0,0,.2);cursor:pointer}
#gate-btn:disabled{opacity:.6}
#gate-msg{min-height:22px;margin-top:14px;font-size:14.5px;font-weight:600}
#gate-msg.err{color:#ffe0e0;background:rgba(198,40,40,.35);border-radius:10px;padding:8px}
</style>
</head>
<body>
<div id="gate"><form id="gate-form" autocomplete="off">
  <svg class="gate-ic" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4.5" y="10.5" width="15" height="10" rx="2.2"/><path d="M8 10.5V7.5a4 4 0 0 1 8 0v3"/><circle cx="12" cy="15.5" r="1.3"/></svg>
  <div class="gate-k">DMV Briheche</div><h1>Maladies QC</h1><p>Accès réservé. Entrez le mot de passe.</p>
  <input id="gate-pw" type="password" inputmode="text" autocapitalize="characters" autocorrect="off" spellcheck="false" placeholder="Mot de passe" aria-label="Mot de passe">
  <label class="gate-rem"><input id="gate-rem" type="checkbox"> Rester connecté sur cet appareil</label>
  <button id="gate-btn" type="submit">Entrer</button><div id="gate-msg"></div></form></div>
<noscript><p style="position:fixed;top:0;left:0;right:0;z-index:2000;background:#fff;color:#000;padding:16px">JavaScript est nécessaire pour ouvrir l'application.</p></noscript>
<script src="boot.js"></script>
</body>
</html>
