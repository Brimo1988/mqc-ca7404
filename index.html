HÉRAPEUTIQUE=Les anthelminthiques doivent être administrés jusqu'à l'âge de 6 mois ;\nPamoate de Pyrantel 5-10 mg/kg PO q 2 semaines ; ou Fenbendazole 50 mg/kg PO q 24h pendant 3 jours (1-2 traitements habituellement suffisants) ou Ivermectine 0,2 mg/kg PO ou SC (12 traitements habituellement suffisants ; attention aux risques etc.\n• Milbémycine 0,5 mg/kg PO (chiens) ou 2 mg/kg (chats) PO q30 jours. Fenbendazole, moxidectine etc.\nSUIVI/PRÉVENTION- Surveiller le nombre d'œufs fécaux après traitement et l'hématocrite chez les patients anémiques. Débuter un traitement anthelminthique bihebdomadaire des chiots à 2 semaines d'âge ; continuer jusqu'au sevrage. Puis passer à une prévention mensuelle. Traiter la chatte avec un anthelminthique adulticide/larvicide avant la reproduction et après la mise bas.\nPRONOSTIC=Le pronostic est excellent"}]},{"id":"ascaris","nom":"Ascaridiose (Toxocara)","sys":"Digestif","urg":false,"resume":"Chiots/chatons au ventre ballonné, poil terne, vomissement de vers. Œufs à la flottation. Zoonose.","src":["SAM 2 — ascaris"],"img":[],"sp":{"chien":{"tx":[{"d":"pyrantel","r":"1","n":""},{"d":"fenbendazole","r":"2","n":""},{"d":"febantel_pyr_prazi","r":"2","n":""}],"maj":"Déparasitage précoce et répété des chiots (calendrier selon les recommandations CAPC et le protocole de la clinique).","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"pyrantel","r":"1","n":""},{"d":"emodepside","r":"2","n":""},{"d":"selamectine","r":"P","n":""}],"maj":"Zoonose (larva migrans viscérale/oculaire) : hygiène et prévention.","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"ASCARIS-\nChez les chiots le mode d'infection habituel est transplacentaire. Si un chiot <3 mois ingère un œuf embryonné, la larve éclose pénètre la muqueuse intestinale, atteint les poumons via le foie et la circulation sanguine, est toussée, avalée, et mûrit en adulte producteur d'œufs dans l'intestin grêle. Le 1er signe d'infection chez le chiot est un manque de croissance, un pelage terne, un ventre ballonné. Les œufs sont brun clair avec une coque protéique épaisse et piquetée. Ascaridiose causée par Toxocara canis (chiens), T. cati (chats), et Toxascara leonina (chiens et chats)\n• SUBJECTIF-Habituellement sans particularité ; le parasite est découvert fortuitement lors d'un examen fécal de routine, ou l'infection n'est jamais détectée. Des vomissements occasionnels avec ou sans vers peuvent inciter le propriétaire à consulter. Dans les cas manifestes, présence de vers dans les selles ou diarrhée, un aspect ventru montrant une distension abdominale/colique. Faiblesse, perte d'état, cachexie ; mauvais allaitement ou appétit ; selles rares. Toux due à la migration larvaire pulmonaire. Toute la portée peut être affectée.\n• OBJECTIF-Typiquement, aucune anomalie physique n'est notée, comme ci-dessus. Il a été suggéré qu'essentiellement tous les chiots sont infectés par T. canis.\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=• Infections à Ancylostoma spp. (Ankylostomes), Trichuris vulpis (trichures— chiens seulement), Giardia intestinalis, et Cystoisospora (coccidies)\n• Entérite produite par Campylobacter spp.\n• Parvovirus canin\n• Panleucopénie féline\n• Invagination ou ingestion de corps étranger (si occlusion)\n• PLAN- DIAGNOSTICS=NFS/Chimie- habituellement normal. La flottaison fécale doit être réalisée systématiquement chez tous les chiots et chatons jusqu'à l'âge de 6 mois. Les œufs ont une membrane externe sphérique piquetée,\nTHÉRAPEUTIQUE=Traiter les chiennes gestantes pour réduire la transmission transplacentaire ultérieure :\nFenbendazole 50 mg/kg PO q 24h pendant 3 jours. Milbémycine oxime 0,5 mg/kg PO (chiens) ou 2 mg/kg (chats) PO q30 jours.\nL'ivermectine à une dose parasiticide peut être efficace\nPRONOSTIC=bon\nTÉNIA-\nLes stades adultes du parasite peuvent être traités avec du praziquantel 2,5-7,5 mg/kg PO ou SC une fois. Éviter la consommation de viande ou de viscères crus ou insuffisamment cuits par les humains, chiens ou chats"}]},{"id":"coccidiose","nom":"Coccidiose (Cystoisospora)","sys":"Digestif","urg":false,"resume":"Très jeunes ou immunodéprimés : diarrhée, parfois hémorragique. Oocystes à la flottation (Cystoisospora canis/felis).","src":["SAM1 — Coccidies","SAM 2 — coccidiose"],"img":[],"sp":{"chien":{"tx":[{"d":"sulfa_tmp","r":"1","n":"Triméthoprime-sulfa (produit humain Sulfatrim®)"},{"d":"ponazuril","r":"2","n":"Hors AMM (Marquis®)"},{"d":"toltrazuril","r":"2","n":"Hors AMM (Baycox®)"}],"maj":"La sulfadiméthoxine (Albon®) citée dans vos notes n'est pas répertoriée dans la BDPP canadienne : utiliser une alternative.","qc":"","al":"Sulfadiméthoxine (Albon®) : non commercialisée au Canada selon la BDPP.","gl":[]},"chat":{"tx":[{"d":"sulfa_tmp","r":"1","n":""},{"d":"ponazuril","r":"2","n":"Hors AMM"},{"d":"toltrazuril","r":"2","n":"Hors AMM"}],"maj":"Traiter aussi l'environnement (litière, fèces fréquents).","qc":"","al":"Sulfadiméthoxine (Albon®) : non commercialisée au Canada selon la BDPP.","gl":[]}},"notes":[{"label":"Tableau SAM1 — Coccidies Cystoisospora canis, felis","fields":[{"k":"Signes cliniques / examen physique","t":"très jeunes ou adultes immunosupprimés"},{"k":"Diagnostic différentiel","t":"virale, bactérienne, autres parasites,\nécart alimentaire"},{"k":"Diagnostic","t":"Examen de flottation fécale"},{"k":"Traitement (Rx)","t":"sulfadiméthoxine (suspension orale Albon 5 %) PO q 24h pendant 5–20 jours"},{"k":"Pronostic / prévention","t":"Bon à excellent ; la plupart des animaux répondent rapidement au traitement"},{"k":"Surveillance / examens complémentaires","t":"problème dans les environnements insalubres"}]},{"label":"SAM 2 (notes détaillées)","text":"COCCIDIOSE-\n• SUBJECTIF-Vomissements, diarrhée avec ou sans sang ; souvent malodorante, pâteuse à semi-formée à liquide, inappétence, inconfort abdominal. Animal immunodéprimé/sevrage récent/conditions de surpeuplement.\n• OBJECTIF-Perte de poids (ou mauvaise croissance), déshydratation, inconfort abdominal possible.\n• ÉVALUATION-\nLISTE DES PROBLÈMES= DDx=• Diarrhée virale : parvovirus, coronavirus, rotavirus\n• Diarrhée bactérienne : Clostridium, Campylobacter, Salmonella enteritidis\n• Autres parasites gastro-intestinaux\n• Écart alimentaire.\n• PLAN- DIAGNOSTICS=NFS/chimie- normal Examen de flottaison fécale -mise en évidence d'oocystes caractéristiques.\n• L'ELISA pour le parvovirus peut être indiqué chez les chiots et chatons atteints avec diarrhée sévère pour rechercher une entérite parvovirale et une panleucopénie concomitantes, respectivement.\n• Les chatons doivent être testés pour le virus de la leucose féline ou le virus de l'immunodéficience féline FeLV/FIV (âgés de plus de 4 mois).\nTHÉRAPEUTIQUE=Traitement de choix : Sulfadiméthoxine (suspension orale Albon 5%) : - 50-60 mg/kg PO q 24h pendant 5-20 jours OU (50 mg/kg le premier jour et 25 mg/kg/jour pendant 2–3 semaines ensuite) peut être utilisé. Chez les chats cliniquement atteints, le triméthoprime-sulfamide (30–60 mg/kg/jour pendant 6 jours) peut être utilisé. Ponazuril (Marquis) 20 mg/kg PO deux fois, à 1-7 jours d'intervalle ; ou 50 mg/kg PO une fois\nPRONOSTIC=Bon à excellent"}]},{"id":"ver_estomac","nom":"Ver de l'estomac (Physaloptera, Ollulanus)","sys":"Digestif","urg":false,"resume":"Vomissements chroniques/intermittents. Physaloptera (chien, chat), Ollulanus (chat).","src":["SAM1 — Ver de l'estomac"],"img":[],"sp":{"chien":{"tx":[{"d":"pyrantel","r":"1","n":"Physaloptera"},{"d":"fenbendazole","r":"2","n":""}],"maj":"Physaloptera : œufs embryonnés rares aux flottations; envisager un traitement d'épreuve.","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"pyrantel","r":"1","n":"Ollulanus : répéter dans 2–3 semaines"},{"d":"fenbendazole","r":"2","n":""}],"maj":"Ollulanus tricuspis : diagnostic par examen du vomi.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau SAM1 — Ver de l'estomac","fields":[{"k":"Signes cliniques / examen physique","t":"Physaloptera spp. chiens et chats. Ollulanus - chat. Vomissements"},{"k":"Diagnostic différentiel","t":"Écart alimentaire, allergie alimentaire, corps étranger GI, gastrite à Helicobacter, médicaments/toxines (AINS, antibiotiques, plantes, plomb)"},{"k":"Diagnostic","t":"Examen microscopique des vomissures, vermifugation empirique"},{"k":"Traitement (Rx)","t":"Physaloptera : pyrantel 5 mg/kg PO (chien), 20 mg/kg PO (chat). Ollulanus : pyrantel 20 mg/kg PO, répéter dans 2–3 semaines"},{"k":"Pronostic / prévention","t":"excellent. préventif de la dirofilariose avec pyrantel, bloquer l'accès aux hôtes intermédiaires - scarabées et grillons"}]}]},{"id":"pancreatite","nom":"Pancréatite","sys":"Digestif","urg":true,"resume":"Écart alimentaire gras, médicament; anorexie, vomissements, douleur abdominale crâniale. Chat : signes souvent vagues (léthargie, anorexie, vomissements dans 33 % des cas). cPLI/fPLI + échographie.","src":["Urgences (pancréatite)","SAM 2 — pancréatite"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":"Réhydratation puis entretien"},{"d":"buprenorphine","r":"1","n":"Analgésie multimodale"},{"d":"methadone","r":"1","n":""},{"d":"maropitant","r":"1","n":"Antiémétique et analgésique viscéral"},{"d":"ondansetron","r":"2","n":""},{"d":"famotidine","r":"S","n":"Pas systématique"},{"d":"diete_therapeutique","r":"S","n":"Alimentation entérale précoce, peu grasse; pas de jeûne prolongé"}],"maj":"Le jeûne prolongé n'est plus recommandé : nutrition entérale précoce. Le fuzapladib (Panoquell-CA1®) est approuvé conditionnellement aux États-Unis (2022) mais n'est pas répertorié dans la BDPP canadienne.","qc":"","al":"","gl":["acvim_gi_protect_2018"]},"chat":{"tx":[{"d":"fluides","r":"U","n":""},{"d":"buprenorphine","r":"1","n":""},{"d":"maropitant","r":"1","n":""},{"d":"mirtazapine","r":"S","n":"Mirataz® (appétit)"},{"d":"capromorelin","r":"S","n":"Elura®"},{"d":"cobalamine","r":"S","n":"Si hypocobalaminémie"}],"maj":"ACVIM 2021 : diagnostic par fPLI + échographie; traitement de soutien (fluides, analgésie, antiémétiques), nutrition précoce, rechercher les maladies concomitantes (entérite, cholangite = « triade féline »).","qc":"","al":"","gl":["acvim_pancreatite_chat_2021"]}},"notes":[{"label":"Tableau des urgences — Pancréatite","fields":[{"k":"Signes cliniques / examen physique","t":"Écart alimentaire (aliment riche en gras). Anorexie et vomissements. Douleur abdominale et déshydratation"},{"k":"Diagnostic différentiel","t":"Troubles GI. Autres maladies systémiques : rénales, hépatiques, du SNC"},{"k":"Diagnostic","t":"FSC et biochimie : non spécifiques. Échographie abdominale : pancréas hypertrophié. Lipase et amylase sériques. Test SNAP cPL (très sensible)."},{"k":"Traitement (Rx)","t":"Traitement de soutien : LRS, corriger la réhydratation et l'entretien, bolus possible (30 ml/kg). Buprénorphine 0,01 mg/kg IM, Cerenia (1 mg/kg SC), famotidine, alimentation entérale précoce très faible en gras (alimentation à la seringue)"},{"k":"Pronostic / prévention","t":"Bon dans les cas légers et mauvais dans les cas sévères"},{"k":"Surveillance / examens complémentaires","t":"Bilan de coagulation, cPL spécifique"}]},{"label":"SAM 2 (notes détaillées)","text":"PANCRÉATITE SUBJECTIF – antécédent d'écart alimentaire et de médicaments – azathioprine, KBr, l-asparaginase, phénobarbital.\n• CHIENS- vomissements, diarrhée, anorexie, douleur abdominale crâniale. Antécédent d'écart alimentaire (souvent aliments riches en graisses)\n• CHATS-léthargie non spécifique et anorexie. Vomissements dans seulement 33% des cas.\nFaiblesse, douleur abdominale Diarrhée-moins fréquente OBJECTIF – CHIENS- Douleur abdominale Déshydratation Fièvre Ictère possible CHATS-Signes vagues comme léthargie Déshydratation, hypothermie dans les cas sévères Douleur abdominale dans seulement 25% des cas, ictère possible\nÉVALUATION\n• Liste des problèmes – anorexie et vomissements.\n• DDx – troubles G.I. comme infectieux, inflammatoire, mécanique. ex- occlusion, corps étranger, perforation, gastro-entérite infectieuse, maladie ulcéreuse Maladie hépatique Maladie rénale\nPLAN\n• DIAGNOSTIC ■NFS (résultats variables et non spécifiques) révèle souvent une anémie\nnon régénérative (40%), leucocytose (38%), et/ou leucopénie (15%) ■BIOCHIMIE – amylase et lipase augmentées. (utilité limitée), (ALT, PAL) sont souvent élevées en raison d'une ischémie hépatique\n• Radiographies abdominales – pour écarter un corps étranger ■Échographie – examen de choix pancréas HYPOéchogène, tissu environnant HYPERéchogène. pancréas augmenté de volume, accumulation de liquide autour du pancréas. ■Confirmation –test sensible immunoréactivité de la lipase pancréatique spécifique SNAP cPLI OU fPLI.\n• THÉRAPEUTIQUE ■FLUIDES IV (NaCl 0,9%) ■ANTIDOULEUR – Butorphanol 0,2mg/kg SC, IM, IV q 3-6h ou Buprénorphine (0,01–0,02 mg/kg IM, IV, ou SC q 6–12h)\n• Antiémétique – Maropitant 1 mg/kg SC ■Antibiotiques – ampicilline 22mg/kg IV s'il y a infection/sepsis/nécrose pancréatique ■Famotidine – 0,5mg/kg IV ■PLAN ALIMENTAIRE – à jeun puis alimentation ULTRA PAUVRE EN GRAISSES. ■utiliser 20 mEq de KCl/L de fluide IV -une supplémentation en chlorure de potassium (KCl)\nest habituellement nécessaire en raison de la perte de potassium dans les vomissements.\n• Surveiller – NFS, BIOCHIMIE, BILAN DE COAGULATION, cPLI/fPLI tous les 2-3 jours\n• PRONOSTIC – dépend de la sévérité de la maladie. Les cas précoces et bien pris en charge ont un bon pronostic. Maladie sévère avec nécrose pancréatique, insuffisance rénale aiguë, CIVD ou autres complications possibles =réservé à sombre."}]},{"id":"lipidose","nom":"Lipidose hépatique féline","sys":"Digestif","urg":true,"resume":"Chat obèse avec anorexie prolongée et perte de poids rapide; ictère, léthargie. Cytologie hépatique; rechercher la maladie sous-jacente (pancréatite, entérite, MRC, néoplasie).","src":["Urgences (lipidose)","SAM 2 — lipidose hépatique"],"img":[],"sp":{"chat":{"tx":[{"d":"diete_therapeutique","r":"1","n":"Alimentation par sonde d'œsophagostomie, progressive"},{"d":"fluides","r":"U","n":"NaCl 0,9 % + KCl; éviter dextrose/lactate de Ringer d'après vos notes"},{"d":"kcl","r":"S","n":"Surveiller K, phosphore, Mg (syndrome de réalimentation)"},{"d":"vitamine_k1","r":"S","n":""},{"d":"maropitant","r":"S","n":""},{"d":"mirtazapine","r":"S","n":"Appétit (Mirataz®)"},{"d":"capromorelin","r":"S","n":"Elura®"},{"d":"same","r":"S","n":""}],"maj":"La nutrition entérale précoce par sonde est le traitement central; surveiller le syndrome de réalimentation (K, P, Mg). Pas de corticoïdes.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau des urgences — Lipidose hépatique (p.919)","fields":[{"k":"Signes cliniques / examen physique","t":"CHATS : anorexie prolongée, antécédents d'obésité, perte de poids rapide, antécédent d'événement stressant, ictère, vomissements et ventroflexion du cou (↓K ou phosphore), ALP et ALT élevées, GGT normale"},{"k":"Diagnostic différentiel","t":"Cholangiohépatite, pancréatite, PIF, néoplasie, FIV/FeLV, ACD, obstruction extrahépatique des voies biliaires"},{"k":"Diagnostic","t":"élévation ALP > ALT, ↑ bilirubine (sang et urine), GGT normale, coagulopathies fréquentes, échographie abdominale / ponction à l'aiguille fine (PAF) du foie"},{"k":"Traitement (Rx)","t":"sonde d'œsophagostomie (50 kcal/kg/jour). Fluidothérapie : NaCl, KCl, vitamine K1 1 mg/kg SC ou IM aux 12 heures, complexe B (ajouté aux solutés : 1–2 mL/L), B1, Cerenia, pas de stéroïdes !"},{"k":"Pronostic / prévention","t":"bon à excellent. Éviter l'obésité"},{"k":"Surveillance / examens complémentaires","t":"biochimie et électrolytes q4,"},{"k":"Commentaires","t":"Éviter le LRS (lactate mal métabolisé en raison de la dysfonction hépatique). Pas de stéroïdes"}]},{"label":"SAM 2 (notes détaillées)","text":"LIPIDOSE HÉPATIQUE\nSUBJECTIF – anorexie prolongée et perte de poids rapide, antécédent d'événement stressant, léthargie, ictère, vomissements et diarrhée ou constipation sporadiques.\n• DM, TÉTRACYCLINE, STANOZOLOL – médicaments\n• CHAT OBÈSE\nOBJECTIF\n• Ictère, muqueuses pâles, hépatomégalie, fonte musculaire, perte de poids, ptyalisme\n• Faiblesse, ventroflexion du cou (hypokaliémie), hémolyse (hypophosphatémie), décubitus\nÉVALUATION\n• Liste des problèmes ■ictère, anorexie, jaunisse\n• DDx – pancréatite\nMICI Cholangite/cholangiohépatite Hyperthyroïdie Néoplasie hépatique, insuffisance rénale.\nPLAN\n• DIAGNOSTIC-Le diagnostic est suspecté sur la base de la découverte d'un ictère chez un\nchat obèse afébrile avec un antécédent d'anorexie et de perte de poids et des caractéristiques biologiques d'hyperbilirubinémie, une phosphatase alcaline sérique (PAL) augmentée avec une gamma-glutamyltransférase (GGT) normale à légèrement augmentée, et une NFS non inflammatoire. Les résultats échographiques incluent un foie nettement hyperéchogène. Le diagnostic définitif nécessite une biopsie hépatique, mais la cytologie suffit souvent pour un diagnostic présomptif.\n• Bilan sanguin – (NFS)-anémie normocytaire normochrome hémolyse (secondaire à une hypophosphatémie ou des corps de Heinz) (bilan biochimique sérique)-augmentation de la bilirubine, augmentation de la PAL/ALT et augmentation normale à légère de la GGT, diminution des protéines (albumine), hypophosphatémie, hypokaliémie #augmentation plus importante de la PAL que de l'ALT ■RADIOGRAPHIES – foie augmenté de volume. ■Échographie - taille du foie normale à augmentée avec parenchyme hyperéchogène reflétant\nune vacuolisation lipidique hépatique. ■Cytoponction – cytologie du foie=avec gouttelettes lipidiques cytoplasmiques, vacuolisation sévère des hépatocytes. ■FPL – pour écarter une pancréatite ■Endoscopie gastrique – pour écarter une MICI\n• THÉRAPEUTIQUE ■(corriger les anomalies liquidiennes et électrolytiques)\nFLUIDE IV (NaCl 0,9%) + Ajouter KCl 20-40 mEq/L (Éviter le dextrose\net le Ringer lactate) + Complexe vitaminique B – 2ml dans la poche IV ■Vitamine K1 0,5mg/kg SC en cas de profil de coagulation anormal (recommandé\npour tous les chats avec suspicion de LH) ■S-adénosylméthionine (SAMe) 20-40 mg/kg/jour PO La supplémentation en SAMe doit être accompagnée d'une quantité suffisante de B12, folate, et\nd'autres vitamines hydrosolubles pour assurer un bénéfice métabolique optimal ■ALIMENTATION FORCÉE/SONDE NASOGASTRIQUE/GASTROSTOMIE – régime riche en protéines et à haute densité calorique\n• Pronostic – diagnostiqué précocement et bien pris en charge = excellent Mauvais=avec pancréatite concomitante."}]},{"id":"insuffisance_hepatique","nom":"Insuffisance hépatique aiguë","sys":"Digestif","urg":true,"resume":"Début aigu après médicament, toxine ou aliment : ictère, vomissements, saignements, encéphalopathie. Bilirubine, enzymes hépatiques, acides biliaires, coagulation.","src":["Urgences (insuffisance hépatique)"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":"NaCl + dextrose 2,5–5 % + potassium"},{"d":"nac","r":"1","n":"Antidote/hépatoprotecteur"},{"d":"same","r":"S","n":""},{"d":"vitamine_k1","r":"S","n":""},{"d":"colloides","r":"S","n":"Plasma si coagulopathie"},{"d":"maropitant","r":"S","n":""},{"d":"lactulose","r":"S","n":"Si encéphalopathie hépatique"}],"maj":"Rechercher la cause (toxique, médicament, infection, ischémie); l'hépatite chronique du chien est détaillée dans le consensus ACVIM 2019.","qc":"","al":"","gl":["acvim_hepatite_2019"]},"chat":{"tx":[{"d":"fluides","r":"U","n":""},{"d":"nac","r":"1","n":""},{"d":"same","r":"S","n":""},{"d":"vitamine_k1","r":"S","n":""},{"d":"lactulose","r":"S","n":"Si encéphalopathie"}],"maj":"Chat : lipidose, cholangite, toxiques (acétaminophène) à exclure.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau des urgences — Insuffisance hépatique (p.916)","fields":[{"k":"Signes cliniques / examen physique","t":"Antécédents d'administration récente de médicament, d'aliment ou de toxine. Apparition aiguë d'anorexie, léthargie, vomissements et diarrhée, PU/PD, signes d'EH, déshydratation, ictère (+/−), saignements excessifs (hématémèse, méléna, hémorragies). Augmentation inattendue des enzymes hépatiques sériques."},{"k":"Diagnostic différentiel","t":"Anémie hémolytique, obstruction biliaire, sepsie, maladie hépatique chronique"},{"k":"Diagnostic","t":"FSC : pour exclure l'anémie hémolytique. Biochimie : ALT, ALP, bilirubine augmentées, hypoglycémie, coagulopathie. Analyse d'urine : bilirubinurie. Radiographie abdominale : foie normal ou augmenté de volume, échographie abdominale. Hypoalbuminémie - chronique ; azotémie - déshydratation/atteinte rénale (lepto, AINS). Biopsie hépatique."},{"k":"Traitement (Rx)","t":"solutés NaCl + dextrose 2,5–5 % + potassium. Hépatoprotecteurs : N-acétylcystéine 140 mg/kg IV en 20 minutes puis 70 mg/kg IV q6h, SAMe (20 mg/kg PO q24h, source de glutathion) ou silybine (chardon-Marie 50 mg/kg IV q24h), vit. E, Cerenia, famotidine, plasma (10 ml/kg à un débit de 3 ml/minute) et vit. K1 (0,5–1 mg/kg q12–24h SC pendant deux ou trois doses ou jusqu'à normalisation du PT), lactulose et métronidazole 15 mg/kg, Keppra (lévétiracétam) en cas de convulsions."},{"k":"Pronostic / prévention","t":"Si avancé (EH, coagulopathie, hypoglycémie) réservé. Cas légers : rétablissement complet possible"},{"k":"Surveillance / examens complémentaires","t":"Biochimie sérique, profils de coagulation, glycémie, FSC"},{"k":"Commentaires","t":"Fournir des protéines alimentaires adéquates (produits laitiers et œufs) et des calories. Ne pas restreindre les protéines alimentaires sauf en présence d'encéphalopathie hépatique. Éviter les médicaments nécessitant un métabolisme hépatique."}]}]},{"id":"encephalopathie_hepatique","nom":"Encéphalopathie hépatique","sys":"Digestif","urg":true,"resume":"Atteinte cérébrale diffuse : léthargie, errance, pression de la tête contre un mur, convulsions; liée à l'hyperammoniémie. Acides biliaires, ammoniémie.","src":["Urgences (encéphalopathie hépatique)"],"img":[],"sp":{"chien":{"tx":[{"d":"lactulose","r":"1","n":"Voie orale ou lavement"},{"d":"metronidazole","r":"2","n":"Réduction de la flore productrice d'ammoniac"},{"d":"ampicilline","r":"2","n":""},{"d":"diete_therapeutique","r":"S","n":"Protéines de bonne qualité, restriction modérée"},{"d":"levetiracetam","r":"S","n":"Si convulsions"},{"d":"diazepam","r":"U","n":"Convulsions aiguës (prudence)"}],"maj":"Traiter le facteur déclenchant (hémorragie GI, infection, constipation, hypokaliémie); éviter les benzodiazépines si possible.","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"lactulose","r":"1","n":""},{"d":"metronidazole","r":"2","n":""},{"d":"diete_therapeutique","r":"S","n":""},{"d":"levetiracetam","r":"S","n":""}],"maj":"Chat : ptyalisme fréquent.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau des urgences — Encéphalopathie hépatique. Problèmes d'urée ou d'ammoniac (VIN)","fields":[{"k":"Signes cliniques / examen physique","t":"Neurologique : perturbation cérébrale diffuse : léthargie, inappétence, errance sans but, appui de la tête contre les objets, désorientation, convulsions, cécité, stupeur, coma. Mauvaise tolérance à l'anesthésie/réveil prolongé.\nGastro-intestinal (GI) : vomissements, diarrhée, faible gain de poids, ptyalisme (chats)\nUrinaire : polyurie et polydipsie ; strangurie, pollakiurie et/ou hématurie (urolithiase d'urate d'ammonium)"},{"k":"Diagnostic","t":"SC. FSC : acanthocytes, globules rouges crénelés, ANÉMIE, anisocytose, échinocytes\nBiochimie : ↑ GGT, ALT, AST. ↓ de tous les électrolytes. Test de tolérance à l'ammoniac : hyperammoniémie. Coagulation augmentée. Radiographie, échographie. Analyse d'urine : bilirubinurie, bilirubine urinaire augmentée"},{"k":"Traitement (Rx)","t":"Soluté NaCl à dose de choc IV (90 ml/kg/h) + dextrose 5 % (1 g/kg). Lactulose (5 ml/kg/jour divisé en 3 doses) + Cerenia + antagonistes H2 + vit K + antibiotiques (néomycine 20 mg/kg PO 3 fois par jour) + hépatoprotecteur (silymarine 30 mg/kg PO par jour) + diazépam (1 mg/kg IV) + sédation."},{"k":"Pronostic / prévention","t":"Le pronostic des patients avec EH est passable à bon en cas d'EH légère, mais réservé à mauvais lorsque les signes cliniques sont plus sévères"},{"k":"Surveillance / examens complémentaires","t":"Les patients avec EH sévère nécessitent une surveillance aux soins intensifs. Les signes neurologiques, la pression artérielle systémique, l'état ventilatoire et les paramètres de laboratoire courants doivent être surveillés fréquemment et de près. Les patients avec EH stable peuvent souvent être gérés à la maison, mais nécessitent des examens de contrôle et des analyses de laboratoire répétés."},{"k":"Commentaires","t":"Diminuer l'apport en protéines. Diète prescrite. Une supplémentation en zinc peut être bénéfique puisque le zinc est nécessaire à deux enzymes du cycle de l'urée"}]}]},{"id":"shunt_portosystemique","nom":"Shunt portosystémique","sys":"Digestif","urg":false,"resume":"Jeune de petit gabarit : signes du SNC après les repas, PU/PD, signes GI épisodiques, croissance retardée. Acides biliaires, échographie, scanner.","src":["Urgences (shunt portosystémique)"],"img":[],"sp":{"chien":{"tx":[{"d":"lactulose","r":"1","n":""},{"d":"metronidazole","r":"2","n":""},{"d":"diete_therapeutique","r":"S","n":"Restriction protéique modérée"},{"d":"levetiracetam","r":"S","n":"Prévention des convulsions péri-opératoires"},{"d":"cobalamine","r":"S","n":""}],"maj":"Petit gabarit; chirurgie (atténuation) = traitement définitif. Une étude 2026 a évalué la vitamine K orale en préparation préopératoire.","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"lactulose","r":"1","n":""},{"d":"metronidazole","r":"2","n":""},{"d":"diete_therapeutique","r":"S","n":""},{"d":"levetiracetam","r":"S","n":""}],"maj":"Chat : ptyalisme, yeux cuivrés (iris de couleur cuivre) évocateurs.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau des urgences — Shunt portosystémique (SPS) (p.1617 p.911)","fields":[{"k":"Signes cliniques / examen physique","t":"Petit gabarit. Signes du SNC après des repas gras. PU/PD marquées, signes GI épisodiques, BUN, créatinine, cholestérol sous la normale à normaux bas, calculs d'urate, signes du SNC, collapsus (neuroglycopénie), retard de croissance, mauvais pelage, iris couleur cuivre chez les chats"},{"k":"Diagnostic différentiel","t":"maladies infectieuses, toxines, hypoglycémie, épilepsie, parasitisme, corps étranger, écart alimentaire ou allergie, Addison, MII, infection urinaire, autres calculs, obstruction des voies biliaires"},{"k":"Diagnostic","t":"Acides biliaires sériques totaux (ABST) pré- et postprandiaux"},{"k":"Traitement (Rx)","t":"Soluté, K, glucose, cobalamine, lactulose 1 ml/kg PO q8h, métronidazole 15 mg/kg IV (ampicilline Polyflex 100 mg/ml 22 mg/kg IV q12h), en cas de convulsions phénobarbital 10 mg/kg IV lente à effet, mannitol, diètes à teneur restreinte en protéines"},{"k":"Pronostic / prévention","t":"ne pas faire reproduire\nexcellent avec chirurgie"},{"k":"Surveillance / examens complémentaires","t":"dépression respiratoire,"}]}]},{"id":"ipe","nom":"Insuffisance pancréatique exocrine (IPE)","sys":"Digestif","urg":false,"resume":"Bergers allemands, colleys, setters : amaigrissement avec appétit vorace, selles volumineuses grasses. TLI sérique.","src":["SAM1 — IPE"],"img":[],"sp":{"chien":{"tx":[{"d":"pancrelipase","r":"1","n":"Poudre d'enzymes (Pancreakare®)"},{"d":"diete_therapeutique","r":"1","n":"Très digestible, faible en gras"},{"d":"cobalamine","r":"S","n":"Si hypocobalaminémie documentée"},{"d":"tylosine","r":"2","n":"Dysbiose secondaire (magistral)"}],"maj":"Dosage de la TLI (trypsin-like immunoreactivity) = test de choix; supplémenter la cobalamine lorsqu'elle est basse.","qc":"Pancreakare® (enzymes) est répertorié dans la BDPP; Pancrezyme® (cité dans vos notes) : vérifier la disponibilité.","al":"","gl":[]},"chat":{"tx":[{"d":"pancrelipase","r":"1","n":""},{"d":"cobalamine","r":"S","n":""}],"maj":"Chez le chat, l'IPE est souvent associée à une pancréatite chronique et à une carence en cobalamine.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau SAM1 — IPE (insuffisance pancréatique exocrine)","fields":[{"k":"Signes cliniques / examen physique","t":"Plus fréquente chez les bergers allemands, colleys et setters anglais • Polyphagie, diarrhée et perte de poids chez un jeune animal. Diarrhée de l'intestin grêle avec selles volumineuses, jaunâtres ou grises, polyphagie, pica, perte de poids et problèmes dermatologiques"},{"k":"Diagnostic différentiel","t":"MII, insuffisance hépatique, maladie rénale chronique, hypoadrénocorticisme, DM"},{"k":"Diagnostic","t":"Immunoréactivité de type trypsine (TLI) : cTLI sérique ≤ 2,5 mcg/L, fTLI ≤ 8,0 mcg/L. Carence en cobalamine : SIBO"},{"k":"Traitement (Rx)","t":"Des diètes très digestibles et faibles en gras, jumelées à un remplacement des enzymes pancréatiques (Pancreazyme®), stabilisent habituellement la condition. Une supplémentation en cobalamine (vitamine B12) peut être envisagée lorsque l'hypocobalaminémie est documentée. Si des niveaux élevés de folate sont détectés, indiquant une prolifération bactérienne dans l'intestin grêle, la tylosine (Tylan®) peut être prescrite."},{"k":"Pronostic / prévention","t":"bon, le traitement est habituellement à vie."},{"k":"Surveillance / examens complémentaires","t":"Poids corporel, qualité des selles et concentration sérique de cobalamine après la supplémentation"}]}]},{"id":"mici","nom":"Entéropathie inflammatoire chronique (MICI)","sys":"Digestif","urg":false,"resume":"Signes digestifs chroniques et intermittents : vomissements, diarrhée, perte de poids. Exclure parasites, endocrinopathies, EPI, néoplasie; puis diète, biopsies.","src":["SAM1 — MII","SAM 2 — maladie inflammatoire chronique de l'intestin"],"img":[],"sp":{"chien":{"tx":[{"d":"diete_therapeutique","r":"1","n":"Diète d'élimination / hydrolysée (essai de 2–4 semaines)"},{"d":"probiotique","r":"S","n":""},{"d":"cobalamine","r":"S","n":"Si basse"},{"d":"fenbendazole","r":"S","n":"Déparasitage empirique"},{"d":"metronidazole","r":"2","n":"Courte durée"},{"d":"tylosine","r":"2","n":"Entéropathie répondant aux antibiotiques (magistral)"},{"d":"prednisolone","r":"2","n":"Si échec diète; dégression lente"},{"d":"ciclosporine","r":"2","n":"Cas réfractaires"},{"d":"azathioprine","r":"2","n":"Chien seulement"},{"d":"budesonide","r":"2","n":""}],"maj":"Consensus ACVIM-endossé 2026 : diagnostic (endoscopie, histologie, biomarqueurs) et traitement par paliers — la diète reste le premier traitement; immunosuppresseur seulement si échec.","qc":"","al":"","gl":["acvim_cie_chien_2026"]},"chat":{"tx":[{"d":"diete_therapeutique","r":"1","n":""},{"d":"cobalamine","r":"S","n":""},{"d":"prednisolone","r":"1","n":"Prednisolone plutôt que prednisone"},{"d":"chlorambucil","r":"2","n":"Immunosuppresseur de choix chez le chat"},{"d":"budesonide","r":"2","n":""}],"maj":"Consensus ACVIM 2023 : distinguer le lymphome T de bas grade de l'entérite lymphocytaire (histologie + immunohistochimie + clonalité).","qc":"","al":"","gl":["acvim_lymphome_chat_2023"]}},"notes":[{"label":"Tableau SAM1 — MII (maladie inflammatoire de l'intestin) (p.1084)","fields":[{"k":"Signes cliniques / examen physique","t":"chiens : diarrhée chronique - IG (anorexie, perte de poids, vomissements, mauvais état corporel et du pelage, anses épaissies, douleur abdominale, épanchements) GI (N, inconfort abdominal possible, muqueuse/sanglante) chats : vomissements chron. +/- diarrhée, anorexie, perte de poids, léthargie."},{"k":"Diagnostic différentiel","t":"Corps étranger GI chron., ankylostomes, trichures, Giardia, IPE, IRC, maladie hépatique chron., pancréatite, Addison, hyperthyroïdie [chat], inflammation GI : allergie alimentaire, néoplasie infiltrative (lymphome), entérocolite bactérienne/fongique (Clostridium, histoplasmose), perte protéique GI : lymphangiectasie"},{"k":"Diagnostic","t":"Radiographies abdominales, examen des selles, test SNAP Giardia, cTLI, biochimie : ↓ protéines, SNAP cPL, stimulation à l'ACTH, T4 sérique (chat), échographie, spores dans les selles - bâtonnets de clostridies (raquette de tennis)"},{"k":"Traitement (Rx)","t":"Diète d'élimination ou à protéine nouvelle Hill's i/d, métronidazole q12h 2–6 sem, si inefficace ou ELP : prednisone q12h en dégression (8–12 sem). Vermifugation empirique : fenbendazole, vitamine B12 SC si ↓, Cerenia, famotidine, probiotiques"},{"k":"Pronostic / prévention","t":"Le pronostic à court terme est bon en l'absence d'hypoalbuminémie et d'hypocobalaminémie"},{"k":"Surveillance / examens complémentaires","t":"Non curable, le but est de contrôler les SC. Intoxication au métronidazole - signes neurologiques."}]},{"label":"SAM 2 (notes détaillées)","text":"MALADIE INFLAMMATOIRE CHRONIQUE DE L'INTESTIN-signes cliniques souvent chroniques et intermittents. Vomissements, diarrhée aqueuse du gros intestin, perte de poids, perte d'appétit, entéropathie exsudative etc. L'entérite lymphoplasmocytaire est la plus fréquente suivie de l'inflammation éosinophilique. Il y a des rapports occasionnels de motif granulomateux/entérite régionale. Il n'y a pas d'anomalies spécifiques à la NFS, aux bilans biochimiques, ou aux radiographies. La biopsie est utile au diagnostic.\nRx- Prednisone (corticostéroïde) + azathioprine (chiens)/chlorambucil (chats) comme médicament immunosuppresseur + régime hypoallergénique + métronidazole comme antibiotique préféré."}]},{"id":"megaoesophage","nom":"Mégaœsophage","sys":"Digestif","urg":false,"resume":"Régurgitation (≠ vomissement), toux, pneumonie d'aspiration; chiot à partir du sevrage (congénital) ou adulte. Radiographie thoracique.","src":["SAM1 — mégaœsophage","SAM 2 — mégaœsophage"],"img":["sum_5"],"sp":{"chien":{"tx":[{"d":"diete_therapeutique","r":"1","n":"Repas en position verticale (chaise de Bailey), boulettes ou bouillie"},{"d":"omeprazole","r":"S","n":"Si reflux/œsophagite"},{"d":"sucralfate","r":"S","n":""},{"d":"cisapride","r":"S","n":"Non commercialisé au Canada (magistral)"},{"d":"pyridostigmine","r":"2","n":"Myasthénie grave acquise (Mestinon®)"}],"maj":"Rechercher la cause : myasthénie grave acquise (anticorps anti-AChR), hypoadrénocorticisme, corps étranger, congénital. Le risque principal est la pneumonie d'aspiration.","qc":"La néostigmine citée dans vos notes est remplacée en pratique par la pyridostigmine orale (Mestinon® répertorié).","al":"","gl":["acvim_gi_protect_2018"]}},"notes":[{"label":"Tableau SAM1 — Mégaœsophage (p.1275)","fields":[{"k":"Signes cliniques / examen physique","t":"Faiblesse NMI, régurgitation (distinguer du vomissement), toux (due à l'aspiration), bave"},{"k":"Diagnostic différentiel","t":"Myasthénie grave, Addison, hypothyroïdie, dysautonomie (chat), polymyopathie/polyneuropathie, œsophagite, LES, plomb, intoxication aux organophosphorés, botulisme, tétanos, idiopathique"},{"k":"Diagnostic","t":"radiographies thoraciques +/- baryum, test d'anticorps anti-récepteurs de l'ACh, test de stimulation à l'ACTH, T4 libre, CK sérique : myopathies, EMG, œsophagoscopie"},{"k":"Traitement (Rx)","t":"alimenter en position verticale, boulettes de viande, bouillie. Traiter la pneumonie et la cause sous-jacente, cisapride, oméprazole en cas de reflux gastro-œsophagien, anticholinestérasique : néostigmine IM q6h"},{"k":"Pronostic / prévention","t":"réservé à mauvais, bon si la cause est traitée. Ne pas faire reproduire"},{"k":"Surveillance / examens complémentaires","t":"plusieurs meurent de pneumonie par aspiration"}]},{"label":"SAM 2 (notes détaillées)","text":"MÉGAŒSOPHAGE-le signe cardinal est la régurgitation. le chiot commence à régurgiter au sevrage, généralement chétif et plus petit que ses portées. La pneumonie par aspiration est une complication. Diagnostic- NFS pour la pneumonie par aspiration, radiographies, anticorps contre les récepteurs de l'acétylcholine (chez les chiens avec mégaœsophage acquis)\nRx-➭Tensilon (édrophonium) est à action rapide/courte utilisé dans les cas aigus.\n• La pyridostigmine (inhibiteur de l'acétylcholinestérase) est utilisée pour la force musculaire\n• Nourrir depuis une plateforme surélevée pour que l'œsophage du patient soit perpendiculaire au sol\n• Nourrir plusieurs petits repas par jour pour minimiser la rétention de grandes quantités dans l'œsophage.\n• Médicament prokinétique=cisapride (0,1-0,5 mg/kg PO q 8-12h). Il augmente la vidange gastrique normograde et réduit le volume de reflux acide. Métoclopramide. Oméprazole"}]},{"id":"megacolon","nom":"Mégacôlon","sys":"Digestif","urg":false,"resume":"Chat avec constipation répétée, selles dures; côlon dilaté à la radiographie. Rechercher la cause (douleur, sténose, neuropathie, orthopédie).","src":["SAM1 — mégacôlon","SAM 2 — mégacôlon"],"img":[],"sp":{"chat":{"tx":[{"d":"fluides","r":"U","n":"Réhydratation avant les lavements"},{"d":"peg3350","r":"1","n":"Macrogol 3350 (Restoralax®, etc.)"},{"d":"lactulose","r":"1","n":""},{"d":"psyllium","r":"S","n":"Fibres/citrouille"},{"d":"cisapride","r":"2","n":"Prokinétique (magistral)"},{"d":"diete_therapeutique","r":"S","n":"Diète riche en fibres ou très digestible"}],"maj":"Traitement par paliers : réhydratation, extraction, laxatifs osmotiques + prokinétique; colectomie subtotale si échec. Éviter les lavements au phosphate (toxiques chez le chat).","qc":"Cisapride non commercialisé au Canada : préparation magistrale.","al":"","gl":[]}},"notes":[{"label":"Tableau SAM1 — Mégacôlon (p.452)","fields":[{"k":"Signes cliniques / examen physique","t":"constipation, déshydratation, selles dures recouvertes de mucus/sang"},{"k":"Diagnostic différentiel","t":"Déshydratation, troubles électrolytiques, maladies inflammatoires de l'anorectum, opioïdes, anticholinergiques, changement de litière, inactivité"},{"k":"Diagnostic","t":"radiographies abdominales"},{"k":"Traitement (Rx)","t":"Soluté IV, lavements et extraction manuelle sous sédation/anesthésie, lactulose (laxatif liquide) et comprimés de cisapride q8h, colectomie subtotale, diète : Hill's a/d ou ajouter 2 c. à thé de psyllium ou de citrouille pour les fibres"},{"k":"Pronostic / prévention","t":"passable avec traitement médical, bon avec traitement chirurgical (diarrhée)"},{"k":"Surveillance / examens complémentaires","t":"La plupart des chats répondent bien à la prise en charge alimentaire et médicale, mais peuvent encore avoir besoin d'un lavement de temps à autre"},{"k":"Commentaires","t":"Chaise de Bailey"}]},{"label":"SAM 2 (notes détaillées)","text":"MÉGACÔLON-Une défécation réduite, absente, ou douloureuse est typique. Les boules fécales sont souvent très dures si elles sont émises. Côlon distendu avec des matières fécales dures à la palpation abdominale; des signes de douleur abdominale peuvent être présents.\nIl y a 5 objectifs principaux de traitement pour les chats avec mégacôlon 1)statut d'hydratation adéquat 2)retrait des matières fécales impactées, lavement à l'eau tiède. 3)traitement laxatif comme lactulose/huile minérale/psyllium. 4)agents prokinétiques comme le cisapride 5)fibres alimentaires. Si réfractaire alors colectomie"}]},{"id":"glandes_anales","nom":"Maladie des glandes anales","sys":"Digestif","urg":false,"resume":"Léchage/morsures de la région périnéale, « traînage du derrière » (scooting). Expression, irrigation, antibiotique topique/systémique si infection.","src":["SAM1 — glandes anales"],"img":[],"sp":{"chien":{"tx":[{"d":"amox_clav","r":"1","n":"Abcès/infection : drainage + antibiotique"},{"d":"meloxicam","r":"S","n":"Douleur (Metacam®)"},{"d":"psyllium","r":"P","n":"Fibres alimentaires"}],"maj":"Expression régulière, fibres, traitement de la cause (allergie). Abcès : drainage, rinçage, antibiotique selon cytologie/culture.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau SAM1 — Glandes anales (p.143)","fields":[{"k":"Signes cliniques / examen physique","t":"Léchage ou morsures de la région périnéale, traînage du derrière (scooting)"},{"k":"Diagnostic différentiel","t":"impaction, sacculite, abcédation, néoplasie (adénocarcinome)"},{"k":"Diagnostic","t":"enflure, douleur, enflure non douloureuse, fièvre possible en cas d'abcès"},{"k":"Traitement (Rx)","t":"Expression manuelle, possiblement sous sédation, irrigation saline pour ramollir les sécrétions. S : lavage, onguent antibiotique. A : inciser et drainer, amoxicilline et acide clavulanique 14 mg/kg PO q12h 2 sem. Douloureux, on peut donc donner du Metacam"},{"k":"Pronostic / prévention","t":"bon si non néoplasique, peut être un problème récurrent"},{"k":"Surveillance / examens complémentaires","t":"Une activité physique adéquate pour stimuler les selles normales peut favoriser l'expression naturelle"}]}]},{"id":"tumeur_sac_anal","nom":"Adénocarcinome du sac anal","sys":"Digestif","urg":false,"resume":"Masse ferme, indolore, latérale à l'anus; ténesme possible. Métastases aux ganglions sous-lombaires; hypercalcémie.","src":["SAM 2 — adénocarcinome du sac anal"],"img":[],"sp":{"chien":{"tx":[{"d":"toceranib","r":"2","n":"Inhibiteur de tyrosine kinase (Palladia®), hors AMM"},{"d":"carboplatine","r":"2","n":"Chimiothérapie adjuvante"}],"maj":"Chirurgie ± radiothérapie; rechercher une hypercalcémie paranéoplasique; les lignes directrices AAHA 2026 en oncologie sont à consulter.","qc":"","al":"","gl":["aaha_onco_2026"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"TUMEUR/ADÉNOCARCINOME DU SAC ANAL-Un gonflement ferme, non douloureux, latéral à l'anus suggère une néoplasie du sac anal. Position 4h et 8h. Hypercalcémie Le site de métastase le plus fréquent est les ganglions lymphatiques sublombaires. Rx-Excision chirurgicale de la masse+ganglions sublombaires suivie de radiothérapie où des marges nettes n'ont pas été obtenues. Des radiographies thoraciques et abdominales et une échographie abdominale sont indiquées pour la stadification clinique. Pronostic-La présence d'hypercalcémie semble avoir un impact négatif sur la survie des chiens avec adénocarcinome du sac anal. La survie médiane rapportée pour les chiens avec hypercalcémie est de 6-9 mois comparée à 11-19 mois pour les chiens normocalcémiques. Les chiens avec de grandes tumeurs (>10 cm2) et les chiens avec des métastases pulmonaires ont des durées de survie plus courtes"}]},{"id":"hernie_perineale","nom":"Hernie périnéale","sys":"Digestif","urg":false,"resume":"Mâle âgé entier : gonflement périnéal, ténesme, constipation, dysurie (vessie en rétroflexion). Chirurgie (herniorraphie ± colopexie, castration).","src":["SAM 2 — hernie périnéale"],"img":[],"sp":{"chien":{"tx":[{"d":"peg3350","r":"S","n":"Ramollir les selles"},{"d":"lactulose","r":"S","n":""},{"d":"psyllium","r":"S","n":""},{"d":"buprenorphine","r":"S","n":"Analgésie"}],"maj":"Mâle âgé entier : castration lors de la herniorraphie; gestion du ténesme avant et après la chirurgie.","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"HERNIE PÉRINÉALE-communément chez le mâle âgé entier, diaphragme pelvien affaibli+composante hormonale impliquée. Rx- Enroulement de l'obturateur interne+castration"}]},{"id":"lymphome","nom":"Lymphome","sys":"Oncologie","urg":false,"resume":"Lymphadénopathie généralisée (chien), forme digestive fréquente chez le chat âgé. Cytologie/histologie, immunophénotypage, bilan d'extension. Référer en oncologie.","src":["SAM1 — lymphome","SAM 2 — lymphome canin / félin"],"img":[],"sp":{"chien":{"tx":[{"d":"prednisolone","r":"1","n":"Association au protocole"},{"d":"vincristine","r":"1","n":"Protocole CHOP"},{"d":"cyclophosphamide","r":"1","n":""},{"d":"doxorubicine","r":"1","n":""},{"d":"lomustine","r":"2","n":"Rescue"}],"maj":"Protocole CHOP (multi-agents) = standard de référence; classification des lymphomes nodaux canins (consensus 2025); AAHA 2026 pour la prise en charge oncologique. Éviter les corticostéroïdes avant le diagnostic cytologique/histologique.","qc":"","al":"","gl":["aaha_onco_2026"]},"chat":{"tx":[{"d":"prednisolone","r":"1","n":""},{"d":"chlorambucil","r":"1","n":"Forme digestive de bas grade"},{"d":"cyclophosphamide","r":"2","n":""},{"d":"vincristine","r":"2","n":""},{"d":"doxorubicine","r":"2","n":""},{"d":"lomustine","r":"2","n":""}],"maj":"Lymphome digestif de bas grade : chlorambucil + prednisolone; revue systématique 2026 COP vs CHOP chez le chat (lymphome de grade intermédiaire/élevé).","qc":"","al":"","gl":["acvim_lymphome_chat_2023","aaha_onco_2026"]}},"notes":[{"label":"Tableau SAM1 — Lymphome (p.1190)","fields":[{"k":"Signes cliniques / examen physique","t":"lymphadénopathie généralisée"},{"k":"Diagnostic","t":"FSC : anémie, thrombocytopénie et leucémie. Aspiration et cytologie. Radiographie thoracique"},{"k":"Traitement (Rx)","t":"COPD : cyclophosphamide, vincristine (Oncovin), prednisolone, doxorubicine"}]},{"label":"SAM 2 — lymphome canin","text":"LYMPHOME CANIN- il implique surtout les tissus lymphoïdes primaires et secondaires, incluant la moelle osseuse, le thymus, les ganglions lymphatiques, la rate. La néoplasie hématopoïétique la plus fréquente chez le chien. Lymphadénopathie généralisée + ganglions lymphatiques augmentés de volume + lymphocytes malins + hypercalcémie Rx- les agents chimiothérapeutiques en protocole combiné sont vincristine, doxorubicine, cyclophosphamide, L-asparaginase, prednisone. Pronostic- 12 mois avec lymphome à cellules B 6 mois avec lymphome à cellules T."},{"label":"SAM 2 — lymphome félin","text":"LYMPHOME FÉLIN - La forme alimentaire affecte le tractus digestif et les ganglions lymphatiques environnants. C'est la forme de lymphome la plus fréquente chez le chat. L'âge moyen est le chat senior (9-13 ans) avec un antécédent de vomissements, diarrhée, perte de poids, anorexie. Les intestins sont diffusément épaissis, ganglions lymphatiques proéminents, perte de poids, vomissements progressifs. Pour le lymphome de bas grade=chlorambucil + prednisone sont utilisés et 85-90% répondent au traitement. Haut grade= L-asparaginase, doxorubicine, cyclophosphamide, vincristine, prednisone"}]},{"id":"mastocytome","nom":"Mastocytome cutané","sys":"Oncologie","urg":false,"resume":"Tumeur cutanée maligne la plus fréquente du chien (boxers, bouledogues, carlins). Aspiration à l'aiguille fine : granules métachromatiques; gradation histologique.","src":["SAM1 — MCT","SAM 2 — tumeur mastocytaire"],"img":[],"sp":{"chien":{"tx":[{"d":"toceranib","r":"1","n":"Maladie non résécable/métastatique (Palladia®)"},{"d":"vinblastine","r":"2","n":"Avec prednisone"},{"d":"prednisolone","r":"S","n":""},{"d":"famotidine","r":"S","n":"Protection gastrique contre l'histamine"},{"d":"diphenhydramine","r":"S","n":""}],"maj":"Classification consensuelle (2021) à utiliser avec le grade histologique; excision chirurgicale à larges marges, radiothérapie, chimiothérapie pour grade 3 ou comportement agressif (AAHA 2026).","qc":"","al":"","gl":["mct_consensus_2021","aaha_onco_2026"]}},"notes":[{"label":"Tableau SAM1 — MCT (mastocytome) (p.1264 cours)","fields":[{"k":"Diagnostic différentiel","t":"lipome, plasmocytome, histiocytome, lymphome, carcinome épidermoïde, granulome, abcès"},{"k":"Diagnostic","t":"PAF avec Benadryl"},{"k":"Traitement (Rx)","t":"Excision chirurgicale avec larges marges, radiothérapie, chimiothérapie (grade 3, grade 2 avec caractéristiques agressives, non résécable, avec métastases) : vinblastine, prednisone"}]},{"label":"SAM 2 (notes détaillées)","text":"TUMEUR MASTOCYTAIRE-la malignité dermique la plus fréquente chez le chien. Ex-carlins, boxers, boston terriers etc. La gradation va jusqu'à 3. Rx-excision chirurgicale avec des marges larges (2-3 cm) et 1 plan fascial en profondeur +radiothérapie/chimiothérapie (si des marges complètes ne peuvent être obtenues) H1 diphenhydramine+H2 famotidine+prednisone avant la chirurgie."}]},{"id":"melanome","nom":"Mélanome canin (buccal)","sys":"Oncologie","urg":false,"resume":"Tumeur orale la plus maligne du chien; métastases jusqu'à 80 %. Stadification (radiographies thoraciques, ganglions).","src":["SAM 2 — mélanome canin"],"img":[],"sp":{"chien":{"tx":[{"d":"carboplatine","r":"2","n":"Chimiothérapie adjuvante (selon l'oncologue)"}],"maj":"Chirurgie large ± radiothérapie; radiographies thoraciques et aspiration des ganglions régionaux. Référer en oncologie.","qc":"","al":"","gl":["aaha_onco_2026"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"MÉLANOME CANIN- la tumeur orale la plus maligne chez le chien. Métastase jusqu'à 80%, faire des radiographies thoraciques une fois diagnostiqué. Le traitement de choix est l'excision chirurgicale avec des marges larges qui nécessite le retrait de l'os sous-jacent (mandibulectomie ou maxillectomie partielle) Taille de la tumeur <2 cm =17 mois. >2 cm =5,5 mois."}]},{"id":"carcinome_epidermoide","nom":"Carcinome épidermoïde (chat)","sys":"Oncologie","urg":false,"resume":"Tumeur orale la plus fréquente du chat; localement agressive.","src":["SAM 2 — carcinome épidermoïde"],"img":[],"sp":{"chat":{"tx":[{"d":"toceranib","r":"2","n":"Hors AMM"},{"d":"buprenorphine","r":"S","n":"Douleur orale"},{"d":"mirtazapine","r":"S","n":"Appétit"}],"maj":"Tumeur orale la plus fréquente du chat : localement agressive; chirurgie/radiothérapie. Cutané : exposition solaire (chats blancs).","qc":"","al":"","gl":["aaha_onco_2026"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"CARCINOME ÉPIDERMOÏDE-tumeur maligne provenant de l'épithélium squameux\nLe CE est la tumeur orale la plus fréquente chez le chat, une forme de néoplasie localement agressive. L'exposition solaire chez les chats à pelage blanc est associée à un risque augmenté de CE du plan nasal, du pavillon, et péri-oculaire. Rx-Excision de la tumeur primaire avec des marges larges, suivie de cryothérapie ou radiothérapie si des marges libres de tumeur n'ont pas été obtenues en chirurgie. Dans les cas oraux agressifs, résection incluant une mandibulectomie ou maxillectomie partielle. Radiothérapie définitive pour la maladie microscopique résiduelle si la chirurgie ne fournit pas de marges libres de tumeur. Pronostic-Oral=L'issue est réservée à mauvaise dans la plupart des cas, à moins que la tumeur soit diagnostiquée et traitée précocement. La plupart des chats ont une maladie avancée au diagnostic. La survie médiane est de 2 mois. Plan nasal, auriculaire= excellent pronostic de guérison si résection chirurgicale complète, malheureusement, les tumeurs chez les chats ont souvent progressé massivement avant l'identification, menant à une survie médiane de seulement 3,8 mois."}]},{"id":"sarcome_injection","nom":"Sarcome au site d'injection (chat)","sys":"Oncologie","urg":false,"resume":"Tumeur localement agressive induite par l'injection (vaccins, médicaments) : masse persistante > 3 mois, > 2 cm ou en croissance après 1 mois.","src":["SAM 2 — sarcome au site d'injection"],"img":[],"sp":{"chat":{"tx":[{"d":"vaccin","r":"P","n":"Site anatomique distal recommandé pour chaque vaccin"}],"maj":"Prévention : injecter dans les membres distaux (vaccin de la rage : membre postérieur droit; FeLV : membre postérieur gauche), documenter chaque injection. Chirurgie radicale + radiothérapie.","qc":"Vérifier les exigences de vaccination antirabique (voyage, municipalité) et documenter le site de chaque injection.","al":"","gl":["wsava_vacc_2024"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"SARCOME AU SITE D'INJECTION-tumeurs localement agressives induites par l'administration d'injections IM. La rage et le FeLV sont les plus fréquents. Rx-Une excision radicale avec des marges latérales de 3-5 cm et 2 plans fasciaux en profondeur est recommandée. La récidive est très fréquente."}]},{"id":"carcinome_basocellulaire","nom":"Carcinome basocellulaire (chat)","sys":"Oncologie","urg":false,"resume":"Tumeur cutanée épithéliale du chat; excision chirurgicale.","src":["SAM 2 — tumeur/carcinome basocellulaire"],"img":[],"sp":{"chat":{"tx":[],"maj":"Excision chirurgicale large (pronostic généralement bon).","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"TUMEUR/CARCINOME BASOCELLULAIRE-il représente le groupe hétérogène de néoplasmes épithéliaux cutanés reconnus chez le chat. Les chats persans sont prédisposés. Ils apparaissent souvent comme des plaques ulcérées sur la tête, le cou, les extrémités, glabres, en forme de dôme, bien circonscrites, librement mobiles par rapport au fascia sous-jacent. TRAITEMENT DE CHOIX- excision chirurgicale suivie d'une observation du site pour la récidive"}]},{"id":"carcinome_mammaire","nom":"Carcinome mammaire","sys":"Oncologie","urg":false,"resume":"Masse(s) mammaire(s) : examen de toutes les chaînes, radiographies thoraciques, ganglions. Chirurgie = traitement principal.","src":["SAM 2 — carcinome mammaire"],"img":[],"sp":{"chat":{"tx":[{"d":"carboplatine","r":"2","n":"Chimiothérapie adjuvante"},{"d":"doxorubicine","r":"2","n":""}],"maj":"Chez la chatte, la plupart sont malins (métastases ~85 %) : mastectomie radicale bilatérale; radiographies thoraciques (3 vues). L'ovariohystérectomie précoce (< 6 mois) réduit fortement le risque.","qc":"","al":"","gl":["aaha_onco_2026"]},"chien":{"tx":[],"maj":"Chez la chienne, environ la moitié des tumeurs sont bénignes; chirurgie adaptée à la taille/localisation; OVH précoce = prévention.","qc":"","al":"","gl":["aaha_onco_2026"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"CARCINOME MAMMAIRE- chez les CHATS, la plupart des glandes mammaires sont malignes avec de fortes chances de métastase (85%) donc une mastectomie radicale unilatérale de la chaîne est recommandée (les ganglions lymphatiques affectés sont aussi retirés le long de la chaîne mammaire). chez les chats les deux glandes antérieures ou thoraciques sont plus\nfréquemment impliquées\n• Radiographies thoraciques (trois vues) pour métastase pulmonaire\n• L'ovariohystérectomie avant l'âge de 6 mois réduit le risque mais ne préviendra pas le carcinome mammaire chez les chattes. CHEZ LES CHIENS, le type de chirurgie (nodulectomie, mastectomie régionale ou radicale) dépend de la taille, de la localisation, et du nombre de tumeurs présentes. L'ovariectomie avant les premières chaleurs réduit le risque de néoplasie mammaire à 0,5% du risque chez les chiennes entières."}]},{"id":"chocolat","nom":"Intoxication au chocolat (théobromine/caféine)","sys":"Toxicologie","urg":false,"resume":"Début des signes 6–12 h après l'ingestion : PU/PD, vomissements, diarrhée, agitation, tachycardie, tremblements, convulsions, arythmies. Décontaminer, soutenir, traiter les signes.","src":["Urgences (chocolat)","SAM 2 — toxicité au chocolat"],"img":[],"sp":{"chien":{"tx":[{"d":"charbon","r":"1","n":"Décontamination si ingestion récente (doses répétées possibles)"},{"d":"fluides","r":"U","n":"Dose de choc selon l'état; sonde urinaire pour limiter la réabsorption"},{"d":"methocarbamol","r":"S","n":"Tremblements, rigidité"},{"d":"diazepam","r":"U","n":"Convulsions"},{"d":"lidocaine","r":"S","n":"Arythmies ventriculaires"},{"d":"maropitant","r":"S","n":""}],"maj":"Les signes apparaissent 6–12 h après l'ingestion : adapter la décontamination au délai. Utiliser un calculateur de dose toxique (type de chocolat, poids) et joindre un centre antipoison vétérinaire. Vérifier aussi la présence de xylitol ou de cannabis dans les produits.","qc":"Centres antipoison pour animaux : ASPCA Animal Poison Control, Pet Poison Helpline (service payant, accessible depuis le Canada).","al":"Chez le chat, éviter le peroxyde d'hydrogène pour provoquer le vomissement.","gl":["recover_pa_2026"]}},"notes":[{"label":"Tableau des urgences — Chocolat (p.380)","fields":[{"k":"Signes cliniques / examen physique","t":"Début des signes 6–12 h après l'ingestion. Initialement : PD, vomissements, diarrhée ; agitation. Peut évoluer vers PU, agitation, tremblements, rigidité, ataxie, convulsions, collapsus. Tachycardie, tachypnée, hyperthermie, arythmies cardiaques"},{"k":"Diagnostic différentiel","t":"SNC : amphétamines, pseudoéphédrine, phénylpropanolamine, métaldéhyde, cocaïne, antidépresseurs, antihistaminiques"},{"k":"Diagnostic","t":"antécédents d'exposition, présence de chocolat dans les vomissures et signes cliniques compatibles avec une intoxication au chocolat"},{"k":"Traitement (Rx)","t":"Décontaminer : vomissement (8–12 h), charbon, sonde urinaire pour augmenter l'excrétion de la caféine. Soluté IV à dose de choc. Méthocarbamol (50–100 mg/kg IV lente ; max 330 mg/kg/24 h) pour tremblements, rigidité, diazépam (2 mg/kg IV) pour convulsions, propranolol 0,04 mg/kg IV lente en 2–3 minutes, lidocaïne pour arythmies ventriculaires : 1 mg/kg IV, atropine (0,01 mg/kg IV) pour bradyarythmies sévères, soluté, ventilateurs pour hyperthermie, maropitant 1 mg/kg PO q24h."},{"k":"Pronostic / prévention","t":"bon"},{"k":"Surveillance / examens complémentaires","t":"ECG, PA, T, électrolytes sériques, production urinaire, échographie pancréatique ± enzymes. Asymptomatique : surveiller 8–12 heures pour détecter des signes"},{"k":"Commentaires","t":"Gérer d'abord les signes cliniques mettant la vie en danger. Envisager l'une des options suivantes pour les convulsions, tremblements, agitation et/ou hyperactivité :\n1) Diazépam 0,13–1 mg/kg IV ou 0,5 mg/kg par voie rectale\n2) Midazolam 0,05–0,3 mg/kg/h IV en perfusion à débit constant (PDC)\n3) Propofol 3–6 mg/kg IV ou 0,1 mg/kg/min IV PDC\n4) Phénobarbital 2–8 mg/kg IV à effet\n5) Anesthésie par inhalation à effet\n6) Méthocarbamol 50–220 mg/kg IV"}]},{"label":"SAM 2 (notes détaillées)","text":"TOXICITÉ AU CHOCOLAT- La toxicose au chocolat peut résulter en des arythmies cardiaques et un dysfonctionnement du SNC potentiellement engageant le pronostic vital. Signes SNC + cardiaques + G.I.\nLes signes cliniques de toxicose au chocolat surviennent habituellement dans les 6-12h suivant l'ingestion. Les signes initiaux peuvent inclure polydipsie, vomissements, diarrhée, distension abdominale, et agitation. Les signes peuvent progresser vers hyperactivité, polyurie, ataxie, rigidité, tremblements, et convulsions. Tachycardie, extrasystoles ventriculaires, tachypnée, cyanose, hypertension, hyperthermie, bradycardie, hypotension, ou coma peuvent survenir. Une hypokaliémie peut survenir tard dans l'évolution de la toxicose, contribuant au dysfonctionnement cardiaque. La mort est généralement due aux arythmies cardiaques, à l'hyperthermie, ou à l'insuffisance respiratoire. Rx- Apomorphine, peroxyde d'hydrogène pour l'émèse suivis de charbon activé. Méthocarbamol, diazépam pour les tremblements/convulsions. Perfusion de lidocaïne pour l'arythmie ventriculaire/extrasystoles ventriculaires."}]},{"id":"xylitol","nom":"Intoxication au xylitol","sys":"Toxicologie","urg":false,"resume":"Hypoglycémie rapide (faiblesse, vomissements, désorientation, convulsions); atteinte hépatique possible à doses élevées. Glycémie, ALT, bilirubine, TP.","src":["Urgences (xylitol)","SAM 2 — toxicité au xylitol"],"img":[],"sp":{"chien":{"tx":[{"d":"glucose","r":"U","n":"Bolus de dextrose puis perfusion si hypoglycémie"},{"d":"fluides","r":"U","n":""},{"d":"nac","r":"1","n":"Si atteinte hépatique (hépatoprotecteur)"},{"d":"same","r":"S","n":""},{"d":"vitamine_k1","r":"S","n":"Si coagulopathie"}],"maj":"L'hypoglycémie survient en 15–60 min : mesurer la glycémie dès l'arrivée; surveiller la fonction hépatique 24–72 h. Le xylitol se retrouve dans les gommes, certaines formulations liquides de médicaments (ex. gabapentine) et des beurres de noix.","qc":"Au Canada, vérifier la liste d'ingrédients des produits « sans sucre » avant de recommander des préparations liquides.","al":"","gl":["recover_pa_2026"]}},"notes":[{"label":"Tableau des urgences — Intoxication au xylitol (gommes, bonbons) (p.2125)","fields":[{"k":"Signes cliniques / examen physique","t":"hypoglycémie entraînant faiblesse, léthargie, vomissements, désorientation, convulsions, coagulopathie, ataxie 30 minutes à 12 heures après l'ingestion, hépatotoxicité possible"},{"k":"Diagnostic différentiel","t":"hypoglycémie : surdose d'insuline, surdose d'antidiabétiques (sulfonylurées), insulinome, hypoglycémie juvénile, jeûne, sepsie. LHA (lésion hépatique aiguë) : acétaminophène, algues bleu-vert, sagoutier, champignons (type Amanita), phosphure de zinc, mycotoxines (aflatoxines), AINS, hépatite bactérienne, hépatopathie chronique idiopathique, hépatite virale, leptospirose"},{"k":"Diagnostic","t":"FSC : thrombocytopénie. Biochimie : hypoglycémie, enzymes hépatiques augmentées, hyperbilirubinémie, hyperphosphatémie. Bilan de coagulation : temps de prothrombine (PT) souvent élevé (36 à > 100 secondes) ○ Temps de céphaline activée (APTT) très élevé (> 100 secondes)"},{"k":"Traitement (Rx)","t":"Si asymptomatique (< 6 h) induire le vomissement (H2O2 3 % ou apomorphine 0,04 mg/kg IV) + prophylaxie du saignement. Gérer l'hypoglycémie : bolus de dextrose 5 % 20 mL/kg IV suivi de 2 mL/kg/h IV, sirop Karo/de maïs, miel si l'animal peut avaler, petits repas fréquents. N-acétylcystéine pour LHA, plasma (10 ml/kg à un débit de 3 ml/minute) pour les facteurs de coagulation (PT/APTT 2x), SAMe 1–3 mois"},{"k":"Pronostic / prévention","t":"Bon avec contrôle de l'hypoglycémie. Réservé si une nécrose hépatique et une coagulopathie se développent"},{"k":"Surveillance / examens complémentaires","t":"glycémie toutes les 2–4 h, enzymes hépatiques, bilan de coagulation, signes du SNC"}]},{"label":"SAM 2 (notes détaillées)","text":"TOXICITÉ AU XYLITOL-Le xylitol est un alcool de sucre à 5 carbones utilisé comme édulcorant dans les chewing-gums, bonbons, confiseries/produits de boulangerie caractérisé par une hypoglycémie menant à faiblesse, léthargie, désorientation, convulsions, et ataxie habituellement dans les 12 heures suivant l'ingestion. Une hépatotoxicose peut survenir en 12-48 heures chez certains chiens. Léthargie, vomissements, faiblesse, désorientation, ataxie, convulsions, typiquement 30 minutes à 12 heures après l'ingestion Rx= Induire des vomissements avec une administration orale de peroxyde d'hydrogène 3% ou apomorphine Ne pas donner de charbon activé; on ne s'attend pas à ce qu'il soit efficace. Dextrose 5% 20 mL/kg en bolus IV suivi de 2 mL/kg/h IV; ajuster selon la glycémie mesurée q 2-4h. Traiter la lésion hépatique aiguë Utilisation de N-acétylcystéine et de S-adénosyl-L-méthionine (SAMe)"}]},{"id":"marijuana","nom":"Intoxication au cannabis (THC)","sys":"Toxicologie","urg":false,"resume":"Apparition rapide (≈ 60 min) : dépression du SNC, ataxie, hypersalivation, incontinence urinaire, bradycardie, hypothermie; parfois hyperréactivité. Dépistage urinaire du THC.","src":["Urgences (marijuana)","SAM 2 — toxicité nicotine/marijuana","Cas CPE 5"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"1","n":"Soutien; thermorégulation"},{"d":"maropitant","r":"S","n":"Si vomissements"},{"d":"diazepam","r":"S","n":"Agitation sévère seulement"},{"d":"atropine","r":"S","n":"Hypersalivation/bradycardie sévère"},{"d":"emulsion_lipidique","r":"2","n":"Intoxication sévère"}],"maj":"Mortalité rare, mais attention aux produits comestibles (chocolat, xylitol, beurre). Dépistage urinaire du THC disponible. CPE : cas 5 (pit-bull).","qc":"Depuis la légalisation (2018), les consultations pour ingestion de cannabis ont augmenté : poser la question explicitement au propriétaire.","al":"","gl":[]},"chat":{"tx":[{"d":"fluides","r":"1","n":""},{"d":"maropitant","r":"S","n":""},{"d":"emulsion_lipidique","r":"2","n":""}],"maj":"Soutien, thermorégulation et surveillance respiratoire; attention aux comestibles contenant chocolat ou xylitol.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau des urgences — Intoxication à la marijuana [tétrahydrocannabinol (THC)] (Article de recherche)","fields":[{"k":"Signes cliniques / examen physique","t":"ingestion de la réserve de marijuana du propriétaire. Apparition rapide (en 60 min), dépression, hypersalivation, mydriase, hypermétrie, vomissements, incontinence urinaire, tremblements, hypothermie et bradycardie. À doses plus élevées, nystagmus, agitation, tachypnée, tachycardie, ataxie, hyperexcitabilité et convulsions possibles."},{"k":"Diagnostic différentiel","t":"DDx maladies GI, maladies du SNC, autres intoxications"},{"k":"Diagnostic","t":"Anamnèse et signes cliniques. Cannabinoïdes dans l'urine et les fèces"},{"k":"Traitement (Rx)","t":"Traitement de soutien : LRS. Lavage gastrique, tranquillisants (diazépam), atropine (hypersalivation). Une sédation aux benzodiazépines peut être nécessaire si les chiens sont très agités. Des solutés intraveineux peuvent être utilisés pour contrer les vomissements prolongés et aider à contrôler la température corporelle."},{"k":"Pronostic / prévention","t":"Excellent"},{"k":"Surveillance / examens complémentaires","t":"TPR"},{"k":"Commentaires","t":"Pas d'antidote spécifique. Le propriétaire doit garder la marijuana hors de portée de ses animaux."}]},{"label":"SAM 2 (notes détaillées)","text":"TOXICITÉ À LA NICOTINE/MARIJUANA- Intoxication chez les animaux de compagnie due à l'ingestion de tabac ou de produits apparentés et se manifestant par un début aigu de signes gastro-intestinaux (GI) suivi d'un dysfonctionnement neurologique potentiellement sévère. Rx= Induire l'émèse par apomorphine, charbon activé, lavage gastrique si pas d'émèse et ingestion d'une grande dose. Fluides IV pour la diurèse, traitement symptomatique comme le diazépam pour les convulsions, atropine pour la bradycardie. Pronostic= Mauvais pronostic si des signes du SNC sont présents ou si une ventilation artificielle est nécessaire Bon pronostic si seulement des signes GI sont observés."},{"label":"Cas CPE 5","fields":[{"k":"Cas clinique","t":"Cas 5 – Chapitre 18. • Stevie, un pit-bull mâle castré de 3 ans (23,1 kg), a été présenté pour un examen d'urgence environ 3 heures après que le propriétaire a remarqué l'apparition aiguë d'un comportement léthargique. Le propriétaire a rapporté que Stevie s'était comporté normalement la veille au soir. Il était le seul chien du foyer et avait accès à un garage et à la cour arrière. Il n'y avait aucun antécédent de morsures de tiques ni de voyage. Stevie avait été castré à l'âge de 8 mois sans complications et n'avait aucun antécédent médical ou chirurgical majeur. Il était à jour pour les préventifs contre les puces, les tiques et les vers du cœur et ne recevait aucun autre médicament. L'examen physique a révélé une température rectale de 98 °F (36,7 °C), une fréquence cardiaque de 60 bpm et une fréquence respiratoire de 24 respirations par minute. Stevie était légèrement déshydraté (6 %) et laissait goutter de l'urine en marchant. Pendant l'examen neurologique, Stevie s'endormait durant les périodes d'inactivité mais avait des moments d'hyperréactivité à une stimulation légère à modérée et, lors d'un de ces épisodes, il a fini par vomir ce qui semblait être une matière végétale. Une ataxie proprioceptive marquée avec mydriase bilatérale et des réflexes pupillaires à la lumière paresseux ont été notés. Le reste de l'examen physique était sans particularité. La NFS et le profil biochimique sérique étaient normaux. La pression artérielle mesurée par la méthode Doppler était de 118 mm Hg. "},{"k":"Évaluation initiale et prise en charge","t":"• Léthargie aiguë, vomissements et signes neurologiques du cerveau antérieur après l'ingestion d'une plante\nDiagnostics différentiels.\n• Marijuana\n• Exposition à l'éthanol, à l'éthylène glycol, à l'ivermectine, aux opioïdes, aux barbituriques, aux\nbenzodiazépines et aux phénothiazines.\nPrise en charge.\nAdministrer immédiatement :\n• Diazépam (0,5 mg/kg IV), Maropitant (1 mg/kg SC), Charbon activé avec sorbitol (2 g/kg PO)\nDémarrer immédiatement la fluidothérapie au débit d'entretien, RL à\n[1386 ml (perte) + 1155 (entretien) = 2541 ml/24 heures = 105,87 ml/h\nRecueillir l'urine pour une analyse d'urine et pour effectuer un test de dépistage de drogues (afin de confirmer\nl'exposition au tétrahydrocannabinol)\nSurveiller – FC, FR, pression artérielle, température, signes neurologiques"},{"k":"Ordonnance (Rx)","t":"Aucun médicament"}]}]},{"id":"nicotine","nom":"Intoxication à la nicotine","sys":"Toxicologie","urg":false,"resume":"Hypersalivation, tremblements, désorientation; peut évoluer vers la dépression respiratoire. Décontamination précoce, soutien respiratoire.","src":["Urgences (nicotine)","SAM 2 — toxicité nicotine"],"img":[],"sp":{"chien":{"tx":[{"d":"charbon","r":"1","n":"Décontamination précoce"},{"d":"fluides","r":"U","n":""},{"d":"diazepam","r":"S","n":"Convulsions"},{"d":"atropine","r":"S","n":"Hypersalivation"}],"maj":"Signes précoces en < 1 h (hypersalivation, vomissements, tremblements, excitation) puis dépression; attention aux sachets de nicotine, cigarettes électroniques, timbres et gommes.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau des urgences — Intoxication à la nicotine (Article de recherche)","fields":[{"k":"Signes cliniques / examen physique","t":"hypersalivation, tremblements et désorientation. TPR normaux, MM normales. Vomissement de mégots de cigarettes. FSC normale. BUN, PT élevés. Signes cardiovasculaires (hypertension et tachycardie). Tachypnée."},{"k":"Diagnostic différentiel","t":"Autres intoxications : strychnine, méthylxanthines, organophosphorés, insecticides anticholinestérasiques"},{"k":"Diagnostic","t":"les signes initiaux ressemblent à une intoxication par insecticide anticholinestérasique ; plus tard - à celle par des dépresseurs (éthanol, barbituriques, marijuana, etc.)"},{"k":"Traitement (Rx)","t":"Induire le vomissement (apomorphine) ou lavage gastrique. Charbon activé (4 g/kg une fois) par voie orale. LRS (3,8 ML/KG). Barbituriques ou benzodiazépines (diazépam 0,1 mg/kg). Une oxygénothérapie ou un soutien ventilatoire peut être nécessaire."},{"k":"Pronostic / prévention","t":"très grave à mauvais lorsque de grandes quantités de nicotine. Bon si l'animal survit aux quatre premières heures."},{"k":"Surveillance / examens complémentaires","t":"Surveiller la fréquence cardiaque et la pression artérielle du patient."}]},{"label":"SAM 2 (notes détaillées)","text":"TOXICITÉ À LA NICOTINE/MARIJUANA- Intoxication chez les animaux de compagnie due à l'ingestion de tabac ou de produits apparentés et se manifestant par un début aigu de signes gastro-intestinaux (GI) suivi d'un dysfonctionnement neurologique potentiellement sévère. Rx= Induire l'émèse par apomorphine, charbon activé, lavage gastrique si pas d'émèse et ingestion d'une grande dose. Fluides IV pour la diurèse, traitement symptomatique comme le diazépam pour les convulsions, atropine pour la bradycardie. Pronostic= Mauvais pronostic si des signes du SNC sont présents ou si une ventilation artificielle est nécessaire Bon pronostic si seulement des signes GI sont observés."}]},{"id":"ethylene_glycol","nom":"Intoxication à l'éthylène glycol (antigel)","sys":"Toxicologie","urg":true,"resume":"Phase 1 (30 min–12 h) : « marin ivre », ataxie, PU/PD, vomissements; phase 2 : amélioration apparente; phase 3 (12–72 h) : insuffisance rénale aiguë. Trou anionique/osmolaire élevés, cristaux d'oxalate de calcium monohydraté. CPE : cas 17.","src":["Urgences (éthylène glycol)","SAM 2 — toxicité à l'éthylène glycol","Cas CPE 17"],"img":[],"sp":{"chien":{"tx":[{"d":"fomepizole","r":"1","n":"Antidote : plus efficace si administré tôt (produit humain Antizol®)"},{"d":"ethanol","r":"2","n":"Alternatif (magistral)"},{"d":"fluides","r":"U","n":""},{"d":"charbon","r":"S","n":"Si < 1–2 h (peu d'adsorption de l'éthylène glycol)"},{"d":"maropitant","r":"S","n":""}],"maj":"Fomépizole : répertorié et commercialisé au Canada (Antizol®, BDPP) — traitement de choix. Hémodialyse (centres de référence) si anurie. Le propylène glycol (antigel « pour animaux ») est beaucoup moins toxique. CPE : cas 17.","qc":"Antigel au propylène glycol vs éthylène glycol : vérifier l'étiquette.","al":"","gl":[]},"chat":{"tx":[{"d":"fomepizole","r":"1","n":"Fenêtre plus courte : traiter dans les premières heures"},{"d":"ethanol","r":"2","n":""},{"d":"fluides","r":"U","n":""}],"maj":"Le chat est très sensible : consulter sans délai; fomépizole à posologie féline.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau des urgences — Éthylène glycol (p.686)","fields":[{"k":"Signes cliniques / examen physique","t":"animal près d'un garage ou en liberté. Comportement de « marin ivre ». Faiblesse et ataxie. Cristaux d'oxalate de calcium monohydraté"},{"k":"Diagnostic différentiel","t":"encéphalite, traumatisme crânien, néoplasie intracrânienne, ACD ; barbituriques, aspirine, méthanol, éthanol, isopropanol, propylène glycol, éthers de glycol, vitamine D3, lys, AINS, raisins frais ou secs."},{"k":"Diagnostic","t":"Signes d'insuffisance rénale aiguë + oxalate de Ca. Bandelettes vétérinaires de dépistage de l'éthylène glycol ; trousse de réactif qualitatif VetSpec pour l'éthylène glycol"},{"k":"Traitement (Rx)","t":"si < 1 h induire le vomissement : apomorphine 0,04 mg/kg IV, charbon activé 1 g/kg PO une fois ; soluté, fomépizole 20 mg/kg IV une fois puis 15 mg/kg IV q12h x 3 tx, ou éthanol 7 % IV ; pyridoxine 1–2 mg/kg IV q6h, thiamine 50 mg IV lente q 6h. Pour les CHATS exposés < 3 h : 4-MP (125 mg/kg IV lente puis 31,5 mg/kg q12h x 3 tx)"},{"k":"Pronostic / prévention","t":"Chiens : passable à bon avec intervention intensive dans les 8–12 heures ; chats : réservé à mauvais avec SC. Une intervention intensive dans les 3 heures suivant l'exposition peut réussir."},{"k":"Surveillance / examens complémentaires","t":"Fonction rénale, convulsions, IRA, production urinaire, état mental, CIVD"},{"k":"Commentaires","t":"Verrouiller les contenants d'antigel. Garder les animaux à l'intérieur"}]},{"label":"SAM 2 (notes détaillées)","text":"TOXICITÉ À L'ÉTHYLÈNE GLYCOL\n(antigel)/néphropathie SUBJECTIF – preuve indirecte d'exposition (animal près du garage ou de la zone de travail) calme/déprimé, polyurie/polydipsie (chien), nausées, vomissements, PU, PD\n• Tout âge peut être affecté.\n• Comportement d'ivresse (stupeur, ataxie, marche sur les phalanges, chutes etc.)\n• Salivation et ulcères buccaux peuvent être observés.\n• Le patient montre graduellement plus de faiblesse, de dépression, d'ataxie, d'anorexie, et de tachypnée/dyspnée à mesure que la lésion rénale aiguë et l'oligurie/anurie surviennent, 72 heures après l'ingestion.\nOBJECTIF- dépression du SNC, faiblesse généralisée, signes du SNC (tremblements, convulsions en cas d'intoxication sévère durant les premières heures post-ingestion), anorexie, vomissements\nTachypnée et tachycardie (souvent inaperçues)\nDes signes manifestes d'insuffisance rénale (oligurie/anurie, anorexie, vomissements, augmentation du volume rénal avec signes de douleur rénale etc.) débutent typiquement 24-72 heures après l'ingestion.\n• Dans les intoxications sévères, des convulsions, un nystagmus, et des tremblements peuvent survenir dans les premières heures après l'ingestion (pronostic sombre).\nÉVALUATION\n• Liste des problèmes-déshydratation, PU, PD, vomissements\n• DDx – troubles du SNC, dépression du SNC, ataxie, traumatisme crânien, encéphalite, néoplasie intracrânienne.\nAcidocétose diabétique autre intoxication – médicaments comme aspirine, éthanol, méthanol, AINS, raisins secs/raisins\nPLAN\n• DIAGNOSTIC ■NFS-hématocrite et protéines totales—souvent élevés en raison de la déshydratation. Leucogramme\nde stress— fréquent ■BIOCHIMIE – l'urée et la créatinine seront augmentées. Hyperkaliémie si oligurique ou anurique. Hypocalcémie—survient chez\nenviron la moitié des patients. Hyperglycémie—survient chez environ\nla moitié des patients. ■Analyse d'urine – calculs d'oxalate de calcium (prisme à 6 côtés) ■Bandelettes de test vétérinaires pour l'éthylène glycol. ■Osmolalité sérique=trou osmolaire élevé >20 mOsm/kg\n• THÉRAPEUTIQUE ■Émèse – xylazine (chat), APOMORPHINE (chien) – 0,03mg/kg IV ■Charbon activé – 2g/kg PO une fois ■Fluide IV – NaCl 0,9% (éviter le Ringer lactate) ■PROTOCOLE\n• CHAT – éthanol 20% 3-5 ml/kg IV (dilué dans de l'eau stérile) Effet secondaire – hypothermie et détresse respiratoire Perfusion continue – 0,5-1 ml/kg\n• CHIEN – 4 MP (fomépizole) – 20 mg/kg IV puis après 12 heures réduire la dose à 15 mg/kg.\n• Quand appeler un vétérinaire – si une complication survient – hypothermie, détresse respiratoire, muqueuses pâles, hypotension, absence de production d'urine\n• PRONOSTIC – dépend du délai depuis l'ingestion – si l'ingestion date de moins de 3 heures alors c'est bon. Mauvais si les symptômes cliniques ont débuté à la présentation."},{"label":"Cas CPE 17","fields":[{"k":"Cas clinique","t":"Cas 17 – Chapitre 15. • Une femelle caniche de 3 ans nommée Mia (20 kg) a été présentée à votre hôpital d'urgence et de spécialité avec des convulsions et des vomissements fréquents (dix fois) au cours des dernières 24 heures. Le propriétaire a indiqué que Mia est à jour pour toutes ses vaccinations. Il a également mentionné que Mia est essentiellement un chien d'intérieur qui dort à l'occasion dans son garage. Hier, le propriétaire a remarqué que Mia paraissait extrêmement anxieuse et confuse. Il a aussi dit qu'il n'avait jamais porté attention à la quantité d'eau que Mia buvait en une journée jusqu'à hier. Selon le propriétaire, Mia a bu au moins 3 fois la quantité d'eau dont il pense pouvoir se souvenir et il a également trouvé plus de taches d'urine que d'habitude dans la maison. Il pense que Mia a ingéré quelque chose, mais il ne sait pas quoi. Le chien était vif et alerte il y a deux jours et maintenant elle a des convulsions et peut à peine marcher. À l'examen physique, Mia était léthargique mais réactive et était déshydratée à 8 %. Les signes vitaux étaient les suivants : 94 °F, 50 bpm et 160 bpm. La base de données minimale à la présentation comprenait : NFS, gaz sanguins, bilan biochimique et analyse d'urine (les résultats se trouvent dans la diapositive suivante). Le propriétaire est très inquiet mais croit que vous pouvez sauver Mia. Il est donc prêt à faire tout ce qu'il faut pour sauver sa petite. Analyte Valeur Valeur de référence pH 7,18 7,32 – 7,45 pCO2 (mmHg) 18 26 – 46 HCO3 (µmol/L) 6,3 17–24 EB (µmol/L) –19,6 –5,8 à 3,6 EB : excès de base Analyte Valeur Valeur de référence Hématocrite (L/L) 0,56 0,37 – 0,55 Hémoglobine (g/L) 183 120 – 180 Érythrocytes (X 1012/L) 8,8 5,5 – 8,5 VGM (fL) 62 60 – 77 CCMH (g/L) 327 320 – 360 Plaquettes (X 109/L) 220 200 –"},{"k":"Évaluation initiale et prise en charge","t":"• Chien présentant des signes d'insuffisance rénale aiguë\nDiagnostics différentiels.\n• Toxicité (éthylène glycol, AINS, éthanol, métaux lourds, plantes)\n• Ingestion d'acide oxalique\n• Morsure de serpent crotalidé\n• Leptospirose\nPrise en charge.\nImmédiatement :\n• Diminuer le stress – À la présentation, placer le chien dans une cage chaude à O2 ou un masque et placer\nune sonde urinaire\n• Effectuer un test d'éthylène glycol.\n• Traitement du choc (RL – 20 ml/kg jusqu'à 90 ml/kg, puis réévaluer la perfusion).\n• Fluides d'entretien (RL) = besoins liés au déficit (8 % x 20 kg) + entretien (60 ml/kg/jour) + pertes continues\n(chien ayant vomi 10 fois à 100 ml/épisode) = 1600 ml + 1200 ml/jour + 400 ml/jour = 3200 ml/jour (déficit\nremplacé sur 4 à 6 heures).\n• Placer un cathéter d'hémodialyse – commencer l'hémodialyse à\n• Fomépizole (20 mg/kg IV lent sur 30 minutes), puis 15 mg/kg IV lent à 12 et 24 heures, puis 5 mg/kg à 36\nheures.\n• Furosémide (1 mg/kg/h pendant 4 heures, puis 5 µg/kg/min pour maintenir le débit urinaire.\n• Ondansétron 0,5 mg/kg PO q12 heures\n• Sucralfate à 0,5 g PO q8h\n• Famotidine à 0,5 mg/kg PO q12h\n• Diazépam (2 mg/kg IV)\nAutres tests diagnostiques\n• gaz sanguins artériels, NFS, panel de coagulation, bilan biochimique, analyse d'urine, échographie\nabdominale et radiographie (reins)\nSurveiller – Oxymétrie de pouls, surveillance des convulsions, temps de coagulation activé, FC/ECG/PA, FR,\nMM/TRC, température, état d'hydratation, attitude, gaz sanguins artériels, électrolytes, débit urinaire, analyse d'urine,\nNFS"},{"k":"Ordonnance (Rx)","t":"Sucralfate à 0,5 g PO q8h pendant 7 jours; Famotidine à 0,5 mg/kg PO q12h pendant 7 jours; Ondansétron à 0,5 mg/kg PO
