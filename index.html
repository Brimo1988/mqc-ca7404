ommencer avant la fin de la série vaccinale."],"etapes":[{"age":"6–8 sem","txt":"1re dose DAPP : CDV + CAV-2 + CPV-2 (± parainfluenza). Pas avant 6 semaines à cause des anticorps maternels. Bordetella orale/intranasale possible dès 3 à 8 semaines selon le produit (Nobivac Intra-Trac Oral BbPi : dès 7 semaines)."},{"age":"10–12 sem","txt":"2e dose DAPP. Leptospirose, 1re dose (dès 8 semaines, 2e dose 2 à 4 semaines plus tard) et Lyme, 1re dose, si le risque le justifie."},{"age":"12 sem +","txt":"Rage, 1re dose (Nobivac NXT Canine 3-Rabies : une dose dès 12 semaines selon l'étiquette canadienne)."},{"age":"14–16+ sem","txt":"3e dose DAPP, donnée à 16 semaines ou plus (la dose la plus importante). 2e dose de leptospirose / Lyme."},{"age":"6 mois – 1 an","txt":"Rappel DAPP dès ~26 semaines (WSAVA), ou à 1 an. Rappel rage 1 an après la première dose (étiquette Nobivac NXT 3-Rabies)."},{"age":"Adulte","txt":"DAPP : au plus souvent tous les 3 ans. Rage : tous les 3 ans avec un vaccin à 3 ans, sinon selon l'étiquette. Leptospirose, Lyme (avant la saison des tiques), Bordetella, grippe : annuel si le risque persiste."}],"grille":{"cols":["6–8 sem","10–12 sem","14–16+ sem","6 mois–1 an","Ensuite"],"rows":[{"v":"DAPP (CDV, CAV-2, CPV-2)","st":"core","c":["c","c","c","c","3 ans"]},{"v":"Rage","st":"core","c":["","","c","c","1–3 ans*"]},{"v":"Leptospirose (4 sérovars)","st":"non","c":["","o","o","","annuel"]},{"v":"Bordetella ± CPiV","st":"non","c":["o","","","","annuel"]},{"v":"Lyme","st":"non","c":["","o","o","","annuel"]},{"v":"Grippe canine","st":"non","c":["o","o","","","annuel"]}],"note":"Pastille pleine (✓) = recommandé à tous ; cercle vide = selon le risque (vaccin non essentiel)   * selon l'étiquette du produit (Nobivac NXT 3-Rabies : rappel à 1 an, puis tous les 3 ans). Les âges de départ des vaccins non essentiels dépendent de la notice du produit."},"vaccins":[{"n":"DAPP — maladie de Carré, adénovirus 2, parvovirus 2 (± parainfluenza)","st":"core","type":"Vivant modifié (MLV) pour CPV-2 et CAV-2 ; CDV MLV ou recombinant. Les vaccins recombinants protègent comme les MLV.","prim":"Dès 6–8 sem, puis toutes les 2–4 sem jusqu'à ≥16 sem. Cas à haut risque : poursuivre jusqu'à 20 sem et vacciner toutes les 2–3 sem.","rap":"~6 mois (dès 26 sem) ou 1 an, puis pas plus souvent que tous les 3 ans. Chien gériatrique : tous les 3 ans ou plus souvent.","note":"Une seule dose de MLV ou de recombinant protège probablement la plupart des adultes sans historique. Le CPV-2 inactivé n'est pas recommandé lorsqu'un MLV existe. Certains MLV sont sans danger chez la chienne gestante : vérifier la notice.","prod":[["Nobivac Canine 1-DAPPv","conf"],["Nobivac Edge DAPPv","conf"],["Nobivac Canine 3-DAPv (sans parainfluenza)","conf"]]},{"n":"Rage","st":"core","type":"Inactivé adjuvanté (1 ou 3 ans selon le produit) ; vaccin de nouvelle génération sans adjuvant ni agent de conservation (Nobivac NXT).","prim":"Dès 12 sem selon l'étiquette habituelle. Appliquer d'abord la réglementation locale, puis la notice.","rap":"1 an après la première dose, puis selon la durée d'immunité du produit (Nobivac NXT 3-Rabies : tous les 3 ans).","note":"Non obligatoire à l'échelle de la province, mais fortement recommandée, y compris pour les chiens d'intérieur (MAPAQ). Obligatoire dans certaines municipalités. Remettre un certificat de vaccination.","prod":[["Nobivac NXT Canine 3-Rabies","conf"]]},{"n":"Leptospirose (4 sérovars)","st":"non","type":"Bactérine tuée. Préférer un vaccin à 4 sérovars : l'ACVIM 2023 signale des cas chez des chiens vaccinés avec des vaccins à 2 sérovars dans certaines régions.","prim":"2 doses à 2–4 sem d'intervalle, dès 8 sem environ (voir la notice).","rap":"Annuel.","note":"Non essentiel, mais « essentiel » là où la maladie est endémique (WSAVA 2024). L'ACVIM 2023 rappelle que la leptospirose reste fréquente, y compris chez les petits chiens urbains et les chiots dès 11 semaines. Maladie zoonotique.","prod":[["Nobivac Canine 1-DAPPv+L4","conf"],["Nobivac Edge DAPPv+L4","conf"],["Nobivac Edge Lepto4","conf"]]},{"n":"Bordetella bronchiseptica ± parainfluenza (toux de chenil)","st":"non","type":"Vivant avirulent intranasal ou oral (dose unique) ; ou bactérine / extrait parentéral (2 doses).","prim":"Intranasal / oral : 1 dose, dès 3 à 8 sem selon le produit (Nobivac Intra-Trac Oral BbPi : dès 7 sem).","rap":"Annuel.","note":"Pour les chiens en pension, garderie, toilettage, expositions. Les vaccins intranasaux ou oraux ne doivent JAMAIS être injectés (réaction grave) ; les vaccins parentéraux ne se donnent pas par voie intranasale.","prod":[["Nobivac Intra-Trac Oral BbPi","conf"],["Bronchicine CAe (parentéral)","sec"],["Recombitek Oral Bordetella","sec"]]},{"n":"Maladie de Lyme (Borrelia burgdorferi)","st":"non","type":"Bactérine tuée, ou sous-unité (OspA recombinant ; OspA + OspC chimérique).","prim":"2 doses à 2–4 sem d'intervalle, dès ~8 sem (voir la notice).","rap":"Annuel, juste avant la saison des tiques.","note":"Seulement pour les chiens à risque élevé qui vivent dans une région endémique ou la visitent. Le consensus ACVIM 2018 n'a pas tranché ; ne pas vacciner un chien malade ou protéinurique. Le contrôle des tiques (ectoparasiticide + inspection) reste la mesure principale ; aucun vaccin ne protège à 100 % et son effet sur la néphrite de Lyme est incertain.","prod":[["Nobivac Lyme","conf"],["Vanguard crLyme","sec"],["Recombitek Lyme","sec"]]},{"n":"Grippe canine (H3N2, H3N8 ou bivalent)","st":"non","type":"Inactivé adjuvanté, parentéral.","prim":"2 doses à 2–4 sem d'intervalle, dès 6–8 sem (voir la notice).","rap":"Annuel.","note":"Pour les chiens à risque regroupés : chenil, garderie, expositions.","prod":[["Nobivac NXT Canine Flu H3N2","conf"],["Nobivac Canine Flu Bivalent","sec"]]},{"n":"Non recommandés","st":"nr","type":"Coronavirus entérique canin ; Giardia ; parvovirus inactivé (si MLV disponible).","prim":"—","rap":"—","note":"Coronavirus entérique : preuve faible qu'il soit un pathogène primaire chez l'adulte, maladie souvent bénigne et précoce, et aucune preuve que les vaccins protègent contre les variants graves. Attention : certains vaccins combinés contiennent cette composante (ex. Nobivac Canine 1-DAPPv+Cv).","prod":[]}],"situations":["Adulte sans historique ou jamais vacciné : une dose de vaccin essentiel MLV ou recombinant protège probablement la plupart des chiens ; certains fabricants recommandent 2 doses à 2–4 semaines d'intervalle.","Vérifier la réponse du chiot : sérologie au moins 4 semaines après la dernière dose (soit dès 20 sem), ou dose supplémentaire à 26 sem ou plus.","Chien gériatrique : une étude de 2023 a montré moins de titres protecteurs (Carré, adénovirus) quand la dernière vaccination date de plus de 3 ans ; revacciner tous les 3 ans ou plus souvent.","Corticothérapie : elle ne bloque pas de façon importante la réponse vaccinale ; revacciner après l'arrêt du traitement, surtout si le corticoïde a été donné pendant la série initiale.","Chimiothérapie ou immunosuppresseurs puissants : demander l'avis d'un spécialiste (oncologue ou immunologiste) plutôt que de refuser par défaut.","Refuge : vacciner à l'admission, ou avant, avec les vaccins essentiels MLV ; chiots, si possible toutes les 2–3 sem dès 4 sem jusqu'à 5 mois."],"notes":[{"s":"Feuille urgences — maladie de Carré","t":"Très contagieux. Vaccin ML-CDV chiots q 3–4 sem de 6 à 16 sem, rappel à 1 an, puis q 3 ans"},{"s":"Notes SAM 2 — parvovirose canine","t":"Pour prévenir et contrôler le CPV, la vaccination avec un vaccin vivant modifié est recommandée à 6–8, 10–12, et 14–16 semaines d'âge, suivie d'un rappel administré 1 an plus tard puis tous les 3 ans."},{"s":"Feuille maladies chroniques — leptospirose","t":"vacciner tous les chiens à risque"}],"alertes":[{"t":"À actualiser","x":"Vos notes (série 6–16 sem, rappel à 1 an, puis q 3 ans) restent exactes. La mise à jour WSAVA 2024 ajoute surtout : la dose à ≥16 semaines est la plus importante, un rappel dès ~26 semaines (6 mois) est préférable à 12–16 mois, et la leptospirose devient « essentielle » là où elle est endémique."}]},"chat":{"retenir":["Vaccins essentiels (« core ») : panleucopénie (FPV), herpèsvirus félin 1 (FHV-1) et calicivirus félin (FCV), regroupés dans le vaccin FVRCP. La rage est fortement recommandée au Québec, et la leucose féline (FeLV) est essentielle chez les chatons de moins de 1 an et chez les chats qui ont accès à l'extérieur.","Série du chaton : première dose entre 6 et 8 semaines (jamais avant 6 semaines), puis toutes les 3 à 4 semaines jusqu'à 16 semaines ou plus, puis une dose à ~26 semaines (6 mois) ou à 1 an.","Chat adulte à faible risque (d'intérieur, sans pension) : FVRCP au plus souvent tous les 3 ans. Chat à risque (pension, contacts avec d'autres chats) : FHV/FCV jusqu'à une fois par an.","Tester le FeLV (et le FIV) avant de vacciner contre le FeLV ; seuls les chats négatifs se vaccinent.","Injecter par voie sous-cutanée, le plus distal possible sur un membre : rage = membre postérieur droit, FeLV = membre postérieur gauche. Jamais dans l'espace interscapulaire.","Non recommandés : PIF, Giardia, Microsporum canis. Le vaccin FIV n'est pas offert en Amérique du Nord."],"etapes":[{"age":"6–8 sem","txt":"1re dose FVRCP (FPV + FHV-1 + FCV). Pas avant 6 semaines. FeLV : 1re dose dès 8 semaines (test négatif d'abord)."},{"age":"10–12 sem","txt":"2e dose FVRCP. FeLV : 2e dose, 3 à 4 semaines après la première. Chlamydia felis, 1re dose (dès 9 sem) si indiqué."},{"age":"12 sem +","txt":"Rage, 1re dose (selon l'étiquette du produit ; âge minimal habituel : 12 semaines)."},{"age":"14–16+ sem","txt":"3e dose FVRCP, donnée à 16 semaines ou plus. Dans les situations à haut risque, poursuivre jusqu'à 20 semaines, toutes les 2–3 semaines."},{"age":"6 mois – 1 an","txt":"Rappel FVRCP dès ~26 semaines (WSAVA), ou à 1 an. FeLV : rappel 1 an après la dernière dose de la série. Rage : rappel selon l'étiquette."},{"age":"Adulte","txt":"FVRCP : tous les 3 ans (faible risque) ; FHV/FCV annuel si risque élevé. FeLV : annuel si l'exposition persiste, ou selon la notice (Nobivac NXT FeLV : durée d'immunité de 2 ans). Rage : selon l'étiquette et la réglementation."}],"grille":{"cols":["6–8 sem","10–12 sem","14–16+ sem","6 mois–1 an","Ensuite"],"rows":[{"v":"FVRCP (FPV, FHV-1, FCV)","st":"core","c":["c","c","c","c","3 ans"]},{"v":"Rage","st":"core","c":["","","c","c","1–3 ans*"]},{"v":"FeLV","st":"core","c":["","c","","c","annuel**"]},{"v":"Chlamydia felis","st":"non","c":["","o","o","","annuel"]},{"v":"Bordetella (intranasal)","st":"non","c":["","","","","rare"]}],"note":"Pastille pleine (✓) = recommandé ; cercle vide = selon le risque   * selon l'étiquette du produit et la réglementation   ** si le risque d'exposition persiste (sinon selon la notice). FeLV : la 1re dose se donne dès 8 sem et la 2e 3–4 sem plus tard ; la colonne 10–12 sem représente cette 2e dose."},"vaccins":[{"n":"FVRCP — panleucopénie, herpèsvirus 1, calicivirus","st":"core","type":"Vivant atténué parentéral (rapide et durable pour la panleucopénie) ; inactivé parentéral (options sans adjuvant) ; intranasal FHV + FCV ± FPV (rapide, mais toujours associer un vaccin FPV sous-cutané).","prim":"Dès 6 sem, toutes les 3–4 sem jusqu'à ≥16 sem. Haut risque : jusqu'à 20 sem, toutes les 2–3 sem.","rap":"~6 mois (dès 26 sem) ou 1 an ; puis tous les 3 ans (faible risque) ; FHV/FCV annuel si risque élevé. Chats en pension : revacciner 1 à 2 semaines avant l'exposition.","note":"Aucun vaccin FHV n'empêche l'infection ; l'immunité FHV/FCV est partielle, contrairement à la panleucopénie. Ne pas utiliser de vaccin vivant atténué chez la chatte gestante ni chez un chaton de moins de 4 semaines : préférer un vaccin inactivé. Ne pas éviter la vaccination des chats FeLV/FIV positifs.","prod":[["Nobivac Feline 1-HCP","conf"],["Nobivac Feline 1-HCPCH (CH = Chlamydia felis)","conf"],["Nobivac Feline 1-HCP+FeLV","conf"],["Nobivac Feline 1-HCPCH+FeLV","conf"]]},{"n":"Rage","st":"core","type":"Recombinant (canarypox) sans adjuvant, ou inactivé adjuvanté (1 ou 3 ans).","prim":"Appliquer d'abord la réglementation locale, puis la notice du produit (âge minimal habituel : 12 sem).","rap":"Selon la réglementation locale ou la durée d'immunité du produit (1 ou 3 ans).","note":"Non obligatoire à l'échelle de la province, mais recommandée, y compris pour les chats d'intérieur qui s'échappent (MAPAQ). Site d'injection : membre postérieur droit, le plus distal possible, par voie sous-cutanée. Les produits félins homologués au Canada n'ont pas pu être vérifiés : consulter l'ACIA ou le distributeur.","prod":[]},{"n":"Leucose féline (FeLV)","st":"core","type":"Recombinant adjuvanté, inactivé adjuvanté, ou Nobivac NXT FeLV (sans adjuvant ni agent de conservation).","prim":"Dès 8 sem, 2 doses à 3–4 sem d'intervalle (Nobivac NXT FeLV : même schéma).","rap":"1 an après la dernière dose de la série, puis annuel si le risque persiste ; selon la notice (2 à 3 ans) si le risque est faible. Nobivac NXT FeLV : durée d'immunité de 2 ans selon l'étiquette canadienne.","note":"Essentiel chez les chatons de moins de 1 an et chez les adultes avec accès extérieur ou qui vivent avec des chats qui sortent ; les morsures sont un mode de transmission reconnu chez l'adulte. Tester avant. Site : membre postérieur gauche, distal.","prod":[["Nobivac NXT FeLV","conf"],["Nobivac Feline 2-FeLV","conf"],["Nobivac Feline 1-HCP+FeLV","conf"]]},{"n":"Chlamydia felis","st":"non","type":"Vivant avirulent non adjuvanté, ou tué adjuvanté, parentéral.","prim":"2 doses à 2–4 sem d'intervalle, dès 9 sem.","rap":"Annuel si le risque persiste.","note":"Surtout dans le cadre d'un plan de contrôle en milieu multi-chats où la maladie est confirmée. L'inoculation conjonctivale accidentelle du vaccin vivant peut causer une maladie.","prod":[["Nobivac Feline 1-HCPCH","conf"]]},{"n":"Bordetella bronchiseptica (intranasal)","st":"non","type":"Vivant avirulent non adjuvanté, intranasal.","prim":"1 dose dès 4 sem.","rap":"Annuel si le risque persiste.","note":"Pas d'usage systématique chez le chat de compagnie ; à envisager dans des colonies inhabituellement grandes.","prod":[]},{"n":"FIV","st":"nr","type":"Tué adjuvanté (3 doses).","prim":"—","rap":"—","note":"Non offert en Amérique du Nord (selon la WSAVA, seulement au Japon, en Australie et en Nouvelle-Zélande). Il induit des anticorps qui compliquent le diagnostic.","prod":[]},{"n":"Non recommandés","st":"nr","type":"PIF (intranasal) ; Giardia ; Microsporum canis.","prim":"—","rap":"—","note":"Preuves insuffisantes pour justifier ces vaccins chez le chat de compagnie.","prod":[]}],"situations":["Chat adulte sans historique : 2 doses de FVRCP à 2–4 semaines d'intervalle sont généralement recommandées, bien qu'une seule dose protège probablement beaucoup de chats.","Vérifier la réponse : dose supplémentaire à ≥26 semaines, ou titres selon le contexte.","Chatte gestante : pas de vaccin vivant atténué ; les vaccins inactivés sont considérés plus sûrs.","Chats rétrovirus positifs : ne pas éviter la vaccination ; un vaccin inactivé est parfois préférable à un vaccin vivant atténué.","Pension ou environnement à risque : revacciner contre FHV/FCV 1 à 2 semaines avant, et vacciner contre la panleucopénie au plus souvent tous les 3 ans.","Sarcome au site d'injection : injecter par voie sous-cutanée (plus facile à détecter qu'en intramusculaire), le plus distal possible. Règle 3-2-1 : toute masse qui persiste 3 mois après la vaccination, dépasse 2 cm, ou grossit encore 1 mois après, doit faire l'objet d'une biopsie incisionnelle (pas excisionnelle).","Corticothérapie : voir ci-dessus (revacciner après l'arrêt si elle a été donnée pendant la série initiale). Chimiothérapie : avis spécialisé.","Refuge : vacciner à l'admission, ou avant, avec les vaccins essentiels vivants atténués ; chatons, si possible toutes les 2–3 semaines dès 4 semaines jusqu'à 5 mois."],"notes":[{"s":"Notes SAM 2 — panleucopénie féline","t":"Les cliniciens doivent administrer le vaccin après que le chaton ait 8 semaines pour éviter l'inactivation par les anticorps maternels, puis approximativement 3 et 6 semaines après la première vaccination."},{"s":"Notes SAM 2 — sarcome au site d'injection","t":"SARCOME AU SITE D'INJECTION-tumeurs localement agressives induites par l'administration d'injections IM. La rage et le FeLV sont les plus fréquents. Rx-Une excision radicale avec des marges latérales de 3-5 cm et 2 plans fasciaux en profondeur est recommandée. La récidive est très fréquente."},{"s":"Feuille urgences — panleucopénie","t":"Vaccin vivant modifié préféré."}],"alertes":[{"t":"⚠ À corriger / nuancer","x":"Vos notes : « après 8 semaines, puis ~3 et 6 semaines après la première dose ». Cela place la dernière dose vers 14 semaines, donc encore dans la période où les anticorps maternels peuvent interférer. La WSAVA 2024 recommande de poursuivre jusqu'à 16 semaines ou plus, puis une dose à ≥26 semaines. Départ possible dès 6 semaines."},{"t":"À actualiser","x":"Vos notes (rage et FeLV les plus fréquents, injection IM) : la recommandation actuelle est l'injection sous-cutanée, distale, avec un site différent par type de vaccin (rage à droite, FeLV à gauche), et la règle 3-2-1 pour décider de la biopsie."}]},"qc":{"titre":"Québec : rage et exigences","blocs":[{"t":"Statut légal de la rage","l":["La vaccination antirabique n'est pas obligatoire à l'échelle de la province : selon la presse (2026), la province ne privilégie pas cette option et mise plutôt sur la sensibilisation et la responsabilisation des propriétaires. Elle est toutefois recommandée, y compris pour les animaux d'intérieur qui peuvent s'échapper.","Plusieurs municipalités l'exigent : par exemple Sainte-Catherine (preuve de vaccination à jour pour le permis de chien ou de chat de 6 mois et plus) et la Ville de Québec (chien déclaré potentiellement dangereux). Vérifier le règlement municipal du client.","Attention : des sites Web affirment que la loi provinciale rend la vaccination obligatoire ; cela n'est pas confirmé par le MAPAQ."]},{"t":"Contexte 2026 : rage du raton laveur","l":["Recrudescence de la rage du raton laveur au Québec en 2026. À la demande du MAPAQ, la Faculté de médecine vétérinaire de l'Université de Montréal a organisé des cliniques de vaccination antirabique à tarif réduit, du 30 août à la mi-octobre, en Montérégie, en Estrie, au Centre-du-Québec et dans la région de Montréal.","Dans les zones à risque, la vaccination antirabique devrait faire partie de la routine (propos rapportés par la presse). Un certificat de vaccination est remis pour chaque animal vacciné."]},{"t":"Déclaration","l":["La rage est une maladie à déclaration obligatoire : les médecins vétérinaires doivent la déclarer au MAPAQ (1 844 ANIMAUX).","Personne mordue : laver la plaie à l'eau courante et au savon pendant 10 à 15 minutes, puis consulter un professionnel de la santé ou appeler Info-Santé (811)."]}],"mordeur":{"t":"Chien, chat ou furet qui a mordu une personne","l":["Animal en santé : observation de 10 jours, sous la responsabilité du propriétaire, qu'il soit vacciné ou non.","Ne pas vacciner contre la rage pendant l'observation, sauf si l'animal est mordu à son tour par un animal potentiellement rabique.","Si des signes compatibles avec la rage apparaissent : isoler l'animal et aviser le MAPAQ sans délai ; aviser aussi le MAPAQ si l'animal meurt pendant l'observation (carcasse étiquetée, congelée au moins 10 jours).","Sans signe clinique 10 jours après la morsure, l'animal n'a pas pu transmettre la rage au moment de l'incident."]},"mordu":{"t":"Animal de compagnie mordu par un animal suspect (chauve-souris, raton laveur, mouffette, renard, etc.)","avert":"Première mesure : nettoyer la plaie à l'eau et au savon pendant 10 à 15 minutes, puis appliquer un antiseptique, en portant des gants et un équipement de protection.","vac":{"t":"Chien, chat ou furet vacciné (statut à jour)","opts":["Option 1 : incident de moins de 7 jours → rappel antirabique le plus vite possible + isolement et observation de 45 jours.","Option 2 : isolement et observation de 3 mois.","Option 3 : euthanasie."]},"nonvac":{"t":"Chien ou chat non vacciné (ou statut non à jour)","opts":["Prophylaxie post-exposition (si l'incident date de moins de 7 jours) : 3 doses d'un vaccin antirabique standard — immédiatement, puis durant la 3e semaine, puis durant la 8e semaine — avec isolement et observation de 3 mois.","Si la prophylaxie est impossible : isolement et observation de 6 mois, ou euthanasie."]},"note":"Source : guide d'intervention du MAPAQ pour les médecins vétérinaires (février 2023). Vérifier la version en vigueur sur le site du MAPAQ ou en appelant le 1 844 ANIMAUX, surtout depuis la recrudescence de 2026."},"autres":{"t":"Autres vaccins au Québec : décider selon le risque","l":["Leptospirose : maladie zoonotique encore fréquente, y compris chez les petits chiens urbains ; vaccin à 4 sérovars annuel pour les chiens exposés (ACVIM 2023, WSAVA 2024).","Lyme : à considérer seulement pour les chiens qui vivent dans une région où la maladie est endémique ou qui s'y rendent (consulter la carte de risque de l'INSPQ) ; contrôle des tiques en priorité.","Bordetella et grippe canine : chiens en pension, garderie, toilettage, expositions.","FeLV : chatons et chats avec accès à l'extérieur."]}},"refs":[{"k":"wsava_vacc_2024","t":"WSAVA 2024 — lignes directrices de vaccination du chien et du chat (lues en entier)"},{"k":"aaha_vacc_2022","t":"AAHA 2022, mise à jour 2024 — vaccination canine (résumé PubMed seulement)"},{"k":"aaha_aafp_felin_2020","t":"AAHA/AAFP 2020 — vaccination féline (résumé PubMed seulement)"},{"k":"acvim_lepto_2023","t":"ACVIM 2023 — leptospirose du chien"},{"k":"acvim_lyme_2018","t":"ACVIM 2018 — maladie de Lyme"},{"k":"mapaq_rage_2023","t":"MAPAQ, février 2023 — guide d'intervention rage pour les médecins vétérinaires"}],"limites":"Je n'ai pas pu lire le texte complet des lignes directrices AAHA 2022 (mise à jour 2024) et AAHA/AAFP 2020 : l'accès aux sites de l'AAHA et de l'AAFP est bloqué ou protégé. Les recommandations ci-dessus reposent sur le texte intégral de la WSAVA 2024 (qui cite et approuve les recommandations AAHA/AAFP, p. ex. site d'injection et règle 3-2-1), sur les résumés PubMed des documents de l'AAHA, sur le guide du MAPAQ, et sur le site de Merck Santé animale Canada. Vérifiez les tableaux de l'AAHA avant de les citer à l'examen."}}</script>
<script>

const LS={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

    d._blob[sp]=norm([d.nom,d.sys,d.resume,v.maj,v.qc,names,d.src.join(" ")].join(" "));

Object.values(DRUGS).forEach(g=>{g._blob=norm([g.dci,g.pa,g.classe,g.note].concat(g.vet.map(x=>x.b+" "+x.c),g.hum).join(" "))});

/* ---------- helpers ---------- */
function availTags(g){
  const out=[];
  if(g.vet.length) out.push('<span class="tag vet">Vétérinaire · commercialisé au Canada</span>');
  else if(g.hum.length) out.push('<span class="tag hum">Produit humain · hors AMM vétérinaire</span>');
  else if(g.tag==="mag") out.push('<span class="tag mag">Magistral / non commercialisé</span>');
  else if(g.tag==="bio") out.push('<span class="tag bio">Produit biologique (ACIA)</span>');
  else if(g.tag==="nhp") out.push('<span class="tag">Supplément / hors BDPP</span>');
  else if(g.tag==="fluid") out.push('<span class="tag">Soluté / fluide</span>');
  else if(g.tag==="ant") out.push('<span class="tag hum">Antidote</span>');
  else out.push('<span class="tag hum">Produit humain · marque à vérifier</span>');
  if(g.tag==="ctrl") out.push('<span class="tag ctrl">Substance contrôlée</span>');
  return out.join(" ");
}
function brandsHtml(g,max){
  let h="";
  if(g.vet.length){
    const seen=new Set();const items=g.vet.filter(x=>{const k=x.b.toLowerCase();if(seen.has(k))return false;seen.add(k);return true}).slice(0,max||6);
    h+='<div class="brands"><span class="lbl">Au Canada (vét.)</span>'+items.map(x=>'<span class="bn" title="'+esc(x.c)+'">'+esc(x.b)+'</span>').join("")+'</div>';
  }
  if(g.hum.length){
    h+='<div class="brands"><span class="lbl">Pharmacie (humain)</span>'+g.hum.slice(0,4).map(x=>'<span class="bn h">'+esc(x)+'</span>').join("")+'</div>';
  }
  return h;
}
function toast(msg){let t=$("#toast");if(!t){t=document.createElement("div");t.id="toast";t.style.cssText="position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;font-size:14px;max-width:86vw;text-align:center";document.body.appendChild(t)}t.textContent=msg;t.style.display="block";clearTimeout(t._h);t._h=setTimeout(()=>t.style.display="none",1800)}
function glLink(k){
  const g=GL[k];if(!g)return "";
  let url=g.url||(g.doi?("https://doi.org/"+g.doi):(g.pmid?("https://pubmed.ncbi.nlm.nih.gov/"+g.pmid+"/"):null));
  const lab=esc(g.abr);
  return url?'<a href="'+esc(url)+'" target="_blank" rel="noopener" title="'+esc(g.titre)+'">'+lab+' ↗</a>':'<a>'+lab+'</a>';
}

function renderChips(){
  const present=new Set(DIS.filter(d=>d.sp[st.sp]).map(d=>d.sys));
  const arr=[["all","Tous"],["urg","⚠ Urgences"],["fav","★ Favoris"]].concat(SYS_ORDER.filter(s=>present.has(s)).map(s=>[s,s]));
  $("#chips").innerHTML=arr.map(([k,l])=>'<button class="chip'+(st.sys===k?" on":"")+'" data-sys="'+esc(k)+'">'+esc(l)+'</button>').join("");

function filtered(){
  const q=norm(st.q).trim();const toks=q?q.split(/\s+/):[];
  return DIS.filter(d=>{
    if(!d.sp[st.sp])return false;
    if(st.sys==="urg"&&!d.urg)return false;
    if(st.sys==="fav"&&!st.fav.has(d.id))return false;
    if(st.sys!=="all"&&st.sys!=="urg"&&st.sys!=="fav"&&d.sys!==st.sys)return false;

  return txs.map(t=>{const g=DRUGS[t.d];if(!g)return "";
    return '<div class="tx"><div class="h"><div><button class="dci" data-med="'+g.id+'">'+esc(g.dci)+'</button><div class="cls">'+esc(g.classe)+'</div></div><span class="role r'+t.r+'">'+esc(ROLE[t.r]||t.r)+'</span></div>'
     +((g.pa&&g.pa!=="—")?'<div class="pa"><b>Principe actif :</b> '+esc(g.pa)+'</div>':'')
     +(t.n?'<div class="nt">'+esc(t.n)+'</div>':'')

const vstack=[];
function hashFor(v){return v.med?("#/med/"+v.med):("#/maladie/"+v.id+"/"+v.sp)}
function showView(v){if(v.med)showMed(v.med);else showDetail(v.id,v.sp)}
function openDetail(id,sp,push){
  const d=byId[id];if(!d)return;if(!d.sp[sp])sp=Object.keys(d.sp)[0];
  const v={id,sp};
  if(push===false){showDetail(id,sp);return}
  if(curDetail)vstack.push(curDetail);
  showDetail(id,sp);
  try{history.pushState(v,"",hashFor(v));st.hist=true}catch(e){st.hist=false}
}
function openMed(id,push){
  if(!DRUGS[id])return;
  if(push===false){showMed(id);return}
  if(curDetail)vstack.push(curDetail);
  showMed(id);
  try{history.pushState({med:id},"",hashFor({med:id}));st.hist=true}catch(e){st.hist=false}
}
function goBack(){
  if(st.hist&&history.state){history.back();return}
  const prev=vstack.pop();if(prev)showView(prev);else closeDetail();
}
function replaceHash(v){try{history.replaceState(v,"",hashFor(v))}catch(e){}}

   +'<tr><td>Modéré (~8 %)</td><td>Perte modérée d\'élasticité cutanée, muqueuses sèches, pouls faibles et rapides, énophtalmie</td></tr>'
   +'<tr><td>Sévère (&gt; 10 %)</td><td>Perte considérable d\'élasticité, énophtalmie, tachycardie, muqueuses extrêmement sèches, pouls faibles/filiformes, hypotension, altération de la conscience</td></tr></table><div class="hint">Tableau traduit de vos notes (urgences).</div></div>';
  h+='<div class="sec"><h3>Supplémentation en potassium (vos notes)</h3><table><tr><th>K sérique (mEq/L)</th><th>KCl à ajouter (mEq/L de soluté)</th></tr><tr><td>3,5–4,5</td><td>20</td></tr><tr><td>3,0–3,5</td><td>30</td></tr><tr><td>2,5–3,0</td><td>40</td></tr><tr><td>2,0–2,5</td><td>60</td></tr><tr><td>&lt; 2,0</td><td>80</td></tr></table><div class="hint">Ne pas dépasser 0,5 mEq/kg/h de potassium.</div></div>';
  h+='<div class="sec"><h3>Fluidothérapie — repères de vos notes</h3><p>Soluté de choix : lactate de Ringer, sauf maladie hépatique (le NaCl 0,9 % peut mener à l\'acidose à long terme).</p><p>Doses de choc de vos notes : chien 90 mL/kg/h; chat 40 mL/kg/h.</p><div class="alert"><b>⚠ Mise à jour</b>Ces doses sont des maximums théoriques : fractionner en bolus (p. ex. 20 mL/kg en 20 minutes, comme dans vos notes de traumatologie) avec réévaluation après chaque bolus (AAHA/AAFP 2013; RECOVER 2026, premiers soins).</div></div>';
  h+='<div class="sec"><h3>Légende des statuts</h3><p><span class="tag vet">Vétérinaire · commercialisé au Canada</span><br>Produit répertorié « commercialisé » dans la BDPP de Santé Canada (classe vétérinaire).</p><p><span class="tag hum">Produit humain · hors AMM vétérinaire</span><br>Produit à usage humain commercialisé au Canada, utilisé hors indication chez l\'animal.</p><p><span class="tag mag">Magistral / non commercialisé</span><br>Aucun produit répertorié comme commercialisé : préparation magistrale, importation ou accès particulier.</p><p><span class="tag bio">Produit biologique (ACIA)</span><br>Vaccins, anticorps monoclonaux biologiques : hors BDPP (Agence canadienne d\'inspection des aliments).</p><p><span class="tag ctrl">Substance contrôlée</span><br>Prescription, registre et entreposage sécurisé requis.</p></div>';
  h+='<div class="sec"><h3>À propos</h3><p><b>DMV Briheche</b> — aide-mémoire personnel, chiens et chats.</p><p>Contenu construit à partir de vos fichiers de cours (tableaux SAM1/urgences, notes SAM 2, cas CPE), puis confronté aux recommandations nord-américaines récentes et à la BDPP de Santé Canada (statut « commercialisé » vérifié le '+esc(META.dpd)+').</p><p>Aucune dose n\'est ajoutée par la mise à jour : les doses figurent uniquement dans « Vos notes » (texte d\'origine). Pour toute dose, se référer à la monographie du produit ou à un formulaire vétérinaire à jour.</p><p>Les notes « ⚠ À corriger / nuancer » signalent un point de vos documents qui diffère des pratiques ou de la disponibilité actuelles au Canada.</p><p>Outil d\'étude et d\'aide-mémoire : il ne remplace pas le jugement clinique, la monographie des produits ni les protocoles de la clinique.</p><div class="ver">Version '+esc(META.built)+'</div></div>';
  $("#p-ref").innerHTML=h;
}
function renderVeille(){
  const items=Object.entries(GL).map(([k,g])=>({k,g}));
  items.sort((a,b)=>String(b.g.abr).localeCompare(String(a.g.abr),"fr"));
  let h='<div class="sec"><h3>Lignes directrices et études consultées</h3><div class="hint">Triées de la plus récente à la plus ancienne (selon l\'abréviation). Les liens ouvrent PubMed/DOI.</div></div>';
  const yr=g=>{const m=String(g.abr).match(/(20\d\d)/g);return m?Math.max.apply(null,m.map(Number)):0};
  items.sort((a,b)=>yr(b.g)-yr(a.g)||a.g.titre.localeCompare(b.g.titre,"fr"));
  h+='<div class="list">'+items.map(({k,g})=>{
    const url=g.url||(g.doi?("https://doi.org/"+g.doi):(g.pmid?("https://pubmed.ncbi.nlm.nih.gov/"+g.pmid+"/"):null));
    const used=DIS.filter(d=>Object.values(d.sp).some(v=>(v.gl||[]).includes(k)));
    return '<div class="card" style="cursor:default"><div class="t"><span class="n">'+esc(g.titre)+'</span></div><div class="meta"><span class="tag sys">'+esc(g.abr)+'</span>'+(url?'<a class="tag" style="text-decoration:none" href="'+esc(url)+'" target="_blank" rel="noopener">Ouvrir ↗</a>':'')+'</div>'+(used.length?'<div class="s" style="-webkit-line-clamp:3">Cité dans : '+esc(used.slice(0,6).map(d=>d.nom).join(" ; "))+(used.length>6?" …":"")+'</div>':'')+'</div>';
  }).join("")+'</div>';
  $("#p-vei").innerHTML=h;
}

/* ---------- navigation ---------- */
function setTab(t){
  st.tab=t;
  document.querySelectorAll(".tabbar button").forEach(b=>b.classList.toggle("on",b.dataset.tab===t));
  document.querySelectorAll(".page").forEach(p=>p.classList.toggle("on",p.id==="p-"+t));
  $("#spseg").style.display=(t==="mal"||t==="vac")?"flex":"none";
  $(".search input").placeholder=(t==="med")?"DCI, marque, classe…":"Maladie, signe, médicament, marque…";
  $(".search").style.display=(t==="mal"||t==="med")?"block":"none";
  $("#q").value=(t==="med")?st.mq:st.q; $("#qclr").style.display=$("#q").value?"block":"none";
  if(t==="mal")renderList(); if(t==="med")renderMeds(); if(t==="vac")renderVac(); if(t==="ref")renderRefs(); if(t==="vei")renderVeille();
  window.scrollTo(0,0);
}
function setSp(sp){st.sp=sp;LS.set("sp",sp);$("#b-chien").classList.toggle("on",sp==="chien");$("#b-chat").classList.toggle("on",sp==="chat");if(st.sys!=="all"&&st.sys!=="urg"&&st.sys!=="fav"&&!DIS.some(d=>d.sp[sp]&&d.sys===st.sys))st.sys="all";renderList();if(st.tab==="vac"){renderVac();window.scrollTo(0,0)}}
function toggleFav(id){if(st.fav.has(id))st.fav.delete(id);else st.fav.add(id);LS.set("fav",[...st.fav]);}
function shareText(){
  if(!curDetail||!curDetail.id)return "";
  const d=byId[curDetail.id],v=d.sp[curDetail.sp];
  let t=d.nom+" — "+(curDetail.sp==="chien"?"Chien":"Chat")+"\n"+d.resume+"\n\nTraitements (DCI — principe actif — marques au Canada) :\n";
  v.tx.forEach(x=>{const g=DRUGS[x.d];if(!g)return;t+="• "+(ROLE[x.r]||x.r)+" : "+g.dci+" — "+g.pa+(g.vet.length?" — "+[...new Set(g.vet.map(b=>b.b))].slice(0,3).join(", "):"")+"\n"});
  if(v.maj)t+="\nMise à jour : "+v.maj+"\n";
  return t+"\n(Aide-mémoire — vérifier la monographie.)";
}
document.addEventListener("click",e=>{
  const t=e.target;
  let el;
  if((el=t.closest("[data-gotab]"))){setTab(el.dataset.gotab);return}
  if((el=t.closest("[data-vgo]"))){const s=document.getElementById(el.dataset.vgo);if(s){const d=s.querySelector("details");if(d)d.open=true;s.scrollIntoView({behavior:"smooth",block:"start"})}return}
  if((el=t.closest("[data-fav]"))){e.preventDefault();e.stopPropagation();const id=el.dataset.fav;toggleFav(id);
     if(curDetail&&curDetail.id===id){el.textContent=st.fav.has(id)?"★":"☆"} else {renderList()} return}
  if((el=t.closest("[data-open]"))){openDetail(el.dataset.open,st.sp);return}
  if((el=t.closest("[data-med]"))){openMed(el.dataset.med);return}
  if((el=t.closest("[data-link]"))){e.preventDefault();const [m,sp]=el.dataset.link.split("|");openDetail(m,sp);return}
  if((el=t.closest("[data-back]"))){goBack();return}
  if((el=t.closest("[data-dsp]"))){const nid=curDetail.id;showDetail(nid,el.dataset.dsp);replaceHash({id:nid,sp:el.dataset.dsp});return}
  if((el=t.closest("[data-sp]"))){setSp(el.dataset.sp);return}
  if((el=t.closest("[data-sys]"))){st.sys=el.dataset.sys;renderList();return}
  if((el=t.closest("[data-msys]"))){st.msys=el.dataset.msys;renderMeds();return}
  if((el=t.closest(".tabbar button"))){if($("#detail").classList.contains("on")){closeDetail();try{history.replaceState(null,"","#")}catch(e){}}setTab(el.dataset.tab);return}
  if(t.closest("[data-share]")){const txt=shareText();if(navigator.share){navigator.share({title:"Maladies QC",text:txt}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(txt).then(()=>toast("Résumé copié"))}else toast("Partage non disponible");return}
  if(t.id==="qclr"){$("#q").value="";$("#q").dispatchEvent(new Event("input"));$("#q").focus();return}
});
$("#q").addEventListener("input",e=>{const v=e.target.value;$("#qclr").style.display=v?"block":"none";if(st.tab==="med"){st.mq=v;renderMeds()}else{st.q=v;renderList()}});
window.addEventListener("popstate",()=>{route(false)});
function route(initial){
  const h=location.hash||"";let m;
  if((m=h.match(/^#\/maladie\/([^/]+)\/(chien|chat)$/))&&byId[m[1]]){openDetail(m[1],m[2],false)}
  else if((m=h.match(/^#\/med\/([^/]+)$/))&&DRUGS[m[1]]){openMed(m[1],false)}
  else closeDetail();
}
$("#b-chien").classList.toggle("on",st.sp==="chien");$("#b-chat").classList.toggle("on",st.sp==="chat");
setTab("mal");route(true);
if('serviceWorker' in navigator && location.protocol.startsWith('http')){window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}))}
</script>
