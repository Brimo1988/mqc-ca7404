ce en taurine.","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"CARDIOMYOPATHIE DILATÉE\nUne maladie myocardique primaire caractérisée par une fonction systolique altérée (défaillance de la pompe) d'un ou des deux ventricules, menant à un agrandissement cardiaque et potentiellement une insuffisance cardiaque congestive (ICC), des arythmies, ou les deux.\n• SUBJECTIF-➭CMD occulte : par définition, sans signes cliniques (examen de dépistage ou\ndécouverte fortuite)\n• ICC : toute combinaison de tachypnée, toux, agitation, distension abdominale, léthargie,\ninappétence, détresse respiratoire\n• Arythmies cardiaques : syncope, collapsus, léthargie, précipitation d'ICC.\n• OBJECTIF- ➭Certains ou tous les éléments suivants surviennent fréquemment : faiblesse, dépression,\ntachypnée, perte de poids, choc cardiogénique dû à une pression artérielle diminuée, souffle systolique doux grade 1/6 à 3/6 gauche et/ou droit apical, galop S3 ou de sommation, arythmie.\n• ICC droite : pouls/distension jugulaire, bruits cardiaques et pulmonaires ventraux étouffés avec épanchement pleural, hépatomégalie due à la congestion (± ascite)\n• ICC gauche : crépitants/râles pulmonaires, bruits pulmonaires étouffés avec épanchement pleural (chats)\n• Pouls fémoraux hypokinétiques ; déficits de pouls avec battements prématurés ou fibrillation auriculaire\n• Un œdème godet sous-cutané est rare ; presque exclusivement chez les grandes/géantes races\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx= ➭Clinique : maladie respiratoire primaire, œdème pulmonaire non cardiogénique, troubles de l'espace pleural, dirofilariose, maladie valvulaire dégénérative myxomateuse, endocardite ou myocardite infectieuse, tumeurs cardiaques et épanchement péricardique, hernie diaphragmatique, occlusion des voies aériennes (paralysie laryngée, tumeur, corps étranger, collapsus trachéal), maladie cardiaque congénitale.\n• Radiographique : épanchement péricardique, hernie diaphragmatique péritonéopéricardique, maladie valvulaire dégénérative myxomateuse, maladie cardiaque congénitale, autres épanchements pleuraux.\n• Échocardiographique : défaillance myocardique due à une maladie valvulaire avancée ou terminale (maladie valvulaire dégénérative myxomateuse) ou des shunts (persistance du canal artériel, fistules, communications interseptales), ou d'autres troubles myocardiques secondaires\n• PLAN- DIAGNOSTICS=(Aperçu diagnostique=Le diagnostic est suspecté—particulièrement chez les races prédisposées—si de la détresse respiratoire est notée avec un bruit de galop et/ou un souffle systolique sur la région mitrale et/ou avec des arythmies (fibrillation auriculaire, extrasystoles ventriculaires). La suspicion est renforcée si les radiographies suggèrent un agrandissement de l'oreillette gauche, un agrandissement des veines pulmonaires, et/ou un œdème pulmonaire. Le diagnostic final est établi par échocardiographie. Le diagnostic de CMD occulte (cliniquement inapparente) nécessite une échocardiographie, des enregistrements ECG de 24 heures ou les deux. Les marqueurs sanguins de maladie cardiaque pourraient avoir un rôle futur dans le diagnostic ou le pronostic de la CMD)\n• Radiographies thoraciques : cardiomégalie généralisée, signes d'ICC (œdème pulmonaire et/ou épanchement pleural). CMD occulte : souvent sans particularité (mauvais outil de dépistage).\n• ECG : tachycardie sinusale, possiblement avec extrasystoles auriculaires ou ventriculaires; fibrillation auriculaire; tachycardie ventriculaire, particulièrement chez les boxers et dobermans\n• Tests hématologiques et analyse d'urine de routine : habituellement normaux. Exceptions : CMD sévère : azotémie préréénale, alanine aminotransférase élevée; hyponatrémie et hypochlorémie, si notées avec ICC, confèrent un pronostic plus mauvais car elles indiquent une rétention d'eau libre.\n• Maladie concomitante\n• Résultat du traitement de l'ICC (hypokaliémie, alcalose métabolique, azotémie préréénale)\n• Analyse de l'épanchement : habituellement transsudat modifié (numération cellulaire nucléée < 2500/microL, protéines totales < 4,0 g/dL); épanchement chyleux possible chez le chat\n• \nTHÉRAPEUTIQUE=Supplémentation en oxygène, thoracocentèse si épanchement pleural de grand volume\nDiurétiques- furosémide inhibiteurs de l'ECA Pimobendane- chiens, 0,2-0,3 mg/kg q 12h PO Régimes commerciaux restreints en sodium.\nPRONOSTIC=La survie globale est typiquement de 3-24 mois après le diagnostic."}]},{"id":"cmh","nom":"Cardiomyopathie hypertrophique féline (CMH)","sys":"Cardio-respiratoire","urg":false,"resume":"Souvent asymptomatique (souffle fortuit); parfois ICC, thromboembolie artérielle. Échocardiographie : épaississement du septum interventriculaire/de la paroi libre du VG; T4 et PA à vérifier.","src":["SAM 2 — cardiomyopathie hypertrophique"],"img":[],"sp":{"chat":{"tx":[{"d":"furosemide","r":"1","n":"Si ICC"},{"d":"clopidogrel","r":"1","n":"Prévention de la thromboembolie"},{"d":"atenolol","r":"2","n":"Obstruction dynamique/tachyarythmie"},{"d":"diltiazem","r":"2","n":"Selon vos notes"},{"d":"amlodipine","r":"S","n":"Hypertension"},{"d":"telmisartan","r":"S","n":"Hypertension/protéinurie"}],"maj":"ACVIM 2020 : classification (stades A–D) et traitement par stade; mesurer la pression artérielle et la T4 pour écarter une HVG secondaire. Les chats sans signe cliniques ont une survie médiane > 5 ans.","qc":"","al":"","gl":["acvim_cm_chat_2020","isfm_hta_2018"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"CARDIOMYOPATHIE HYPERTROPHIQUE Une maladie myocardique primaire fréquente caractérisée par une épaisseur de paroi ventriculaire gauche augmentée (hypertrophie ventriculaire gauche concentrique [HVG]) en l'absence de causes secondaires d'hypertrophie telles que l'hypertension systémique ou l'hyperthyroïdie. Vue principalement chez les chats de race pure comme le Maine Coon et le Ragdoll. Un agrandissement concentrique du muscle papillaire est la caractéristique constante. Cœur en forme de valentin. Beaucoup de chats n'ont aucun signe clinique, surtout avec une maladie légère à modérée. Une maladie sévère évoluera vers une ICC gauche, une thromboembolie systémique, ou une mort subite. Les chats en insuffisance cardiaque ont des signes de tachypnée/dyspnée secondaires à un œdème pulmonaire ou un épanchement pleural\n• SUBJECTIF-Souvent, les chats ne montrent aucun signe clinique, et la CMH est découverte fortuitement (ex.,\nsouffle à l'examen physique).\n• Anomalies respiratoires (ICC) : tachypnée, dyspnée, orthopnée, toux rare\n• Non spécifique : léthargie, anorexie, vomissements\n• Boiterie, incapacité à bouger le membre, signes de douleur intense (thromboembolie aortique)\n• Mort subite\n• OBJECTIF-Souffle systolique (30%-80% des cas)\n• Bruit de galop (S4) variable (≈30%), plus probable avec ICC\n• Arythmie : battements prématurés, rythme irrégulier (20%-70% des cas)\n• Anomalies respiratoires fréquentes si ICC : tachypnée, dyspnée, bruits respiratoires augmentés, bruits pulmonaires atténués ventralement si épanchement pleural\n• Si thromboembolie artérielle\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=Hyperthyroïdie\n• Hypertension systémique\n• Sténose sous-aortique\n• Acromégalie\n• PLAN- DIAGNOSTICS=Radiographies thoraciques:- Souvent normales en l'absence d'agrandissement de l'oreillette gauche. Les cas modérés ou\nsévères peuvent montrer des signes d'agrandissement de l'oreillette gauche et d'ICC\nÉchocardiogramme : épaisseur télédiastolique du septum interventriculaire et/ou de la paroi libre du ventricule gauche\n6 mm ou plus. Une hypertrophie papillaire est souvent présente (subjective ou quantitative). Le SAM de la valve mitrale avec régurgitation mitrale et obstruction de la chambre de chasse ventriculaire gauche confirme la CMHO. Un agrandissement de l'oreillette gauche est variablement présent ; un rapport oreillette gauche/aorte supérieur à 1,5 ou un diamètre de l'oreillette gauche > 16 mm chez le chat indique un agrandissement de l'oreillette gauche, compatible avec un état de maladie plus avancé.\nAdditionnel- T4 sérique et pression artérielle systolique : pour écarter une HVG secondaire\nTHÉRAPEUTIQUE= traitement dirigé vers le contrôle des signes d'ICC, l'amélioration de la fonction diastolique, la réduction de l'incidence de thromboembolie systémique.\n• ICC aiguë= administration de furosémide + O2 ICC chronique = furosémide + inhibiteurs de l'ECA ex- énalapril 0,5 mg/kg PO, (médicament utilisé pour ↓ la PA par relaxation des vaisseaux sanguins)\n• Bloqueur des canaux calciques- Diltiazem (traitement de choix pour l'hypertension)\n• Bêta-bloquants- ex-aténolol (↓ FC et contractilité permettant un meilleur remplissage des cavités avant la contraction)\n• prévention de la thromboembolie ex-clopidogrel, aspirine\nRestriction sodique+éviter une activité intense\nSurveillance recommandée\n• Bilan rénal sérique et analyse d'urine de base ; répéter le bilan rénal q 12-24h pendant le traitement aigu de l'ICC.\nRadiographies thoraciques pour identifier la résolution de l'ICC ; recontrôler les radiographies tous les 2-4 mois une fois stabilisé.\nPression artérielle systémique et thyroxine sérique tous les 6-12 mois (chats adultes CMH)\nPRONOSTIC=Pronostic passable à bon pour les chats avec CMH légère non évolutive. Les chats avec CMH et sans signes\ncliniques ont une survie médiane> 5 ans.\nCMH sévère et ICC : mauvais pronostic à long terme, survie médiane de 3 mois, bien que très variable avec des durées de survie\nsupérieures à 2 ans chez certains chats\nCMH sévère et thromboembolie artérielle : mauvais pronostic, survie médiane de 2 mois"}]},{"id":"pca","nom":"Persistance du canal artériel (PCA)","sys":"Cardio-respiratoire","urg":false,"resume":"Souffle fortuit chez le jeune; pouls bondissant. Écho-Doppler : flux turbulent dans l'artère pulmonaire. Traitement interventionnel.","src":["SAM 2 — PCA"],"img":[],"sp":{"chien":{"tx":[{"d":"furosemide","r":"S","n":"Si ICC avant la correction"},{"d":"pimobendane","r":"S","n":"Selon le cardiologue"}],"maj":"Correction chirurgicale ou occlusion par cathéter (taux de réussite 90–98 %); souffle continu « de machinerie » chez un jeune animal.","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"PERSISTANCE DU CANAL ARTÉRIEL (PCA) Un shunt artériel entre l'aorte et l'artère pulmonaire normalement présent chez le fœtus mais qui devrait se contracter et se fermer dans les 24 heures après la naissance. La persistance (fermeture incomplète) résulte en un canal de taille variable, dont le diamètre détermine la quantité et la direction du flux sanguin à travers le shunt et donc l'impact sur le patient. Reconnu le plus fréquemment chez les jeunes animaux\n• SUBJECTIF-Le plus souvent reconnu comme un souffle cardiaque fortuit chez un jeune animal\nprésenté pour vaccination et ne montrant pas de signes cliniques manifestes\n• Quand des signes cliniques sont présents, ils incluent intolérance à l'effort, retard de croissance, et signes\nd'ICC\n• OBJECTIF-Varie selon le diamètre du PCA\n• Type 1, petit : souffle continu focal caractéristique à la base cardiaque gauche\n• Type 2, moyen : signes du type 1, plus souffle continu audible à l'apex et frémissement précordial à la base cardiaque gauche\n• Type 3A, grand : signes des types 1 et 2, plus pouls bondissants, impulsion cardiaque proéminente à l'apex gauche, et souffle systolique de régurgitation mitrale à l'apex gauche\n• Type 3B, grand avec ICC : signes des types 1, 2, et 3A, et signes d'ICC (ex., dyspnée, crépitants pulmonaires, ascite [occasionnellement]); arythmies, particulièrement fibrillation auriculaire, possibles\n• Type 4, grand PCA avec hypertension pulmonaire : pas de souffle cardiaque; impulsion apicale droite proéminente, dédoublement du deuxième bruit cardiaque, cyanose caudale (« cyanose différentielle »), collapsus des membres postérieurs à l'effort\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=• Anomalies combinées produisant des souffles cardiaques systoliques et diastoliques comme une communication interventriculaire et une insuffisance aortique due à un feuillet de valve aortique non soutenu\n• Fenêtre aorto-pulmonaire\n• Fistule artérioveineuse\n• Flux de l'artère bronchique dans le cœur pulmonaire chronique dû à la dirofilariose\n• Artères collatérales tortueuses dans la coarctation ou l'interruption aortique\n• PLAN- DIAGNOSTICS= (Le diagnostic est fait facilement en auscultant un souffle continu/en machinerie à la base cardiaque gauche. Des pouls bondissants ou en coup de bélier sont fréquents. les radiographies thoraciques montrent un cœur gauche et une vascularisation pulmonaire agrandis.)\n• Radiographies thoraciques pour évaluer la taille du cœur et des vaisseaux pulmonaires et le parenchyme pulmonaire\n• Électrocardiogramme pour identifier les arythmies cardiaques et les constatations en faveur d'une hypertrophie ventriculaire\n• Hématocrite pour déterminer la présence d'anémie ou d'érythrocytose\nTests avancés ou de confirmation\n• Échocardiographie bidimensionnelle -pour déterminer la taille des cavités, l'épaisseur des parois, la fonction ventriculaire systolique, la présence de tout défaut cardiaque concomitant, et pour une mesure approximative du diamètre ductal en prévision d'une fermeture chirurgicale par dispositif\n• Échocardiographie Doppler couleur pour vérifier le flux sanguin turbulent dans l'artère pulmonaire\nTHÉRAPEUTIQUE= PCA gauche vers droite= ligature chirurgicale ou occlusion par cathéter. PCA droite vers gauche/inversé= phlébotomie pour réduire l'érythrocytose\nPRONOSTIC=90%-98% de correction réussie. Peut vivre des années si l'érythrocytose est contrôlée"}]},{"id":"thromboembolie","nom":"Thromboembolie artérielle (chat)","sys":"Cardio-respiratoire","urg":true,"resume":"Début aigu : douleur, paralysie/parésie des membres postérieurs, membres froids, absence de pouls fémoral, souvent cardiopathie sous-jacente. Pronostic réservé; survie médiane courte en cas de CMH sévère.","src":["Urgences (thromboembolie)"],"img":[],"sp":{"chat":{"tx":[{"d":"hydromorphone","r":"1","n":"Analgésie forte (substance contrôlée)"},{"d":"methadone","r":"1","n":""},{"d":"clopidogrel","r":"1","n":"Prévention secondaire (préféré à l'aspirine)"},{"d":"dalteparine","r":"2","n":"HBPM"},{"d":"rivaroxaban","r":"2","n":"Hors AMM"},{"d":"furosemide","r":"S","n":"Si ICC"}],"maj":"Prévention secondaire : clopidogrel (supérieur à l'aspirine dans l'étude FATCAT). Les directives CURATIVE (2022) encadrent l'usage des antithrombotiques en soins critiques.","qc":"","al":"","gl":["curative_2022","acvim_cm_chat_2020"]}},"notes":[{"label":"Tableau des urgences — Thromboembolie (p.181)","fields":[{"k":"Signes cliniques / examen physique","t":"Antécédents de maladie cardiaque ou signes physiques de maladie cardiaque (souffle, arythmie) fréquents. Thrombus en selle : douleur, parésie des membres postérieurs, pas de pouls fémoral, froid, cyanose. Embole de l'artère brachiale : paralysie unilatérale du membre antérieur, douleur possible"},{"k":"Diagnostic différentiel","t":"Fractures pelviennes et fémorales, traumatisme rachidien, HDIV, néoplasie rachidienne, hypotension systémique sévère"},{"k":"Diagnostic","t":"Hyperglycémie, ALT et AST élevées, hypocalcémie, azotémie (infarctus rénal), ↑ lactate et ↓ glucose dans les membres atteints vs sains. Radiographie du corps entier. ECG. Échographie abdominale"},{"k":"Traitement (Rx)","t":"Traitement principalement de soutien (gestion de la douleur, diurétiques, vasodilatateurs, O2 et fluidothérapie). O2 si ICC/dyspnée, soluté si pas d'ICC, hydromorphone 0,1 mg/kg IV q4h, furosémide si ICC, hydralazine. Anticoagulant : héparine 150 U/kg q8h SC. Traitement antiplaquettaire : clopidogrel (1 mg/kg PO die) comprimés de 75 mg #6, 1/4 de comprimé q24h"},{"k":"Pronostic / prévention","t":"réservé, meilleur pour atteinte partielle ou du membre antérieur"},{"k":"Surveillance / examens complémentaires","t":"EP fréquents. BUN et créat, production urinaire, électrolytes, coag/profil, ECG. Chron. : automutilation, saignements"},{"k":"Commentaires","t":"Chats atteints de maladie cardiaque à risque"}]}]},{"id":"dirofilariose","nom":"Dirofilariose (ver du cœur)","sys":"Cardio-respiratoire","urg":false,"resume":"Toux, intolérance à l'exercice, perte de poids, syncope, dyspnée, ascite; antigène + microfilaires. Chat : signes souvent respiratoires (asthme-like). Protocole en 3 doses de mélarsomine.","src":["SAM1 — dirofilariose","SAM 2 — maladie du ver du cœur"],"img":["sam2_p51_0","sam2_p51_1"],"sp":{"chien":{"tx":[{"d":"doxycycline","r":"1","n":"Posologie de vos notes : jours 0–30, avec le préventif (produit humain)"},{"d":"melarsomine","r":"1","n":"Immiticide® : protocole en 3 doses"},{"d":"ivermectine","r":"P","n":"Préventif mensuel (Heartgard Plus®)"},{"d":"moxidectine","r":"P","n":"Advantage Multi®, ProHeart 6®, Simparica Trio®"},{"d":"milbemycine","r":"P","n":"Interceptor Plus®"},{"d":"selamectine","r":"P","n":"Revolution®"}],"maj":"Protocole conforme aux recommandations de l'American Heartworm Society : lactone macrocyclique + doxycycline, puis mélarsomine; restriction d'activité stricte. Des signes de résistance aux lactones macrocycliques sont rapportés (2026) : observance mensuelle stricte et test annuel. Une étude 2026 compare les protocoles de mélarsomine à 2 et 3 doses.","qc":"Risque présent au Québec (moustiques); la durée de la prévention est à discuter selon la région (saison vs toute l'année).","al":"","gl":[]},"chat":{"tx":[{"d":"selamectine","r":"P","n":"Revolution®"},{"d":"ivermectine","r":"P","n":"Heartgard®"},{"d":"prednisolone","r":"S","n":"Maladie respiratoire associée au ver du cœur (HARD)"}],"maj":"Chat : pas d'adulticide approuvé; prévention mensuelle pour tous les chats exposés; prednisolone pour les signes respiratoires.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau SAM1 — Dirofilariose (p.867)","fields":[{"k":"Signes cliniques / examen physique","t":"Toux, intolérance à l'effort, perte de poids, syncope, dyspnée. Distension jugulaire, ascite (ICC droite)."},{"k":"Diagnostic différentiel","t":"Acanthocheilonema. Maladie bronchointerstitielle, collapsus trachéal, trachéobronchite infectieuse, pneumonie, maladie valvulaire, néoplasie pulmonaire"},{"k":"Diagnostic","t":"Radiographies thoraciques : artères pulmonaires dilatées et tortueuses, hypertrophie du cœur droit, AP et VC élargies. Échocardiographie, test 4Dx (ELISA) pour l'antigène, test de Knott modifié pour les microfilaires. Urine : protéinurie due à une glomérulonéphrite. Chez les chats (tests Ag et Ac)"},{"k":"Traitement (Rx)","t":"Oxygène + repos en cage\nJour 0 – 30 : doxycycline 10 mg/kg PO q12h + Heartgard une fois\nJour 30 : Heartgard\nJour 60 : Heartgard + 1re injection de mélarsomine IM\nJour 90 : Heartgard + 2e injection de mélarsomine IM\nJour 91 : 3e injection de mélarsomine IM + restriction d'activité pendant 6–8 semaines + prednisolone\nRepasser le test pour les microfilaires toutes les 4 semaines."},{"k":"Pronostic / prévention","t":"Bon dans les infections légères à modérées, réservé si une ICC se développe. Le repos complet est essentiel après le traitement"},{"k":"Surveillance / examens complémentaires","t":"Test des microfilaires à 1 mois ; si positif, traiter avec un microfilaricide, test d'antigène et de microfilaires après 6 mois. Test annuel."},{"k":"Commentaires","t":"Mélarsomine : la plupart des chiens reçoivent une première injection, suivie d'une période de repos de 30 jours, puis de deux autres injections données à 24 heures d'intervalle. Plusieurs chiens sont aussi traités avec un antibiotique (doxycycline) pour combattre une infection potentielle par des bactéries (Wolbachia) qui habitent le ver du cœur. De plus, votre chien recevra un médicament pour tuer les microfilaires (larves du ver du cœur)."}]},{"label":"SAM 2 (notes détaillées)","text":"MALADIE DU VER DU CŒUR (DIROFILARIOSE)- CHATS=Les signes (comme la toux ou des difficultés respiratoires) ressemblent souvent à ceux de l'asthme félin. CHIENS=Les signes courants d'infection par le ver du cœur incluent toux, intolérance à l'effort, échec de croissance, respiration laborieuse, une décoloration bleue ou violacée de la peau et des gencives, crachats de sang, évanouissement, saignement de nez, et l'accumulation de liquide dans la cavité abdominale. La sévérité des signes est souvent liée à la quantité de dommages pulmonaires et au niveau d'activité du chien. Les chiens actifs (comme les chasseurs et les chiens de performance) montreront typiquement des signes d'infection plus dramatiques que les chiens moins actifs.\nDiagnostic= Test d'antigène du ver du cœur + radiographies thoraciques\nTraitement=CHATS= Activité restreinte + Sélamectine Revolution/Ivermectine Heartgard + Corticostéroïdes CHIENS=Repos en cage/activité restreinte + Injections de mélarsomine, un protocole à 2 doses ou un protocole à 3 doses + Les corticostéroïdes peuvent réduire l'inflammation associée aux vers mourants. Prednisone 1 mg/kg PO q 24h Doxycycline (10 mg/kg PO q 12h) peut être administrée pendant 1 mois L'antibiotique doxycycline peut tuer la bactérie Wolbachia\nPrévention=Un médicament préventif contre le ver du cœur est recommandé pour tous les chats, qu'ils vivent à l'intérieur ou à l'extérieur CHIENS= Le traitement préventif chez les chiens est recommandé à partir de 6 à 8 semaines d'âge. Aucun\ntest préalable n'est nécessaire à cet âge. En commençant un traitement préventif chez les chiens de 7 mois d'âge ou plus, un test d'antigène (pour s'assurer que le chien n'est pas déjà infecté) est recommandé,\nsuivi d'un test négatif additionnel 6–7 mois plus tard (en raison de la période de développement de 6 mois des vers) pour s'assurer que le chien n'est pas infecté. pronostic=bon dans les infections légères à modérées au ver du cœur • passable à réservé dans les cas sévères\n• mauvais à sombre même avec traitement en cas de syndrome cave, ATP sévère, et ICC"}]},{"id":"collapsus_tracheal","nom":"Collapsus trachéal","sys":"Cardio-respiratoire","urg":true,"resume":"Petites races : toux de type « klaxon », haut-le-cœur, aggravée par l'excitation/pression sur la trachée; dyspnée aiguë possible. Radiographies cervicales/thoraciques en inspiration et expiration, fluoroscopie.","src":["Urgences (collapsus trachéal)","SAM1 — collapsus trachéal","SAM 2 — collapsus trachéal","Cas CPE 10"],"img":[],"sp":{"chien":{"tx":[{"d":"butorphanol","r":"1","n":"Antitussif (0,04–0,05 mg/kg SC selon vos notes)"},{"d":"acepromazine","r":"1","n":"À faible dose pour briser le cycle de toux"},{"d":"prednisolone","r":"2","n":"Courtes cures"},{"d":"theophylline","r":"2","n":"Bronchodilatateur : preuves limitées"},{"d":"terbutaline","r":"2","n":"Voir alerte sur la dose"},{"d":"amox_clav","r":"2","n":"Seulement si infection (culture)"}],"maj":"Perte de poids, harnais plutôt que collier, traitement de l'infection/obésité; endoprothèse trachéale si échec médical. CPE : cas 10 (Yorkshire).","qc":"","al":"Terbutaline : votre fichier d'urgences indique « 5 mg/kg » alors que votre document SAM 2 indique « 1,25–5 mg/chien » : la dose en mg/kg est vraisemblablement erronée — vérifier la source.","gl":[]}},"notes":[{"label":"Tableau des urgences — Collapsus trachéal (p.439)","fields":[{"k":"Signes cliniques / examen physique","t":"Chiens de petite race et de race naine. Toux de type « klaxon », avec haut-le-cœur à la fin, surtout après l'excitation, l'exercice, l'alimentation/l'abreuvement. Sévère : cyanose. Toux provoquée par la palpation de la trachée. Trachée cervicale : respiration sifflante auscultée sur la trachée cervicale, trachée thoracique : bruits de claquement forts à l'auscultation"},{"k":"Diagnostic différentiel","t":"Bronchite chronique, ICC, trachéobronchite infectieuse, compression bronchique par dilatation de l'oreillette gauche ou lymphadénopathie, pneumonie, néoplasie pulmonaire, obstruction trachéale ou laryngée"},{"k":"Diagnostic","t":"Radiographies en inspiration pour la trachée cervicale, en expiration pour la trachée thoracique, fluoroscopie, bronchoscopie"},{"k":"Traitement (Rx)","t":"Aigu : O2, acépromazine à faible dose 0,03 mg/kg IM pour briser le cycle de toux, butorphanol 0,04 mg/kg SC q 4–6h pour la toux. Chronique : perte de poids, butorphanol pour la toux (Rx hydrocodone), +/- prednisone pour l'inflammation trachéale, +/- terbutaline 5 mg/kg PO par jour / albutérol, théophylline « 10 mg/kg PO aux 12 heures ». Chirurgical : endoprothèses intraluminales"},{"k":"Pronostic / prévention","t":"bon avec traitement approprié, réservé en cas de syncope, cyanose"},{"k":"Surveillance / examens complémentaires","t":"Contrôle du poids + antitussif + anti-inflammatoire pour gérer le collapsus trachéal"},{"k":"Commentaires","t":"Traitement ABC : Antitussif, Bronchodilatateurs, Corticostéroïdes"}]},{"label":"Tableau SAM1 — Collapsus trachéal (p.439)","fields":[{"k":"Traitement (Rx)","t":"Aigu : O2, butorphanol (0,05 mg/kg SC q 4h), acépromazine à dose réduite (0,05–0,1 mg/kg IM). Chron. : perte de poids, hydrocodone 0,22 mg/kg PO q12h ; prednisone en dégression 0,5 mg/kg PO q 12h 7 j. Si aucune amélioration : albutérol, théophylline. Endoprothèses intraluminales."},{"k":"Pronostic / prévention","t":"bon pour la survie"},{"k":"Surveillance / examens complémentaires","t":"ne pas faire reproduire"}]},{"label":"SAM 2 (notes détaillées)","text":"COLLAPSUS TRACHÉAL\n• SUBJECTIF-Propriétaire de petite race se plaignant d'une toux récurrente, forte, sèche, en oie\navec haut-le-cœur et efforts de vomissement couramment observés à la fin d'une série de toux. Les signes peuvent s'aggraver avec l'excitation, la chaleur, l'exercice, le fait de manger/boire. Tachypnée habituellement aggravée par l'excitation, la chaleur, l'humidité, l'exercice, ou l'obésité. Les cas sévèrement atteints ont une cyanose, une syncope en plus de la toux\n• OBJECTIF-toux sèche provoquée par la palpation trachéale. (pas une constatation constante ou spécifique cependant) Avec un collapsus trachéal cervical des sifflements peuvent être auscultés sur la région trachéale cervicale. Avec un collapsus trachéal thoracique un bruit de claquement fort peut être ausculté dû à l'ouverture ou au collapsus dynamique des grandes voies aériennes. Un effort expiratoire augmenté peut être vu\n• ÉVALUATION- LISTE DES PROBLÈMES=toux\nDDx=trachéobronchite infectieuse pneumonie néoplasie pulmonaire occlusion trachéale\nI.C.C\n• PLAN- DIAGNOSTICS=➣NFS-peut montrer un leucogramme inflammatoire secondaire à un stress chronique ou\nune infection concomitante. Enzymes hépatiques augmentées fréquentes.\n• Radiographies cervicales et thoraciques-obtenir l'image pendant l'inspiration pour le collapsus cervical, l'expiration pour le thoracique. DIAGNOSTICS AVANCÉS-Bronchoscopie/Fluoroscopie-pour classer la sévérité du collapsus\nTHÉRAPEUTIQUE=Perte de poids\n• Oxygène+antitussifs en crise aiguë\n• Antitussifs-Hydrocodone 0,22 mg/kg PO q 6-12h Butorphanol 0,55-1,1 mg/kg PO q 8-12h\n• Anti-inflammatoire pour aider à diminuer l'inflammation trachéale Prednisone 0,5-1 mg/kg PO q 12-24h en dose dégressive pendant 5-7 jours\n• Bronchodilatateurs -Albutérol 0,05 mg/kg PO 8h, terbutaline, aminophylline\n• Infection bactérienne rare mais doxycycline (3–5 mg/kg PO q12h)\n• Chirurgical= implantation d'anneau prothétique/stent pour grade 2-4 avec échec du traitement médical\nPRONOSTIC=bon"},{"label":"Cas CPE 10","fields":[{"k":"Cas clinique","t":"Cas 10 – Chapitre 13. • Un Yorkshire terrier mâle castré de 8 ans nommé Maine (10 kg) est présenté pour détresse respiratoire. Le patient présentait depuis 1 mois une toux bruyante, progressive et « rauque » (en coup de klaxon). Les propriétaires avaient tenté la nébulisation et le tapotement thoracique (coupage) à la maison sans amélioration. L'examen physique a révélé un patient en détresse avec un écoulement mucopurulent unilatéral de la narine droite, une fréquence respiratoire de 60 respirations/min, un stridor et un stertor bruyants des voies respiratoires supérieures, ainsi que de la toux. De plus, la toux pouvait être provoquée par la palpation de la trachée à l'entrée thoracique. La température était de 103,9 °F (39,9 °C), la fréquence cardiaque de 160 bpm et les muqueuses étaient de couleur boueuse/cyanosée. Une NFS a été réalisée et a révélé 15 000 neutrophiles segmentés/µl et 3 000 bandes/µl. "},{"k":"Évaluation initiale et prise en charge","t":"• Chien en détresse respiratoire avec infection concomitante des voies respiratoires supérieures\nDiagnostics différentiels.\n• Collapsus trachéal\n• Trachéite\n• Paralysie laryngée\n• Obstruction (étouffement)\n• Néoplasie\nPrise en charge.\nImmédiatement :\n• Administration IV de butorphanol (1 mg/kg q3h) et de théophylline (20 mg/kg PO BID); placer le patient dans\nune chambre à oxygène. Surveiller constamment le cœur, la fréquence respiratoire et les muqueuses.\n• Administrer l'amoxicilline-clavulanate (13,75 mg/kg PO BID) et la prednisolone (0,5 mg PO BID)\nUne fois stable :\n• Garder le patient dans la chambre à oxygène avec un nébuliseur contenant une solution d'acétylcystéine (50\nml/h pendant 1 heure BID)\n• Radiographies thoraciques, lavage trachéal et culture\n• Examen buccal (+/- avec endoscopie)\n• Fluidothérapie d'entretien : (RL – 20 ml/h)\n• Si le collapsus trachéal est confirmé – envisager une chirurgie corrective – (en attente de l'approbation du\npropriétaire).\nSurveiller – FC, FR, MM, NFS/bilan biochimique, température, attitude"},{"k":"Ordonnance (Rx)","t":"Butorphanol (1 mg/kg PO BID) pendant 2 semaines; Amoxicilline-clavulanate (13,75 mg/kg PO BID) pendant 3 semaines; Prednisolone (0,5 mg PO BID) pendant 2 semaines"}]}]},{"id":"toux_chenil","nom":"Toux de chenil / trachéobronchite infectieuse","sys":"Cardio-respiratoire","urg":false,"resume":"Exposition récente à des groupes de chiens : toux sèche ou rauque suivie de haut-le-cœur, éternuements, écoulements; état général normal. Examiner pour pneumonie (fièvre, léthargie).","src":["SAM1 — toux de chenil","SAM 2 — trachéobronchite"],"img":[],"sp":{"chien":{"tx":[{"d":"doxycycline","r":"1","n":"Si antibiothérapie indiquée"},{"d":"amox_clav","r":"2","n":"Pneumonie secondaire (selon culture)"},{"d":"butorphanol","r":"S","n":"Antitussif (pas en cas de pneumonie)"},{"d":"vaccin","r":"P","n":"Bordetella/parainfluenza (selon le risque)"}],"maj":"Complexe respiratoire infectieux canin : la majorité guérit sans antibiotique; ISCAID/ACVIM 2017 : doxycycline en première ligne si signes systémiques/risque de pneumonie. Une revue systématique 2026 (3 études, 74 chiens) n'a pas trouvé de différence entre 10–14 et 21–28 jours dans la pneumonie bactérienne canine (certitude très faible; aucune donnée chez le chat).","qc":"Risque accru en pension, garderie, expositions canines : vaccination Bordetella intranasale/orale selon les exigences des établissements.","al":"","gl":["iscaid_resp_2017","rs_pneumonie_duree_2026"]}},"notes":[{"label":"Tableau SAM1 — Toux de chenil (p.1987)","fields":[{"k":"Signes cliniques / examen physique","t":"toux, éternuements, écoulements nasal et oculaire, et occasionnellement bronchopneumonie"},{"k":"Diagnostic différentiel","t":"Collapsus trachéal, bronchite chronique, dirofilariose, corps étranger nasopharyngé, néoplasie pulmonaire ou médiastinale, œdème pulmonaire"},{"k":"Diagnostic","t":"Antécédents de pension, chiot, non vacciné"},{"k":"Traitement (Rx)","t":"Doxycycline, antitussif et bronchodilatateurs. Si pneumonie : amoxicilline/acide clavulanique PO q12h selon C&S, 7–28 j au-delà de la résolution des signes cliniques et radiographiques. Hydrocodone (pas en cas de pneumonie) : 0,22 mg/kg PO q12h au besoin"},{"k":"Pronostic / prévention","t":"Vaccination. Excellent si non compliquée"},{"k":"Surveillance / examens complémentaires","t":"très contagieux. Porter des gants, se laver les mains et isoler strictement à la clinique. Nettoyer les écoulements nasaux et oculaires avec un linge chaud et humide."}]},{"label":"SAM 2 (notes détaillées)","text":"TRACHÉOBRONCHITE\n• SUBJECTIF-Habituellement antécédent d'exposition récente à des groupes de chiens (pension, toilettage, exposition etc.). Statut non vacciné : incidence plus élevée et infections plus\nsévères Toux allant de douce et humide à profonde et rauque, souvent suivie d'un haut-le-cœur terminal. le client pourrait la décrire à tort comme des vomissements. Les propriétaires croient souvent que quelque chose est coincé dans la gorge. Signes de pneumonie...\n• OBJECTIF-fréquent=-écoulement nasal séreux à mucoïde écoulement oculaire avec conjonctivite possible, toux spontanée et facilement provoquée. Pneumonie=fièvre, dépression, tachypnée, dyspnée, cyanose, sibilances, crépitants. râles à l'auscultation pulmonaire.\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=collapsus trachéal maladie du ver du cœur néoplasie pulmonaire œdème pulmonaire corps étranger nasopharyngé\n• PLAN- DIAGNOSTICS= NFS, chimie sérique=souvent sans particularité. Mais peut montrer un leucogramme inflammatoire avec déviation gauche dans les cas de pneumonie. (leucopénie légère précoce) Radiographies thoraciques - normales chez les chiens avec juste de la toux. Les chiens avec signes pulmonaires montrent un motif bronchique/alvéolaire diffus/focal.\nLBA- Pour les chiens avec une toux simple, le diagnostic est typiquement fait selon l'anamnèse, l'examen physique, et possiblement la réponse au traitement\nTHÉRAPEUTIQUE= 1) dans la maladie clinique non compliquée, le but du traitement est la suppression de la toux et la prévention de l'infection secondaire. la toux se résout\nspontanément en 7-14 jours 2) avec pneumonie, le but est d'identifier et d'éradiquer la bactérie causale, améliorer la ventilation, maintenir la santé de l'épithélium respiratoire et fournir des soins de soutien.\nMaladie clinique non compliquée les antibiotiques ne sont pas nécessaires. Avec pneumonie, antibiotiques appropriés 7-28 jours après avoir fait une culture et un antibiogramme.\n• Amoxicilline/acide clavulanique 12-25 mg/kg PO q 8-12h (traitement initial de la maladie non compliquée)\n• Antitussifs-Hydrocodone 0,22 mg/kg PO q 6-12h PRN, Butorphanol 0,5 mg/kg PO SC IM q 6-12h PRN\n• Les chiens avec bronchopneumonie nécessitent un traitement supplémentaire comme des bronchodilatateurs, une thérapie en aérosol, des soins de soutien.\nPRONOSTIC=excellent dans les cas non compliqués\n{ Dans la néoplasie pulmonaire, le diagnostic est fait par une toux chronique non répondante aux antibiotiques. radiographies= la tumeur pulmonaire primaire apparaît comme un nodule unique ou une grande masse. les chats ont plus un motif infiltrant dans le lobe pulmonaire. Des tests avancés comme bronchoscopie, scanner, biopsie pulmonaire par thoracoscopie peuvent être utilisés. Traitement pour résoudre les signes inconfortables et faire la chirurgie ensuite. chimiothérapie pour les métastases }"}]},{"id":"asthme_felin","nom":"Asthme félin","sys":"Cardio-respiratoire","urg":false,"resume":"Toux (parfois prise pour des haut-le-cœur), respiration sifflante expiratoire, tachypnée, détresse; chat siamois prédisposé. Radiographie : motif bronchique; exclure dirofilariose, parasites pulmonaires.","src":["SAM1 — asthme félin","SAM 2 — asthme félin"],"img":[],"sp":{"chat":{"tx":[{"d":"fluticasone","r":"1","n":"Corticostéroïde inhalé avec chambre d'inhalation (traitement de fond)"},{"d":"salbutamol","r":"1","n":"Bronchodilatateur de secours inhalé"},{"d":"prednisolone","r":"2","n":"Cures orales courtes"},{"d":"terbutaline","r":"U","n":"Crise aiguë : injectable (magistral)"},{"d":"dexamethasone","r":"U","n":"Crise sévère"}],"maj":"La corticothérapie inhalée est la base du traitement de fond (limite l'effet systémique des stéroïdes) et se fait avec une chambre adaptée au chat; minimiser le stress en cas de crise.","qc":"Dispositifs d'inhalation félins (AeroKat®) et aérosols-doseurs humains disponibles en pharmacie.","al":"","gl":[]}},"notes":[{"label":"Tableau SAM1 — Asthme félin (p.201)","fields":[{"k":"Signes cliniques / examen physique","t":"Toux, respiration sifflante expiratoire, tachypnée, détresse respiratoire, bruits bronchovésiculaires augmentés"},{"k":"Diagnostic différentiel","t":"Épanchement pleural, œdème pulmonaire, pneumonie, néoplasie, vers pulmonaires, dirofilariose, migration larvaire de Toxocara cati"},{"k":"Diagnostic","t":"FSC : éosinophilie. Radiographies thoraciques : motif bronchique ou bronchointerstitiel (beignes), champs pulmonaires hyperinflés. LBA : éosinophilie des voies respiratoires. Technique de Baermann, test de dirofilariose (Ag et Ac)."},{"k":"Traitement (Rx)","t":"Aigu : O2, minimiser le stress, terbutaline 0,01 mg/kg IM q 4–8h, dans les cas sévères épinéphrine, dexaméthasone 0,4 mg/kg IM. Chron. : terbutaline 0,625 mg/CHAT PO q 12h, au départ prednisolone 2 mg/kg PO q 24h puis fluticasone 220 mcg q 12h ≈10 respirations (compter les respirations), +/- antibiotique."},{"k":"Pronostic / prévention","t":"Variable"},{"k":"Surveillance / examens complémentaires","t":"Idéalement, éliminer l'allergène déclencheur, minimiser l'exposition aux irritants aéroportés - poussières, fumée, aérosols, filtres à air de type HEPA. Tenir un registre du moment où surviennent les SC peut aider à établir la saisonnalité de l'exposition à l'allergène."}]},{"label":"SAM 2 (notes détaillées)","text":"ASTHME FÉLIN\nSUBJECTIF – MC – toux (le propriétaire peut l'interpréter comme des tentatives infructueuses de vomir une boule de poils), détresse respiratoire/dyspnée, respiration bouche ouverte,\n• Chat siamois – prédisposé\nOBJECTIF\n• Sifflements expiratoires audibles avec ou sans stéthoscope\n• Détresse respiratoire/dyspnée (surtout phase expiratoire ou effort)\n• Toux provoquée à la palpation de la trachée. Sensibilité trachéale augmentée.\n• FR augmentée\n• Bruits bronchovésiculaires augmentés (l'auscultation thoracique peut révéler des crépitants et/ou des sifflements expiratoires, mais peut être normale.)\nÉVALUATION\n• Liste des problèmes – toux, bruit expiratoire, détresse respiratoire.\n• DDx – épanchement pleural pneumonie (infectieuse, par aspiration, corps étranger) maladie laryngée (les bruits musicaux seront les plus forts au-dessus du larynx avec détresse inspiratoire)\nvers pulmonaires, dirofilariose (toujours demander si sous prévention contre la dirofilariose)\nPLAN\n• DIAGNOSTIC ■NFS – éosinophilie ■Radiographie thoracique – motif bronchique ou broncho-interstitiel (rails et anneaux)\n• Hyperinflation pulmonaire (piégeage aérien), radiotransparence pulmonaire augmentée, diaphragme aplati, silhouette cardiaque augmentée. ■Cytologie LBA =éosinophiles et neutrophiles augmentés (car éosinophilie due à trouble allergique/atopique, parasites, etc.) ■Test d'anticorps/antigène de la dirofilariose-pour écarter une cause de toux et d'éosinophilie périphérique chez les chats. ■Analyse fécale de BAERMANN – pour écarter des vers pulmonaires.\n• THÉRAPEUTIQUE Traitement aigu ■Minimiser la manipulation et le stress ■Fournir de l'OXYGÈNE ■BRONCHODILATATEURS (parentéraux) – Terbutaline 0,01mg/kg SC/IM q\n4-8h ou (Albuterol 0,1 ml dilué dans 2 ml de sérum physiologique stérile en nébulisation q 4h) ■PREDNISOLONE – 1-2 mg/kg IV Traitement chronique avec (par voie orale) bronchodilatateurs+prednisolone\n• Glucocorticoïdes oraux préférés initialement : prednisolone 2 mg/kg PO q 24h\n• Bronchodilatateurs : voie orale idéale pour le traitement chronique\n• Théophylline à libération prolongée (Theo-Dur) 25 mg/kg PO q 24h, ou\n• Aminophylline 4-5 mg/kg PO q 8h, ou\n• Terbutaline 0,625 mg/CHAT PO q 12h\n• Minimiser l'exposition aux allergènes aériens\n• Pronostic – Bon mais dépend de la sévérité de la maladie. Un traitement à long terme\ndoit être attendu.\n• "}]},{"id":"pneumothorax","nom":"Pneumothorax","sys":"Cardio-respiratoire","urg":true,"resume":"Dyspnée expiratoire ± inspiratoire, bruits pulmonaires assourdis après traumatisme. Radiographie thoracique; thoracocentèse diagnostique/thérapeutique.","src":["SAM 2 — pneumothorax"],"img":["sam2_p40_0"],"sp":{"chien":{"tx":[{"d":"buprenorphine","r":"S","n":"Analgésie"}],"maj":"Oxygène, thoracocentèse (ou drain thoracique) si dyspnée; si pas de signe clinique, surveillance seulement.","qc":"","al":"","gl":["recover_pa_2026"]},"chat":{"tx":[{"d":"buprenorphine","r":"S","n":""}],"maj":"Même démarche; traumatisme, morsure, chute (syndrome de chute de haut).","qc":"","al":"","gl":["recover_pa_2026"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"PNEUMOTHORAX\n• SUBJECTIF- traumatisme (renversé par une voiture, morsure, chute de hauteur, intervention chirurgicale etc.), début aigu de toux ou tachypnée ou aggravation de la tachypnée suite à une procédure médicale.\n• OBJECTIF- Dyspnée/effort respiratoire augmenté est la constatation caractéristique\n(expiratoire ou à la fois expiratoire et inspiratoire mais pas inspiratoire seule ce qui suggérerait généralement une maladie des voies respiratoires supérieures, pas un pneumothorax). Bruits pulmonaires sourds/étouffés à l'auscultation ou à la percussion. Autres signes de traumatisme soit contondant (renversé par une voiture) soit pénétrant (morsure, blessure par balle, coup de couteau)\n• ÉVALUATION- LISTE DES PROBLÈMES=dyspnée, toux\nDDx=pneumonie (par aspiration/bactérienne) hernie diaphragmatique asthme épanchement pleural contusions pulmonaires fracture, volet costal maladie pulmonaire primaire néoplasie pulmonaire\n• PLAN- DIAGNOSTICS=NFS/chimie sérique-généralement sans particularité Radiographies thoraciques-décubitus latéral gauche=petit volume d'air dans l'espace pleural.\ndiagnostics de confirmation/avancés=scanner, mesure des gaz du sang artériel ou oxymétrie de pouls peuvent aider à évaluer si la dyspnée est due au pneumothorax ou à la douleur, l'hypovolémie etc. Analyse de l'épanchement pleural si présent, obtenu par thoracocentèse.\nTHÉRAPEUTIQUE=si pas de signes cliniques, alors pas de traitement nécessaire, juste surveiller. Si signes cliniques présents alors thoracocentèse, suivie d'un drain thoracique.\nPRONOSTIC=passable à bon avec traumatisme. La dyspnée et les soins intensifs sont un indicateur pronostique négatif.\nSURVEILLER- fréquence/effort respiratoire Oxymétrie de pouls"}]},{"id":"pneumonie_aspiration","nom":"Pneumonie par aspiration","sys":"Cardio-respiratoire","urg":true,"resume":"Toux, tachypnée, fièvre, anorexie; crépitements; infiltrat alvéolaire des lobes crâniaux/moyens déclives. Oxygène, nébulisation, antibiotiques.","src":["SAM 2 — pneumonie par aspiration"],"img":[],"sp":{"chien":{"tx":[{"d":"amox_clav","r":"1","n":"Avec ou sans fluoroquinolone selon la gravité/culture"},{"d":"ampicilline","r":"2","n":"IV"},{"d":"maropitant","r":"S","n":"Prévention des vomissements"},{"d":"metoclopramide","r":"S","n":"Injectable"},{"d":"cisapride","r":"S","n":"Magistral"}],"maj":"Les corticostéroïdes systémiques ne sont pas recommandés en routine (vos notes : « jusqu'à 48 h » — à nuancer). Culture si possible; durée à adapter (revue systématique 2026 : pas de différence nette entre 10–14 et 21–28 jours, certitude très faible).","qc":"","al":"Corticostéroïdes courts cités dans vos notes : bénéfice non démontré, risque d'aggravation de l'infection.","gl":["iscaid_resp_2017","rs_pneumonie_duree_2026"]},"chat":{"tx":[{"d":"amox_clav","r":"1","n":""},{"d":"maropitant","r":"S","n":""}],"maj":"Chat : plus rare; rechercher une cause (vomissements, dysphagie, sédation).","qc":"","al":"","gl":["iscaid_resp_2017"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"PNEUMONIE (PAR ASPIRATION)\n• SUBJECTIF-les signes cliniques varient et peuvent ou non être présents. Anorexie, toux, détresse respiratoire, léthargie, collapsus etc. antécédent possible de régurgitation ou d'épisode anesthésique etc.\n• OBJECTIF-tachypnée, toux, détresse inspiratoire et expiratoire, fièvre (<50%) Auscultation - localisée. Bruits bronchovésiculaires augmentés ou rudes (~50%), crépitants (~10%)\n• ÉVALUATION- LISTE DES PROBLÈMES=toux, dyspnée, bruits pulmonaires rudes\nDDx=pneumonie infectieuse\n• PLAN- DIAGNOSTICS= NFS-leucocytose neutrophilique +/- déviation gauche fréquente\nRadiographies thoraciques- motif alvéolaire ou interstitiel ou consolidation dans les lobes pulmonaires affectés souvent vu dans le lobe pulmonaire crânial droit ou moyen droit. Ou lobe pulmonaire crânial gauche.\nTESTS AVANCÉS- oxymétrie de pouls pour analyser l'oxygénation. Hypoxémie LBA pour examen cytologique.\n• THÉRAPEUTIQUE=➣si une aspiration est observée, aspirer immédiatement le matériel du pharynx/voies respiratoires et assurer la perméabilité des voies aériennes. Si détresse respiratoire, donner de l'oxygène + repos\n• Bronchodilatateurs pour soulager le bronchospasme ex-albutérol, terbutaline, aminophylline.\n• Fluides d'entretien à 60 ml/kg par jour (attention à éviter la surhydratation)\n• Antimicrobiens car l'infection microbienne secondaire est fréquente. Ex-ampicilline 22 mg/kg IV q 8h et enrofloxacine 5 mg/kg q 12h\n• Corticostéroïdes à courte durée d'action—à considérer jusqu'à 48 heures pour combattre l'inflammation associée à une aspiration engageant le pronostic vital.\nNébulisation saline.\nPRONOSTIC=dépend du volume et de la nature du matériel inhalé=généralement bon"}]},{"id":"pneumonie_infectieuse","nom":"Pneumonie infectieuse","sys":"Cardio-respiratoire","urg":true,"resume":"Toux, respiration laborieuse, écoulement nasal, fièvre; infiltrat alvéolaire; lavage trachéal pour cytologie et culture.","src":["SAM 2 — pneumonie infectieuse"],"img":[],"sp":{"chien":{"tx":[{"d":"amox_clav","r":"1","n":"Selon culture/lavage trachéal"},{"d":"doxycycline","r":"2","n":""},{"d":"enrofloxacine","r":"2","n":"Réservé aux cas graves/sepsis"},{"d":"theophylline","r":"S","n":"Bronchodilatateur"}],"maj":"Lavage trachéal pour culture; ISCAID/ACVIM 2017 : antibiotiques ciblés; nébulisation saline + couponnage.","qc":"","al":"","gl":["iscaid_resp_2017","rs_pneumonie_duree_2026"]},"chat":{"tx":[{"d":"doxycycline","r":"1","n":""},{"d":"amox_clav","r":"2","n":""}],"maj":"Chat : Bordetella/Mycoplasma/Streptococcus zooepidemicus; doxycycline en première intention selon ISCAID.","qc":"","al":"","gl":["iscaid_resp_2017"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"PNEUMONIE (INFECTIEUSE)\n• SUBJECTIF- toux, respiration laborieuse, écoulement nasal, éternuements, intolérance à l'effort, anorexie, léthargie\n• OBJECTIF-toux, écoulement nasal, fièvre, tachypnée, effort inspiratoire augmenté ou détresse respiratoire manifeste. Bruits bronchiques augmentés ou crépitants ou sibilances-peuvent être focaux.\n• ÉVALUATION- LISTE DES PROBLÈMES=tachypnée, toux\nDDx=néoplasie pulmonaire parasites respiratoires œdème pulmonaire pneumonie fongique corps étranger\nasthme\n• PLAN- DIAGNOSTICS=➣ NFS-leucogramme inflammatoire=leucocytose neutrophilique avec ou sans déviation gauche bien que non observée dans tous les cas. La neutropénie est possible surtout en cas de sepsis\n• Radiographies thoraciques-motif alvéolaire dans les lobes affectés. OU motif interstitiel avec ou sans alvéolaire également possible. OU consolidation lobaire peut être proéminente.\n• Cytologie LBA=inflammation septique, suppurative. Bactéries/neutrophiles peuvent être vus.\nTHÉRAPEUTIQUE=➣1) (Aigu) Oxygénothérapie en cage, masque etc.\n• 2) Antibiotiques à large spectre = Les animaux cliniquement instables doivent être traités avec\ndes antibiotiques IV à large spectre : (couvrant G+ ET G-) les antimicrobiens sont la pierre angulaire du traitement\n• Ampicilline (22 mg/kg IV q 8h) ou céfazoline (22 mg/kg IV q 8h) ET ➣soit enrofloxacine (3-5 mg/kg IV q 24h chiens) chats, maximum 5 mg/kg\nq24h), soit un aminoglycoside comme l'amikacine (20 mg/kg SC ou IV q 24h)\n(Des choix antimicrobiens initiaux raisonnables en attendant les résultats de culture incluent l'amoxicilline-acide clavulanique (15 mg/kg PO\nq12h) ou la céphalexine (22–30 mg/kg PO q12h) avec enrofloxacine (chiens, 5–10 mg/kg q12h ou 10–20 mg/kg q24h; chats, maximum 5 mg/kg q24h), ou triméthoprime-sulfamide (15 mg/kg PO q12h))\n• 3) Nébulisation saline + clapping (plusieurs fois par jour)\n• 4) Bronchodilatateurs- théophylline, terbutaline 1,25-5 mg/chien PO q 8h\nAntitussifs (contre-indiqués dans les cas de pneumonie, en raison de l'expectoration réduite):\nPRONOSTIC=la pneumonie non compliquée a un bon pronostic."}]},{"id":"rhinite","nom":"Rhinite (lymphoplasmocytaire ou bactérienne)","sys":"Cardio-respiratoire","urg":false,"resume":"Écoulement nasal, éternuements, ronflement, stertor, éternuements inversés. DDx : rhinite fongique, néoplasie, corps étranger, acariens, polype, infection dentaire.","src":["SAM 2 — rhinite"],"img":[],"sp":{"chien":{"tx":[{"d":"itraconazole","r":"2","n":"Aspergillose : thérapie topique/systémique (référer)"},{"d":"clotrimazole","r":"2","n":"Perfusion intranasale (spécialiste)"},{"d":"doxycycline","r":"2","n":"Si bactérienne"}],"maj":"Éternuements, écoulement nasal, stertor : exclure corps étranger, néoplasie, aspergillose, maladie dentaire; rhinoscopie/CT.","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"doxycycline","r":"1","n":"Chlamydia/Mycoplasma"},{"d":"fluconazole","r":"2","n":"Cryptococcose (selon le test d'antigène)"},{"d":"famciclovir","r":"S","n":"Herpèsvirus chronique"}],"maj":"Rhinite chronique du chat : post-viral; traitement multimodal.","qc":"","al":"","gl":["iscaid_resp_2017"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"RHINITE (lymphoplasmocytaire ou bactérienne)\n• SUBJECTIF- écoulement nasal, éternuements, ronflement, stertor, éternuement inversé, écoulement oculaire et frottement/griffage du nez (occasionnel) halitose, inappétence (maladie dentaire) parfois épistaxis\n• OBJECTIF-écoulement nasal séreux, mucoïde, sanglant unilatéral ou bilatéral Passage d'air diminué à travers une ou les deux narines Ganglions lymphatiques sous-mandibulaires augmentés Signes de maladie systémique rares. Une maladie dentaire, nasopharyngée, ou des voies respiratoires inférieures\nconcomitante peut être observée. L'état général est normal.\n• ÉVALUATION- LISTE DES PROBLÈMES= éternuements, écoulement nasal, stertor\nDDx= rhinite fongique\nNéoplasie nasale Corps étranger Acariens nasaux Polype nasopharyngé Infection de racine dentaire/maladie dentaire\n• PLAN- DIAGNOSTICS= examen oral et dentaire pour exclure une maladie dentaire, des défauts palatins, choanaux. radiographies simples des cavités nasales, sinus, racines dentaires sous anesthésie Les cultures bactériennes sont rarement utiles. NFS/chimie sérique-normal\nDiagnostics avancés- Rhinoscopie, cytologie d'échantillons de muqueuse nasale, scanner\nTHÉRAPEUTIQUE= ➪Antibiotiques à large spectre pour courte période, une semaine est bien (rhinite bactérienne) ➪Médicament mucolytique- N-acétylcystéine (large gamme) 5-10 mg et jusqu'à 100 mg/kg PO q 12h. Une administration intranasale ou en aérosol d'une solution à 5-20% peut être utilisée ➪Les agents anti-inflammatoires comme le piroxicam peuvent être utiles. ➪Prednisone (les glucocorticoïdes à dose immunosuppressive peuvent être donnés à 1-2 mg/kg PO q 12h progressivement réduits pour contrôler les signes (rhinite lymphoplasmocytaire) ➪L'humidification des voies aériennes aide.\nPRONOSTIC=varie selon la cause primaire (essayer de trouver la cause de la rhinite et traiter en conséquence comme fongique etc.)"}]},{"id":"calicivirose","nom":"Calicivirose féline","sys":"Cardio-respiratoire","urg":false,"resume":"Ulcères buccaux, éternuements, boiterie « fébrile » du chaton. Soutien : fluides, alimentation à la seringue, analgésie, antibiotique si surinfection.","src":["SAM 2 — calicivirose féline"],"img":[],"sp":{"chat":{"tx":[{"d":"fluides","r":"S","n":""},{"d":"buprenorphine","r":"S","n":"Douleur des ulcères buccaux"},{"d":"amoxicilline","r":"S","n":"Infection bactérienne secondaire"},{"d":"sucralfate","r":"S","n":"Pâte sur ulcères"},{"d":"vaccin","r":"P","n":"Vaccin essentiel (core)"}],"maj":"Traitement de soutien (analgésie, nutrition, hydratation); des antiviraux sont à l'étude en 2026 mais ne sont pas homologués pour le calicivirus félin. Prévention : vaccination (WSAVA 2024).","qc":"","al":"","gl":["wsava_vacc_2024"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"CALICIVIROSE FÉLINE\n• SUBJECTIF- le chat est malaise/léthargique. Anorexie/inappétence, signes oculaires éternuements, écoulement nasal (séreux ou purulent), bave, réticence à marcher, boiterie\n• OBJECTIF- 1) forme pneumotropique-conjonctivite, épiphora, blépharospasme, chémosis. écoulement oculaire écoulement nasal. Vésicules ou érosions, ulcères sur la langue, le palais, les lèvres, le plan nasal (visibles pendant l'examen buccal) bave, déshydratation 2) forme systémique virulente- fièvre, œdème facial et des membres pouvant évoluer vers une nécrose. Signes respiratoires supérieurs ictère avec pancréatite\nDyspnée, épistaxis, hématochézie, pneumonie Ulcération de la bouche, du visage, du museau, du pavillon de l'oreille, des extrémités Péricardite, mort 3) forme rhumatismale- fièvre, température>104°F Gonflement articulaire, douleur, myalgie, boiterie aiguë douloureuse.\nUlcères buccaux possibles chat/chaton réticent à marcher.\n• ÉVALUATION- LISTE DES PROBLÈMES=ulcères, éternuements\nDDx=herpèsvirus félin chlamydiose bordetellose lésion/traumatisme cornéen Des ulcères buccaux accompagnés de fièvre peuvent être causés par le léchage de désinfectant\n• PLAN- DIAGNOSTICS=coloration à la fluorescéine de la cornée pour écarter des ulcères. Test du virus de la leucose féline/immunodéficience féline pour écarter une immunodépression sous-jacente Diagnostics avancés- PCR\nTHÉRAPEUTIQUE={ soutien-contrôler la douleur des ulcères buccaux et articulaires, traiter l'infection\nbactérienne secondaire, hydratation/nutrition }\nFluides pour l'hydratation.\n• Alimentation à la seringue si anorexique.\n• Pommade ophtalmique à l'érythromycine\n• Pâte de sucralfate sur les ulcères buccaux.\n• Buprénorphine 0,01-0,03 mg/kg q 8-12h IM, IV, PO\n• Antibiotiques à large spectre—habituellement indiqués (ex., amoxicilline à 22 mg/kg PO q12h).\nPRONOSTIC=bon"}]},{"id":"herpesvirus_felin","nom":"Herpèsvirus félin (rhinotrachéite)","sys":"Cardio-respiratoire","urg":false,"resume":"Éternuements, écoulement nasal séreux→purulent, conjonctivite, kératite, fièvre jusqu'à 106 °F; latence et récidives.","src":["SAM 2 — herpèsvirus félin"],"img":[],"sp":{"chat":{"tx":[{"d":"famciclovir","r":"1","n":"Antiviral systémique (hors AMM)"},{"d":"tobramycine","r":"S","n":"Kératite : antibiotique topique"},{"d":"lysine","r":"S","n":"Preuves limitées"},{"d":"vaccin","r":"P","n":"Vaccin essentiel (core)"}],"maj":"Famciclovir = antiviral de choix en pratique (produit humain, Famvir®); la lysine n'a pas fait la preuve de son efficacité. Examen oculaire et test à la fluorescéine; PCR de confirmation.","qc":"","al":"","gl":["wsava_vacc_2024"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"HERPÈSVIRUS FÉLIN\n• SUBJECTIF-Œil rouge douloureux unilatéral ou bilatéral Douleur et écoulement oculaires, conjonctivite, et kératite ulcéreuse.\nSignes respiratoires supérieurs comme éternuements, écoulement nasal/rhinite=écoulement nasal séreux, mucopurulent, ou\npurulent, inappétence, fièvre jusqu'à 106°F\n• OBJECTIF-hyperémie conjonctivale, œdème (chémosis), follicules lymphoïdes sur la conjonctive Nodules conjonctivaux lisses, crémeux Écoulement oculaire observé Blépharospasme, protrusion de la 3ème paupière\n• ÉVALUATION- LISTE DES PROBLÈMES=conjonctivite, éternuements\nDDx=\n• PLAN- DIAGNOSTICS= examen ophtalmique et test à la fluorescéine Confirmer par PCR\nTHÉRAPEUTIQUE=➣Antibiotiques topiques à large spectre ex. tobramycine (pour la kératite)\n• lysine 500 mg PO/chat q 12h Famciclovir 62,5 mg PO/chat q 12-24h ?\n• Antibiotiques à large spectre—ampicilline (20–40 mg/kg PO q8h; 10–20 mg/kg IV, IM, SC q6–8h) ou\namoxicilline (10–40 mg/kg q8–12h PO, IM, SC) pour les infections bactériennes secondaires. OU associations d'antibiotiques—ampicilline ou amoxicilline et une fluoroquinolone (enrofloxacine [2,5 mg/kg PO, IM,\nIV q12h],\nPRONOSTIC=bon"}]},{"id":"mvrs_feline","nom":"Maladies des voies respiratoires supérieures du chat","sys":"Cardio-respiratoire","urg":false,"resume":"Complexe herpèsvirus/calicivirus/Chlamydia/Bordetella : éternuements, écoulements, conjonctivite, ulcères buccaux.","src":["SAM 2 — maladie respiratoire supérieure féline"],"img":[],"sp":{"chat":{"tx":[{"d":"doxycycline","r":"1","n":"Chlamydia felis, Bordetella, Mycoplasma"},{"d":"fluides","r":"S","n":""},{"d":"mirtazapine","r":"S","n":"Appétit (Mirataz®)"},{"d":"famciclovir","r":"S","n":""}],"maj":"Soutien d'abord (hydratation, nutrition, hygiène nasale); antibiotiques seulement si signes de surinfection bactérienne : doxycycline en première ligne (ISCAID 2017).","qc":"","al":"","gl":["iscaid_resp_2017"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"MALADIE DES VOIES RESPIRATOIRES SUPÉRIEURES FÉLINE\nUne cause fréquente de signes des voies respiratoires supérieures et d'anomalies oculaires incluant congestion nasale, éternuements, écoulement oculaire/nasal, conjonctivite/kératite, ulcères buccaux etc. c'est souvent le résultat d'une infection transmissible multi-agents avec l'herpèsvirus félin FHV, le calicivirus félin FCV, Chlamydia felis, Bordetella bronchiseptica et moins couramment les mycoplasmes DDx- 1)signes nasaux- corps étranger nasal, néoplasie, polype nasopharyngé, infection fongique, malformation des voies nasales/sinus 2)signes oculaires- traumatisme cornéen/conjonctival, corps étranger cornéen, néoplasie, KCS, uvéite, glaucome 3)toux/dyspnée-asthme félin, néoplasie intrathoracique, ICC, épanchement pleural, dirofilariose féline DIAGNOSTICS- NFS-leucogramme de stress ou inflammatoire possible. résultats souvent normaux. Radiographies thoraciques-évaluer pneumonie, œdème pulmonaire, maladie pleurale etc.\nTHÉRAPEUTIQUE- Soutien (voir livre)\nChlamydophila felis- traitement doxycycline"}]},{"id":"epistaxis","nom":"Épistaxis","sys":"Cardio-respiratoire","urg":false,"resume":"Saignement nasal : unilatéral (local) vs bilatéral (systémique). Plaquettes, coagulation, PA, imagerie nasale.","src":["SAM1 — épistaxis"],"img":[],"sp":{"chien":{"tx":[{"d":"vitamine_k1","r":"S","n":"Si raticide anticoagulant"},{"d":"clotrimazole","r":"2","n":"Aspergillose (spécialiste)"}],"maj":"Exclure coagulopathie (raticide, thrombocytopénie, Ehrlichia), néoplasie nasale, aspergillose, hypertension.","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"vitamine_k1","r":"S","n":""}],"maj":"Chat : néoplasie nasale, cryptococcose, hypertension, coagulopathie.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau SAM1 — Épistaxis (p.661)","fields":[{"k":"Diagnostic différentiel","t":"traumatisme, aspergillose/cryptococcose, intoxication aux rodenticides, lymphome/carcinome, corps étranger, cause dentaire, TIM, maladie de von Willebrand, ehrlichiose"},{"k":"Traitement (Rx)","t":"Aspergillose : clotrimazole intranasal. Lymphome : COPD"},{"k":"Pronostic / prévention","t":"Aspergillose : passable à bon"}]}]},{"id":"trauma","nom":"Traumatisme (frappé par une voiture)","sys":"Cardio-respiratoire","urg":true,"resume":"Collapsus, difficulté respiratoire, lacérations, fractures, hémorragie interne. Oxygène, cristalloïdes, analgésie; FAST/radiographies après stabilisation.","src":["Urgences (frappé par une voiture)"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":"Bolus de 20 mL/kg sur 20 min, réévalués"},{"d":"hydromorphone","r":"1","n":"Analgésie (substance contrôlée)"},{"d":"methadone","r":"1","n":""},{"d":"fentanyl","r":"1","n":"Perfusion"},{"d":"ketamine","r":"S","n":""},{"d":"cefazoline","r":"S","n":"Plaies ouvertes"},{"d":"colloides","r":"S","n":"Sang/plasma si nécessaire"}],"maj":"Priorité : voies aériennes/respiration/circulation (ABC), analgésie précoce, imagerie après stabilisation. Les doses de choc (90 mL/kg/h) sont des maximums théoriques : bolus fractionnés avec réévaluation (RECOVER 2026 : premiers soins).","qc":"","al":"","gl":["recover_pa_2026"]},"chat":{"tx":[{"d":"fluides","r":"U","n":"Bolus fractionnés avec réévaluation (dose de choc de vos notes pour le chat : 40 mL/kg/h)"},{"d":"buprenorphine","r":"1","n":""},{"d":"hydromorphone","r":"1","n":""},{"d":"methadone","r":"1","n":""}],"maj":"Chat : syndrome de chute de haut, pneumothorax, rupture de la vessie/diaphragme.","qc":"","al":"","gl":["recover_pa_2026"]}},"notes":[{"label":"Tableau des urgences — Frappé par une voiture (p.980)","fields":[{"k":"Signes cliniques / examen physique","t":"collapsus aigu, difficulté respiratoire, lacérations, boiterie et fractures présumées. EP : dépend des parties atteintes (neurologique, cardiovasculaire, respiratoire, etc.)"},{"k":"Diagnostic différentiel","t":"Autres causes de traumatisme : coups de pied, chute d'une hauteur, morsures"},{"k":"Diagnostic","t":"Triage. FSC. Biochimie sanguine. ECG. TPR. Radiographies. Échographie FAST (Focused Assessment with Sonography for Trauma). PA, oxymétrie de pouls."},{"k":"Traitement (Rx)","t":"Oxygénothérapie + intubation, cristalloïdes 20 mL/kg en 20 minutes jusqu'aux doses de choc complètes de 90 mL/kg chez le chien et 40 mL/kg chez le chat, culots globulaires ou sang entier frais, pansements pour couvrir les plaies, hydromorphone 0,1 mg/kg IM, IV q 4–6h ; antibiotiques, +/- sonde urinaire"},{"k":"Pronostic / prévention","t":"si l'animal a survécu assez longtemps pour arriver à l'hôpital : 84–91 %."},{"k":"Surveillance / examens complémentaires","t":"fréquence cardiaque, qualité du pouls et couleur des MM, fréquence/effort respiratoire, état mental, niveau de douleur, PCV/PT, lactate, production urinaire"}]}]},{"id":"epilepsie","nom":"Épilepsie / crises convulsives","sys":"Neurologie","urg":true,"resume":"Grande race (idiopathique) : crises tonico-cloniques généralisées. Rechercher l'hypoglycémie, l'encéphalopathie hépatique, l'urémie, les toxines. Phénobarbital en première ligne dans vos notes; gabapentine en ajout.","src":["Urgences (épilepsie)","SAM 2 — épilepsie"],"img":[],"sp":{"chien":{"tx":[{"d":"phenobarbital","r":"1","n":"Epiphen® : 12 h; dosage sérique après 14 jours"},{"d":"levetiracetam","r":"1","n":"Seul ou en association (produit humain, Keppra®)"},{"d":"bromure","r":"2","n":"Préparation magistrale"},{"d":"zonisamide","r":"2","n":"Non commercialisé (BDPP) : magistral"},{"d":"diazepam","r":"U","n":"État de mal épileptique (IV/IN/rectal)"},{"d":"midazolam","r":"U","n":""},{"d":"propofol","r":"U","n":"État de mal réfractaire"},{"d":"pentobarbital","r":"U","n":"Réfractaire"}],"maj":"ACVIM 2023 : prise en charge de l'état de mal épileptique et des crises en salves (benzodiazépine → lévétiracétam → perfusion). Épilepsie chronique : phénobarbital ou lévétiracétam; mesurer les enzymes hépatiques/acides biliaires régulièrement avec le phénobarbital.","qc":"Phénobarbital : substance contrôlée (Epiphen® est le produit vétérinaire répertorié).","al":"","gl":["acvim_se_2023","acvim_epi_2015"]},"chat":{"tx":[{"d":"phenobarbital","r":"1","n":""},{"d":"levetiracetam","r":"1","n":""},{"d":"diazepam","r":"U","n":""},{"d":"midazolam","r":"U","n":""}],"maj":"Chat : pas de bromure (risque d'asthme/toux); lévétiracétam souvent bien toléré.","qc":"","al":"","gl":["acvim_se_2023"]}},"notes":[{"label":"Tableau des urgences — Épilepsie (p.655)","fields":[{"k":"Signes cliniques / examen physique","t":"Chien de grande race. Convulsions tonico-cloniques caractérisées par une perte de conscience et une contraction soutenue de tous les muscles, suivies de mouvements de pédalage des membres ou de contractions musculaires rythmiques (membres et muscles masticateurs). EP : normal sauf si l'examen est fait directement après les épisodes."},{"k":"Diagnostic différentiel","t":"EH, hypoglycémie, polycythémie, hypocalcémie, plomb, éthylène glycol, organophosphorés, métaldéhyde, encéphalites : maladie de Carré, encéphalite fongique, Neospora caninum, Toxoplasma gondii, péritonite infectieuse féline, néoplasie, traumatisme crânien"},{"k":"Diagnostic","t":"exclure les autres causes. Tomodensitométrie cérébrale (CT scan). Électroencéphalographie (EEG)"},{"k":"Traitement (Rx)","t":"Soluté IV suivi de : aigu : diazépam 1 mg/kg IV à effet en cas d'état de mal épileptique. Chronique : phénobarbital 2–3 mg/kg PO q12h (effets secondaires : PU/PD, sédation, ataxie) vérifier la concentration sérique après 14 jours, enzymes hépatiques q6 mois. En cas d'inefficacité, ajouter de la gabapentine 10 mg/kg PO q6h. Si les convulsions deviennent bien contrôlées, il peut être possible de sevrer graduellement le premier médicament"},{"k":"Pronostic / prévention","t":"bon avec traitement (phénobarbital)"},{"k":"Surveillance / examens complémentaires","t":"Animal avec antécédents : pas de reproduction. La stérilisation est requise chez les femelles car les œstrogènes augmentent les convulsions"}]},{"label":"SAM 2 (notes détaillées)","text":"ÉPILEPSIE- Les plus fréquentes sont les crises tonico-cloniques généralisées caractérisées par une perte de conscience et une contraction soutenue de tous les muscles, suivie de mouvements de pédalage des membres ou de contractions musculaires rythmiques, surtout des membres et des muscles masticateurs. Diagnostics- ➭NFS sans particularité\n• Bilan biochimique sérique, analyse d'urine : aident à identifier hypoglycémie, encéphalopathie hépatique, et azotémie/urémie comme causes possibles de convulsions au lieu d'une épilepsie idiopathique.\n• Acides biliaires sériques (pré et postprandiaux)= Une élévation de l'un ou des deux suggère une encéphalopathie hépatique (shunt porto-systémique, maladie hépatique cirrhotique/fibrosante, autre)\nAIGU Rx-Pour arrêter une crise active : diazépam 0,5-1 mg/kg IV jusqu'à effet\nSi la crise ne s'arrête pas avec trois doses de diazépam, administrer :\n• Lévétiracétam 20-60 mg/kg IV sur plusieurs minutes; si efficace, répéter au besoin (typiquement q 8-12h) ou\n• Pentobarbital 3-15 mg/kg, IV lente; ou\n• Propofol 1-8 mg/kg IV jusqu'à effet, suivi d'une perfusion continue à 0,1 mg/kg/min titrée selon effet\nCHRONIQUE Rx- Traitement initial avec soit le phénobarbital (chien, chat) soit le bromure (chien)\n• Phénobarbital : -Dose initiale : 2-3 mg/kg PO q 12h (chien, chat) ajustée subséquemment selon les effets cliniques et la surveillance thérapeutique Bromure de potassium : - Dose initiale : 20-30 mg/kg PO q 24h (chien), changée subséquemment selon les effets cliniques et la surveillance thérapeutique ■Chats : risque substantiel de pneumopathie Surveillance recommandée- ➣➣Phénobarbital - Mesurer les concentrations sériques 14 jours après le début du traitement ou le changement de dose, quand les convulsions ne sont pas adéquatement contrôlées, quand des signes de toxicose liés à la dose surviennent, et tous les 6-12 mois.\ndébut du traitement ou le changement de dose, quand les convulsions ne sont pas adéquatement contrôlées, quand des signes de toxicose liés à la dose surviennent, et tous les 6-12 mois.\n• Mesurer les acides biliaires tous les 6-12 mois pour dépister une hépatotoxicose."}]},{"id":"hdiv","nom":"Hernie discale intervertébrale (HDIV)","sys":"Neurologie","urg":true,"resume":"Impossible de sauter/grimper; douleur cervicale/lombaire, parésie/paralysie (NMS), incontinence. Évaluer la perception de la douleur profonde; IRM/myélographie.","src":["Urgences (HDIV)","SAM 2 — maladie du disque intervertébral"],"img":[],"sp":{"chien":{"tx":[{"d":"gabapentine","r":"S","n":"Douleur neuropathique"},{"d":"meloxicam","r":"1","n":"AINS (Metacam®) — sans corticostéroïde associé"},{"d":"carprofene","r":"1","n":"Rimadyl®"},{"d":"methocarbamol","r":"S","n":"Relaxation musculaire"},{"d":"prazosine","r":"S","n":"Tonus urétral"},{"d":"famotidine","r":"S","n":"Si corticostéroïdes"}],"maj":"Traitement conservateur ou chirurgical (hémilaminectomie) selon le déficit neurologique. Études 2024–2025 : la restriction d'exercice n'a pas modifié le résultat dans l'extrusion non compressive aiguë (JVIM 2025); une étude 2024 décrit la récupération de la marche après traitement conservateur chez les petits chiens non brachycéphales.","qc":"","al":"Éviter l'association AINS + corticostéroïde (risque d'ulcères gastro-intestinaux).","gl":["et_hdiv_repos_2025","et_hdiv_cons_2024"]}},"notes":[{"label":"Tableau des urgences — HDIV (hernie discale intervertébrale) (p.1105)","fields":[{"k":"Signes cliniques / examen physique","t":"Le chien ne peut pas sauter ni grimper. Douleur cervicale, boiterie, réflexes (NMS) dans les membres pelviens, vessie NMS, perte du réflexe du muscle cutané du tronc (panniculaire) deux espaces vertébraux caudalement à la lésion. Altération de la perception."},{"k":"Diagnostic différentiel","t":"Fracture vertébrale, néoplasie, embolie fibrocartilagineuse, discospondylite, myélite, myélopathie dégénérative"},{"k":"Diagnostic","t":"Examen orthopédique pour exclure une maladie musculosquelettique. Examen neurologique : signes NMS aux membres antérieurs et postérieurs C1–C5. NMI aux antérieurs, NMS aux postérieurs : C6–T2. Antérieurs normaux, NMS postérieurs : T3–L3. Antérieurs normaux + (réflexe patellaire diminué L4–L6) ou (retrait diminué aux postérieurs L6–S2). Radiographie.,"},{"k":"Traitement (Rx)","t":"restreindre l'activité (repos STRICT en cage pendant 4–6 semaines), soluté IV, AINS, corticostéroïdes, méthocarbamol (44 mg/kg IV q4h), carprofène (4 mg/kg SC q24h), famotidine (1 mg/kg IV q24h), prazosine (phénoxybenzamine pour réduire le tonus du sphincter urétral), cathétérisme, expression manuelle de la vessie aux 4 h, zones de repos matelassurées, réadaptation physique incluant l'hydrothérapie"},{"k":"Pronostic / prévention","t":"en l'absence de douleur profonde réservé sans chirurgie, bon avec chirurgie ; si pas de douleur profonde réservé même avec chirurgie"},{"k":"Surveillance / examens complémentaires","t":"Niveau d'inconfort, évacuations vésicale/intestinale, signes de plaies de pression, état neurologique, signes de myélomalacie"},{"k":"Commentaires","t":"le repos en cage est essentiel au rétablissement. Éviter l'obésité et les activités de saut"}]},{"label":"SAM 2 (notes détaillées)","text":"MALADIE DU DISQUE INTERVERTÉBRAL Dégénérescence discale intervertébrale et déplacement de matériel discal dans le canal vertébral ou le foramen intervertébral, causant des signes allant de la douleur dorsale à la parésie ou la paralysie\n• SUBJECTIF-Réticence à sauter, grimper, ou s'engager dans d'autres formes d'activité\n• Avec maladie discale cervicale—douleur cervicale, port bas de la tête, tétraparésie, raideur cervicale, spasmes musculaires, peut-être boiterie du membre thoracique ou déficits neurologiques.\n• Avec maladie discale thoraco-lombaire—douleur dorsale, dos arqué/cyphose, réticence à marcher, douleur lorsque soulevé, parésie postérieure. Peut-être ataxie du membre pelvien à paraplégie et incontinence.\n• L'inconfort associé à la maladie discale thoraco-lombaire et lombaire peut être mal interprété comme preuve de douleur intra-abdominale.\n• Parésie (faiblesse) : causée par une perturbation de la transmission nerveuse normale entre le cerveau et les nerfs vers les membres. Ataxie (incoordination) et marche sur les phalanges/trébuchement (déficits proprioceptifs conscients).\n• La paralysie peut survenir de façon aiguë ou progresser sur plusieurs jours.\n• OBJECTIF-• Maladie discale cervicale : douleur cervicale/raideur cervicale, boiterie du membre antérieur (signature radiculaire), tétraparésie ou tétraplégie.\n• Maladie discale thoraco-lombaire : douleur focale à la palpation vertébrale, réflexes de motoneurone supérieur (MNS) dans les membres pelviens, vessie de type MNS, perte du réflexe cutané du tronc (panniculus) deux espaces vertébraux caudalement à la lésion, parésie/paraplégie postérieure. Ceci est évalué en pinçant l'orteil, la queue et en observant s'il y a une réponse comportementale comme un tournement du dos ou de la tête.\n• Les altérations de la perception et de la réponse aux stimuli nociceptifs ont une signification localisatrice et pronostique.\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=Fracture/luxation vertébrale ; néoplasie de la moelle épinière, racine nerveuse, épidurale ou vertébrale; embolie fibrocartilagineuse; inflammation de la moelle épinière (myélite); discospondylite (ostéomyélite intradiscale); myélopathie dégénérative; syndrome de malformation occipitale caudale avec syringomyélie\n• PLAN- DIAGNOSTICS=➭ Examen orthopédique pour écarter une maladie musculo-squelettique\n• Examen neurologique-Les constatations sont compatibles avec une lésion focale unique de la moelle épinière (c.-à-d., l'état mental et les réponses des nerfs crâniens sont dans les limites normales).\n• Radiographies- rétrécissement de l'espace discal affecté, du foramen intervertébral ou des facettes articulaires ou matériel calcifié radiodense.\n• Myélographie de contraste\nTHÉRAPEUTIQUE=➭Repos strict en cage pendant 4-6 semaines\n• Traitement avec des relaxants musculaires comme le méthocarbamol\n• Analgésiques ([AINS], opiacés).\nSTÉROÏDES-Prednisone 0,5 mg/kg PO quotidiennement pendant 1-3 jours pour une courte période afin de soulager la douleur\n• Hémilaminectomie (chirurgie de décompression)\nPRONOSTIC=L'indicateur pronostique le plus important pour les chiens paralysés (c.-à-d., aucune fonction motrice volontaire) est la présence ou l'absence de nociception (douleur profonde). Éviter l'obésité et les activités de saut pour les races chondrodystrophiques peut diminuer la tendance à la récidive."}]},{"id":"glaucome","nom":"Glaucome aigu / luxation du cristallin","sys":"Ophtalmologie","urg":true,"resume":"Œil rouge/trouble, buphtalmie, mydriase, cornée œdémateuse, PIO élevée (> 25 mmHg); luxation antérieure du cristallin possible. Mesure du tonomètre.","src":["SAM 2 — glaucome","Cas CPE 2"],"img":[],"sp":{"chien":{"tx":[{"d":"mannitol","r":"1","n":"Bolus IV; recontrôler la PIO"},{"d":"dorzolamide_timolol","r":"1","n":"Cosopt® topique"},{"d":"carprofene","r":"S","n":"Anti-inflammatoire post-opératoire"},{"d":"amox_clav","r":"S","n":"Selon protocole post-opératoire"},{"d":"latanoprost","r":"2","n":"Contre-indiqué en cas de luxation antérieure du cristallin"}],"maj":"Urgence ophtalmique : référer rapidement en ophtalmologie. Latanoprost : contre-indiqué si luxation antérieure (miosis). CPE : cas 2 (labrador, PIO 39 mmHg).","qc":"","al":"Ne pas utiliser les analogues de prostaglandines (latanoprost) en cas de luxation antérieure du cristallin.","gl":[]},"chat":{"tx":[{"d":"mannitol","r":"1","n":""},{"d":"dorzolamide_timolol","r":"1","n":""},{"d":"latanoprost","r":"2","n":"Éviter en cas de luxation du cristallin"}],"maj":"Chat : glaucome souvent secondaire (uvéite, néoplasie); diagnostic étiologique.","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"GLAUCOME\n• Les glaucomes sont un groupe de maladies caractérisées par une déficience visuelle et une cécité dues à des dommages à la rétine et au nerf optique causés par une pression intraoculaire (PIO) augmentée.\n• Les valeurs normales de PIO vont de 15 à 25 mm Hg; >30 mm Hg = glaucome (chien et chat)\n• Les patients avec pupilles dilatées, œdème cornéen, et hyperémie conjonctivale nécessitent une tonométrie pour estimer la PIO.\n• SUBJECTIF-Œil rouge ou trouble transitoire ou constant avec l'un ou tous les éléments suivants :\n• Preuve variable de douleur oculaire (habituellement présente quand la PIO > 40 mm Hg) se manifestant par une réticence à être manipulé autour du visage ou de la tête, ou un blépharospasme\n• Se cogner dans des objets ou d'autres manifestations de déficience visuelle ou de cécité\n• Réflexion verte augmentée de l'œil (c.-à-d., réflexion tapétale d'une pupille dilatée)\n• Augmentation du volume du globe (buphtalmie)\n• OBJECTIF-Changements oculaires unilatéraux ou bilatéraux ; initialement unilatéral avec glaucome primaire : œdème cornéen (typiquement diffus) Hyperémie épisclérale (vaisseaux épiscléraux tortueux) Pupille dilatée et réflexes photomoteurs lents à absents Subluxation/luxation du cristallin possible Dégénérescence variable du nerf optique et de la rétine Striae cornéennes (ruptures de la membrane de Descemet apparaissant comme des lignes blanches dans la cornée ; rare)\n• ÉVALUATION- LISTE DES PROBLÈMES=buphtalmie, mydriase, et les deux cornées sont œdémateuses\nDDx=Œil rouge, conjonctivite, uvéite\n• PLAN- DIAGNOSTICS=Examen ophtalmique complet Tonométrie (la mesure de la PIO)\nTHÉRAPEUTIQUE=1)Myotiques- pilocarpine 2)Inhibiteurs de l'anhydrase carbonique topiques ou systémiques- acétazolamide 3)Prostaglandines- Latanoprost, topique=latanoprost 0,005%\n4)Diurétiques osmotiques-Mannitol, systémique=1-2 g/kg IV sur 20 minutes\n5)Bêta-bloquants, topique =timolol 0,5% ou bétaxolol 0,5%, habituellement q 8h\nPRONOSTIC=Le pronostic est habituellement mauvais SURVEILLER-PIO—surveillée souvent (initialement quotidiennement puis hebdomadairement) et régulièrement après le début du traitement initial ; si un niveau hypotenseur est maintenu pendant plusieurs semaines, réduire lentement le traitement médicamenteux."},{"label":"Cas CPE 2","fields":[{"k":"Cas clinique","t":"Cas 2 – Chapitre 11. • Johnny est un Labrador Retriever de 4 ans (30 kg). Plus tôt ce samedi, le chien jouait gaiement dans la cour arrière avec son propriétaire, mais il a perdu le contrôle et a couru dans le coin de la clôture. Johnny a vocalisé mais s'est rapidement rétabli. Selon le propriétaire, il commençait déjà à faire noir et il n'a pas pu trouver quoi que ce soit d'anormal chez le chien. Trois heures plus tard, le propriétaire a remarqué un changement subtil dans le comportement de Johnny lorsque celui-ci a refusé d'accepter un morceau du rôti qu'il faisait cuire dans la cuisine. Le propriétaire a dit que Johnny pouvait voir et sentir le rôti, mais qu'il n'était tout simplement pas intéressé. Un examen attentif a mené le propriétaire à repérer un gonflement de l'œil droit. Comme le propriétaire a attribué avec justesse le changement oculaire à l'accident de Johnny dans la cour arrière plus tôt cet après-midi, il a rapidement amené le chien à l'hôpital d'urgence local. À la présentation, Johnny était vif, alerte et réactif (VAR) mais anxieux (TPR – 102 °F, 130 bpm, 40 bpm). Outre l'œil droit buphtalmique, les examens physique général et neurologique étaient sans particularité. Le test de Schirmer (STT) était normal. Un examen ophtalmique a également été réalisé. Un œdème cornéen avec une absence de rétention de fluorescéine a été observé dans l'œil droit. La PIO de l'œil atteint était de 39 mmHg. Une iridodonèse et une asymétrie de la profondeur de la chambre antérieure dues au déplacement dorsal du cristallin ont également été observées. Comme la présentation de Johnny est l'une des rares véritables urgences ophtalmiques, le vétérinaire de garde a obtenu la permission de garder Johnny à l'hôpital durant la nuit pour un bilan plus approfondi. Annexe 3— Formulai"},{"k":"Évaluation initiale et prise en charge","t":"Glaucome aigu secondaire à une luxation du cristallin dans la chambre antérieure à la suite d'un événement\ntraumatique\nPlan diagnostique (Dx).\nImmédiatement (valeurs de base) – NFS, hématocrite (HCT), bilan biochimique, analyse d'urine. Puis q6h\npendant les doses répétées de mannitol.\nPIO – 1 h après chaque cycle de mannitol.\nPlan thérapeutique (Rx).\nImmédiatement – solution de mannitol à 15 % (2 g/kg IV en bolus sur 20 minutes avec une micropompe), puis\nmesurer la PIO. Si la PIO demeure supérieure à 25 mmHg, répéter le mannitol 4 heures après la dose initiale.\nImmédiatement – Cosopt topique (dorzolamide/timolol) TID.\nUne fois la PIO stable, planifier la chirurgie pour retirer le cristallin atteint (peut être référé à l'ophtalmologiste de\ngarde).\nCarprofène PO (2,2 mg/kg BID) pendant 5 jours.\nAmoxicilline/acide clavulanique PO (13,75 mg/kg BID) pendant 2 semaines.\nCollerette de protection pendant 7 à 10
