<style>
:root{
  --bg:#f4f6f8;--card:#fff;--ink:#0f172a;--mute:#5b6678;--line:#e2e8f0;--brand:#0f766e;--brand2:#0d9488;--brandsoft:#ccfbf1;
  --warn:#92400e;--warnbg:#fef3c7;--warnline:#f59e0b;--ok:#166534;--okbg:#dcfce7;--hum:#1e40af;--humbg:#dbeafe;--mag:#92400e;--magbg:#ffedd5;
  --bio:#6b21a8;--biobg:#f3e8ff;--grey:#475569;--greybg:#e2e8f0;--red:#b91c1c;--redbg:#fee2e2;
  --head:#0f766e;--sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);--sal:env(safe-area-inset-left,0px);--sar:env(safe-area-inset-right,0px);
}
@media (prefers-color-scheme:dark){
 :root{--head:#0f3b38;--bg:#0b1220;--card:#131c2e;--ink:#e6edf7;--mute:#9aa8bd;--line:#26334a;--brand:#2dd4bf;--brand2:#14b8a6;--brandsoft:#0f3b38;
  --warn:#fcd34d;--warnbg:#3b2a0a;--warnline:#b45309;--ok:#86efac;--okbg:#10331f;--hum:#93c5fd;--humbg:#14274d;--mag:#fdba74;--magbg:#3b2210;
  --bio:#d8b4fe;--biobg:#2a1646;--grey:#cbd5e1;--greybg:#26334a;--red:#fca5a5;--redbg:#3f1515}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
body{padding-bottom:calc(64px + var(--sab));min-height:100vh}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
a{color:var(--brand)}
.top{position:sticky;top:0;z-index:20;background:var(--head);color:#fff;padding:calc(var(--sat) + 10px) calc(var(--sar) + 14px) 10px calc(var(--sal) + 14px)}
.top h1{margin:0 0 8px;font-size:19px;font-weight:700;letter-spacing:.2px;display:flex;justify-content:space-between;align-items:center}
.top h1 .who{display:block;font-size:13px;font-weight:600;opacity:.92;letter-spacing:.3px;margin-top:1px}
.top h1 small{font-weight:500;font-size:12px;opacity:.85}
.seg{display:flex;background:rgba(255,255,255,.18);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;padding:8px 6px;border-radius:8px;font-weight:600;font-size:15px;color:#fff;min-height:40px}
.seg button.on{background:#fff;color:#0f766e;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.search{margin-top:8px;position:relative}
.search input{width:100%;border:0;border-radius:10px;padding:11px 36px 11px 38px;font-size:16px;background:#fff;color:#0f172a;outline:none;-webkit-appearance:none}
.search svg{position:absolute;left:11px;top:11px;width:18px;height:18px;color:#64748b}
.search input::-webkit-search-cancel-button,.search input::-webkit-search-decoration{-webkit-appearance:none;display:none}
.search .clr{position:absolute;right:6px;top:3px;width:36px;height:36px;color:#64748b;font-size:20px;display:none}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px calc(var(--sar) + 14px) 4px calc(var(--sal) + 14px);scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:7px 13px;font-size:14px;font-weight:600;min-height:36px;white-space:nowrap}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
.dark .chip.on{color:#042f2e}
@media (prefers-color-scheme:dark){.chip.on{color:#042f2e}}
.count{padding:6px calc(var(--sar) + 16px) 2px calc(var(--sal) + 16px);color:var(--mute);font-size:13px}
.list{padding:6px calc(var(--sar) + 12px) 12px calc(var(--sal) + 12px)}
.card{display:block;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0;box-shadow:0 1px 2px rgba(15,23,42,.04)}
.card .t{font-weight:700;font-size:16.5px;display:flex;gap:8px;align-items:flex-start;justify-content:space-between}
.card .t span.n{flex:1}
.card .s{color:var(--mute);font-size:13.5px;margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;align-items:center}
.tag{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--greybg);color:var(--grey);white-space:nowrap}
.tag.urg{background:var(--redbg);color:var(--red)}
.tag.sys{background:var(--brandsoft);color:var(--brand)}
.tag.vet{background:var(--okbg);color:var(--ok)}
.tag.hum{background:var(--humbg);color:var(--hum)}
.tag.mag{background:var(--magbg);color:var(--mag)}
.tag.bio{background:var(--biobg);color:var(--bio)}
.tag.ctrl{background:transparent;border:1px solid var(--red);color:var(--red)}
.star{font-size:22px;line-height:1;color:var(--mute);min-width:32px;min-height:32px;text-align:center}
.star.on{color:#f59e0b}
.empty{padding:40px 20px;text-align:center;color:var(--mute)}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:var(--sab)}
.tabbar button{flex:1;padding:8px 2px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--mute);min-height:56px}
.tabbar button svg{width:24px;height:24px}
.tabbar button.on{color:var(--brand)}
.page{display:none}
.page.on{display:block}
/* detail overlay */
#detail{position:fixed;top:0;right:0;bottom:0;left:0;z-index:40;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;display:none;padding-bottom:calc(24px + var(--sab))}
#detail.on{display:block}
.dtop{position:sticky;top:0;z-index:5;background:var(--head);color:#fff;padding:calc(var(--sat) + 8px) calc(var(--sar) + 10px) 10px calc(var(--sal) + 10px)}
.dtop .row{display:flex;align-items:center;gap:6px}
.dtop .back{font-size:16px;font-weight:600;color:#fff;padding:8px 10px 8px 4px;min-height:40px}
.dtop .sp{flex:1}
.iconbtn{color:#fff;min-width:40px;min-height:40px;font-size:22px;text-align:center}
.dtop h2{margin:2px 4px 8px;font-size:20px;line-height:1.25}
.dtop .seg{margin:0 2px}
.sec{background:var(--card);border:1px solid var(--line);border-radius:14px;margin:12px calc(var(--sar) + 12px) 0 calc(var(--sal) + 12px);padding:14px}
.sec h3{margin:0 0 8px;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--brand)}
.sec p{margin:0 0 8px}
.alert{border-left:4px solid var(--warnline);background:var(--warnbg);color:var(--warn);border-radius:10px;padding:10px 12px;margin:8px 0;font-size:15px}
.alert b{display:block;margin-bottom:2px}
.tx{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--bg)}
.tx .h{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.tx .role{font-size:11px;font-weight:800;letter-spacing:.5px;text-transform:uppercase;border-radius:6px;padding:2px 7px;color:#fff;background:var(--brand2);white-space:nowrap}
.tx .role.r1{background:#15803d}.tx .role.r2{background:#2563eb}.tx .role.rS{background:#64748b}.tx .role.rU{background:#dc2626}.tx .role.rP{background:#7c3aed}.tx .role.rD{background:#0891b2}
.tx .dci{font-weight:800;font-size:16.5px;color:var(--ink);text-align:left}
.tx .dci:after{content:" ›";color:var(--mute);font-weight:400}
.tx .cls{color:var(--mute);font-size:13.5px}
.tx .pa{font-size:14px;margin-top:3px}
.tx .pa b{font-weight:700}
.tx .nt{font-size:14px;margin-top:6px;color:var(--ink)}
.brands{margin-top:6px;font-size:14px}
.brands .lbl{font-size:12px;font-weight:700;color:var(--mute);text-transform:uppercase;letter-spacing:.4px;margin-right:4px}
.bn{display:inline-block;background:var(--okbg);color:var(--ok);border-radius:8px;padding:2px 8px;margin:2px 4px 2px 0;font-weight:600;font-size:13.5px}
.bn.h{background:var(--humbg);color:var(--hum)}
.gl{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.gl a{display:inline-block;text-decoration:none;background:var(--brandsoft);color:var(--brand);border-radius:8px;padding:5px 9px;font-size:13.5px;font-weight:600}
.maj{font-size:15.5px}
.qc{margin-top:8px;font-size:15px;padding:8px 10px;border-radius:10px;background:var(--brandsoft)}
figure{margin:10px 0 0}
figure img{width:100%;height:auto;border-radius:10px;border:1px solid var(--line);display:block}
figcaption{font-size:12.5px;color:var(--mute);margin-top:4px}
details.notes{margin:0}
details.notes>summary{cursor:pointer;font-weight:700;list-style:none;padding:2px 0;min-height:32px;display:flex;justify-content:space-between;align-items:center}
details.notes>summary::-webkit-details-marker{display:none}
details.notes>summary:after{content:"▾";color:var(--mute)}
details.notes[open]>summary:after{content:"▴"}
.blk{border-top:1px dashed var(--line);margin-top:10px;padding-top:8px}
.blk .bl{font-weight:700;font-size:14px;margin-bottom:4px}
.fld{margin:6px 0}
.fld .k{font-size:12px;font-weight:800;color:var(--mute);text-transform:uppercase;letter-spacing:.4px}
.fld .v{white-space:pre-wrap;font-size:14.5px;word-break:break-word}
.raw{white-space:pre-wrap;font-size:14.5px;word-break:break-word}
.src{font-size:12.5px;color:var(--mute);margin:14px calc(var(--sar) + 16px) 0 calc(var(--sal) + 16px)}
.share{display:flex;gap:8px;margin:12px calc(var(--sar) + 12px) 0 calc(var(--sal) + 12px)}
.btn{flex:1;background:var(--brand);color:#fff;border-radius:12px;padding:12px;text-align:center;font-weight:700;min-height:46px}
.vbtn{display:flex;align-items:center;gap:10px;width:calc(100% - 24px);margin:10px 12px 0;padding:12px 14px;border-radius:14px;background:var(--brand);color:#fff;font-weight:700;text-align:left;min-height:52px;box-shadow:0 1px 3px rgba(15,23,42,.18)}
.vbtn .ic{font-size:22px}
.vbtn .tx2{flex:1;line-height:1.25}
.vbtn .tx2 small{display:block;font-weight:500;font-size:12.5px;opacity:.92}
.vbtn:after{content:"›";font-size:24px;line-height:1}
#p-vac .sec{scroll-margin-top:125px}
.vsum{cursor:pointer;list-style:none;font-size:13px;letter-spacing:.6px;text-transform:uppercase;color:var(--brand);font-weight:800;display:flex;justify-content:space-between;align-items:center;min-height:32px}
.vsum::-webkit-details-marker{display:none}
.vsum:after{content:"▾";color:var(--mute)}
details[open]>.vsum:after{content:"▴"}
.vbody{margin-top:8px}
.vj{background:var(--brandsoft);color:var(--brand);border-radius:8px;padding:6px 10px;font-size:13.5px;font-weight:600;min-height:34px}
.vl{margin:0;padding-left:18px}
.vl li{margin:5px 0;font-size:15px}
.stp{display:flex;gap:10px;margin:8px 0;align-items:flex-start}
.stp .a{flex:0 0 84px;font-weight:800;font-size:13px;color:var(--brand);background:var(--brandsoft);border-radius:8px;padding:6px 4px;text-align:center}
.stp .b{flex:1;font-size:14.5px}
.vg{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:6px}
.vg th{font-size:10.5px;color:var(--mute);font-weight:700;text-align:center;padding:4px 2px;border-bottom:1px solid var(--line)}
.vg td{padding:8px 2px;text-align:center;border-bottom:1px solid var(--line)}
.vg td.l{text-align:left;font-weight:700;font-size:12.5px;width:30%;padding-right:4px}
.vg td.l i{display:block;font-style:normal;font-size:10.5px;font-weight:700;margin-top:1px}
.vg td.l i.core{color:var(--ok)}
.vg td.l i.non{color:var(--hum)}
.vg .dt{display:inline-block;width:22px;height:22px;line-height:19px;border-radius:50%;font-size:13px;font-weight:800;text-align:center}
.vg .dt.c{background:var(--brand);color:#fff}
.vg .dt.o{border:2px solid var(--brand);color:var(--brand)}
.vg .tt{font-size:10.5px;font-weight:700;color:var(--mute)}
.vnote{font-size:12.5px;color:var(--mute);margin-top:8px}
.vc{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin:8px 0;background:var(--bg)}
.vc .vh{display:flex;justify-content:space-between;gap:8px;align-items:flex-start}
.vc .vn{font-weight:800;font-size:15.5px;flex:1}
.vc .vr{font-size:14px;margin-top:6px}
.vc .vr b{font-size:11.5px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);display:block}
.vcs{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:2px 7px;white-space:nowrap}
.vcs.core{background:var(--okbg);color:var(--ok)}
.vcs.non{background:var(--humbg);color:var(--hum)}
.vcs.nr{background:var(--redbg);color:var(--red)}
.vopt{border-left:4px solid var(--brand);background:var(--brandsoft);border-radius:10px;padding:8px 10px;margin:8px 0;font-size:14.5px}
.vopt b{display:block;margin-bottom:3px}
.vopt .vl li{font-size:14.5px}
.vleg{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--mute);margin-top:8px}
@media (prefers-color-scheme:dark){.vbtn{color:#042f2e}.vg .dt.c{color:#042f2e}}
@media (prefers-color-scheme:dark){.btn{color:#042f2e}}
.btn.alt{background:var(--card);color:var(--ink);border:1px solid var(--line)}
table{border-collapse:collapse;width:100%;font-size:14.5px}
th,td{border:1px solid var(--line);padding:7px 8px;text-align:left;vertical-align:top}
th{background:var(--brandsoft);color:var(--brand)}
.use h4{margin:10px 0 4px;font-size:14px}
.use a{display:block;padding:9px 10px;border:1px solid var(--line);border-radius:10px;margin:5px 0;text-decoration:none;color:var(--ink);background:var(--bg);font-size:15px}
.use a small{color:var(--mute);margin-left:6px}
.pill{display:inline-block;font-size:11px;font-weight:800;border-radius:6px;padding:1px 6px;color:#fff;margin-left:6px;vertical-align:1px}
.hint{color:var(--mute);font-size:13.5px;margin:6px 0}
.ver{font-size:12px;color:var(--mute);text-align:center;margin:18px 12px 0}
</style>
</head>
<body>
<header class="top" id="topbar">

<main>

<script id="data" type="application/json">{"dis":[{"id":"corps_etranger","nom":"Corps étranger gastro-intestinal / occlusion","sys":"Digestif","urg":true,"resume":"Vomissements, anorexie, ptyalisme, dépression; abdomen douloureux. Radiographies (± contraste), échographie, abdominocentèse si péritonite suspectée; chirurgie après stabilisation (fluides, électrolytes, analgésie).","src":["Urgences (obstruction par corps étranger)","SAM 2 — corps étranger linéaire / occlusion"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":"Corriger déshydratation et électrolytes (hypochlorémie, hypokaliémie) avant l'anesthésie"},{"d":"buprenorphine","r":"S","n":"Analgésie opioïde"},{"d":"methadone","r":"S","n":""},{"d":"maropitant","r":"S","n":"Antiémétique après avoir écarté une rupture/perforation"},{"d":"cefazoline","r":"1","n":"Antibioprophylaxie à l'induction; ne pas poursuivre sans signe de péritonite"},{"d":"famotidine","r":"S","n":"Seulement si ulcère/œsophagite suspectés"}],"maj":"Antibioprophylaxie ciblée (dose à l'induction, redosage peropératoire) plutôt qu'antibiothérapie prolongée : voir les lignes directrices ENOVAT 2025 sur la prophylaxie chirurgicale. Les protecteurs gastriques ne sont pas systématiques (ACVIM 2018).","qc":"","al":"","gl":["acvim_gi_protect_2018"]},"chat":{"tx":[{"d":"fluides","r":"U","n":""},{"d":"buprenorphine","r":"S","n":""},{"d":"maropitant","r":"S","n":""},{"d":"cefazoline","r":"1","n":"Antibioprophylaxie à l'induction"},{"d":"mirtazapine","r":"S","n":"Appétit après la chirurgie (Mirataz®)"}],"maj":"Chez le chat, chercher un corps étranger linéaire (fil sous la langue) : vérifier la bouche à l'examen. Même principe d'antibioprophylaxie ciblée.","qc":"Veiller à la gestion de l'opioïde (substance contrôlée) : registre obligatoire.","al":"","gl":["acvim_gi_protect_2018"]}},"notes":[{"label":"Tableau des urgences — Obstruction par corps étranger (p.749)","fields":[{"k":"Signes cliniques / examen physique","t":"Vomissements, anorexie, ptyalisme, dépression, perte de poids (si chronique). Peut-on voir une ficelle sortir de l'anus. EP : déshydratation, regarder sous la langue, intestins douloureux et regroupés"},{"k":"Diagnostic différentiel","t":"obstruction intestinale, comme néoplasie, intussusception, granulome, sténose, adhérences ou volvulus • Iléus"},{"k":"Diagnostic","t":"Hypokaliémie due aux vomissements/anorexie, hypoglycémie associée à la péritonite. Azotémie associée à la déshydratation. L'hyponatrémie peut être plus fréquente chez les chiens avec corps étrangers linéaires que chez ceux avec corps étrangers distincts. Radiographies abdominales : plicature des intestins. Étude au baryum ou Pipps"},{"k":"Traitement (Rx)","t":"LRS +/- KCl, céfazoline 22 mg/kg IV q90 min, chirurgie"},{"k":"Pronostic / prévention","t":"électrolytes, glycémie, PCV/PT, douleur abdominale"},{"k":"Surveillance / examens complémentaires","t":"la mortalité est 50 % plus élevée chez les chiens que chez les chats"}]},{"label":"SAM 2 (notes détaillées)","text":"CORPS ÉTRANGER GASTRO-INTESTINAL (linéaire)/ OCCLUSION G.I.\nSUBJECTIF – Vomissements, anorexie, ptyalisme, dépression, si chronique- (perte de poids),\nJeune animal (chat-fil/ficelle, chien-tissu/tapis).\nOBJECTIF\n• Abdomen douloureux à la palpation abdominale.\n• Chat – le fil peut être visible près de la base de la langue à l'examen général. Donc vérifier la bouche dans ces cas.\n• Déshydratation, dépression\nÉVALUATION :\n• Liste des problèmes – vomissements, déprimé, anorexie\n• DDx – occlusion intestinale- tumeur/néoplasie, invagination intestinale, granulome, MICI, gastrite, péritonite, volvulus, adhérences, trichobézoard, vomissements (aigu), parasites. Insuffisance rénale aiguë, pancréatite, hyperthyroïdie.\nPLAN :\n• DIAGNOSTIC (demander d'abord au sujet du vermifuge)\n• HÉMOGRAMME (NFS/biochimie) – infection (due à la péritonite) leucocytose avec une légère déviation gauche.\nAnomalies électrolytiques (fréquent dans la plupart des occlusions G.I.) Hypochlorémie (en cas d'occlusion gastro-intestinale) Hypokaliémie – vomissements, anorexie Hyponatrémie – observée en cas de corps étranger linéaire, plus que les corps étrangers discrets Hypoglycémie-péritonite (seulement si présente en plus) Azotémie-déshydratation. (Urée, créatinine ↑ avec densité urinaire >1,030 montre une déshydratation. Protéines totales/Hématocrite ↑) (Diminution des valeurs de Na, K = vomissements, diarrhée) (Leucocytose principalement Neutrophilie=sepsis/infection, stress/glucocorticoïdes) (Leucogramme de stress = Neutrophilie, lymphopénie, monocytose). (La cause la plus fréquente d'alcalose métabolique hypochlorémique est le vomissement de liquide gastrique.) (L'alcalose métabolique + hypochlorémie est une constatation constante quel que soit le site de l'occlusion).\n• RADIOGRAPHIE – Plicatures des intestins (forme de goutte), toute tumeur peut également être écartée.\n• Abdominocentèse – pour écarter une péritonite.\n• Échographie, radiographie de contraste si les radiographies ne sont pas concluantes, comme test de confirmation\nTHÉRAPEUTIQUE\n• FLUIDES IV (NaCl 0,9%) – rétablir l'état de déshydratation (le liquide de choix est le NaCl 0,9% ; administrer des cristalloïdes isotoniques à 90 mL/kg (chiens) ou 45–60 mL/kg (chats) sur 1 heure.\nAntibiotiques parentéraux à large spectre— en cas de lésion muqueuse importante ou de sepsis ; ampicilline (20 mg/kg IV PO q8h), fluoroquinolone (enrofloxacine 5–10 mg/kg IV q24h; pour les chats, 10-20 mg/kg pour les chiens\nAugmentin (amoxicilline/acide clavulanique) 22 mg/kg PO 12h pendant 7 jours\n• Céfazoline – 22 mg/kg IV pendant la période périopératoire\n• Douleur – morphine 0,1 mg/kg SC\n• Une fois l'animal stable, passer à la chirurgie.\n• À jeun 6-12 h après entérotomie, 12h après résection\n• Protecteurs gastro-intestinaux anti-H2-Famotidine 0,5-1 mg/kg IV, IM, SC, PO 12-24 h\n• Antiémétiques - au besoin - métoclopramide 0,2-0,4 mg/kg PO, SC, IM 6h-12h\nPronostic – il faut attendre 3-5 jours pour voir s'il n'y a pas de péritonite/déhiscence, alors c'est bon.\nRégime : commencer par une alimentation liquide et introduire progressivement une alimentation molle, puis une fois l'animal complètement rétabli, reprendre l'alimentation normale\nSURVEILLANCE : 6-12 h jusqu'à la sortie=hydratation + hématocrite/protéines totales +électrolytes, température corporelle, glycémie, douleur abdominale (tout signe de déhiscence, péritonite) après la chirurgie\nEn cas de corps étranger œsophagien, il y aura un début aigu de régurgitation, ptyalisme, dysphagie ou haut-le-cœur, dyspnée/fièvre secondaire à une perforation et une pleurite. Les os sont une cause fréquente. Hameçons, peaux brutes, jouets à mâcher etc. les boules de poils sont importantes chez les chats."}]},{"id":"invagination","nom":"Invagination intestinale","sys":"Digestif","urg":false,"resume":"Vomissements, douleur abdominale, masse palpable en saucisse; image « en cible » à l'échographie. Traitement chirurgical après stabilisation.","src":["SAM 2 — invagination intestinale"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":""},{"d":"buprenorphine","r":"S","n":""},{"d":"fenbendazole","r":"S","n":"Rechercher/traiter une cause parasitaire chez le jeune"},{"d":"maropitant","r":"S","n":""},{"d":"cefazoline","r":"1","n":"Péri-opératoire"}],"maj":"Chirurgie (réduction ou résection) si non résolutive; traiter la cause sous-jacente (parasites, entérite, corps étranger).","qc":"","al":"","gl":["acvim_gi_protect_2018"]},"chat":{"tx":[{"d":"fluides","r":"U","n":""},{"d":"buprenorphine","r":"S","n":""},{"d":"maropitant","r":"S","n":""},{"d":"cefazoline","r":"1","n":"Péri-opératoire"}],"maj":"Même approche; penser à un lymphome intestinal chez le chat âgé.","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"INVAGINATION INTESTINALE\nL'intussusceptum est le segment invaginé et l'intussuscipien est le segment externe.\n• SUBJECTIF- Vomissements, diarrhée (avec ou sans Hématochésie/méléna), anorexie, léthargie, perte de poids, douleur abdominale. Détresse respiratoire si invagination gastro-œsophagienne. Les signes peuvent être aigus ou chroniques.\n• OBJECTIF-une masse abdominale palpable en forme de saucisse est caractéristique mais peut être absente. la palpation peut être gênée par la défense/douleur abdominale. Signes de douleur abdominale. Déshydratation, tachycardie (signes plus sévères associés à une occlusion plus proximale) Mauvais état corporel dans les cas chroniques.\n• ÉVALUATION- LISTE DES PROBLÈMES= diarrhée, vomissements, anorexie\nDDx=▪occlusion intestinale par corps étranger, néoplasie, abcès etc.\n• Gastro-entérite.\n• Pancréatite\n• Prolapsus rectal si l'invagination fait saillie à travers l'anus.\n• PLAN-\nDIAGNOSTICS=\n• NFS=peut montrer des signes de leucogramme de stress ou d'anémie. Cela peut aller de normal à leucopénie (surtout en cas de sepsis ou d'infection parvovirale) à leucocytose (soit une réponse au stress, soit chez certains patients septiques).\nChimie sérique= (peut montrer des perturbations électrolytiques dues à la perte par vomissements ou diarrhée.) :\nDéshydratation (↑protéines totales, hématocrite), hypokaliémie, hypochlorémie, hyponatrémie, hypoprotéinémie.\n• Radiographies=effet de masse tubulaire, en forme de saucisse\n• Test de confirmation=1) échographie-anneaux concentriques en coupe transversale. Signe de la cible/cible typique. 2) radiographie de contraste.\nTHÉRAPEUTIQUE= (identique) Fluides IV + Antibiotiques périopératoires (céfazoline 22 mg/kg IV q 2h) Chirurgie -entéroplication. Tirer doucement l'intussusceptum\nPRONOSTIC=bon"}]},{"id":"colite","nom":"Colite (aiguë ou chronique)","sys":"Digestif","urg":false,"resume":"Selles molles à liquides, mucus/sang frais, ténesme, fréquence augmentée. Diagnostic d'exclusion : parasitologie, diète, puis imagerie/endoscopie si chronique.","src":["SAM 2 — colite"],"img":[],"sp":{"chien":{"tx":[{"d":"diete_therapeutique","r":"1","n":"Diète très digestible, riche en fibres fermentescibles"},{"d":"psyllium","r":"S","n":"Fibres"},{"d":"probiotique","r":"S","n":""},{"d":"fenbendazole","r":"S","n":"Déparasitage empirique"},{"d":"metronidazole","r":"2","n":"Seulement si indiqué (voir mise à jour)"},{"d":"prednisolone","r":"2","n":"Colite lymphoplasmocytaire/éosinophilique après exclusion diététique et infectieuse"}],"maj":"Les antibiotiques ne sont pas recommandés d'emblée dans la diarrhée aiguë non compliquée (stewardship; études 2026 sur l'intention de traiter). Pour la forme chronique : séquence diète → traitement ciblé → immunosuppresseur (voir consensus 2026 sur les entéropathies inflammatoires chroniques).","qc":"","al":"","gl":["acvim_cie_chien_2026"]},"chat":{"tx":[{"d":"diete_therapeutique","r":"1","n":""},{"d":"psyllium","r":"S","n":""},{"d":"probiotique","r":"S","n":""},{"d":"fenbendazole","r":"S","n":""},{"d":"prednisolone","r":"2","n":"Colite chronique réfractaire"}],"maj":"Chez le chat, différencier colite, entérite chronique et lymphome de bas grade (consensus ACVIM 2023).","qc":"","al":"","gl":["acvim_lymphome_chat_2023"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"COLITE (aiguë, chronique)\nTrouble courant caractérisé par un début soudain (<72 h en aigu) / (>3 semaines en chronique) d'inflammation colique (diarrhée du gros intestin et efforts de défécation), se manifestant par une diarrhée typiquement légère, de faible volume, contenant du mucus, du sang frais. Signes systémiques généralement absents.\n• SUBJECTIF-diarrhée du gros intestin, caractérisée par ténesme/efforts de défécation, fréquence accrue de défécation avec faible volume fécal, selles muqueuses/mucus fécal accru, sang rouge frais.\n• OBJECTIF-animal généralement bien portant sans signes systémiques (ex- mauvais état général, perte de poids) de la maladie. L'examen rectal ne révèle rien de significatif hormis le caractère des selles. Peut parfois révéler une muqueuse colorectale épaissie et irrégulière.\n• ÉVALUATION- LISTE DES PROBLÈMES=diarrhée\nDDx=parasites (helminthes et protozoaires), Causes alimentaires, ingestion de matière étrangère, aliments avariés. Agents bactériens spécifiques ex- E. coli, clostridium. Néoplasie. Syndrome de l'intestin irritable/MICI, lymphome intestinal (chats)\n• PLAN-\nDIAGNOSTICS= ▪Examen physique-palpation abdominale et toucher rectal avec prélèvement de selles. ▪NFS/Chimie-résultats habituellement normaux ; neutrophilie avec déviation gauche possible en cas de causes inflammatoires sévères ; éosinophilie secondaire à une colite éosinophilique, un parasitisme, une histoplasmose et une pythiose/phycomycose. Une anémie légère microcytaire hypochrome peut survenir secondairement à un saignement intestinal chronique et une carence en fer.\n• Examen fécal à la recherche de nématodes ou de parasites protozoaires. Une flottaison fécale et un frottis fécal direct doivent être réalisés. La flottaison au sulfate de zinc peut être requise pour le Giardia. ▪Radiographies abdominales- sans particularité, pour écarter un corps étranger ▪Évaluation cytologique rectale à la recherche de tout signe d'agents pathogènes bactériens comme Clostridium. ▪PCR pour l'infection à Tritrichomonas foetus. ▪Tests avancés-coloscopie avec biopsies muqueuses multiples. Échographie abdominale—peut révéler des masses, un épaississement diffus ou une architecture colique altérée, ou des ganglions lymphatiques associés augmentés de volume.\n(Neutrophilie=inflammation septique, inflammation non septique, glucocorticoïdes) (Éosinophilie=parasites, maladie allergique, néoplasie mastocytaire)\nTHÉRAPEUTIQUE= (La prise en charge initiale de la colite aiguë est non spécifique et de soutien. La plupart des cas se résolvent d'eux-mêmes et répondent à un traitement simple.) Traiter pour suspicion de nématodes et de parasites protozoaires avec des anthelminthiques à large spectre l'excrétion d'œufs par les trichures étant intermittente, un vermifuge thérapeutique s'impose (même si l'examen fécal est négatif) et confirmer l'efficacité avec un examen fécal de contrôle.\n• Fenbendazole 50 mg/kg PO q 24 h X 3 jours.\n• Éviter l'utilisation d'antibiotiques sauf en cas de cause bactérienne confirmée de signes gastro-intestinaux. (Utiliser en cas de sepsis ou de lésion muqueuse)\n• Les glucocorticoïdes, associés à une gestion alimentaire et au métronidazole, sont le traitement de choix pour la colite chronique chez le chat.\nLa MICI qui pourrait être une cause de colite chronique (corticostéroïdes comme la prednisolone / budésonide + azathioprine (chien) / chlorambucil (chat) comme immunosuppresseurs + régime hypoallergénique + métronidazole comme antibiotique préféré).\nPRONOSTIC=excellent"}]},{"id":"gastro_enterite","nom":"Gastro-entérite aiguë","sys":"Digestif","urg":false,"resume":"Vomissements ± diarrhée d'apparition aiguë; causes alimentaires, parasitaires ou infectieuses. Évaluer l'hydratation, le statut vaccinal, la présence d'un corps étranger.","src":["SAM 2 — gastrite / gastro-entérite aiguë"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"1","n":""},{"d":"maropitant","r":"1","n":""},{"d":"ondansetron","r":"2","n":""},{"d":"metoclopramide","r":"2","n":"Forme injectable seulement commercialisée au Canada"},{"d":"famotidine","r":"S","n":"Pas systématique"},{"d":"probiotique","r":"S","n":""},{"d":"diete_therapeutique","r":"S","n":"Alimentation précoce, très digestible"}],"maj":"Éviter l'antibiothérapie dans la gastro-entérite aiguë non compliquée; l'acidité gastrique n'a pas besoin d'être réduite sans ulcère/œsophagite (ACVIM 2018).","qc":"","al":"","gl":["acvim_gi_protect_2018"]},"chat":{"tx":[{"d":"fluides","r":"1","n":""},{"d":"maropitant","r":"1","n":""},{"d":"ondansetron","r":"2","n":""},{"d":"mirtazapine","r":"S","n":"Stimulant de l'appétit (Mirataz®)"},{"d":"capromorelin","r":"S","n":"Elura®"}],"maj":"Chez le chat, l'anorexie prolongée mène à la lipidose hépatique : nutrition précoce et stimulant de l'appétit.","qc":"","al":"","gl":["acvim_gi_protect_2018"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"GASTRITE/GASTRO-ENTÉRITE (aiguë)\nTrouble très courant avec début soudain de vomissements et/ou diarrhée, anorexie et signes d'inconfort abdominal. Généralement spontanément résolutif mais des soins de soutien sont nécessaires. Les facteurs de risque peuvent être une mauvaise surveillance, l'accès aux poubelles, des comportements alimentaires indiscriminés etc.\n• SUBJECTIF-début soudain de vomissements/diarrhée. Vomissements=nourriture ou matière étrangère. La diarrhée peut s'accompagner de mucus, d'urgence et de ténesme. Anorexie, léthargie, léger inconfort abdominal peuvent être notés Le propriétaire peut signaler un écart alimentaire récent. La fréquence varie de quotidienne à toutes les quelques semaines et augmente à mesure que la gastrite progresse. Les vomissements peuvent être stimulés par le fait de manger ou de boire\n• OBJECTIF-déshydratation possible dans les cas sévères Léger inconfort abdominal non localisé peut être noté Selles muqueuses peuvent être notées à l'examen rectal. Paramètres vitaux normaux (température, fréquence cardiaque, tension artérielle etc.) dans la plupart des cas.\n• ÉVALUATION- LISTE DES PROBLÈMES=vomissements, diarrhée, anorexie\nDDx=infection (parasitaire, bactérienne, virale, protozoaire) Occlusion G.I. Ingestion de toxine Maladies systémiques comme maladie rénale, pancréatite\n• PLAN-\nDIAGNOSTICS=➣NFS/chimie sérique-leucogramme de stress attendu, érythrocytose peut être notée en cas de déshydratation Hypokaliémie fréquente, azotémie légère en cas de déshydratation ↑hématocrite/protéines totales, acidose métabolique.\n• Évaluation fécale-aucun pathogène noté.\n• Radiographies abdominales-sans particularité, mais peuvent montrer une paroi gastrique épaissie\n• ELISA fécal pour Parvo, antigène fécal pour Giardia, immunoréactivité de la lipase pancréatique pour la pancréatite =négatif.\nTHÉRAPEUTIQUE= fournir un traitement de soutien jusqu'au rétablissement de la fonction G.I. normale.\n• Fluides IV\n• Antiémétiques après avoir écarté une occlusion. Métoclopramide 0,2-0,4 mg/kg SC ou PO 6-8 h\n• Médicaments réducteurs d'acide gastrique- Famotidine 0,5 mg/kg PO, IV, SC 12-24 h\nPRONOSTIC=excellent\n(Le vomissement est probablement dû à une irritation gastrique directe ou une dysmotilité. La diarrhée est probablement due à une irritation, une dysmotilité, ou une dérégulation des populations microbiennes intestinales normales.)"}]},{"id":"vomissement","nom":"Vomissement aigu","sys":"Digestif","urg":false,"resume":"Expulsion active du contenu gastrique. Distinguer vomissement, régurgitation et dysphagie; statut vaccinal (parvovirose, Carré), exposition toxique, corps étranger.","src":["SAM 2 — vomissement aigu"],"img":[],"sp":{"chien":{"tx":[{"d":"maropitant","r":"1","n":"Après avoir écarté une occlusion"},{"d":"ondansetron","r":"2","n":""},{"d":"metoclopramide","r":"2","n":"Injectable seulement au Canada"},{"d":"fluides","r":"S","n":""},{"d":"famotidine","r":"S","n":"Si signes d'œsophagite/ulcère"}],"maj":"Rechercher la cause avant le symptôme : occlusion, pancréatite, maladie rénale/hépatique/endocrinienne (Addison), toxique. Vomissement ≠ régurgitation ≠ dysphagie.","qc":"","al":"","gl":["acvim_gi_protect_2018"]},"chat":{"tx":[{"d":"maropitant","r":"1","n":""},{"d":"ondansetron","r":"2","n":""},{"d":"fluides","r":"S","n":""},{"d":"mirtazapine","r":"S","n":"Appétit/antiémétique d'appoint"}],"maj":"Chez le chat, penser à l'hyperthyroïdie, la MRC, la pancréatite et la lipidose.","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"VOMISSEMENT (aigu)\nExpulsion active du contenu de l'estomac et parfois du duodénum précédé de nausées et de haut-le-cœur, durée inférieure à 7 jours. La cause la plus fréquente est un écart alimentaire, cependant de nombreuses maladies G.I. ou systémiques peuvent aussi causer des vomissements.\n• SUBJECTIF-différencier vomissement, régurgitation, dysphagie ?\n• Statut vaccinal : l'entérite parvovirale et la maladie de Carré plus probables chez les animaux non vaccinés.\n• Administration d'AINS, ou de glucocorticoïdes\n• Possibilité d'ingestion d'un corps étranger\n• Antécédents alimentaires (changements récents, contenu et volume des repas récents etc.)\n• Description du vomi.\n• Relation temporelle du vomissement avec la prise alimentaire.\n• OBJECTIF-examen physique complet pour vérifier l'hydratation, inspection buccale, palpation abdominale, examen rectal.\n• ÉVALUATION- LISTE DES PROBLÈMES=vomissements, déshydratation etc.\nDDx=corps étranger. Parasites\nDilatation-torsion gastrique. Réaction alimentaire indésirable. Gastrite- virale comme parvo/maladie de Carré, bactérienne etc.\n• PLAN-\nDIAGNOSTICS=NFS/chimie Analyse d'urine Examen fécal Radiographies/échographie abdominales\nTHÉRAPEUTIQUE= ➣À jeun pendant 12-24 heures.\n• Fluides IV\n• Antiémétiques\n• Médicaments antisécrétoires comme les anti-H2 (ranitidine, famotidine) ou les inhibiteurs de la pompe à protons oméprazole\n• Protecteurs comme le sucralfate (0,5–1 g/chien PO q8–12h; 0,25-0,50 g/chat PO q8–12h) pour accélérer la cicatrisation de la muqueuse gastrique, en suspension ou comprimé.\n• Fièvre ou lésion muqueuse (hématémèse, méléna) —des antibiotiques peuvent être indiqués (ex., ampicilline, enrofloxacine).\nPRONOSTIC=bon en cas d'écart alimentaire, dépend sinon de l'agent causal\nSURVEILLANCE- déshydratation, fréquence des vomissements, douleur abdominale, électrolytes.\nDIARRHÉE (aiguë)\nUne augmentation de la fréquence de défécation, de la fluidité des selles, et/ou du volume fécal, soudaine et de <2 semaines de durée. Facteurs de risque comme surpeuplement, mauvaise hygiène, immunodépression, écart alimentaire, excrétion d'organismes infectieux etc.\nSYSTÈMES AFFECTÉS : Cardiovasculaire—hypovolémie, tachycardie, muqueuses pâles, TRC prolongé et pouls faibles ; l'hypokaliémie peut causer des arythmies. Endocrinien/Métabolique— anomalies électrolytiques et acido-basiques, déshydratation, et azotémie prérénale. Gastro-intestinal—douleur abdominale, l'hypokaliémie peut entraîner une diminution de la motilité. Musculo-squelettique—l'hypokaliémie peut entraîner une faiblesse musculaire.\n• SUBJECTIF-incontinence fécale ou selles molles. Durée des signes cliniques, évolution. Origine de l'animal, vaccination, vermifuges et antécédents alimentaires, médicaments récents ou épisode de stress. Déterminer si d'autres animaux à la maison sont affectés. Différencier si diarrhée de l'intestin grêle ou du gros intestin ?\n• OBJECTIF-infectieux/intoxications plus probables si déprimé et déshydraté. Muqueuses- rouge brique/injectées- sepsis, GHE Pâleur- hypoperfusion/choc/douleur versus perte de sang G.I. Hydratation- ? Palpation abdominale-signes de douleur Palpation rectale Chats-palper le nodule thyroïdien pour l'hyperthyroïdie. Observer l'animal en train de déféquer (ténesme, dyschésie, caractère des selles)\n• ÉVALUATION- LISTE DES PROBLÈMES=diarrhée, douleur abdominale\nDDx= Alimentaire-nouvelle nourriture, écart alimentaire, allergie alimentaire etc. Infectieux-parasitaire, bactérien, viral Inflammatoire- MICI, GHE. Lymphangiectasie. Néoplasie, toxines/médicaments, Insuffisance pancréatique exocrine. Hyperthyroïdie\n• PLAN-\nDIAGNOSTICS=NFS/biochimie examen fécal Tests avancés- radiographies abdominales, radiographies de contraste, échographie, ELISA\nTHÉRAPEUTIQUE= (Les médicaments antidiarrhéiques peuvent être classés en modificateurs de motilité, agents antisécrétoires, ou protecteurs intestinaux.)\n• Médicaments antidiarrhéiques-kaolin et pectine 12 ml/kg PO 8-12 h. traiter la diarrhée.\n• Salicylate de bismuth (0,1-1 mg/kg PO q 8-12h). L'antiacide aide avec la diarrhée. Non recommandé chez les chats en raison d'une capacité réduite à métaboliser les salicylates\n• Modificateurs de motilité- lopéramide 0,1-0,2 mg/kg PO 8-12 h (augmentant le temps de transit) peut être envisagé seulement en cas de diarrhée réfractaire et si une cause infectieuse a été exclue. Utiliser judicieusement et pas plus de 3 jours. Non recommandé en cas de selles sanglantes.\n• Anthelminthiques (ex., fenbendazole 50 mg/kg PO q24h pendant 5 jours) et antiprotozoaires (ex., métronidazole 10–20 mg/kg PO q12h pendant 5 jours) sont recommandés comme traitement empirique pour les patients avec diarrhée aiguë ou ceux avec des analyses fécales positives.\n• Les antibiotiques ne sont généralement pas nécessaires, mais les patients avec entérite bactérienne, maladie sévère, leucopénie concomitante, ou suspicion de rupture de la barrière muqueuse gastro-intestinale (mise en évidence par du sang dans les selles) doivent être traités avec des agents antimicrobiens.\nPRONOSTIC=dépend de la cause : Alimentaire-bon, spontanément résolutif, bénin. Parasitaire- généralement bon, infectieux/GHE/occlusion/-potentiellement engageant le pronostic vital."}]},{"id":"dtg","nom":"Dilatation-torsion gastrique (DTG)","sys":"Digestif","urg":true,"resume":"Grande race profonde de poitrine : distension abdominale, haut-le-cœur non productifs, ptyalisme, choc. Radiographie : « double bulle », signe de Pope. Choc → décompression (sonde orogastrique/trocardisation) → chirurgie. CPE : cas 3 (dogue allemand).","src":["Urgences (DTE)","SAM 2 — DTG","Cas CPE 3"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":"Choc : cristalloïdes en bolus fractionnés avec réévaluation"},{"d":"hydromorphone","r":"U","n":"Analgésie (substance contrôlée)"},{"d":"fentanyl","r":"U","n":""},{"d":"lidocaine","r":"S","n":"Arythmies ventriculaires"},{"d":"cefazoline","r":"1","n":"Péri-opératoire"},{"d":"famotidine","r":"S","n":""},{"d":"metoclopramide","r":"S","n":"Injectable"},{"d":"cisapride","r":"S","n":"Non commercialisé au Canada (magistral)"}],"maj":"Gastropexie prophylactique recommandée chez les chiens de grande race à risque (techniques laparoscopiques en développement). Étude 2026 : la lésion rénale aiguë est associée à une mortalité plus élevée → surveiller la créatinine et le lactate.","qc":"","al":"Votre fichier cite la ranitidine : elle n'est plus commercialisée (famotidine). Le colloïde (hydroxyéthylamidon) cité doit être nuancé : sécurité remise en question; privilégier les cristalloïdes ± plasma.","gl":["et_dtg_ira_2026"]}},"notes":[{"label":"Tableau des urgences — DTE (dilatation-torsion de l'estomac) (p.788, 793)","fields":[{"k":"Signes cliniques / examen physique","t":"Chien de grande race (dogue allemand) avec distension et douleur abdominales. Ptyalisme, collapsus, tympanisme, pouls faible, tachycardie, MM pâles, ↑ TRC, dyspnée, vomissements non productifs"},{"k":"Diagnostic différentiel","t":"dilatation gastrique (alimentaire), torsion splénique, hernie diaphragmatique"},{"k":"Diagnostic","t":"FSC : ↑ PCV et solides totaux (hypovolémie). Thrombocytopénie, CIVD. Biochimie : acidose métabolique, hypokaliémie, hypoglycémie. Radiographie abdominale : double bulle, signe en C, signe de l'œil de Pope"},{"k":"Traitement (Rx)","t":"Soluté IV à débit de choc (NaCl 0,9 % ou LRS 90 ml/kg/h + colloïdes 10 ml/kg en 20 min. Apport de potassium : 30 mEq par litre de soluté (0,5 mEq/kg/h)), décompression par sonde orogastrique et trocardisation gastrique, O2, KCl, glucose, hydromorphone, famotidine, cisapride, céfoxitine"},{"k":"Pronostic / prévention","t":"Intervention chirurgicale : mortalité < 15 %. Un jour après la chirurgie : alimentation en petits repas. Lactate sérique < 6 mmol/L ~ 99 % de survie. Plus de 6,4 mmol/L : mortalité accrue"},{"k":"Surveillance / examens complémentaires","t":"TPR, TRC, MM, ECG, électrolytes, coagulation, FSC"},{"k":"Commentaires","t":"Ne pas faire reproduire un animal ayant des antécédents de DTE"}]},{"label":"SAM 2 (notes détaillées)","text":"DTG (dilatation-torsion gastrique) : GDV\nBallonnement/torsion gastrique/DTG est la rotation de l'estomac le long de son axe mésentérique, fréquente chez les chiens de grande/géante race.\nSUBJECTIF – grande race, PC – antécédents de distension/douleur abdominale, haut-le-cœur non productif ou vomissements, ptyalisme, collapsus aigu.\nOBJECTIF\n• Distension/tympanisme abdominal - l'auscultation et la percussion simultanées révèlent un son tympanique indiquant la présence d'un estomac tendu, rempli de gaz.\n• Signes de CHOC – muqueuses pâles avec TRC prolongé, pouls faibles=évocateur d'hypovolémie, tachycardie, tachypnée/dyspnée, déshydratation.\n• Splénomégalie.\nÉVALUATION\n• LISTE DES PROBLÈMES - abdomen distendu, haut-le-cœur non productif\n• DDx – torsion splénique, hernie diaphragmatique avec hernie de l'estomac, BALLONNEMENT GASTRIQUE associé à une suralimentation. {« ballonnement alimentaire » est le nom commun pour la dilatation gastrique sans volvulus concomitant. Cela survient couramment chez les chiens qui se gavent de nourriture.} CIVD, toxicité aux raticides. PYOMÈTRE. Autres maladies causant une distension abdominale aiguë et une atteinte circulatoire potentielle incluent péritonite septique, hémoabdomen, volvulus intestinal, ou gastro-entérite aiguë.\nPLAN\n• DIAGNOSTIC ▪BILAN SANGUIN- leucogramme de stress, hémoconcentration, thrombopénie possiblement hématocrite/PROTÉINES TOTALES augmentés en raison d'une hypovolémie, hypokaliémie + hypoglycémie + taux de lactate sérique augmenté observé. (La survie des chiens avec des taux de lactate plasmatique < 6,0 mmol/L était de 99 %, comparée aux 58 % de survie chez les chiens avec des taux de lactate > 6,0 mmol/L.)\nPeut voir une azotémie due à l'hypovolémie (prérénale)\n• BILAN DE COAGULATION-thrombopénie, ↑TP, ↑TCA (cause de CIVD)\n• Radiographies abdominales- double bulle, bras de bonhomme (« Popeye »), compartimentation de l'estomac\n• ECG – pour détecter les ARYTHMIES VENTRICULAIRES.\n• THÉRAPEUTIQUE :\n• FLUIDES IV – cathéter 16-18 G dans les deux veines céphaliques cristalloïdes à un débit de 90 ml/kg (1/3 ou 1/4 d'un bolus de choc en 15-20 min puis réévaluer si la fréquence cardiaque ou l'état mental s'améliore ? Le temps de recoloration capillaire ou la qualité du pouls se sont-ils améliorés. Si une réponse clinique minimale ou nulle n’est observée, cela nécessite des bolus répétés jusqu'à ce qu'une réanimation volumique appropriée ait eu lieu). Les colloïdes peuvent être administrés en association avec les cristalloïdes à 5-20 mL/kg sur 15-30 minutes et une fois l'animal stable, en post-opératoire ajouter du KCl 0,5 mEq/kg/h IV dans la poche en cas d'hypokaliémie. Les choix de réanimation liquidienne doivent être adaptés aux besoins individuels du patient.\nDécompression gastrique – par sonde orogastrique, sédation avec DIAZÉPAM ou en association avec BUTORPHANOL, puis laver l'estomac à l'eau tiède., si impossible utiliser une trocarisation percutanée de façon aseptique avec une aiguille 16G en tondant la zone 4/4. Après stabilisation, procéder à la chirurgie.\n• Endotoxémie -CÉFAZOLINE 20 mg/kg IV, céfazoline sodique (22 mg/kg IV q2h en peropératoire) est suffisant. Administrer des antibiotiques prophylactiques parentéraux.\n• Arythmies ventriculaires – LIDOCAÏNE. Un bolus de lidocaïne à 2% (2–4 mg/kg, lentement IV) peut être administré et répété deux fois sur une période de 30 minutes si nécessaire ; une perfusion IV continue (30–80 mcg/kg/min) peut être indiquée pour contrôler les arythmies.\n• ANTIDOULEUR – Butorphanol\n• UNE FOIS L'ANIMAL STABLE, RÉFÉRER EN CHIRURGIE\n• POST-OPÉRATOIRE supplémentation potassique si hypokaliémique 0,5 mEq/kg/h IV ou 20 mEq/L\n• Traiter les ulcères gastriques avec des anti-H2 comme la famotidine/ranitidine etc.\n• Antiémétique-Métoclopramide 0,2-0,4 mg/kg PO, SC, IM 6 h.\n• Prokinétique-Cisapride 0,1-0,5 mg/kg PO q 8h.\n• PRONOSTIC – taux de réussite de 70 % sans autre complication (nécrose gastrique, CIVD, péritonite, lactate sérique) ↑lactate plasmatique (>6 mmol/l) associé à un risque de nécrose gastrique et nécessitant une résection gastrique partielle. Alors réservé.\n• PROPRIÉTAIRE – donner plusieurs repas par jour (4-5/jour) ■Éviter le stress. ■Éviter l'exercice immédiatement après le repas ■Éviter l'eau au moins 1h après le repas. ■NE PAS FAIRE REPRODUIRE. Faire une gastropexie prophylactique lors de la stérilisation etc."},{"label":"Cas CPE 3","fields":[{"k":"Cas clinique","t":"Cas 3 – Chapitre 1. • Young est un Dogue allemand mâle entier de 6 ans (45 kg). Le propriétaire a amené le chien à l'hôpital d'urgence après 2 jours d'antécédents de haut-le-cœur et de tentatives de vomissement. Young vit à l'intérieur et passe la majeure partie de la journée seul dans un grand salon. Le propriétaire travaille de longs quarts et ne nourrit le chien (nourriture sèche) qu'une fois par jour. Selon le propriétaire, Young n'a pas l'air comme d'habitude, et il ne se souvient pas si le chien a déjà eu des symptômes semblables auparavant. À la présentation, Young était gravement léthargique et déshydraté. Il avait également des muqueuses pâles, un temps de remplissage capillaire prolongé, des pouls faibles et de la tachycardie. L'abdomen paraissait distendu et la palpation a provoqué une réponse douloureuse. D'après les observations, le propriétaire a signé un formulaire de consentement autorisant des soins en hospitalisation pendant au moins 3 jours. "},{"k":"Évaluation initiale et prise en charge","t":"Dogue allemand en choc (distributif) dû à un DVG\nPrise en charge.\nImmédiatement.\nStabiliser le patient\n•\nPlacer deux cathéters IV céphaliques\n•\nPrélever du sang pour la base de données minimale (MDB)\n•\nRéanimation liquidienne (bolus de liquide cristalloïde de 30 mL/kg [maximum 3 doses]; si très instable,\nenvisager 4 mL/kg de solution saline hypertonique avec 10 mL/kg de colloïde synthétique).\n•\nSurveiller la réponse au traitement : fréquence cardiaque (arythmies), fréquence respiratoire, pression\nartérielle, qualité du pouls, couleur des muqueuses, TRC, HCT/PT, débit urinaire\n•\n± Gestion de la douleur aux opioïdes (fentanyl – 0,0005 mg/kg IV en CRI à 0,02 µg/kg/min avec lidocaïne\n(10 µg/kg/min). Ajouter de la kétamine (0,5 mg/kg IV)\n•\nCéfoxitine (20 mg/kg q8h)\nUne fois stable\n- Confirmer le diagnostic par des radiographies abdominales du côté droit\n- Bilan sanguin additionnel (NFS, profil de coagulation, analyse des gaz sanguins, lactate, HCT/PT, bilan\nbiochimique, créatinine et urée)\nSi le diagnostic est confirmé, tenter de passer une sonde gastrique pour décompresser.\nDécompression gastrique (ponction gastrique – trocardisation – cathéter de calibre 14 préféré)\nUne fois décomprimé et stable, envoyer en chirurgie pour une gastropexie d'urgence"},{"k":"Ordonnance (Rx)","t":"Méloxicam (0,2 mg/kg SID PO) pendant au moins 5 jours."}]}]},{"id":"parvovirose","nom":"Parvovirose canine","sys":"Digestif","urg":true,"resume":"Chiots < 8 mois ou adultes non vaccinés : anorexie, léthargie, vomissements, diarrhée hémorragique, leucopénie. Test ELISA fécal (SNAP). Soins de soutien intensifs, isolement.","src":["Urgences (entérite parvovirale)","SAM 2 — parvovirose"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":"Cristalloïdes + glucose et potassium"},{"d":"maropitant","r":"1","n":"Durée habituelle ≤ 5 jours (voir monographie)"},{"d":"ondansetron","r":"2","n":""},{"d":"ampicilline","r":"1","n":"Antibiothérapie parentérale si neutropénie/sepsis/translocation (produit humain)"},{"d":"amox_clav","r":"2","n":"Si la voie orale est possible (Clavamox®, Clavaseptin®)"},{"d":"buprenorphine","r":"S","n":""},{"d":"colloides","r":"S","n":"Plasma si albumine basse"},{"d":"anticorps_parvo","r":"2","n":"Immunothérapie : statut canadien à vérifier"},{"d":"vaccin","r":"P","n":"Vaccin essentiel (core)"}],"maj":"Les fluides IV et la nutrition entérale précoce restent les piliers (mise à jour 2026). Un anticorps monoclonal anti-parvovirus (CPMA) a raccourci l'hospitalisation (médiane 2 vs 4 jours) et le délai de levée de l'isolement (5 vs 6,5 jours) dans une étude rétrospective de refuge (2026), sans différence significative de mortalité (17 % vs 22 %); une réaction anaphylactique rapportée; disponibilité canadienne à confirmer. Survie > 90 % avec traitement (revue 2026).","qc":"Au Québec comme ailleurs : isoler, désinfecter à l'eau de Javel diluée, vaccination essentielle (AAHA 2022; WSAVA 2024).","al":"Le métronidazole systématique est controversé (pas de bénéfice démontré en l'absence de signes spécifiques).","gl":["rev_parvo_2026","et_cpma_2026","aaha_vacc_2022","wsava_vacc_2024"]}},"notes":[{"label":"Tableau des urgences — Entérite parvovirale (chiens) (p.1499 Z12)","fields":[{"k":"Signes cliniques / examen physique","t":"Chiots < 8 mois, adultes non vaccinés. Anorexie, léthargie, vomissements, diarrhée hémorragique"},{"k":"Diagnostic différentiel","t":"gastro-entérite aiguë, maladie de Carré, salmonellose, entérite coronavirale, corps étranger/intussusception"},{"k":"Diagnostic","t":"Test fécal ELISA Parvo SNAP (faux positif après vaccination) (faux négatif si échantillons dilués). Leucopénie/neutropénie, hypoalbuminémie, hypoglycémie, hypokaliémie, azotémie prérénale\nFécal : dépister une helminthiase concomitante"},{"k":"Traitement (Rx)","t":"isoler, LRS IV, glucose dans les solutés (50 mL de dextrose 50 % dans un sac de 1 L = 2,5 %, KCl 30 mEq pour 1 L, amoxy-clav 20 mg/kg IV q12h + métronidazole 15 mg/kg IV lentement q12h, buprénorphine 0,01 mg/kg IV q6h, Cerenia (1 mg/kg pendant 5 jours), plasma (10 ml/kg à un débit de 3 ml/minute) si albumine < 1,5 g/dl, sang si PCV < 20 %, alimentation après 4 h."},{"k":"Pronostic / prévention","t":"bon avec traitement"},{"k":"Surveillance / examens complémentaires","t":"PCV/PT, FSC, électrolytes, glycémie, PA, palper la vessie pour détecter l'urine, TRC"},{"k":"Commentaires","t":"Une vaccination adéquate est nécessaire. Le parvovirus persiste dans l'environnement 7 mois ; une désinfection à l'eau de Javel est donc requise"}]},{"label":"SAM 2 (notes détaillées)","text":"PARVOVIROSE\nL'infection à CPV-2 est une maladie systémique aiguë caractérisée par des vomissements et une entérite hémorragique chez les chiots et les adultes non vaccinés. C'est une infection virale qui détruit les cellules des cryptes de l'épithélium villeux de l'intestin grêle, associée à une déplétion lymphocytaire et une neutropénie, menant à une entérite sévère, anorexie, vomissements, diarrhée hémorragique, choc.\n• SUBJECTIF-début aigu de léthargie (souvent 1er signe) anorexie, +vomissements (initialement teintés de bile) et diarrhée évoluant vers hémorragique+ hypovolémie. + choc septique.\n• OBJECTIF-si cas léger, examen physique sans particularité. Les chiots modérément à sévèrement atteints sont typiquement léthargiques, déshydratés (muqueuses buccales collantes) avec des anses intestinales remplies de liquide palpables. La palpation peut induire des vomissements ou des haut-le-cœur. Fièvre (sepsis) et tachycardie fréquentes. Déplétion lymphocytaire et neutropénie. Déplétion ou perte de glucose et de potassium.\n• ÉVALUATION- LISTE DES PROBLÈMES= diarrhée.\nDDx=corps étranger/invagination. Maladie de Carré Salmonellose Entérite coronavirale. Gastro-entérite aiguë\n• PLAN- DIAGNOSTICS= ▪NFS- Lymphopénie—caractéristique de l'infection à CPV-2 ; survient couramment entre les jours 4-6 post-infection. Les chiens sévèrement atteints présentent souvent une neutropénie sévère concomitante à l'apparition des lésions intestinales. Leucopénie (neutropénie)- justifie le recours aux antibiotiques.\nChimie- Hypokaliémie, hypoalbuminémie, hypoglycémie.\nAzotémie et enzymes hépatiques élevées fréquentes. ▪Flottaison fécale et préparation fécale humide ▪Radiographies abdominales -pour écarter une occlusion. ▪ELISA pour le parvovirus dans les selles (confirmation).\nTHÉRAPEUTIQUE= (Se référer aux sections sur le traitement et la prise en charge des vomissements aigus, de la diarrhée aiguë et de la gastro-entérite hémorragique.)\n• une supplémentation empirique en potassium des fluides IV (chlorure de potassium 20–40 mEq/L) et en dextrose (2,5%–5%) est appropriée. Les colloïdes peuvent être utilisés à 10-20 mL/kg IV sur 1-4 h en cas de choc ou si l'albumine est basse. Une supplémentation en chlorure de potassium (KCl) est habituellement nécessaire en raison de la perte de potassium dans les vomissements.\n• MÉDICAMENTS DE CHOIX= Antibiotiques G+ et G- + Antiémétiques. Un antibiotique β-lactame (ex., ampicilline ou céfazoline [22 mg/kg, IV, tid]) fournira une couverture appropriée gram-positive et anaérobie. Pour les signes cliniques sévères et/ou une neutropénie marquée, une couverture gram-négative supplémentaire (ex., enrofloxacine [5 mg/kg/jour, IM ou IV] ou gentamicine [6 mg/kg/jour, IV]) est indiquée.\nPRONOSTIC=bon avec un traitement correct. PRÉVENTION=Pour prévenir et contrôler le CPV, la vaccination avec un vaccin vivant modifié est recommandée à 6–8, 10–12, et 14–16 semaines d'âge, suivie d'un rappel administré 1 an plus tard puis tous les 3 ans.\nL'invagination intestinale est considérée comme associée à une motilité intestinale accrue. Surveiller cette complication chez les patients avec diarrhée aiguë, en particulier les jeunes chiens avec entérite parvovirale et parasitisme.\nSURVEILLANCE-Ce qui suit doit être surveillé à l'admission, après 2 heures de fluidothérapie, et ensuite au moins une fois par jour chez les patients encore malades :\n• Glycémie\npoids corporel\n• Hématocrite et protéines totales\n• Potassium sérique"}]},{"id":"panleucopenie","nom":"Panleucopénie féline (parvovirus félin)","sys":"Digestif","urg":true,"resume":"Chatons non vaccinés : dépression, vomissements, diarrhée, fièvre/hypothermie, leucopénie marquée. Soins de soutien intensifs.","src":["Urgences (panleucopénie)","SAM 2 — panleucopénie"],"img":[],"sp":{"chat":{"tx":[{"d":"fluides","r":"U","n":"Cristalloïdes ± colloïdes; correction du potassium/glucose"},{"d":"maropitant","r":"1","n":""},{"d":"ampicilline","r":"1","n":"Antibiothérapie parentérale à large spectre (vos notes : association avec sulbactam; produit humain)"},{"d":"amox_clav","r":"2","n":"Si la voie orale est possible"},{"d":"colloides","r":"S","n":"Plasma/sang si hypoprotéinémie"},{"d":"vaccin","r":"P","n":"Vaccin essentiel (core)"}],"maj":"Prévention par vaccination (chaton dès 6–8 semaines; core). Pronostic réservé (court terme); hypoplasie cérébelleuse chez les chatons infectés in utero.","qc":"Refuges et chatteries : désinfection rigoureuse (virus très résistant).","al":"","gl":["wsava_vacc_2024"]}},"notes":[{"label":"Tableau des urgences — Panleucopénie / Parvovirus félin / Entérite infectieuse féline / Maladie de Carré féline (p.1667)","fields":[{"k":"Signes cliniques / examen physique","t":"chatons non vaccinés/statut vaccinal inconnu, déshydratation/dépression, ↓↑T, vomissements/diarrhée, convulsions possibles, mort possible en 12 h, anses intestinales épaissies"},{"k":"Diagnostic différentiel","t":"FeLV, néoplasie, hypoglycémie, corps étranger"},{"k":"Diagnostic","t":"FSC : leucopénie profonde, thrombocytopénie (↓ pronostic), anémie en cas d'hémorragie GI, ↓ albumine, test parvovirus canin"},{"k":"Traitement (Rx)","t":"Soluté IV pour déshydratation + entretien (cristalloïdes + colloïdes), sang si PT < 4 g/dl, complexe vitamine B, ampicilline + sulbactam 25 mg/kg IV/SC q6h, Cerenia 1 mg/kg SC q24h si > 4 mois"},{"k":"Pronostic / prévention","t":"passable à bon, selon le degré de neutropénie, présence de thrombocytopénie. Vaccin"},{"k":"Surveillance / examens complémentaires","t":"CIVD, FSC, jusqu'à résolution des cytopénies,"},{"k":"Commentaires","t":"Vaccin vivant modifié préféré. Désinfection de l'environnement à l'eau de Javel. Attention, l'infection peut se propager"}]},{"label":"SAM 2 (notes détaillées)","text":"PANLEUCOPÉNIE\nInfection parvovirale hautement contagieuse des chats provoquant typiquement une gastro-entérite aiguë sévère, parfois fatale, et une leucopénie\n• SUBJECTIF-\nAntécédent d'exposition récente (ex., refuge d'adoption). Chaton nouvellement acquis. Chaton de 2–4 mois provenant d'un établissement avec antécédent de PF. Aucun antécédent vaccinal ou dernière vaccination lorsque < 16 semaines d'âge.\n• Entérite classique, début aigu : -Mort subite, « syndrome du chaton dépérissant », vomissements, anorexie, et/ou diarrhée. Léthargie ou dépression extrême, se cache\n• Infection in utero- Mise bas de fœtus momifiés OU\nSignes cérébelleux ; ataxie, tremblements d'intention, position large notée une fois que les chatons commencent à marcher (10-14 jours). Moins couramment, altération de l'état mental et léthargie (habituellement non notée avant plusieurs semaines) ou convulsions\n• OBJECTIF-\n• Entérite classique- le chaton est infecté par le FPV :\n• Fièvre ou hypothermie dans les cas sévères. Déshydratation marquée ou choc hypovolémique\n• Vomissements, diarrhée, anses intestinales épaissies, inconfort abdominal\n• Forme SNC- la mère a été infectée par le virus de la panleucopénie pendant la gestation : - Hypoplasie Cérébelleuse avec ataxie cérébelleuse et dysplasie rétinienne, hypermétrie, tremblements d'intention, position large, hypoplasie du nerf optique, foyers sombres/plissement/striation de la rétine, léthargie mentale, anomalies comportementales\n• ÉVALUATION- LISTE DES PROBLÈMES=Vomissements, diarrhée\nDDx=Gastro-entérite : corps étranger\nAutres infections bactériennes ou virales (coronavirus, Salmonella spp., Clostridium spp.)\n• Maladie inflammatoire de l'intestin. Néoplasie. Ingestion de toxine. Leucopénie : -virus de la leucose féline (FeLV) Salmonellose\n• PLAN- DIAGNOSTICS=➣NFS : anémie légère sauf saignement gastro-intestinal (GI) sévère ;\nLeucopénie (, le nombre de leucocytes est habituellement entre 500 et 3000 cellules/dL pendant la maladie aiguë) surtout la neutropénie, est typique, mais un leucogramme normal n'exclut pas le FPV ;\nThrombopénie due à une suppression médullaire ou une coagulation intravasculaire disséminée (CIVD). Bilan biochimique sérique : souvent sans particularité ; azotémie prérénale, augmentations de l'alanine aminotransférase/aspartate aminotransférase/bilirubine possibles. Bilan de coagulation : peut montrer des signes de CIVD.\n• Isolement viral à partir des selles/ELISA\n• Radiographies : Typiquement sans particularité, pour écarter une occlusion.\nTHÉRAPEUTIQUE=➣ cristalloïdes/colloïdes IV pour corriger le choc, la déshydratation, et les anomalies électrolytiques\n• Antibiotiques à large spectre (ex., ampicilline +/- sulbactam 22-30 mg/kg IV q 8h) pour combattre les infections bactériennes secondaires\n• Suppression de la nourriture/eau pendant l'épisode aigu pour diminuer la division des cellules des cryptes et la réplication virale subséquente\n• Antiémétiques (maropitant 1 mg/kg SC q 24h, ou métoclopramide 0,2-0,4 mg/kg SC, PO q 8h)\nSurveillance recommandée-Répéter la NFS : leucocytose de rebond (24-48h)\nSi la leucopénie persiste, les cliniciens doivent écarter d'autres causes (ex., FeLV).\nPRONOSTIC=Réservé (court terme) pour la gastro-entérite aiguë et l'hypoplasie cérébelleuse\nLes cliniciens doivent administrer le vaccin après que le chaton ait 8 semaines pour éviter l'inactivation par les anticorps maternels, puis approximativement 3 et 6 semaines après la première vaccination."}]},{"id":"gastroenterite_hemorragique","nom":"Gastro-entérite hémorragique (SDHA)","sys":"Digestif","urg":true,"resume":"Début aigu de vomissements et de diarrhée sanglante (« confiture de framboises »), hémoconcentration (HCT très élevé), petites races. Exclure parvovirose, corps étranger, Addison.","src":["Urgences (diarrhée hémorragique, gastro-entérite hémorragique)","SAM 2 — entérite hémorragique"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":"Réanimation liquidienne agressive (petites races)"},{"d":"maropitant","r":"1","n":""},{"d":"famotidine","r":"S","n":""},{"d":"sucralfate","r":"S","n":"Après l'arrêt des vomissements"},{"d":"amox_clav","r":"2","n":"Seulement si signes de sepsis/neutropénie"},{"d":"probiotique","r":"S","n":""},{"d":"diete_therapeutique","r":"S","n":"Diète facilement digestible"}],"maj":"Les antibiotiques ne sont pas systématiques dans la diarrhée hémorragique aiguë (stewardship); réserver aux signes de sepsis ou de neutropénie.","qc":"","al":"L'hydroxyéthylamidon (hétamidon) cité dans vos notes : usage à nuancer; préférer cristalloïdes ± plasma.","gl":["acvim_gi_protect_2018"]}},"notes":[{"label":"Tableau des urgences — Diarrhée hémorragique (p.899)","fields":[{"k":"Signes cliniques / examen physique","t":"Apparition aiguë de vomissements (bruns). Apparition aiguë de diarrhée sanglante. Diarrhée aqueuse noire"},{"k":"Diagnostic différentiel","t":"Gastro-entérite infectieuse : virale (parvovirus) ou bactérienne (Salmonella, Clostridium perfringens, C. difficile), écart alimentaire, toxicité, hypoadrénocorticisme, intussusception, perforation GI, péritonite, pancréatite nécrosante, coagulopathie"},{"k":"Diagnostic","t":"FSC : PCV > 65 %, leucogramme de stress, thrombocytopénie légère. Biochimie : BUN, ALT, hypokaliémie et panhypoprotéinémie également fréquentes ; acidose métabolique possible. Analyse d'urine, coag/profil, flottation fécale/ELISA, PLI, radiographies abdominales, cortisol sérique."},{"k":"Traitement (Rx)","t":"Hétamidon 5 mL/kg en 20 minutes, bolus de LRS 60 ml/kg, LRS entretien + déshydratation +/- KCl, Unasyn 50 mg/kg IV q 8h, Cerenia, famotidine, sucralfate lorsque les vomissements ont cessé. Diètes facilement digestibles : riz, fromage cottage et poulet, Hill's a/d"},{"k":"Pronostic / prévention","t":"bon"},{"k":"Surveillance / examens complémentaires","t":"qualité du pouls, PA, vomissements/diarrhée q2h, PCV et PT q4h, glycémie, BUN, électrolytes, pression oncotique colloïdale (POC) q6h,"}]},{"label":"Tableau des urgences — Gastro-entérite hémorragique (VIN)","fields":[{"k":"Signes cliniques / examen physique","t":"Petite race. Diarrhée hémorragique aiguë. Les signes cliniques apparaissent soudainement en quelques heures. Vomissements, diarrhée, hématémèse, hématochézie, méléna, douleur abdominale, léthargie, déshydratation, anorexie et fièvre peuvent tous survenir. Comme les signes sont habituellement suraigus et sévères, une hypovolémie et un choc peuvent se développer rapidement. Certains patients en choc peuvent présenter des MM hyperhémiques, tachycardie, tachypnée, extrémités froides, collapsus, TRC lent et hypothermie"},{"k":"Diagnostic différentiel","t":"Rodenticides anticoagulants\nEntérite bactérienne\nParvovirus canin\nCampylobactériose\nSalmonellose\nToxines d'Escherichia coli \nCoagulopathies\nHistoplasmose GI\nObstruction intestinale\nNéoplasie intestinale\nAutres causes d'hypovolémie\nPancréatite"},{"k":"Diagnostic","t":"Anémie + polycythémie + hémoconcentration. Hypoprotéinémie. Biopsie intestinale"},{"k":"Traitement (Rx)","t":"Fluidothérapie agressive + antibiotiques + Cerenia + transfusion sanguine"},{"k":"Pronostic / prévention","t":"Bon"},{"k":"Surveillance / examens complémentaires","t":"Signes vitaux + électrolytes + FSC"},{"k":"Commentaires","t":"Le traitement avec des antidiarrhéiques (p. ex. lopéramide, Pepto-Bismol) n'est pas recommandé"}]},{"label":"SAM 2 (notes détaillées)","text":"ENTÉRITE HÉMORRAGIQUE\nHématémèse aiguë et abondante et diarrhée hémorragique accompagnée d'hypovolémie ; peut évoluer vers un collapsus circulatoire. peut survenir chez toute race ; les chiens de race toy et petite race peuvent être prédisposés.\nANAMNÈSE, MOTIF DE CONSULTATION\n• Anorexie et léthargie possibles initialement.\n• Début aigu de vomissements ; ceux-ci peuvent être abondants et contiennent souvent du sang frais.\n• Début aigu de diarrhée ; elle peut être brune initialement mais devient rapidement franchement sanglante ; la consistance varie d'aqueuse à gélatineuse.\nRÉSULTATS DE L'EXAMEN PHYSIQUE\n• Déprimé mais afébrile\n• Marqueurs de perfusion : fréquence cardiaque, qualité du pouls, couleur des gencives, temps de recoloration capillaire (TRC) initialement normaux. À mesure que du liquide est perdu dans le tractus gastro-intestinal (GI), des signes d'hypovolémie se développent rapidement, caractérisés par pâleur, TRC ralenti, et tachycardie. La palpation abdominale révèle des anses intestinales remplies de liquide avec un inconfort non localisé.\nDiagnostic différentiel\n• Gastro-entérite infectieuse : virale (parvovirus) ou bactérienne (Salmonella, Clostridium perfringens, C. difficile)\n• Écart alimentaire, toxicité\n• Hypoadrénocorticisme\n• Volvulus intestinal, occlusion partielle ou invagination\n• Autres causes de choc hypovolémique ou endotoxique, comme perforation intestinale, péritonite\n• Pancréatite nécrosante\n• Coagulopathie\n• Bilan initial\n• L'hématocrite est classiquement élevé, souvent > 65 % ; les protéines totales sont basses ou à la limite normale. (Le signe diagnostique caractéristique de la GHE est un hématocrite nettement élevé avec des protéines totales normales à légèrement basses.)\n• NFS : leucogramme de stress ; des neutrophiles immatures ou un léger changement toxique peuvent être notés ; une thrombopénie modeste est fréquente.\n• Bilan biochimique sérique : une augmentation de l'urée sanguine et de l'activité de l'alanine aminotransférase est attendue ; hypokaliémie et panhypoprotéinémie sont également fréquentes ; l'acidose métabolique peut être sévère.\n• Bilan de coagulation : habituellement normal au début ; peut montrer des anomalies si l'affection évolue vers une coagulation intravasculaire disséminée (CIVD).\nTraitement aigu et chronique- Reconnaître le besoin de soutien colloïdal en plus du remplacement liquidien cristalloïde.\nLes colloïdes (ex., Hetastarch, Vetstarch) doivent être débutés immédiatement chez les patients hypovolémiques.\nAdministrer un bolus de 5 mL/kg sur 20 minutes si le patient est substantiellement hypovolémique, sinon débuter une perfusion à débit continu de 1 mL/kg/h ; la dose quotidienne totale ne doit pas dépasser 20 mL/kg. Les fluides cristalloïdes doivent être administrés simultanément (en même temps) calculer une dose de choc de cristalloïdes (90 mL/kg), et administrer en bolus un tiers de cette quantité sur 20-30 minutes. Continuer les fluides à un débit nécessaire pour remplacer les pertes en cours et répondre aux besoins d'entretien.\nAntibiotiques- Ampicilline (30 mg/kg IV q 8h) et enrofloxacine (10 mg/kg IV lente q 24h)\nAntiémétiques-Métoclopramide (1,1-2,2 mg/kg/24h en perfusion à débit constant IV)\nAntiacides et protecteurs gastriques -Famotidine (0,5 mg/kg IV ou SC q 12-24h)\nKCl 20–40 mEq/L pour prévenir le développement d'une hypokaliémie.\nSupplémentation en dextrose (2,5%–5%) des fluides IV d'entretien.\n-Surveillance recommandée\n• Surveiller les paramètres vitaux (température, fréquence cardiaque, muqueuses, TRC, qualité du pouls, pression artérielle et pertes liquidiennes en cours toutes les 2 heures.\n• L'hématocrite et les protéines totales doivent être vérifiés toutes les 4-6 heures.\n• La glycémie, l'urée et les électrolytes doivent être vérifiés toutes les 6-8 heures initialement. Pronostic-bon\nSans colloïde, environ 80 % d'un fluide cristalloïde perfusé quittera l'espace intravasculaire dans l'heure suivant l'administration. Avec administration concomitante d'un colloïde, le fluide cristalloïde sera retenu dans l'espace vasculaire plus longtemps et aura un effet soutenu sur l'expansion du volume intravasculaire"}]},{"id":"giardia","nom":"Giardiase","sys":"Digestif","urg":false,"resume":"Souvent subclinique; diarrhée aiguë ou intermittente (chiots/chatons, refuges). Diagnostic : test d'antigène (SNAP Giardia), flottation au sulfate de zinc.","src":["SAM1 — Giardia","SAM 2 — agents infectieux (Giardia)"],"img":[],"sp":{"chien":{"tx":[{"d":"fenbendazole","r":"1","n":""},{"d":"metronidazole","r":"2","n":"Moins efficace"}],"maj":"Traiter seulement si signes ou contexte (refuge, immunodéprimé); bains + nettoyage de l'environnement pour limiter les réinfections. Infection potentiellement zoonotique.","qc":"Zoonose : hygiène des mains, ramasser les selles.","al":"","gl":[]},"chat":{"tx":[{"d":"fenbendazole","r":"1","n":""},{"d":"metronidazole","r":"2","n":""}],"maj":"Même approche; examens fécaux de contrôle après traitement.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau SAM1 — Giardia ZOONOTIQUE (p.814)","fields":[{"k":"Signes cliniques / examen physique","t":"habituellement subclinique, diarrhée (aiguë et de courte durée, intermittente, chronique), stéatorrhée, mucus (chat), perte de poids"},{"k":"Diagnostic différentiel","t":"MII, IPE, lymphome GI, intolérance alimentaire, écart alimentaire"},{"k":"Diagnostic","t":"Flottation avec solution de sulfate de zinc, test SNAP, kystes, trophozoïtes ou antigène dans les selles"},{"k":"Traitement (Rx)","t":"Fenbendazole 50 mg/kg PO q 24h 3–5 j. Métronidazole (moins efficace) 25 mg/kg PO q 12–24h pendant 5 j"},{"k":"Pronostic / prévention","t":"bon"},{"k":"Surveillance / examens complémentaires","t":"Tous les animaux infectés doivent être retestés de deux à quatre semaines après la fin du traitement."},{"k":"Commentaires","t":"Comme les kystes de Giardia sont infectieux dès qu'ils sont excrétés dans l'environnement, les selles doivent être retirées rapidement et jetées. Les animaux infectés doivent être baignés régulièrement pour enlever les kystes du pelage."}]},{"label":"SAM 2 (notes détaillées)","text":"AGENTS INFECTIEUX (GIARDIA)\n• SUBJECTIF-infections habituellement subcliniques mais si diarrhée en résulte elle peut être courte, aiguë, intermittente ou chronique. Une stéatorrhée/excès de graisse dans les selles ou une perte de poids peuvent être observées. Un excès de mucus peut être vu chez les chats cliniquement atteints. Fièvre, vomissements, anorexie peuvent survenir mais ne sont pas typiques. Syndrome de malabsorption avec selles molles, pâles, mousseuses, grasses, volumineuses (diarrhée), grasses/muqueuses habituellement avec une odeur rance.\n• OBJECTIF-aucune anomalie spécifique.\n• ÉVALUATION- LISTE DES PROBLÈMES=diarrhée, perte de poids\nDDx= parasites intestinaux\nMICI. Maladie intestinale néoplasique (lymphome). Maladie intestinale infectieuse (virale, bactérienne, fongique). Intolérance alimentaire ou écart alimentaire.\n• PLAN-\nDIAGNOSTICS= NFS/chimie sérique-habituellement normal. Frottis fécal salin direct-détecte les trophozoïtes mobiles viables. + Flottaison fécale centrifuge au sulfate de zinc-détection des kystes. + Test de confirmation- ELISA.\nTest d'immunofluorescence directe pour les kystes de giardia dans les selles.\nTHÉRAPEUTIQUE= (poudre panacur) Fenbendazole 50 mg/kg PO 24 h pendant 3 jours (chien)-5 jours (chat) OU (comprimés Flagyl) Métronidazole 15-25 mg/kg PO 12-24 h pendant 5-7 jours OU Ronidazole\nSUIVI- Répéter les examens fécaux pour confirmer l'efficacité du traitement et détecter une réinfection\nPRONOSTIC=bon."}]},{"id":"trichures","nom":"Trichures (Trichuris vulpis)","sys":"Digestif","urg":false,"resume":"Diarrhée du gros intestin (mucus, sang frais), amaigrissement. Œufs en citron à la flottation; infection parfois indétectable (période prépatente).","src":["SAM 2 — trichures"],"img":[],"sp":{"chien":{"tx":[{"d":"fenbendazole","r":"1","n":""},{"d":"febantel_pyr_prazi","r":"2","n":"Drontal Plus®"},{"d":"milbemycine","r":"P","n":"Interceptor Plus®, Milbemax® (prévention mensuelle)"}],"maj":"Cycle long (œufs très résistants) : répéter le traitement et assainir l'environnement. Penser à Trichuris dans les cas de diarrhée du côlon avec hyponatrémie/hyperkaliémie pseudo-Addison.","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"TRICHURES\n-Les adultes de Trichuris vulpis vivent dans le cæcum et le côlon des chiens où ils s'attachent fermement et s'incrustent dans la muqueuse. Ils ont des œufs à coque épaisse avec des bouchons bipolaires, éliminés dans les selles.\n• SUBJECTIF-Signes cliniques de diarrhée du gros intestin : défécation fréquente, urgente de selles molles ou aqueuses, contenant éventuellement du mucus ou du sang frais (hématochézie). Ténesme, flatulences possibles.\n• Occasionnellement associé à une perte de poids et une entéropathie exsudative\n• OBJECTIF-Communément, les animaux avec des infections légères à trichures ont un examen physique normal. Des signes vagues de douleur/sensibilité abdominale moyenne, souvent caractérisés par un léchage des flancs, ont été associés à une typhlite granulomateuse.\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=Infection à Capillaria spp. (Les œufs semblent similaires, mais Capillaria spp ne cause pas d'entérite)\n• Diarrhée du gros intestin sensible au régime alimentaire\n• Entérotoxicose à Clostridium perfringens\n• Maladie inflammatoire chronique de l'intestin (gros intestin)\n• Colite chronique (ex., colite ulcéreuse histiocytaire)\n• Colite éosinophilique\n• Histoplasmose (gros intestin)\n• Néoplasie (carcinome, lymphome)\n• Hypoadrénocorticisme\n• Entéropathie exsudative\n• Invagination\n• PLAN- DIAGNOSTICS=➣Flottaisons fécales répétées pour identifier les œufs lisses bioperculés brun doré caractéristiques\n• NFS : éosinophilie occasionnelle et anémie légère à modérée Bilan biochimique sérique : hyponatrémie, hyperkaliémie, azotémie, hypoalbuminémie, acidose métabolique occasionnellement vues dans les cas sévères\n• Un test de stimulation à l'ACTH est recommandé pour écarter un hypoadrénocorticisme chez les chiens avec hyponatrémie et hyperkaliémie.\nTHÉRAPEUTIQUE=Traitement anthelminthique :\n• Fenbendazole 50 mg/kg PO q 24h × 3 jours est le traitement préféré.\n• Fébantel 10 mg/kg PO q 24h × 3 jours est une alternative acceptable. Milbémycine oxime 0,5 mg/kg PO q 30 jours chez le chien est un préventif efficace pour la trichuriase chronique récurrente\nSurveillance recommandée Examens fécaux fréquents pour les infections chroniques.\nRépéter l'examen fécal pour les œufs de trichures et/ou retraiter avec un anthelminthique à 3 semaines et à 3 mois après le traitement initial ou une fois par mois pendant 3 mois pour détecter et éliminer les adultes récemment matures.\nPRONOSTIC=Excellent avec un traitement approprié."}]},{"id":"ankylostomes","nom":"Ankylostomes (Ancylostoma)","sys":"Digestif","urg":false,"resume":"Anémie, mélæna, amaigrissement, retard de croissance chez les jeunes. Œufs à la flottation. Zoonose : larva migrans cutanée.","src":["SAM1 — Ankylostomes","SAM 2 — ankylostomes"],"img":[],"sp":{"chien":{"tx":[{"d":"pyrantel","r":"1","n":""},{"d":"fenbendazole","r":"2","n":""},{"d":"milbemycine","r":"P","n":"Prévention mensuelle"},{"d":"selamectine","r":"P","n":""}],"maj":"Zoonose (larva migrans cutanée) : déparasiter les chiots tôt et régulièrement. Moins fréquent en climat froid, mais présent en chenil/refuge.","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"pyrantel","r":"1","n":""},{"d":"emodepside","r":"2","n":"Profender® (chat)"},{"d":"selamectine","r":"P","n":"Revolution®"}],"maj":"Même principe; calendrier de déparasitage des chatons.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau SAM1 — Ankylostomes ZOONOTIQUE larva migrans cutanée (p.983)","fields":[{"k":"Signes cliniques / examen physique","t":"Perte de poids, léthargie, PD, mauvaise croissance (chiots/chatons), méléna, diarrhée, anémie : MM pâles, tachycardie, tachypnée, faiblesse"},{"k":"Diagnostic différentiel","t":"Corps étranger, parvovirose (chiots), FeLV (chatons), ulcération GI, néoplasie GI (animaux âgés), anémie hémolytique, anémie due à des ectoparasites (puces, tiques)"},{"k":"Diagnostic","t":"flottation fécale, vermifugation empirique, anémie régénérative, éosinophilie, thrombocytose. Une analyse fécale négative chez de jeunes animaux anémiques n'exclut pas les ankylostomes"},{"k":"Traitement (Rx)","t":"Fenbendazole 50 mg/kg PO q 24h pendant 3 jours (1–2 traitements), vermifuger jusqu'à l'âge de 6 mois"},{"k":"Pronostic / prévention","t":"excellent"},{"k":"Surveillance / examens complémentaires","t":"Vermifuger aux 2–3 semaines. La résistance à l'infection augmente avec l'âge et l'exposition. Fenbendazole du 40e jour de gestation au 14e jour de lactation"}]},{"label":"SAM 2 (notes détaillées)","text":"ANKYLOSTOMES\n- Nématode, les œufs d'Ancylostoma caninum sont facilement reconnaissables par leur apparence à paroi mince avec 2-8 cellules qui sont éliminés. Les ankylostomes pénètrent à travers la peau chez les jeunes chiots et migrent vers les poumons où ils sont toussés puis avalés et mûrissent dans l'intestin grêle. Là les vers sucent le sang et causent des ulcères saignants entraînant une anémie. Tout chiot qui ne prospère pas/muqueuses pâles doit être testé pour des parasites intestinaux.\n• SUBJECTIF- Perte de poids • Léthargie • Polydipsie\n• Mauvais état corporel/croissance et retard de développement (chiots/chatons), mauvais pelage\n• Méléna/selles goudronneuses\n• Diarrhée\n• Des œufs peuvent être trouvés fortuitement à l'examen fécal.\n• OBJECTIF-• Les muqueuses pâles sont le signe caractéristique, dû à l'activité hématophage des ankylostomes adultes.\n• Mauvais état corporel et pelage\n• Méléna à l'examen rectal\n• Souffle cardiaque dû à l'anémie (systolique, gauche, doux)\n• Tachycardie, tachypnée, faiblesse, ou obtusion si en choc hémorragique\n• Les signes cliniques varient selon le degré de perte sanguine et la chronicité du parasitisme.\n• L'examen physique peut être normal si la charge parasitaire est faible\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=Ingestion de corps étranger\n• Parvovirus canin (chiots)\n• Infection au virus de la leucose féline (chatons)\n• Ulcération gastro-intestinale\n• Néoplasie gastro-intestinale (animaux âgés)\n• Anémie hémolytique\n• Anémie due à des ectoparasites (ex., puces, tiques)\n• PLAN- DIAGNOSTICS=NFS- Anémie habituellement aiguë normochrome, normocytaire, et régénérative ; peut devenir microcytaire, hypochrome en raison d'une carence chronique en fer. Éosinophilie,\nThrombocytose\nBilan biochimique sérique : - Hypoprotéinémie/hypoalbuminémie, hyponatrémie/hypochlorémie chez les animaux polydipsiques.\nFlottaison fécale : les œufs caractéristiques d'ankylostomes sont ellipsoïdaux et contiennent une morula à huit cellules.\nT
