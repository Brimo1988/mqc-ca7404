q24h pendant 7 jours"}]}]},{"id":"raticides","nom":"Intoxication aux raticides anticoagulants","sys":"Toxicologie","urg":true,"resume":"Hémorragie généralisée 3–7 jours après l'ingestion : muqueuses pâles, hématomes, saignements, dyspnée (hémothorax), faiblesse. TP/TCA/PIVKA allongés.","src":["Urgences (raticides)","SAM 2 — raticides anticoagulants"],"img":[],"sp":{"chien":{"tx":[{"d":"vitamine_k1","r":"1","n":"Vitamine K1 par voie orale avec un repas gras (Hemophyt®)"},{"d":"colloides","r":"U","n":"Plasma frais congelé si saignement actif"},{"d":"fluides","r":"U","n":""},{"d":"charbon","r":"S","n":"Décontamination si ingestion récente"}],"maj":"Surveiller le TP/PIVKA à 48–72 h; poursuivre la vitamine K1 jusqu'à normalisation puis recontrôler 48–72 h après l'arrêt. Si pas de coagulopathie, penser à d'autres raticides (brométhaline, cholécalciférol).","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"vitamine_k1","r":"1","n":""},{"d":"colloides","r":"U","n":""},{"d":"fluides","r":"U","n":""}],"maj":"Chat : même démarche; intoxication secondaire par ingestion de rongeurs possible.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau des urgences — Intoxication aux rodenticides (p.173)","fields":[{"k":"Signes cliniques / examen physique","t":"3–7 jours après l'ingestion, hémorragie généralisée, MM pâles, hématomes, anorexie, léthargie, articulations enflées (boiterie), méléna, dyspnée/toux, couleur bleu-vert dans les selles/vomissures, tachycardie, dyspnée, bruits pulmonaires rudes en cas d'hémorragie pulmonaire, épanchement pleural hémorragique, choc hypovolémique brodifacoum, II, VII, IX, X (1972)"},{"k":"Diagnostic différentiel","t":"intoxication au xylitol, maladie hépatique, hémophilie, thrombocytopénie, CIVD"},{"k":"Diagnostic","t":"FSC : anémie régénérative, thrombocytopénie due à la perte sanguine, PCV bas. Coag/profil : PT et APTT, PIVKA (protéines induites par l'absence de vitamine K1) seront prolongés. PT ou PIVKA élevé 3x est diagnostique"},{"k":"Traitement (Rx)","t":"Décontamination si aucun signe : vomissement (apomorphine 0,04 mg/kg IV), charbon, surveiller PT, APTT ou PIVKA au départ, à 48 et 72 h. O2, soluté IV, transfusions de sang, plasma (10 ml/kg à un débit de 3 ml/minute), vitamine K1 5 mg/kg PO une fois par jour pendant 30 jours + diète riche en gras, vérifier le PT 48 h après la dernière dose. Drain thoracique ou thoracocentèse, thermorégulation, antibiotique si infection, repos en cage"},{"k":"Pronostic / prévention","t":"Excellent si présenté avant les signes cliniques, réservé à mauvais en cas de saignement thoracique ou du SNC"},{"k":"Surveillance / examens complémentaires","t":"Signes cliniques, PT, hématocrite"}]},{"label":"SAM 2 (notes détaillées)","text":"TOXICITÉ AUX RATICIDES ANTICOAGULANTS\n• SUBJECTIF=Antécédent ou preuve d'exposition (passage d'appât bleu-vert dans les selles) plusieurs jours avant le début des signes.\n• Souvent il n'y a pas d'antécédent d'exposition.\n• Typiquement, des signes cliniques initiaux vagues surviennent comme première manifestation : léthargie, intolérance à l'effort, anorexie, dyspnée, toux, boiterie, articulations gonflées\n• Une mort subite sans signes cliniques rapportés est possible.\n• OBJECTIF=➭ Muqueuses pâles\n• Tachycardie, dyspnée, bruits pulmonaires rudes:\n• Hémorragie pulmonaire\n• Épanchement pleural hémorragique\n• Hématome des voies aériennes Choc hypovolémique Un bruit physique d'occlusion des voies aériennes supérieures peut suggérer un hématome des voies aériennes ; sinon, les radiographies thoraciques différencient entre épanchement pleural hémorragique et hémorragie pulmonaire.\n• Faiblesse, intolérance à l'effort.\n• Hémorragie fréquemment dans les cavités corporelles comme l'abdomen, l'espace pleural etc. résultant en distension abdominale, détresse respiratoire. Les signes cliniques surviennent fréquemment 3-6 jours après l'ingestion.\n• Masses sous-cutanées (hématomes sous-cutanés ou intradermiques)\n• Suintement ou saignement aux sites de ponction veineuse ou de plaies\n• Boiterie, articulations gonflées\n• Exophtalmie (hémorragie rétrobulbaire)\n• Pétéchies, ecchymoses\n• Saignement franc de la bouche, du rectum (rare).\n• Paralysie ou convulsions si saignement dans le système nerveux central (SNC)\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=Déficiences congénitales en facteurs de coagulation. Thrombopénie/anémie hémolytique à médiation immunitaire.\nDéficience en facteur de coagulation secondaire à une maladie hépatique Coagulopathie intravasculaire disséminée typiquement associée à néoplasie, sepsis, pancréatite, ou maladie concomitante. Les preuves de laboratoire incluent TP, TCA prolongés, produits de dégradation de la fibrine élevés, d-dimères avec thrombopénie. Malabsorption des graisses. Choc hémorragique.\n• PLAN- DIAGNOSTICS=➭ NFS:- Une anémie régénérative peut être présente. Une thrombopénie légère à modérée\npeut survenir due à la perte de sang (50 000-150 000/mL). L'hématocrite peut être bas dû au saignement.\n• Bilan biochimique sérique (aucun changement spécifique attendu)\n• Bilan de coagulation : TP et TCA augmentent, PIVKA (protéines induites par l'absence ou l'antagonisme de la vitamine K1) seront prolongés. (Une valeur de TP ou PIVKA élevée trois fois ou plus par rapport à la normale est en faveur d'une toxicose aux raticides anticoagulants.) (Aucun changement attendu si l'exposition a été observée dans les 24 heures précédentes ; le test est quand même fait pour la valeur de base du TP)\n• Les radiographies peuvent révéler des épanchements thoraciques ou abdominaux. Un rétrécissement trachéal ou une opacité des tissus mous peuvent être présents dus à un hématome des voies aériennes.\nTHÉRAPEUTIQUE= 1)Ingestion récente connue- émèse si ingestion depuis 2-4 heures. Charbon activé PO dans les 8-12h. Vérifier le TP à 36-72 heures pour déterminer si la vitamine K1 est nécessaire ou non. Traiter avec de la vitamine K1 pendant 4 semaines. Vérifier le TP 48-72 heures après la fin du traitement à la vitamine K1 (si le TP ou la PIVKA est encore élevé 48 heures après la dernière dose (16-32 jours post-exposition), reprendre le traitement à la vitamine K1 pendant 1 semaine supplémentaire, puis remesurer le TP ou la PIVKA 48 heures après la dernière dose.)\n2) Ingestion connue ou possible ou récente- effectuer immédiatement un TP Induire l'émèse seulement si le TP est normal. Du charbon activé peut être donné Administrer de la vitamine K1 pendant 4 semaines Vérifier le TP 48-72 heures après la fin du traitement à la vitamine K1 3) Chien se présentant avec hémorragie secondaire à une coagulopathie. Transfusions sanguines pour remplacer la masse de globules rouges perdue si critique Transfusions de plasma pour fournir des facteurs de coagulation immédiatement Vitamine K1 : 2,5 mg/kg PO q 8-12h\nContinuer à administrer de la vitamine K1 pendant 4 semaines et vérifier le TP 48-72h après la fin du traitement.\nSoins de soutien (au besoin) : fluides intraveineux, supplémentation en oxygène, thermorégulation, antibiotiques à large spectre si infection concomitante identifiée, repos en cage.\nSurveillance recommandée signes cliniques, TP, hématocrite\nPRONOSTIC=Excellent si l'animal est présenté avant que les signes cliniques ne se développent. La plupart des animaux répondent\ntrès bien au traitement à la vitamine K1. Pronostic réservé à mauvais si l'animal saigne dans la poitrine ou dans le système nerveux central"}]},{"id":"organophosphores","nom":"Intoxication aux organophosphorés / carbamates","sys":"Toxicologie","urg":true,"resume":"Signes muscariniques (SLUDGE : salivation, larmoiement, urination, défécation, GI, émèse), nicotiniques (fasciculations, faiblesse) et du SNC. Exposition à un insecticide OP ou carbamate.","src":["Urgences (organophosphorés)"],"img":[],"sp":{"chien":{"tx":[{"d":"atropine","r":"1","n":"Signes muscariniques (produit humain)"},{"d":"pralidoxime","r":"2","n":"Signes nicotiniques : non commercialisé au Canada (BDPP)"},{"d":"diazepam","r":"U","n":"Convulsions"},{"d":"fluides","r":"U","n":""},{"d":"charbon","r":"S","n":""}],"maj":"Décontamination cutanée (bain) et digestive. Pralidoxime : non répertorié actuellement au Canada; contacter la pharmacie hospitalière ou un centre antipoison.","qc":"","al":"Pralidoxime (2-PAM) : non commercialisé au Canada selon la BDPP.","gl":[]},"chat":{"tx":[{"d":"atropine","r":"1","n":""},{"d":"diazepam","r":"U","n":""},{"d":"fluides","r":"U","n":""}],"maj":"Chat : très sensible aux anticholinestérasiques (produits antipuces en pyréthrines/perméthrine = autre toxicité).","qc":"","al":"Pralidoxime (2-PAM) : non commercialisé au Canada selon la BDPP.","gl":[]}},"notes":[{"label":"Tableau des urgences — Organophosphorés (p.1422)","fields":[{"k":"Signes cliniques / examen physique","t":"Anamnèse : exposition à un OP ou à un carbamate. Muscariniques : SLUDDE (salivation, larmoiement, urination, défécation, dyspnée, émèse), myosis, bradycardie. Nicotiniques : tremblements musculaires, faiblesse, parésie/paralysie. SNC : hyperactivité, dépression respiratoire, convulsions."},{"k":"Diagnostic différentiel","t":"anatoxine(s) des algues bleu-vert • Signes muscariniques : champignons muscariniques, mycotoxines trémorgènes • Signes nicotiniques : nicotine, pyréthrines/pyréthrinoïdes, caféine, strychnine, fluoroacétate (1080), 4-aminopyridine, métaldéhyde, phosphure de zinc, plomb. SNC : hypoglycémie, hypoCa, EH, maladie vestibulaire"},{"k":"Diagnostic","t":"Biochimie : possible légère augmentation des enzymes hépatiques et pancréatiques avec certains OP. Niveaux d'AChE : sérum, plasma, sang entier : < 50 % de la normale - exposition significative probable, < 25 % de la normale - intoxication. L'activité de l'AChE peut rester diminuée pendant 6–8 semaines"},{"k":"Traitement (Rx)","t":"Soluté IV (90 ml/kg/h), O2, atropine (signes musc.) 0,02 mg/kg. Pralidoxime 20 mg/kg IM q12h (signes nic.), diazépam 1 mg/kg IV en cas de convulsions, décontamination (bain pour éliminer les résidus d'insecticide)"},{"k":"Pronostic / prévention","t":"bon sauf en cas de détresse respiratoire (sécrétions bronchiques excessives, pneumonie par aspiration) ou de convulsions"},{"k":"Surveillance / examens complémentaires","t":"FC, fréquence et effort respiratoires, bruits pulmonaires, signes du SNC"},{"k":"Commentaires","t":"Utiliser les insecticides selon les directives de l'étiquette"}]}]},{"id":"acetaminophene","nom":"Intoxication à l'acétaminophène (Tylenol)","sys":"Toxicologie","urg":true,"resume":"Dépression, vomissements, muqueuses brunâtres (méthémoglobinémie), œdème de la face/pattes (chat). Décontamination < 4 h; NAC (dose de charge puis 70 mg/kg q6h dans vos notes).","src":["Urgences (Tylenol)","SAM 2 — toxicité à l'acétaminophène"],"img":[],"sp":{"chat":{"tx":[{"d":"nac","r":"1","n":"Dose de charge puis doses répétées"},{"d":"same","r":"S","n":""},{"d":"fluides","r":"U","n":""},{"d":"charbon","r":"S","n":"Si ingestion < 4 h"},{"d":"fluides","r":"S","n":""}],"maj":"Le chat est le plus sensible (méthémoglobinémie, hémolyse à corps de Heinz, œdème facial). Éviter le peroxyde d'hydrogène chez le chat (risque de gastrite hémorragique) : ne pas l'utiliser comme émétique.","qc":"","al":"Vos notes indiquent le peroxyde d'hydrogène (2–3 ml PO) : à éviter chez le chat.","gl":[]},"chien":{"tx":[{"d":"nac","r":"1","n":""},{"d":"same","r":"S","n":""},{"d":"fluides","r":"U","n":""},{"d":"charbon","r":"S","n":""}],"maj":"Chien : hépatotoxicité et kératoconjonctivite sèche à doses élevées; NAC + SAMe.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau des urgences — Intoxication au Tylenol (p.62)","fields":[{"k":"Signes cliniques / examen physique","t":"dépression, vomissements, +/- hématurie, déshydratation, douleur abdominale, œdème de la face et des pattes. Les MM peuvent être pâles en raison de l'anémie, ou boueuses, cyanosées ou brunâtres en raison de la méthémoglobinémie"},{"k":"Diagnostic différentiel","t":"nitrites, chlorates, phénol, ail ou oignons, spray de mouffette chez les chiens et chats. fer, aflatoxines, cycas, graines de ricin, algues bleu-vert, métaldéhyde et champignons amanites"},{"k":"Diagnostic","t":"Estimer la méthémoglobine (metHb). Une goutte de sang sur papier filtre blanc est brunâtre si metHb > 15 % (normale < 1 %) ; analyse d'urine : couleur brune avec méthémoglobinurie • Test de Schirmer (réaction idiosyncrasique à l'acétaminophène causant une kératoconjonctivite sèche)"},{"k":"Traitement (Rx)","t":"vomissement (2–3 ml H2O2 PO) et/ou charbon activé si moins de 4 heures, N-acétylcystéine 5 % PO. Dose de charge = 140 mg/kg, répéter à 70 mg/kg q 6h pour 7 à 17 doses, SAMe (20 mg/kg par jour) pendant 2 semaines. Acide ascorbique. Soluté IV (p. ex., si déshydratation/hypovolémie). Larmes artificielles."},{"k":"Pronostic / prévention","t":"Bon avec un traitement précoce < 14 h."},{"k":"Surveillance / examens complémentaires","t":"Hématocrite, enzymes hépatiques, tests de coagulation et bilirubine totale au besoin • Test de Schirmer, au départ et à 48 heures"},{"k":"Commentaires","t":"Avec des antécédents d'œdème de la face et des pattes chez le chat ~ exposition à l'acétaminophène."}]},{"label":"SAM 2 (notes détaillées)","text":"TOXICITÉ À L'ACÉTAMINOPHÈNE-Les chats sont plus sensibles à la toxicose à l'acétaminophène, car ils sont déficients en glucuronyltransférase. La méthémoglobinémie et l'hépatotoxicité caractérisent la toxicose à l'acétaminophène. le médicament est toxique pour le foie et les globules rouges et cause une nécrose hépatique, une méthémoglobinémie, une méthémoglobinurie (analyse d'urine : couleur brune avec méthémoglobinurie), une anémie, une hypoxémie, la mort.\nSelon le stade auquel le chat arrive, le traitement va de la transfusion sanguine, au soutien en oxygène. Induire des vomissements + charbon si ingestion récente.\nLa N-acétylcystéine (NAC) peut réduire l'étendue de la lésion hépatique ou de la méthémoglobinémie. La S-adénosylméthionine (SAMe) a été suggérée comme adjuvant pour gérer une lésion hépatique aiguë ou chronique à 18 mg/kg, PO, pendant 1-3 mois chez le chien et le chat."}]},{"id":"morsure_serpent","nom":"Morsure de serpent (crotalidés)","sys":"Toxicologie","urg":true,"resume":"Paire de marques de crocs avec œdème, douleur, ecchymoses; hypotension, coagulopathie. Surtout chiens vivant à l'extérieur en climat chaud (fin du printemps–été).","src":["Urgences (morsure de serpent)"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":"Bolus puis dose de choc selon l'état"},{"d":"buprenorphine","r":"S","n":"Analgésie"},{"d":"antivenin","r":"1","n":"Antivenin polyvalent des crotalidés : surveiller l'anaphylaxie"},{"d":"colloides","r":"S","n":"Plasma"}],"maj":"Au Québec, aucun serpent venimeux indigène significatif : cas surtout liés au voyage ou à des serpents exotiques; consulter un centre antipoison pour l'accès à l'antivenin.","qc":"Cas rare au Québec; l'antivenin n'est pas répertorié dans la BDPP : accès par des canaux spécialisés.","al":"","gl":[]}},"notes":[{"label":"Tableau des urgences — Morsure de serpent (p.1850)","fields":[{"k":"Signes cliniques / examen physique","t":"Chiens vivant à l'extérieur. Fin du printemps et été. Paire de marques de crocs avec enflure. Lymphœdème hémorragique. Tachycardie. Le venin des crotalidés est vasculotoxique et nécrosant."},{"k":"Diagnostic différentiel","t":"autres attaques ou plaies"},{"k":"Diagnostic","t":"FSC : hémoconcentration, thrombocytopénie. Analyse d'urine : hématurie, hémoglobinurie. Profil de coagulation : CIVD (↑ ACT, PT, PTT, PDF)"},{"k":"Traitement (Rx)","t":"Traiter l'hypotension : bolus de LRS 30 ml/kg en 20 minutes puis dose de choc pendant 1 h, antivenin polyvalent Crotalidae (surveiller les signes vitaux pendant la perfusion pour réaction anaphylactique), buprénorphine 0,01 mg/kg IV q 6–8h, plasma (10 ml/kg à un débit de 3 ml/minute)"},{"k":"Pronostic / prévention","t":"bon avec l'antivenin"},{"k":"Surveillance / examens complémentaires","t":"fréquence et effort respiratoires, PA, ECG, couleur/production d'urine, état mental, PCV, solides totaux, lactate +/− état de coagulation q 6–12 heures"},{"k":"Commentaires","t":"Pendant l'administration de l'antivenin, le patient doit être surveillé constamment pour détecter des signes d'anaphylaxie."}]}]},{"id":"coup_chaleur","nom":"Coup de chaleur","sys":"Toxicologie","urg":true,"resume":"Hyperthermie > 40 °C, halètement, muqueuses hyperhémiques, altération de l'état mental, pétéchies, CIVD, nécrose tubulaire, convulsions. Pas de refroidissement agressif; sonde urinaire; surveiller TPR, MM, TRC, PA, ECG.","src":["Urgences (coup de chaleur)","SAM 2 — coup de chaleur"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":"Cristalloïdes à température ambiante"},{"d":"hydromorphone","r":"S","n":""},{"d":"colloides","r":"S","n":"Plasma si coagulopathie"},{"d":"maropitant","r":"S","n":""},{"d":"famotidine","r":"S","n":""},{"d":"mannitol","r":"2","n":"Si œdème cérébral suspecté"}],"maj":"Refroidissement actif modéré (eau tiède/ventilateur), arrêt vers 39–39,5 °C pour éviter l'hypothermie de rebond. Surveiller coagulation (CIVD), ECG, fonction rénale. Risque accru chez les brachycéphales. Les corticostéroïdes systématiques ne sont pas recommandés.","qc":"Épisodes caniculaires estivaux au Québec : voitures stationnées, chiens brachycéphales.","al":"","gl":["recover_pa_2026"]},"chat":{"tx":[{"d":"fluides","r":"U","n":""},{"d":"hydromorphone","r":"S","n":""},{"d":"maropitant","r":"S","n":""}],"maj":"Chat : plus rare; même démarche prudente de refroidissement.","qc":"","al":"","gl":["recover_pa_2026"]}},"notes":[{"label":"Tableau des urgences — Coup de chaleur (p.869)","fields":[{"k":"Signes cliniques / examen physique","t":"Signalement : halètement excessif ou collapsus, ou animal retrouvé en surchauffe (enfermé dans une voiture ou après un effort). EP : température habituellement > 40 °C (105,8 °F) ; altération de l'état mental, muqueuses hyperhémiques, ↑ effort respiratoire et bruits des voies aériennes supérieures forts, pétéchies"},{"k":"Diagnostic différentiel","t":"fièvre, état de mal épileptique, métaldéhyde, tétanie hypocalcémique, lésions du SNC, hyperthermie maligne (rare)"},{"k":"Diagnostic","t":"Hémoconcentration. Globules rouges nucléés, thrombocytopénie, ↑créatine kinase, ↑ azotémie, ↑ ALT, ↑ PT et APTT"},{"k":"Traitement (Rx)","t":"O2 + intubation. LRS IV tiède (température ambiante). Hydromorphone 0,1 mg/kg IV q4h, plasma (10 ml/kg à un débit de 3 ml/minute), mannitol (20 %, 1 g/kg IV en 20 min), diazépam 1 mg/kg IV q6h, famotidine 1 mg/kg IV q12h, lidocaïne, dexaméthasone"},{"k":"Pronostic / prévention","t":"mauvais : coagulopathie à l'admission, convulsions"},{"k":"Surveillance / examens complémentaires","t":"ECG, CIVD, bilan de coagulation"},{"k":"Commentaires","t":"Pas de refroidissement agressif, poser une sonde urinaire, surveiller TPR, MM, TRC, PA, ECG"}]},{"label":"SAM 2 (notes détaillées)","text":"COUP DE CHALEUR-Hyperthermie : élévation de la température corporelle centrale. Le plus souvent, les animaux se présentent avec un antécédent d'exposition environnementale (dehors par une journée chaude sans accès à l'ombre, laissé dans une voiture) ou une activité physique intense récente comme la chasse, la poursuite, ou des convulsions.\nDiagnostic=NFS : l'hémoconcentration est fréquente et peut être sévère. La présence de globules rouges nucléés survient dans jusqu'à 68% des cas. Une leucocytose neutrophilique est la plus fréquente. Thrombopénique Bilan biochimique sérique : une élévation de la créatine kinase due à des dommages musculaires est la plus fréquente Le temps de prothrombine (TP) et le temps de céphaline activée (TCA) sont fréquemment prolongés chez les patients sévèrement atteints, et ces élévations ont une valeur pronostique négative.\nRx-Fluides IV et bains d'eau fraîche pour diminuer la température tout en évitant une vasoconstriction périphérique excessive. Refroidissement additionnel- lavage de la vessie urinaire ou gastrique avec de l'eau froide Mannitol (solution injectable 20% [200 mg/mL] : 0,5-1 g/kg IV lentement sur 15-20 minutes) si une pression intracrânienne augmentée est suspectée Si des convulsions surviennent : diazépam 0,2-0,5 mg/kg IV\nAntibiotiques à large spectre. Le pronostic associé au coup de chaleur varie largement selon la sévérité clinique à l'admission hospitalière. Éviter d'exposer l'animal à une température ambiante élevée ou à une activité physique prolongée."}]},{"id":"diabete","nom":"Diabète sucré","sys":"Endocrinologie","urg":false,"resume":"PU/PD, polyphagie, perte de poids; cataractes (chien), neuropathie plantigrade (chat). Glycémie élevée persistante + glucosurie. Suivi par courbe/fructosamine/CGM. CPE : cas 18 (chien, ACD).","src":["SAM1 — DM","SAM 2 — diabète sucré","Cas CPE 18"],"img":[],"sp":{"chien":{"tx":[{"d":"insuline_caninsulin","r":"1","n":"Insuline porcine lente (le « Vetsulin » cité dans vos notes est le nom américain; au Canada : Caninsulin®)"},{"d":"insuline_pzi","r":"2","n":"ProZinc® (selon indication/étiquette)"},{"d":"diete_therapeutique","r":"1","n":"Diète riche en fibres, repas à heures fixes"},{"d":"insuline_glargine","r":"2","n":"Hors AMM"}],"maj":"Insuline = seul traitement établi chez le chien (les inhibiteurs du SGLT2 sont réservés au chat). Suivi : fructosamine/courbe de glycémie, ou surveillance continue du glucose (CGM). Traiter les affections concomitantes (Cushing, pancréatite, IU) et stériliser les femelles.","qc":"","al":"","gl":["aaha_diabete_2018"]},"chat":{"tx":[{"d":"insuline_glargine","r":"1","n":"Insuline glargine (Lantus®/Basaglar®/Semglee®) très utilisée (produit humain)"},{"d":"insuline_caninsulin","r":"2","n":"Caninsulin®"},{"d":"insuline_pzi","r":"2","n":"ProZinc®"},{"d":"bexagliflozine","r":"2","n":"Bexacat® (inhibiteur du SGLT2) chez le chat stable, non acidocétosique"},{"d":"velagliflozine","r":"2","n":"Senvelgo®"},{"d":"diete_therapeutique","r":"1","n":"Diète humide faible en glucides"}],"maj":"iCatCare 2025 : plus d'options (insulines variées, médicaments oraux — SGLT2), CGM de plus en plus utilisé; la rémission est possible. Les inhibiteurs du SGLT2 (Bexacat®, Senvelgo®) sont commercialisés au Canada selon la BDPP.","qc":"","al":"Vos notes mentionnent le glipizide (sulfonylurée) : option peu recommandée aujourd'hui (efficacité limitée, toxicité des cellules bêta).","gl":["icatcare_dm_2025","aaha_diabete_2018"]}},"notes":[{"label":"Tableau SAM1 — DM (diabète sucré) (p.559)","fields":[{"k":"Signes cliniques / examen physique","t":"PU/PD, polyphagie, perte de poids, cécité due aux cataractes (chiens), faiblesse des membres postérieurs, position plantigrade (chats)."},{"k":"Diagnostic différentiel","t":"IRC, hyperthyroïdie, Cushing, IPE"},{"k":"Diagnostic","t":"Biochimie : hyperglycémie > 350, hypercholestérolémie, ↑ ALT, ALP, azotémie prérénale si déshydraté. Analyse d'urine : DS > 1,025, glycosurie"},{"k":"Traitement (Rx)","t":"Insuline NPH/lente. Chiens : Vetsulin 0,25 U/kg SC q 12h au départ ; chat : glargine 1 U/CHAT SC q 12h, recontrôle à 7 j. Possibilité d'ajouter une sulfonylurée, glipizide. Diète en conserve ↑ protéines, ↓ glucides (Hill's w/d, m/d)"},{"k":"Pronostic / prévention","t":"bon, plusieurs entrent en rémission"},{"k":"Surveillance / examens complémentaires","t":"Courbe de glycémie sur 12 heures, objectif 100–300 mg/dl, surveiller l'hypoglycémie (sirop Karo)"},{"k":"Commentaires","t":"Diète riche en fibres et faible en gras pour les chiens, riche en protéines et faible en glucides pour les chats."}]},{"label":"SAM 2 (notes détaillées)","text":"DIABÈTE SUCRÉ\n• SUBJECTIF-• Polydipsie, polyurie, polyphagie, et perte de poids chez pratiquement tous les\ndiabétiques\n• Des signes cliniques additionnels peuvent inclure : léthargie, vomissements Mauvais état corporel/maigreur, fonte musculaire et perte de poids Cécité due à une cataracte chez le chien. Manque de comportement de toilettage, pelage négligé et terne (chats) Diminution de la capacité de saut, faiblesse des membres postérieurs, ou développement d'une posture plantigrade (chats) Déshydratation, odeur de cétone dans l'haleine, ictère, tachypnée\n• OBJECTIF-Il n'y a pas de constatations spécifiques à l'examen physique. Le poids corporel varie d'obèse à maigre. La léthargie est variable. Un pelage sec et terne et des squames dues à l'hyperkératose ; hépatomégalie due à la lipidose hépatique ; changements lenticulaires compatibles avec la formation de cataracte (chiens) ; et capacité de saut altérée, faiblesse des membres postérieurs, ataxie, ou posture plantigrade due à une neuropathie périphérique (chats) peuvent être identifiées.\n• ÉVALUATION- LISTE DES PROBLÈMES=PU,PD\nDDx=Hyperthyroïdie\n• PLAN- DIAGNOSTICS=➣NFS-normal ou leucocytose avec neutrophilie mature\nChimie-Hyperglycémie, hypercholestérolémie, et ↑ activités de l'alanine aminotransférase\net de la phosphatase alcaline.\n• Analyse d'urine : densité spécifique > 1,025, glycosurie, résultats compatibles avec une\ninfection urinaire bactérienne concomitante. Une culture bactérienne d'urine est recommandée chez tous les patients diabétiques quels que soient les résultats de l'analyse d'urine. Une cétonurie établit un diagnostic de cétose ou d'acidocétose diabétique.\n• Échographie abdominale -peut inclure hépatomégalie, changements suggérant une pancréatite, et adrénomégalie bilatérale ou une masse surrénalienne si un hyperadrénocorticisme concomitant est présent.\nTHÉRAPEUTIQUE=Traitement général aigu=Traitement de l'acidocétose diabétique\nTraitement chronique- Chien=NPH ou lente 0,25 UI/kg SC q 12h initialement, puis\najusté selon besoin. (Humulin N—insuline humaine à action intermédiaire ; 0,75 unités/kg SC q12h dose initiale. Novolin\nN—insuline humaine à action intermédiaire ; 0,75 unités/kg SC q12h dose initiale.)\nChat=Insuline glargine : 0,25 UI/kg de poids corporel idéal\nPour l'entretien chez le chien, régime riche en fibres. Maintenir un exercice quotidien assez constant pour les chiens. Pour les chats, des régimes riches en protéines et pauvres en glucides sont recommandés.\nPRONOSTIC=bon."},{"label":"Cas CPE 18","fields":[{"k":"Cas clinique","t":"Cas 18 – Chapitre 4. • Un Border terrier mâle castré de 11 ans nommé Buddy, pesant 10,4 kg, est présenté avec des antécédents de léthargie, d'anorexie, de vomissements et d'apathie progressive entraînant une réticence à marcher. Ses propriétaires rapportent que Buddy a déjà eu des épisodes de vomissements spontanément résolutifs durant 2 à 3 jours, dont quatre épisodes au cours des 6 derniers mois. Ils ont remarqué que sa consommation d'eau et sa miction avaient augmenté de façon spectaculaire au cours des 2 dernières semaines. Aucune anomalie du pelage ou de la peau n'a été notée, mais Buddy a perdu un peu de poids durant cette période. L'appétit de Buddy jusqu'à il y a 48 heures était excellent. Buddy a vomi, accompagné d'efforts abdominaux, 8 fois au cours des dernières 24 heures et le vomi était un liquide teinté de bile. L'examen physique révèle un chien très déprimé, en surpoids (note d'état corporel 4/5), qui est réticent à marcher. Les yeux sont enfoncés et l'élasticité cutanée normale est perdue. Les muqueuses sont très collantes au toucher mais ont une couleur normale avec un temps de remplissage capillaire de 2,5 s. La fréquence cardiaque est de 144/min, la fréquence respiratoire de 32/min et la température rectale de 38,3 °C. La qualité du pouls périphérique est légèrement faible. L'auscultation du cœur et de l'appareil respiratoire est normale et la palpation abdominale provoque un inconfort abdominal crânial reproductible, mais aucune anomalie structurelle palpable. La vessie est modérément pleine et, après la palpation, le chien urine spontanément sans difficulté apparente, et une partie est recueillie pour analyse. Hématologie Paramètre Valeur Unités Intervalle GR 6,89 × 1012/l (5,5–8,5) Hémoglobine 14,4 g/dl (12,0–18,0) Hématocrite 0,49 l/l (0,37–0,55) "},{"k":"Évaluation initiale et prise en charge","t":"• PU/PD avec hyperglycémie/glucosurie, hyperlipidémie et cétonurie\nDiagnostics différentiels.\n• Acidocétose diabétique\n• Non diagnostiqué : pancréatite, lipidose hépatique, cholangiohépatite, hyperadrénocorticisme, hypothyroïdie\n• Lepto\n• Corps étranger\n• Néoplasie\nPrise en charge.\nImmédiatement :\n• Traitement du choc (NaCl 0,9 % – 20 ml/kg jusqu'à 90 ml/kg, puis réévaluer la perfusion).\n• Fluides d'entretien (NaCl 0,9 %) = besoins liés au déficit (12 % x 10,4 kg) + entretien (60 ml/kg/jour) + pertes\ncontinues (chien ayant vomi 8 fois à 100 ml/épisode) = 1248 ml + 328 ml/jour + 800 ml/jour = 2430 ml/jour\n• Supplémentation en potassium 20 mmol/l à 25 ml/kg/h\n• Insuline CRI (2,2 unités/kg dans 250 ml de NaCl 0,9 % à 10 ml/h – réévaluer la glycémie q2h)\n• Ondansétron 0,5 mg/kg PO q12 heures\n• S-adénosylméthionine 1 comprimé (225 mg) PO SID\n• Sucralfate à 0,5 g PO q8h\n• Cerenia 1 mg/kg SC q24h\nAutres tests diagnostiques\n• gaz sanguins artériels, NFS, bilan biochimique, analyse d'urine, courbe de glycémie, taux de fructosamine,\ntest d'immunoréactivité de la lipase pancréatique, test de stimulation à l'ACTH, test thyroïdien et échographie\nabdominale pour examiner le pancréas et les glandes surrénales\nSurveiller – Oxymétrie de pouls, glycémie, FC/ECG/PA, FR, MM/TRC, température, état d'hydratation, attitude, gaz\nsanguins artériels, électrolytes, débit urinaire, analyse d'urine, NFS"},{"k":"Ordonnance (Rx)","t":"Insuline : débuter à 0,5 U/kg IM q12h après les repas; S-adénosylméthionine 1 comprimé (225 mg) PO SID; Gestion de la perte de poids – Diète prescrite w/d (suivre les instructions du fabricant) + exercice modéré; et régulier à heures fixes"}]}]},{"id":"acd","nom":"Acidocétose diabétique (ACD)","sys":"Endocrinologie","urg":true,"resume":"Diabétique : léthargie, vomissements, haleine acétonée, déshydratation, respiration profonde. Hyperglycémie, cétonurie, acidose métabolique. Fluides → électrolytes → insuline 2–6 h après le début de la fluidothérapie.","src":["Urgences (ACD)","SAM 2 — acidocétose diabétique","Cas CPE 18"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":"LRS/NaCl; corriger l'hydratation puis les électrolytes"},{"d":"insuline_reguliere","r":"1","n":"Perfusion à débit constant ou doses IM (humain)"},{"d":"kcl","r":"U","n":"Supplémentation selon la kaliémie"},{"d":"maropitant","r":"S","n":""},{"d":"famotidine","r":"S","n":""},{"d":"amox_clav","r":"S","n":"Si infection urinaire/pancréatite sous-jacente"}],"maj":"Rechercher le facteur déclenchant (pancréatite, infection, hypercortisolisme). Glycémie toutes les heures (vos notes); ajouter du dextrose quand la glycémie descend. CPE : cas 18 (border terrier).","qc":"","al":"","gl":["aaha_diabete_2018"]},"chat":{"tx":[{"d":"fluides","r":"U","n":""},{"d":"insuline_reguliere","r":"1","n":""},{"d":"kcl","r":"U","n":""},{"d":"maropitant","r":"S","n":""},{"d":"mirtazapine","r":"S","n":"Appétit (Mirataz®)"}],"maj":"Les inhibiteurs du SGLT2 peuvent provoquer une acidocétose (y compris euglycémique) : ne pas les utiliser chez un chat cétosique; en cas d'ACD sous SGLT2i, arrêter le médicament.","qc":"","al":"","gl":["icatcare_dm_2025"]}},"notes":[{"label":"Tableau des urgences — ACD (acidocétose diabétique) (p.563)","fields":[{"k":"Signes cliniques / examen physique","t":"Diabétique, PU/PD, polyphagie, léthargie, vomissements, odeur d'acétone, déshydraté, respiration lente et profonde"},{"k":"Diagnostic différentiel","t":"IRC, maladie hépatique, Cushing, pancréatite, infection urinaire, maladie GI, acidose urémique, Addison"},{"k":"Diagnostic","t":"hyperglycémie, acidose métabolique, ↓ (Na, K, Cl)"},{"k":"Traitement (Rx)","t":"Fluidothérapie : LRS ; corriger l'hydratation, bolus possible : si K = 3,5 : ajouter 30 mEq par litre de soluté sans dépasser 0,5 mEq/kg/h. Insuline 2–6 h après le début de la fluidothérapie : insuline régulière 0,2 U/kg IM une fois, puis une 2e dose une heure plus tard, puis 0,1 U/kg IM chaque heure --- Cerenia 1 mg/kg IV q24h – Famotidine 1 mg/kg IV q24h. Amoxy-Clav 20 mg/kg PO q12h pendant 7 jours"},{"k":"Pronostic / prévention","t":"bon"},{"k":"Surveillance / examens complémentaires","t":"glycémie toutes les heures ; si elle atteint 250 mg/dl (13 mmol/l), ajouter du dextrose (dextrose 5 % à partir de 100 ml de dextrose 50 %), hydratation, cétones urinaires, culture et antibiogramme urinaires pour infection urinaire"},{"k":"Commentaires","t":"Culture et antibiogramme urinaires (infection urinaire) : amoxicilline-acide clavulanique 12,5 mg/kg PO q12h pendant 7 jours :--- Rx : amoxicilline/acide clavulanique comprimés de 125 mg # 14 -- Donner un comprimé par la bouche deux fois par jour (aux 12 h) pendant 7 jours."}]},{"label":"SAM 2 (notes détaillées)","text":"ACIDOCÉTOSE DIABÉTIQUE (ACD) Un trouble métabolique engageant le pronostic vital causé par une déficience en insuline et/ou une résistance à l'insuline menant à une production hépatique excessive de cétoacides et une acidose métabolique, une hyperosmolalité, des perturbations électrolytiques sériques, et des signes systémiques de maladie progressivement aggravés. FACTEURS DE RISQUE-diabète sucré non traité ou traité mais avec infection urinaire, pancréatite, hyperadrénocorticisme concomitants.\n• SUBJECTIF-l'anamnèse et les constatations d'examen physique sont variables en raison de la nature progressive de l'acidocétose diabétique (ACD) et du délai variable entre le début de l'ACD et la reconnaissance du problème par le propriétaire.\n• Les signes cliniques classiques du diabète (c.-à-d., polyurie, polydipsie, polyphagie,\nperte de poids) se développent initialement, suivis de signes systémiques de maladie (léthargie,\nanorexie, vomissements) à mesure que la cétonémie et l'acidose métabolique se développent et s'aggravent.\n• La maladie sous-jacente qui précipite l'ACD (ex., pancréatite, infection) contribue aussi au tableau clinique.\n• L'intervalle de temps entre le début du diabète et le début de l'ACD est imprévisible, mais une fois l'acidocétose développée, une maladie sévère devient habituellement évidente en quelques jours.\n• OBJECTIF- Les constatations sont variables pour les raisons discutées ci-dessus.\nConstatations physiques communes en plus de celles trouvées chez les chiens et chats diabétiques non cétosiques incluent déshydratation, dépression, faiblesse, tachypnée, et parfois une forte odeur d'acétone dans l'haleine. Une respiration lente et profonde (c.-à-d., respiration de Kussmaul) peut être observée chez les animaux avec acidose métabolique sévère. Vomissements et signes de douleur abdominale sont fréquents avec pancréatite concomitante.\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=\n• PLAN- DIAGNOSTICS=L'évaluation de laboratoire des chiens et chats malades avec ACD doit inclure une\nNFS, un bilan biochimique sérique, les électrolytes sériques, une évaluation acido-basique artérielle, et une analyse d'urine avec culture bactérienne et antibiogramme.\n• NFS-leucocytose avec neutrophilie mature\n• Chimie- hyperglycémie, acidose métabolique, hyperosmolalité. Hyponatrémie, hypokaliémie, hypochlorémie, hypophosphatémie Azotémie préréénale, activités des enzymes hépatiques augmentées, hypercholestérolémie, et infection urinaire. Des altérations associées à une pancréatite concomitante sont aussi fréquentes.\n• Analyse d'urine-glucosurie et cétonurie\nTHÉRAPEUTIQUE=Le traitement des chiens et chats systémiquement malades avec ACD inclut des fluides intraveineux avec\ndes suppléments appropriés, de l'insuline régulière (cristalline), du bicarbonate, du dextrose, et un traitement auxiliaire, selon la maladie concomitante. ⇨fluides-solution saline 0,9% à un débit suffisant pour corriger la déshydratation sur 12-24 heures ; ajuster selon le statut d'hydratation, la production d'urine, et la persistance des pertes liquidiennes. ⇨Supplémentation potassique dans les fluides-ajouter 20-40 mEq de KCl à chaque litre de fluides OU 0,5 mEq/kg/h ⇨Une supplémentation en dextrose dans les fluides est indiquée quand la glycémie approche ou tombe sous 250 mg/dL. Ajouter du dextrose pour obtenir une solution à 5%. (Comme l'administration d'insuline doit être poursuivie pour résoudre la cétose, le dextrose doit être utilisé pour maintenir la glycémie\nentre 150 et 250 mg/dL) ⇨Une supplémentation en bicarbonate de sodium est rarement indiquée car une fluidothérapie adéquate restaure l'excrétion rénale des cétoacides.\nDébuter le traitement à l'insuline 2-6 heures après le début de la fluidothérapie. Si le potassium sérique est normal, débuter le traitement à l'insuline comme décrit ci-dessous. Si une hypokaliémie est présente, diminuer la dose d'insuline de 50% pendant les 2-3 premières heures, et fournir une supplémentation potassique adéquate ⇨L'insuline régulière (cristalline) est administrée en utilisant l'une des techniques suivantes : 1) IM intermittente : 0,2 UI/kg IM initialement, puis 0,1 UI/kg IM chaque heure ; passer à\nl'insuline régulière SC q 6-8h une fois la glycémie proche de 250 mg/dL\n(13,9 mmol/L), et ajouter du dextrose aux fluides IV comme discuté ci-dessus.\n2) Technique de perfusion IV à faible dose : 0,05 UI/kg/h (chat) ou 0,1 UI/kg/h (chien) initialement, dilué dans du NaCl 0,9% et administré en perfusion à débit continu (CRI) dans une ligne IV dédiée. Ajuster le débit selon les mesures horaires de la glycémie. À mesure que la glycémie diminue et approche 250 mg/dL (13,9 mmol/L), ajouter du dextrose aux fluides IV comme discuté ci-dessus. Le débit d'administration d'insuline peut nécessiter un ajustement lorsque du dextrose est ajouté aux fluides IV.\n(Fournir des quantités adéquates d'insuline pour maintenir la glycémie\nentre 150 et 300 mg/dL)\nSurveillance recommandée\n• Mesure de la glycémie toutes les 1-2 heures initialement ; à mesure que la glycémie diminue en réponse au traitement, ajuster le traitement à l'insuline et débuter la perfusion de dextrose quand elle approche 250 mg/dL (13,9 mmol/L).\n• Statut d'hydratation, production d'urine, respiration, pouls toutes les 2-4 heures ; ajuster les fluides en conséquence.\n• Électrolytes sériques et concentrations de CO2 veineux total toutes les 6-12 heures ; ajuster le traitement liquidien et bicarbonaté en conséquence.\n• Production d'urine, glycosurie, cétonurie toutes les 2-4 heures ; ajuster la fluidothérapie en conséquence. • Poids corporel quotidien, hématocrite, température, pression artérielle\n• Surveillance additionnelle, selon la maladie concomitante\nPRONOSTIC=dépend en partie de la sévérité des perturbations métaboliques au moment\noù l'ACD est diagnostiquée, des maladies sous-jacentes qui ont précipité l'ACD, et des complications qui se développent pendant le traitement.\nLIVRE DE 5 MINUTES L'insuline régulière est l'insuline de choix.- Dose initiale—0,2 U/kg IM (ou SC si l'hydratation est normale).\nDose subséquente 0,1–0,2 U/kg donnée 3–6h plus tard—peut être donnée toutes les heures si le patient est étroitement surveillé ; la réponse à la dose d'insuline précédente doit être considérée lors du calcul des doses subséquentes. Idéalement, la concentration de glucose devrait chuter de 50–100 mg/dL/h. L'insuline régulière peut aussi être administrée en perfusion à débit continu via un cathéter dédié. Pour les chiens, mettre 2,2 unités/kg dans 250 mL de fluide NaCl 0,9%. Pour les chats, mettre 1,1 unités/kg dans 250 mL de fluide NaCl 0,9%. Ensuite, laisser 50 mL de l'insuline diluée s'écouler à travers la tubulure IV et jeter. Si la glycémie est > 250 mg/dL, administrer à 10 mL/heure. Si la glycémie est 200–250 mg/dL, administrer à 7\nmL/heure. Si la glycémie est 150–200 mg/dL, administrer à 5 mL/heure. Si la glycémie est 100–150 mg/dL, administrer à 5 mL/heure et ajouter du dextrose 2,5% aux fluides cristalloïdes IV. Si la glycémie est < 100\nmg/dL, arrêter la perfusion d'insuline IV et continuer le dextrose 2,5–5% dans la perfusion cristalloïde IV."},{"label":"Cas CPE 18","fields":[{"k":"Cas clinique","t":"Cas 18 – Chapitre 4. • Un Border terrier mâle castré de 11 ans nommé Buddy, pesant 10,4 kg, est présenté avec des antécédents de léthargie, d'anorexie, de vomissements et d'apathie progressive entraînant une réticence à marcher. Ses propriétaires rapportent que Buddy a déjà eu des épisodes de vomissements spontanément résolutifs durant 2 à 3 jours, dont quatre épisodes au cours des 6 derniers mois. Ils ont remarqué que sa consommation d'eau et sa miction avaient augmenté de façon spectaculaire au cours des 2 dernières semaines. Aucune anomalie du pelage ou de la peau n'a été notée, mais Buddy a perdu un peu de poids durant cette période. L'appétit de Buddy jusqu'à il y a 48 heures était excellent. Buddy a vomi, accompagné d'efforts abdominaux, 8 fois au cours des dernières 24 heures et le vomi était un liquide teinté de bile. L'examen physique révèle un chien très déprimé, en surpoids (note d'état corporel 4/5), qui est réticent à marcher. Les yeux sont enfoncés et l'élasticité cutanée normale est perdue. Les muqueuses sont très collantes au toucher mais ont une couleur normale avec un temps de remplissage capillaire de 2,5 s. La fréquence cardiaque est de 144/min, la fréquence respiratoire de 32/min et la température rectale de 38,3 °C. La qualité du pouls périphérique est légèrement faible. L'auscultation du cœur et de l'appareil respiratoire est normale et la palpation abdominale provoque un inconfort abdominal crânial reproductible, mais aucune anomalie structurelle palpable. La vessie est modérément pleine et, après la palpation, le chien urine spontanément sans difficulté apparente, et une partie est recueillie pour analyse. Hématologie Paramètre Valeur Unités Intervalle GR 6,89 × 1012/l (5,5–8,5) Hémoglobine 14,4 g/dl (12,0–18,0) Hématocrite 0,49 l/l (0,37–0,55) "},{"k":"Évaluation initiale et prise en charge","t":"• PU/PD avec hyperglycémie/glucosurie, hyperlipidémie et cétonurie\nDiagnostics différentiels.\n• Acidocétose diabétique\n• Non diagnostiqué : pancréatite, lipidose hépatique, cholangiohépatite, hyperadrénocorticisme, hypothyroïdie\n• Lepto\n• Corps étranger\n• Néoplasie\nPrise en charge.\nImmédiatement :\n• Traitement du choc (NaCl 0,9 % – 20 ml/kg jusqu'à 90 ml/kg, puis réévaluer la perfusion).\n• Fluides d'entretien (NaCl 0,9 %) = besoins liés au déficit (12 % x 10,4 kg) + entretien (60 ml/kg/jour) + pertes\ncontinues (chien ayant vomi 8 fois à 100 ml/épisode) = 1248 ml + 328 ml/jour + 800 ml/jour = 2430 ml/jour\n• Supplémentation en potassium 20 mmol/l à 25 ml/kg/h\n• Insuline CRI (2,2 unités/kg dans 250 ml de NaCl 0,9 % à 10 ml/h – réévaluer la glycémie q2h)\n• Ondansétron 0,5 mg/kg PO q12 heures\n• S-adénosylméthionine 1 comprimé (225 mg) PO SID\n• Sucralfate à 0,5 g PO q8h\n• Cerenia 1 mg/kg SC q24h\nAutres tests diagnostiques\n• gaz sanguins artériels, NFS, bilan biochimique, analyse d'urine, courbe de glycémie, taux de fructosamine,\ntest d'immunoréactivité de la lipase pancréatique, test de stimulation à l'ACTH, test thyroïdien et échographie\nabdominale pour examiner le pancréas et les glandes surrénales\nSurveiller – Oxymétrie de pouls, glycémie, FC/ECG/PA, FR, MM/TRC, température, état d'hydratation, attitude, gaz\nsanguins artériels, électrolytes, débit urinaire, analyse d'urine, NFS"},{"k":"Ordonnance (Rx)","t":"Insuline : débuter à 0,5 U/kg IM q12h après les repas; S-adénosylméthionine 1 comprimé (225 mg) PO SID; Gestion de la perte de poids – Diète prescrite w/d (suivre les instructions du fabricant) + exercice modéré; et régulier à heures fixes"}]}]},{"id":"addison","nom":"Hypoadrénocorticisme (maladie d'Addison)","sys":"Endocrinologie","urg":false,"resume":"PU/PD, faiblesse, anorexie, vomissements, diarrhée (méléna), perte de poids; hyponatrémie, hyperkaliémie, ratio Na:K < 27. Test de stimulation à l'ACTH.","src":["SAM1 — Addison","SAM 2 — Addison"],"img":[],"sp":{"chien":{"tx":[{"d":"docp","r":"1","n":"DOCP (Percorten-V® ou Zycortal®) q ≈25 jours"},{"d":"fludrocortisone","r":"2","n":"Alternative orale (Florinef®)"},{"d":"prednisone","r":"S","n":"Glucocorticoïde de maintien selon le besoin"},{"d":"cosacthen","r":"D","n":"Test de stimulation à l'ACTH (Cosacthen®)"}],"maj":"AAHA 2023 : algorithme diagnostique et thérapeutique; DOCP vétérinaire commercialisé au Canada (Percorten-V®, Zycortal®). Les signes sont vagues (« grand imitateur »); un cortisol de base > ~55 nmol/L exclut pratiquement l'Addison.","qc":"","al":"","gl":["aaha_endocrino_2023"]}},"notes":[{"label":"Tableau SAM1 — Addison (p.1032)","fields":[{"k":"Signes cliniques / examen physique","t":"PU/PD, faiblesse, anorexie, vomissements. Diarrhée (méléna), perte de poids, tremblements, régurgitation (mégaœsophage)"},{"k":"Diagnostic différentiel","t":"IRA, obstruction urinaire, trichures, épanchements abdominaux/thoraciques, obstruction GI, maladie hépatique"},{"k":"Diagnostic","t":"Hypoglycémie, anémie normocytaire normochrome, absence de leucogramme de stress, acidose métabolique ; azotémie prérénale, hyponatrémie et hyperkaliémie, hypercalcémie, hypoalbuminémie et isosthénurie. Cortisol post-stimulation à l'ACTH < 2 mcg/dL"},{"k":"Traitement (Rx)","t":"Prednisone 0,25–0,5 mg/kg PO q 12h au départ, puis dégression à q 24h ; DOCP 2,2 mg/kg SC ou IM q ≈25 jours OU fludrocortisone (la prednisone peut ne pas être nécessaire) 0,01 mg/kg PO q 12h au départ"},{"k":"Pronostic / prévention","t":"excellent"},{"k":"Surveillance / examens complémentaires","t":"Électrolytes sériques : 7 et 14 jours après le diagnostic. Une fois les électrolytes stabilisés, recontrôle mensuel pendant 3–6 mois, puis q 3–6 mois."}]},{"label":"SAM 2 (notes détaillées)","text":"ADDISON (HYPOADRÉNOCORTICISME)\n• SUBJECTIF – Faiblesse, léthargie, anorexie et vomissements ou diarrhée (parfois sanglante en raison d'ulcérations GI). PU/PD\n• Les signes cliniques sont notoirement vagues. Les plus fréquents : faiblesse, léthargie, anorexie,\nvomissements.\n• Moins fréquents : faiblesse généralisée ou des membres postérieurs, diarrhée (possiblement avec méléna ou hématochézie), perte de poids, tremblements, polyurie/polydipsie (PU/PD), régurgitation\n(due au mégaœsophage), et collapsus. Rarement, convulsions, secondaires à une hypoglycémie.\n(Cette maladie peut mimer d'autres plus courantes (lésion rénale aiguë/anurie, maladie hépatique, maladie GI), et le diagnostic d'hypoadrénocorticisme est souvent\nmanqué initialement. La NFS peut fournir un indice précieux : l'absence de leucogramme\nde stress chez un animal malade suggère un hypoadrénocorticisme.)\n• OBJECTIF – constatation physique – dépression mentale, bradycardie (due à\nl'hyperkaliémie), déshydratation, CHOC hypovolémique, TRC augmenté, muqueuses pâles.\n• ÉVALUATION – liste des problèmes – léthargie, vomissements, déshydratation, anorexie.\n• DDx – INSUFFISANCE RÉNALE\nmaladie G.I. sévère, occlusion des voies urinaires\n• PLAN - DIAGNOSTIC ⇨NFS/Chimie-anémie normocytaire, normochrome non régénérative\nAbsence de leucogramme de stress (la NFS peut fournir un indice précieux : l'absence de leucogramme\nde stress chez un animal malade suggère un hypoadrénocorticisme) Hyponatrémie, hyperkaliémie (<27), ↑urée/créatinine, azotémie, anémie, hy\npoglycémie, fréquence cardiaque basse/bradycardie, hypercalcémie. Diagnostic – rapport Na:K si <25:1 c'est Addison.\n(Le potassium sérique peut s'élever en raison d'une ➭déshydratation sévère,\n• occlusion/rupture des voies urinaires, ➭hypoadrénocorticisme, ➭acidose métabolique,\n• acidocétose diabétique, et ➭insuffisance rénale. l'insuffisance rénale peut aussi entraîner\ndivers degrés d'hypokaliémie)\n⇨Taux de cortisol sérique basal : si normal (>2 mcg/dL [>55 nmol/L]), l'hypoadrénocorticisme\nest hautement improbable. Si bas, l'incertitude persiste.\n⇨Test de stimulation à l'ACTH -cortisol confirmé bas. (test de confirmation) Test rénal – présence de protéines dans l'urine.\n• PLAN – THÉRAPEUTIQUE ⇨FLUIDE IV – NaCl 0,9% (le NaCl 0,9% est traditionnellement recommandé en raison de la teneur élevée en sodium\net de l'absence de potassium. Chiens : si sévèrement malade, déshydraté, et/ou hypotendu, un tiers à la\nmoitié du volume de choc (90 mL/kg) en bolus IV, puis réévaluer et administrer davantage si nécessaire. Pour\nl'entretien et pour corriger la déshydratation, des fluides supplémentaires doivent être donnés au besoin) ⇨Administration de glucocorticoïdes :-Phosphate sodique de dexaméthasone (préféré) : action\nrapide et non détecté par le dosage du cortisol (test de stimulation à l'ACTH). Administrer initialement 0,25 mg/kg IV À la 12ème heure suit la succinate sodique de prednisone (2 mg/kg initialement, puis 0,5-1 mg/\nkg q 12h) peut être administrée mais seulement après la fin du test de stimulation à l'ACTH.\nTRAITER l'hyperkaliémie et l'hypoglycémie Une fois l'animal stable du choc, ajouter PREDNISOLONE 2-5 mg/kg PO\n12-24h + TRAITEMENT À LONG TERME – DOCP (Percoten) – 2,2mg/kg SC tous les 25-30\njours. pivalate de désoxycorticostérone OU acétate de fludrocortisone : 0,01 mg/kg PO q 12h\ninitialement. NaCl dans l'alimentation\n• Famotidine – 0,5mg/kg IV\n• Si des vomissements surviennent, ajouter du Maropitant 1 mg/kg SC ⇨Hypoglycémie : ajouter du dextrose aux fluides IV isotoniques pour obtenir une concentration\nde dextrose à 2,5%-5%. Si l'hypoglycémie est sévère ou le patient présente des signes cliniques\nd'hypoglycémie, des bolus de solution de dextrose à 25%, 1 mL/kg dans du NaCl 0,9%, peuvent être donnés.\n• Si l'hématocrite est inférieur à 18, une transfusion est aussi nécessaire.\n• HYPERKALIÉMIE – si K >8 mEq/L alors donner 1-2 ml/kg de dextrose 50% dans le\nNaCl 0,9%.\n• PRONOSTIC – BON. Avec traitement et surveillance, le pronostic est excellent et une espérance de vie normale est\nattendue.\n• Surveillance recommandée- Biochimie sérique, incluant électrolytes : 7 et 14 jours\naprès le diagnostic. Une fois les électrolytes stabilisés, recontrôler mensuellement pendant 3-6 mois, puis tous les 3-6\nmois. Surveiller la production d'urine. Surveiller les électrolytes et la glycémie après la réanimation liquidienne initiale, puis\ntoutes les 8-12h jusqu'à normalisation. Maintenir la fluidothérapie jusqu'à ce que le patient mange."}]},{"id":"crise_addisonienne","nom":"Crise addisonienne","sys":"Endocrinologie","urg":true,"resume":"Faiblesse soudaine, vomissements/diarrhée sévères, collapsus, bradycardie, hyperkaliémie; ECG. Traitement d'urgence puis diagnostic confirmatif.","src":["Urgences (crise addisonienne)"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":"NaCl 0,9 % (correction lente de la natrémie)"},{"d":"glucose","r":"U","n":"Dextrose si hypoglycémie"},{"d":"gluconate_ca","r":"U","n":"Hyperkaliémie avec arythmie (+ ECG)"},{"d":"insuline_reguliere","r":"U","n":"Avec dextrose, pour l'hyperkaliémie"},{"d":"dexamethasone","r":"1","n":"Avant le test ACTH si l'urgence l'exige"},{"d":"hydrocortisone","r":"2","n":""},{"d":"docp","r":"P","n":"Après stabilisation"}],"maj":"Fluides d'abord, puis glucocorticoïde (la dexaméthasone n'interfère pas avec le dosage du cortisol); correction lente de la natrémie (< 12 mEq/jour, comme dans vos notes) pour éviter la myélinolyse osmotique.","qc":"","al":"L'hydroxyéthylamidon (colloïde) cité dans vos notes est à nuancer : privilégier les cristalloïdes ± plasma.","gl":["aaha_endocrino_2023"]}},"notes":[{"label":"Tableau des urgences — Crise addisonienne (p.1033 hyperK p.1007)","fields":[{"k":"Signes cliniques / examen physique","t":"faiblesse soudaine, avec vomissements et diarrhée sévères, et parfois collapsus"},{"k":"Diagnostic différentiel","t":"IRA ; trichures (diarrhée), épanchements abdominaux/thoraciques, obstruction GI, obstruction urinaire"},{"k":"Diagnostic","t":"radiographie abdominale, cortisol basal (< 2 µg/dl), test de stimulation à l'ACTH (< 2 µg/dl)."},{"k":"Traitement (Rx)","t":"5 ml/kg bolus d'hétamidon + 20 ml/kg bolus de LRS (↑Na < 12 mEq/jour) ; dextrose 50 % 1 ml/kg 1:1 avec sérum physiologique ; LRS à 2x l'entretien ; gluconate de Ca 1,5 mL/kg en 15 min + ECG ; insuline régulière 0,5 U/kg IV + dextrose 2 g/U dans LRS (solution à 5 %) ; dexaméthasone (0,25 mg/kg IV, puis 0,07–0,15 mg/kg) (sauf si déshydraté avec maladie GI) 0,25 mg/kg ; famotidine 0,1 mg/kg. Renvoyer le patient à la maison avec de la prednisone 1 mg/kg PO q24h"},{"k":"Pronostic / prévention","t":"bon"},{"k":"Surveillance / examens complémentaires","t":"Production urinaire, électrolytes, glycémie, ECG,"},{"k":"Commentaires","t":"Maintenir la fluidothérapie jusqu'à ce que l'animal mange. Utiliser la dexaméthasone injectable jusqu'à ce que la prednisone orale puisse être instaurée à 1 mg/kg PO q24h jusqu'au retour à la maison. Ensuite, la dose est réduite à 0,25 mg/kg PO."}]}]},{"id":"cushing","nom":"Hypercorticisme (maladie de Cushing)","sys":"Endocrinologie","urg":false,"resume":"PU/PD, polyphagie, halètement, abdomen pendulaire, alopécie bilatérale, peau fine, calcinose cutanée; ↑PAL. PDH (80–90 %) vs tumeur surrénalienne. Complications : IU, diabète, HTA, pancréatite, thromboembolie.","src":["SAM1 — Cushing","SAM 2 — hypercorticisme"],"img":[],"sp":{"chien":{"tx":[{"d":"trilostane","r":"1","n":"Vetoryl® — titration selon test ACTH"},{"d":"mitotane","r":"2","n":"Lysodren® (adrénolytique; surveillance étroite)"},{"d":"cosacthen","r":"D","n":"Test de stimulation à l'ACTH (Cosacthen®)"}],"maj":"Étude 2024 (reprise en 2025) : débuter à 0,5–1 mg/kg q12h puis augmenter progressivement (une augmentation de dose a été nécessaire chez 88 % des chiens); test ACTH toutes les 4–6 semaines. Ne traiter que les chiens symptomatiques (consensus ACVIM/AAHA).","qc":"","al":"Votre fichier indique une dose fixe (60 mg/jour pour 5–20 kg) : approche dépassée au profit d'une dose initiale en mg/kg, titrée selon le test ACTH.","gl":["aaha_endocrino_2023"]}},"notes":[{"label":"Tableau SAM1 — Cushing 80 %–90 % microadénome hypophysaire (p.994)","fields":[{"k":"Signes cliniques / examen physique","t":"PU/PD, polyphagie, halètement, abdomen pendulaire, peau mince, ecchymoses, hyperpigmentation, alopécie, pyodermite, atrophie musculaire, intolérance à l'effort, obésité, atrophie testiculaire, anœstrus, hépatomégalie"},{"k":"Diagnostic différentiel","t":"DM, maladie rénale, hypothyroïdie, alopécie X, hyperœstrogénisme (tumeur des cellules de Sertoli), DI"},{"k":"Diagnostic","t":"FSC : leucogramme de stress, thrombocytose. Biochimie : ↑ ALP, cholestérol, glucose. Urine : ↓ DS ; protéinurie ; IU possible. Radiographies abdominales : hépatomégalie, calculs kystiques, ostéopénie. Test de stimulation à l'ACTH : cortisol > 30 mg/dL diagnostique. LDDS pour confirmer. Ratio cortisol/créatinine urinaire : exclure l'HAC. HDDS pour différencier PDH de ADH. Échographie abdominale : PDH : bilatérale ↑, TS : une ↑, une ↓"},{"k":"Traitement (Rx)","t":"Médical : trilostane 5–20 kg : 60 mg/jour PO, test de stimulation à l'ACTH à 10, 30 j, q3 mois 3 h après le médicament - cortisol dans la partie basse de l'intervalle de référence (↓ synthèse du cortisol). Chirurgical : PDH : surrénalectomie bilatérale ; ADH : surrénalectomie unilatérale"},{"k":"Pronostic / prévention","t":"PDH : traitement au trilostane — survie médiane de 22 mois"},{"k":"Surveillance / examens complémentaires","t":"Le propriétaire doit avoir de la prednisone à portée de main, à donner dans les situations stressantes 0,2 mg/kg PO q 24h. Reconnaître les signes cliniques d'hypoadrénocorticisme"}]},{"label":"SAM 2 (notes détaillées)","text":"HYPERADRÉNOCORTICISME (CUSHING) Syndrome causé par un excès d'une ou plusieurs stéroïdes surrénaliens (c.-à-d., cortisol, minéralocorticoïdes, androgènes surrénaliens)\nmais le plus souvent le cortisol.\n• SUBJECTIF-Chiens : les possibilités incluent des combinaisons variables de polyurie,\npolydipsie, polyphagie, abdomen pendulaire, ecchymoses excessives, halètement, alopécie,\nhypertrophie clitoridienne, atrophie testiculaire, anœstrus, faiblesse/léthargie, intolérance à l'effort, atrophie musculaire, obésité, alopécie bilatérale symétrique.\n• Chats : polyurie, polydipsie, polyphagie, abdomen pendulaire, pelage négligé,\nalopécie, peau fragile (se déchirant facilement), léthargie, fonte musculaire, obésité.\nTROUBLES ASSOCIÉS\n• Infections urinaires.\n• Calculs urinaires.\n• Hypertension systémique.\n• Diabète sucré.\n• Dégénérescence rétinienne acquise soudaine.\n• Maladie glomérulaire.\n• Pancréatite.\n• Signes neurologiques avec macroadénome hypophysaire.\n• Thrombose et thromboembolie pulmonaire.\n• OBJECTIF-Chiens : peau fine, alopécie bilatérale symétrique, hépatomégalie,\npyodermite, distension abdominale, hypertrophie clitoridienne, atrophie testiculaire, ecchymoses,\nfonte musculaire, séborrhée, calcinose cutanée, hyperpigmentation, comédons\n• Chats : abdomen pendulaire, pelage négligé, alopécie, peau fragile (se déchirant facilement),\nfonte musculaire, obésité\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=Diabète sucré, hyperthyroïdie (chat)\n• PLAN- DIAGNOSTICS=▪NFS : neutrophilie mature, monocytose, lymphopénie, éosinopénie (« leucogramme de stress »), thrombocytose\nBilan biochimique sérique :-↑PAL/ALT, hypercholestérolémie, hyperglycémie (habituellement\nlégère), ↓urée\n• Analyse d'urine et culture bactérienne : densité spécifique < 1,020 ; protéinurie fréquente ;\ninfection dans 40%-50% des cas quel que soit le sédiment urinaire\n• Radiographies abdominales : hépatomégalie, calculs vésiculaires, glande surrénale minéralisée, et/ou ostéopénie ▪Pression artérielle : hypertension possible\n• Examen du fond d'œil : hémorragie rétinienne possible\nTEST DE CONFIRMATION-Rapport cortisol/créatinine urinaire : 90%-100% sensible pour les\nchiens et les chats. Test de suppression à la dexaméthasone à faible dose (LDDS) :-\nTHÉRAPEUTIQUE=▪Mitotane (o,p′DDD, Lysodren). Détruit sélectivement les zones de la glande surrénale\nproduisant des glucocorticoïdes. ADH\n• Trilostane (Vetoryl). Inhibe la synthèse du cortisol. PDH\n• Kétoconazole. Inhibe la synthèse surrénalienne du cortisol.\nSURVEILLANCE- Réponse au traitement—utiliser des tests de stimulation à l'ACTH périodiques pour évaluer l'efficacité du mitotane, du kétoconazole, ou du trilostane\nPRONOSTIC=Survie médiane-2 ans"}]},{"id":"hypothyroidie","nom":"Hypothyroïdie","sys":"Endocrinologie","urg":false,"resume":"Chien d'âge moyen : léthargie, prise de poids, intolérance au froid, alopécie bilatérale (queue de rat), pyodermite; anémie normocytaire, hypercholestérolémie. T4 totale/TSH.","src":["SAM1 — hypothyroïdie","SAM 2 — hypothyroïdie"],"img":[],"sp":{"chien":{"tx":[{"d":"levothyroxine","r":"1","n":"Thyro-Tabs® Canine (vétérinaire) ou Synthroid® (humain)"}],"maj":"AAHA 2023 : diagnostic = T4 totale ± TSH canine ± T4 libre; début de la lévothyroxine q12–24h, suivi du T4 4–6 h après la prise. Traitement à vie, pronostic excellent.","qc":"","al":"","gl":["aaha_endocrino_2023"]}},"notes":[{"label":"Tableau SAM1 — Hypothyroïdie (thyroïdite lymphocytaire) (p.1054)","fields":[{"k":"Signes cliniques / examen physique","t":"obèse, apathique, faible, intolérance à l'effort/au froid, alopécie bilatérale, séborrhée, hyperpigmentation, otite, queue de rat, pyodermite, bradycardie, constipation, parésie faciale, signes vestibulaires, ↓ réflexes spinaux. infertilité (peu fréquente)."},{"k":"Diagnostic différentiel","t":"Cushing, déséquilibre des hormones sexuelles, alopécie X, obésité (↑ alimentation, ↓ exercice), acromégalie, dysfonction hypothalamique, médicaments (stéroïdes, phénobarbital)"},{"k":"Diagnostic","t":"hypercholestérolémie, anémie légère normocytaire normochrome non régénérative ; légère ↑ ALT/ALP, CK, test SNAP TT4 : ↓ TT4 sérique ou FT4 par dialyse à l'équilibre. Les lévriers et les shar-peis ont normalement un T4 ↓ (la moitié de l'intervalle de référence)"},{"k":"Traitement (Rx)","t":"lévothyroxine (T4 synthétique) : 0,02 mg/kg q24h est souvent suffisant. Ajuster la dose selon les SC et le T4 sérique (viser le T4 dans la moitié supérieure)"},{"k":"Pronostic / prévention","t":"excellent"},{"k":"Surveillance / examens complémentaires","t":"EP et thyroxine sérique vérifiés à 4 sem, puis q6 mois, une fois l'euthyroïdie atteinte. Une ↑ de la vivacité et de l'activité est couramment observée en 1–2 sem - amélioration dermatologique en 1–2 mois"}]},{"label":"SAM 2 (notes détaillées)","text":"HYPOTHYROÏDIE\n• SUBJECTIF- Chien d'âge moyen présenté pour léthargie, prise de poids, alimentation/boisson normales mais prend quand même du poids, léthargie mentale, paralysie\nfaciale/affaissement, intolérance à l'effort/inactivité, intolérance au froid sont fréquentes. Dermatologique-Alopécie tronculaire bilatérale symétrique,\nséborrhée, hyperpigmentation, alopécie en queue de rat, pyodermite.\n• OBJECTIF- constatations d'examen similaires. Bradycardie, pouls faibles\nParésie faciale\n• ÉVALUATION- Liste des problèmes-alopécie, prise de poids\nDDx-Alopécie obésité/prise de poids Troubles de la kératinisation cutanée\n• PLAN-\nDIAGNOSTICS- ▪NFS+biochimie sérique=anémie normocytaire normochrome non régénérative. Hypercholestérolémie, triglycérides élevés, hyperlipidémie. ↑légère PAL, ↑CK\n• Taux basal de T4 totale sérique=test de dépistage préféré. ▪T4 libre par dialyse à l'équilibre + test de stimulation à la TSH=test de confirmation\nTHÉRAPEUTIQUE- Thyroxine 0,01-0,02 mg/lb une fois par jour bid à jeun, sans nourriture\nPRONOSTIC- excellent, traitement à vie"}]},{"id":"hyperthyroidie","nom":"Hyperthyroïdie féline","sys":"Endocrinologie","urg":false,"resume":"Chat âgé : perte de poids avec bon appétit, PU/PD, hyperactivité, vomissements/diarrhée, tachycardie, nodule thyroïdien. T4 totale; ajuster pour viser la moitié inférieure de l'intervalle.","src":["SAM1 — hyperthyroïdie","SAM 2 — hyperthyroïdie"],"img":[],"sp":{"chat":{"tx":[{"d":"methimazole","r":"1","n":"Felimazole® (vétérinaire)"},{"d":"diete_therapeutique","r":"2","n":"Diète pauvre en iode (y/d)"},{"d":"atenolol","r":"S","n":"Tachycardie/hypertension"},{"d":"calcitriol","r":"S","n":"Hypocalcémie post-thyroïdectomie"}],"maj":"Traitement définitif : radio-iode (I-131) ou thyroïdectomie. Après traitement, la créatinine augmente souvent (démasquage d'une MRC) : surveiller créatinine et densité urinaire; une étude 2026 montre que le SDMA ne prédit pas bien l'azotémie post-traitement. AAHA 2023 : algorithme complet.","qc":"","al":"","gl":["aaha_endocrino_2023","et_sdma_hyperthy_2026"]}},"notes":[{"label":"Tableau SAM1 — Hyperthyroïdie (hyperplasie adénomateuse) (p.1015)","fields":[{"k":"Signes cliniques / examen physique","t":"Perte de poids + ↑ appétit, PU/PD, vomissements/diarrhée, hyperactivité, hypertension, tachypnée/halètement, évitement de la chaleur, pelage négligé, tachycardie/arythmie, souffle cardiaque, changements rétiniens, glande thyroïde palpable"},{"k":"Diagnostic différentiel","t":"Polyphagie + perte de poids : DM, MII, lymphome GI ; PU/PD : maladie rénale, Cushing"},{"k":"Diagnostic","t":"Test SNAP T4 total. Leucogramme de stress possible, érythrocytose légère ; ↑ ALP, ALT, ↑ T4 total sérique ou TT4 à la limite supérieure de la normale + ↑ T4 libre, hypertension"},{"k":"Traitement (Rx)","t":"Standard : I-131, 1 dose - guérit. Méthimazole 5 mg/CHAT PO q 24h (excoriations faciales, signes GI) ajuster la dose pour que le TT4 soit dans la moitié inférieure de l'intervalle de référence. Diète à teneur restreinte en iode Hill's y/d, thyroïdectomie (peut nécessiter du Ca), aténolol pour tachypnée/tachycardie, hypertension"},{"k":"Pronostic / prévention","t":"bon"},{"k":"Surveillance / examens complémentaires","t":"Vérifier la fonction rénale avant et pendant le traitement (démasquage d'une IRC - traiter). Une fois l'euthyroïdie atteinte, vérifier le T4 q6 mois"}]},{"label":"SAM 2 (notes détaillées)","text":"HYPERTHYROÏDIE\n• SUBJECTIF-Chats âgés présentant une perte de poids malgré un bon appétit, polydipsie, polyurie, polyphagie, perte de poids\n• Vomissements et/ou diarrhée\n• Hyperactivité, nervosité\n• Tachypnée/halètement\n• Faiblesse, léthargie\n• Diminution de l'activité de toilettage\n• Évitement de la chaleur ou recherche de zones fraîches\n• OBJECTIF-• Mauvais état corporel • Pelage négligé\n• Modifications cardiaques- Tachycardie sinusale, souffle cardiaque systolique, arythmie\n• Examen rétinien anormal (vaisseaux rétiniens tortueux, déchirures rétiniennes, décollement rétinien)\n• Glande(s) thyroïde(s) palpable(s)\nTROUBLES ASSOCIÉS Hypertrophie cardiaque concentrique (épaississement ventriculaire)\nHypertension systémique L'hyperthyroïdie peut masquer une maladie rénale chronique sous-jacente\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=Pour polyphagie avec perte de poids chez un chat adulte/gériatrique : diabète sucré, maladie inflammatoire de l'intestin, lymphome gastro-intestinal. Rarement chez les chats : hyperadrénocorticisme.\n• PLAN- DIAGNOSTICS=⇨NFS/chimie/analyse d'urine : leucogramme de stress possible et légère\nérythrocytose ; augmentation des enzymes hépatiques fréquente ; les résultats de densité urinaire varient.\n⇨Mesure du T4 sérique : habituellement augmenté.\n• Mesure de la pression artérielle systémique : hypertension (pression artérielle systolique\nrépétée > 180 mm Hg en environnement calme) possible.\n• Électrocardiogramme- si une arythmie ou d'autres signes de maladie cardiaque sont présents:\nla tachycardie sinusale est la plus fréquente ; les arythmies auriculaires ou ventriculaires sont possibles\nmais rares. ⇨ T4 libre sérique par dialyse à l'équilibre (FT4ED) : une FT4ED augmentée en conjonction avec un\nT4 total normal-haut soutient un diagnostic d'hyperthyroïdie.\nTHÉRAPEUTIQUE= ▪Méthimazole (2,5 mg/CHAT PO q 12h ou 5 mg/CHAT PO q 24h ▪Régime restreint en iode : la restriction en iode devrait entraîner une diminution des concentrations de T4.\n• Thyroïdectomie : potentiellement curative. ▪Traitement à l'iode : ceci est considéré comme la meilleure option de traitement pour le contrôle à long terme et\nla guérison de l'hyperthyroïdie.\nPRONOSTIC=bon"}]},{"id":"hypercalcemie","nom":"Hypercalcémie","sys":"Endocrinologie","urg":false,"resume":"PU/PD, léthargie, perte d'appétit. Dosage du calcium total et ionisé, paramètres rénaux, électrolytes.","src":["SAM1 — hypercalcémie"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"1","n":"NaCl 0,9 % (éviter le lactate de Ringer)"},{"d":"furosemide","r":"2","n":"Après réhydratation, diurèse calciurique"},{"d":"prednisolone","r":"2","n":"Seulement après avoir exclu un lymphome (peut masquer le diagnostic)"}],"maj":"Chercher la cause : lymphome, hyperparathyroïdie primaire, Addison, intoxication à la vitamine D, MRC; doser le Ca ionisé, PTH, PTHrP.","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"fluides","r":"1","n":""},{"d":"furosemide","r":"2","n":""},{"d":"prednisolone","r":"2","n":""}],"maj":"Chat : l'hypercalcémie idiopathique est fréquente; adapter la diète; néoplasie à exclure.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau SAM1 — Hypercalcémie (p.1002)","fields":[{"k":"Signes cliniques / examen physique","t":"PU/PD, léthargie, perte d'appétit"},{"k":"Diagnostic différentiel","t":"hyperparathyroïdie, néoplasie maligne, intoxication à la vit. D, Addison, maladie rénale chronique"},{"k":"Traitement (Rx)","t":"Soluté IV (sans Ca ; éviter le LRS) 2x l'entretien plus déshydratation, furosémide : 2–3 mg/kg IV q 4–8h – diurétique calciurique, dexaméthasone 0,1–0,2 mg/kg PO q 12h – ↓ absorption du Ca, ↑ excrétion."},{"k":"Surveillance / examens complémentaires","t":"Calcium sérique total et ionisé • Paramètres rénaux • Électrolytes sériques"}]}]},{"id":"eclampsie","nom":"Éclampsie (hypocalcémie de lactation)","sys":"Endocrinologie","urg":true,"resume":"Femelle allaitante (4 premières semaines) : anxiété, halètement, tremblements, ataxie, convulsions, hyperthermie. Calcium total < 7 mg/dl.","src":["Urgences (éclampsie)","SAM 2 — éclampsie"],"img":[],"sp":{"chien":{"tx":[{"d":"gluconate_ca","r":"1","n":"IV lente avec ECG; relais SC dilué"},{"d":"glucose","r":"S","n":"Si hypoglycémie"},{"d":"maropitant","r":"S","n":""}],"maj":"Retirer les chiots (sevrage ou alimentation artificielle); calcium oral de maintien. Hyperthermie > 40 °C : refroidissement.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau des urgences — Éclampsie (hypocalcémie, tétanie de lactation) (p.617)","fields":[{"k":"Signes cliniques / examen physique","t":"Femelles en lactation, durant les quatre premières semaines post-partum. Anxiété, désintérêt pour les chiots\nPrurit et morsures des pattes\nAtaxie, démarche chancelante et raideur musculaire\nTremblements musculaires, collapsus, spasmes cloniques (tétanie) et convulsions \nHyperthermie\nArythmies : complexes ventriculaires prématurés"},{"k":"Diagnostic différentiel","t":"Hypoparathyroïdie primaire, intoxication à l'éthylène glycol, malabsorption intestinale, hypovitaminose D, lavements contenant du phosphate, hypoglycémie"},{"k":"Diagnostic","t":"Hypocalcémie (calcium sérique < 6 mg/dl). Évaluer la glycémie pour exclure l'hypoglycémie"},{"k":"Traitement (Rx)","t":"Gluconate de Ca 1 ml/kg d'une solution à 10 % en 20 min avec ECG. Même dose diluée 1:1 avec du sérum physiologique, divisée en 3 doses à donner SC pour la prévention pendant les 2 jours suivants ; bain d'alcool et ventilateur en cas d'hyperthermie si > 104 °F. Dextrose en cas d'hypoglycémie sévère ; Cerenia si vomissements. (Amoxicilline-acide clavulanique 12,5 mg/kg PO q12h pendant 7 jours en cas de mammite ; envisager le Clavomox, adapté aux femelles allaitantes)."},{"k":"Pronostic / prévention","t":"Bon à excellent"},{"k":"Surveillance / examens complémentaires","t":"ECG, TPR,"},{"k":"Commentaires","t":"Retirer les chiots et donner un substitut de lait maternel, ou sevrer. Ajouter du carbonate de Ca et de la vitamine D par voie orale. En cas de récidive, donner un inhibiteur de la prolactine (cabergoline)"}]},{"label":"SAM 2 (notes détaillées)","text":"ÉCLAMPSIE\n• SUBJECTIF-Chienne allaitante avec des signes de comportement aberrant, ataxie, tremblements musculaires, convulsions, tétanie.\n• OBJECTIF-anxiété, agitation, va-et-vient, gémissements, désintérêt pour les chiots.\nPrurit, mordillement des pattes. Ataxie, titubation, raideur musculaire. Halètement progressant vers la dyspnée. Mydriase, réflexe photomoteur diminué Tachycardie ou bradycardie Tremblements musculaires, collapsus, spasmes cloniques (tétanie), et convulsions (les signes musculo-squelettiques sont souvent exagérés par un stimulus tactile) Hyperthermie Arythmies : extrasystoles ventriculaires\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=Hypocalcémie d'origine alternative Hypoglycémie (peut être concomitante) Œdème cérébral (possiblement secondaire à l'éclampsie ± hypoglycémie) Ingestion de toxine\n• PLAN- DIAGNOSTICS=Le calcium sérique total <7 mg/dl confirme le diagnostic.\nLa glycémie doit être évaluée simultanément pour écarter l'hypoglycémie comme facteur contributif primaire ou secondaire aux signes cliniques.\nTHÉRAPEUTIQUE= ➸ Gluconate/borogluconate de calcium 10% : 1-1,5 mL/kg IV lentement (sur 10-30 min) ou jusqu'à résolution des signes.\n• Une hyperthermie sévère > 104°F (>40°C) doit être contrôlée avec des poches de glace ou des bains d'alcool\n• Une supplémentation en vitamine D3 aide à l'absorption et l'homéostasie du calcium, mais une surveillance étroite est nécessaire car elle peut induire une hypercalcémie. Produits typiques en vente libre : 50 UI/kg PO q 24h.\n• Si convulsions alors diazépam IV ou par voie rectale.\nSurveillance - Une administration de calcium IV trop rapide ou non surveillée peut entraîner une bradycardie sévère La température corporelle doit être surveillée jusqu'à résolution de l'hyperthermie.\nPRONOSTIC=Le pronostic est bon à excellent avec un traitement immédiat\nPrévention=Les chiennes doivent être maintenues sur une alimentation de haute qualité pendant la gestation. Retirer les chiots pendant 24-36 heures pour réduire la perte de calcium maternel par la lactation; les chiots peuvent être nourris au lait de remplacement tous les deux jours pour diminuer la demande de lactation sur la chienne jusqu'au sevrage à 3 semaines."}]},{"id":"mrc","nom":"Maladie rénale chronique (MRC)","sys":"Urinaire","urg":false,"resume":"Chat âgé : PU/PD, perte de poids, léthargie, vomissements, petits reins irréguliers. Azotémie avec urines mal concentrées, protéinurie, hypertension. Stadification IRIS.","src":["SAM1 — maladie rénale chronique","SAM 2 — maladie rénale chronique"],"img":[],"sp":{"chien":{"tx":[{"d":"diete_therapeutique","r":"1","n":"Diète rénale (protéines/phosphore contrôlés)"},{"d":"benazepril","r":"1","n":"Protéinurie persistante (UPC > 0,5)"},{"d":"telmisartan","r":"2","n":"ARA II (alternative)"},{"d":"amlodipine","r":"2","n":"Hypertension (Amodip®)"},{"d":"chelateur_phosphore","r":"S","n":"Si hyperphosphatémie malgré la diète"},{"d":"maropitant","r":"S","n":"Vomissements/nausée"},{"d":"famotidine","r":"S","n":""},{"d":"calcitriol","r":"S","n":"Chez le chien, à envisager"},{"d":"darbepoetine","r":"S","n":"Anémie (Aranesp®)"}],"maj":"IRIS 2023 : stadification par créatinine ± SDMA, sous-stades protéinurie/pression artérielle; traiter selon le stade (diète, protéinurie, HTA, hyperphosphatémie, anémie).","qc":"","al":"","gl":["iris_mrc_2023","acvim_hta_2018"]},"chat":{"tx":[{"d":"diete_therapeutique","r":"1","n":"Diète rénale"},{"d":"telmisartan","r":"1","n":"Semintra® : protéinurie"},{"d":"amlodipine","r":"1","n":"Amodip® : hypertension"},{"d":"benazepril","r":"2","n":"Fortekor®"},{"d":"mirtazapine","r":"S","n":"Mirataz® (appétit/nausée)"},{"d":"capromorelin","r":"S","n":"Elura®"},{"d":"maropitant","r":"S","n":""},{"d":"chelateur_phosphore","r":"S","n":""},{"d":"darbepoetine","r":"S","n":"Anémie"},{"d":"kcl","r":"S","n":"Hypokaliémie féline"}],"maj":"iCatCare 2026 : lignes directrices complètes (diagnostic, stadification, traitements, environnement). Semintra® (telmisartan) et Amodip® (amlodipine) sont répertoriés au Canada; envisager aussi un traitement de l'hyperphosphatémie et de l'hypokaliémie.","qc":"","al":"Vos notes : l'hydroxyde d'aluminium n'est plus le chélateur de première intention; l'Epogen® (EPO humaine) expose au risque d'anticorps anti-EPO — la darbépoétine est généralement préférée.","gl":["iris_mrc_2023","icatcare_mrc_2026","isfm_hta_2018"]}},"notes":[{"label":"Tableau SAM1 — Maladie rénale chronique (P.397)","fields":[{"k":"Signes cliniques / examen physique","t":"Chat âgé, PU/PD, perte de poids, léthargie/hyporexie/anorexie, vomissements, petits reins bosselés"},{"k":"Diagnostic différentiel","t":"Azotémie prérénale, azotémie postrénale (obstruction urinaire, rupture), DM, hyperthyroïdie, maladie GI, infection urinaire"},{"k":"Diagnostic","t":"FSC/biochimie/T4/analyse d'urine (DS basse), ↑ BUN/créat/P, SDMA, fréquentes : hypoK/anémie non régénérative (due à une carence en érythropoïétine, saignement GI)"},{"k":"Traitement (Rx)","t":"Diète faible en protéines et en P (diète rénale), stimulants de l'appétit : mirtazapine, chélateurs du phosphate : Al(OH)₃, soluté, potassium (KCl), Cerenia, amlodipine, antibiotiques, darbépoétine/Epogen"},{"k":"Surveillance / examens complémentaires","t":"une fois les reins endommagés, leur capacité de récupération est très limitée. Cependant, avec une prise en charge adéquate, la plupart des cas d'IRC progressent très lentement."}]},{"label":"SAM 2 (notes détaillées)","text":"LÉSION RÉNALE CHRONIQUE La maladie rénale chronique (MRC) : une anomalie de la structure ou de la fonction rénale existant depuis plus de 3 mois. L'azotémie et/ou une urine insuffisamment concentrée (densité spécifique < 1,035 chez le chat ; < 1,030 chez le chien) ne sont pas nécessaires pour que la MRC soit présente. L'azotémie est une concentration augmentée d'urée sanguine et/ou de créatinine. L'urémie est l'ensemble des signes cliniques associés à l'insuffisance rénale excrétrice. La MRC est l'une des maladies gériatriques les plus fréquentes chez le chat. La MRC canine survient moins fréquemment, mais se manifeste tant chez les patients gériatriques que juvéniles (MRC congénitale).\n• SUBJECTIF-La polyurie/polydipsie est fréquente.\n• Anorexie\n• Perte de poids et atrophie musculaire\n• Des vomissements surviennent chez les animaux décompensés (urémiques).\n• Léthargie\n• Halitose\n• Altération de la conscience (léthargie générale) chez les animaux décompensés (urémiques)\n• Convulsions (rarement vues ; urémie terminale)\n• Hémostase anormale (rarement saignement spontané ; risque augmenté de saignement avec les procédures invasives)\n• OBJECTIF-Signes de déshydratation Palpation rénale : reins petits, irréguliers (fréquent) ou reins gros (rare)\n• Chez le chat, l'asymétrie rénale est fréquente après une néphropathie obstructive ou une pyélonéphrite ascendante chronique.\n• Typiquement non douloureux à la palpation rénale sauf si une atteinte aiguë est concomitante à la MRC Halitose urémique Ulcération buccale (avec azotémie sévère) Mauvais pelage Mauvais état corporel/musculaire Pâleur des muqueuses (si anémique) Température corporelle basse\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=1. Azotémie prérénale 2. Azotémie avec urine insuffisamment concentrée\n• MRC\n• Azotémie prérénale avec altération extrarénale de la concentration urinaire (ex., diurétiques, diurèse osmotique, diabète insipide) 3. Azotémie postrénale (ex., occlusion urinaire, rupture)\n• PLAN- DIAGNOSTICS=Évaluer l'hydratation : l'azotémie peut être causée ou exacerbée par la déshydratation et peut se résoudre partiellement ou complètement avec une fluidothérapie intraveineuse.\n• Numération formule sanguine (NFS) : une anémie non régénérative (due à une déficience en érythropoïétine, un saignement GI, une anémie de maladie chronique, ou une combinaison de ceux-ci) est fréquente ; sévérité variable\n• Bilan biochimique sérique : azotémie, hyperphosphatémie, hypokaliémie ou hyperkaliémie (rare), hypercalcémie ou hypocalcémie (calcium souvent normal), hypercholestérolémie, et acidose métabolique peuvent être documentées.\n• Analyse d'urine : habituellement isosthénurique ou occasionnellement une densité spécifique minimalement concentrée (chien < 1,030 ; chat < 1,035). Un sédiment actif peut indiquer une infection urinaire. Une protéinurie avec un examen du sédiment inactif doit être quantifiée par le rapport protéine/créatinine urinaire.\n• Culture d'urine : indiquée pour écarter une infection cliniquement silencieuse, incluant une pyélonéphrite\n• Dosage de l'hormone thyroïdienne (chats âgés) : écarter l'hyperthyroïdie comme trouble concomitant.\n• Pression artérielle : hypertension (PA systolique > 160-179 mm Hg, PA diastolique > 95-119 mm Hg) souvent identifiée ; peut causer des dommages aux organes cibles (surtout cœur, yeux, système nerveux central, reins)\n• Radiographies abdominales et/ou échographie : peuvent davantage élucider la cause de ou les facteurs contribuant à la MRC (ex., néphrolithes ou urétérolithes partiellement obstructifs, néoplasie rénale, maladie kystique, pseudokystes périnéphriques, pyélectasie). Des altérations de la forme, de la taille, et de l'échogénicité des reins sont fréquentes.\nTHÉRAPEUTIQUE=➭ Fluides IV-Débit de fluide : remplacement de la déshydratation (pourcentage de déshydratation [en décimal, ex., 10% = 0,1] × poids corporel kg = déficit en litres) plus pertes continues (volume estimé de polyurie, vomissements) plus besoins d'entretien Entretien:-Débit d'entretien : hautement variable selon le degré de polyurie, les pertes extrarénales, et l'apport volontaire. 60-75 mL/kg/jour est un bon point de départ\n• Supplémentation potassique en KCl ou gluconate de K dans les fluides basée sur la mesure des électrolytes (ne pas dépasser 0,5 mEq/kg/h) en raison de l'hypokaliémie.\n• Bloqueurs de l'histamine (ex., famotidine 0,2-0,5 mg/kg IV, SC, PO q 24h)\n• Sucralfate 0,25-1,0 g (dose totale) PO q 8h jusqu'à résolution des signes\n• Vomissements persistants:-Maropitant 1 mg/kg SC ou 2 mg/kg PO q 24h pendant 5 jours ;\n• Hyperphosphatémie : régime ± chélateur
