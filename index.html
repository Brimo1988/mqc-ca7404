s de phosphate (doivent être donnés avec la nourriture pour prévenir l'absorption du phosphore, hydroxyde ou carbonate d'aluminium, 30–100 mg/kg/jour PO avec les repas\n• Acidose:-Bicarbonate de sodium 10 mg/kg PO q 8-12h\n• Anémie- transfusion ou érythropoïétine humaine recombinante. Fer dextran 5-10 mg/kg IM q 2-4 semaines.\n• Hypertension systémique- Inhibiteurs de l'ECA, bloqueurs des canaux calciques\n• Un régime à quantité restreinte (mais de haute qualité) de protéines et restreint en phosphore (« régime rénal ») ralentit la progression de la MRC et diminue la sévérité de l'urémie clinique.\nInhibiteur de l'ECA (bénazépril ou énalapril) pour la protéinurie (débuter à 0,5 mg/kg PO q 24h ; peut augmenter à 1 mg/kg PO q12h si nécessaire pour réduire la protéinurie).\nPRONOSTIC=dépend de la sévérité."}]},{"id":"ira","nom":"Insuffisance rénale aiguë (lésion rénale aiguë)","sys":"Urinaire","urg":true,"resume":"Animal sain qui développe soudainement des signes urémiques : léthargie, vomissements, oligurie/anurie, halitose, ulcères. Azotémie, hyperkaliémie, acidose.","src":["Urgences (IRA)","SAM 2 — lésion rénale aiguë"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":"Surveiller la surhydratation si oligurie/anurie"},{"d":"furosemide","r":"S","n":"Oligurie après réhydratation"},{"d":"mannitol","r":"2","n":""},{"d":"maropitant","r":"S","n":""},{"d":"famotidine","r":"S","n":""},{"d":"kcl","r":"S","n":"Selon la kaliémie"}],"maj":"Rechercher la cause (leptospirose, éthylène glycol, AINS, hypovolémie). Dialyse/hémodialyse si anurie (IRIS : consensus sur l'hémodialyse intermittente 2024). Mortalité à court terme élevée (~60 %).","qc":"","al":"","gl":["iris_ira_chat_2024"]},"chat":{"tx":[{"d":"fluides","r":"U","n":""},{"d":"furosemide","r":"S","n":""},{"d":"maropitant","r":"S","n":""},{"d":"famotidine","r":"S","n":""}],"maj":"IRIS 2024 : lignes directrices sur la lésion rénale aiguë du chat (diagnostic, gradation, traitement).","qc":"","al":"","gl":["iris_ira_chat_2024"]}},"notes":[{"label":"Tableau des urgences — Insuffisance rénale aiguë (IRA) (p.84)","fields":[{"k":"Signes cliniques / examen physique","t":"Animal en santé qui développe soudainement des signes urémiques avec azotémie. Plus fréquent chez les jeunes animaux en liberté. Anurie (< 0,1 ml/kg/h), oligurie (< 0,5 ml/kg/h) ou polyurie (> 2 ml/kg/h). Inconfort abdominal, vomissements, collapsus, déshydratation."},{"k":"Diagnostic différentiel","t":"Azotémie prérénale, insuffisance rénale, obstruction rénale, diabète insipide."},{"k":"Diagnostic","t":"FSC : normale. Azotémie ; pré- BUN:créat > 20 (déshydratation, saignement GI), insuffisance rénale (< 15), post- (obstruction urinaire, rupture des voies urinaires). Hyperkaliémie, acidose métabolique. Échographie abdominale, ECG (signes d'hyperkaliémie). SDMA"},{"k":"Traitement (Rx)","t":"Fluidothérapie et surveillance de l'hydratation (polyurie). Surveiller la surhydratation en cas d'oligurie et d'anurie. Traitement de l'hyperkaliémie. Furosémide 50 mg/ml 2 mg/kg. Diminuer l'acidité gastrique (famotidine 1 mg/kg q12h) et Cerenia (1 mg/kg q24h pendant 5 jours)."},{"k":"Pronostic / prévention","t":"Réservé à mauvais"},{"k":"Surveillance / examens complémentaires","t":"production urinaire, ECG aux 3 h, auscultation (effort respiratoire), poids corporel, BUN et créat, équilibre acido-basique et électrolytes q6h, PCV, PT et PA q6h"},{"k":"Commentaires","t":"Diète restreinte en protéines et en P. Considérer le risque zoonotique de la leptospirose ; manipuler l'urine avec précaution"}]},{"label":"SAM 2 (notes détaillées)","text":"LÉSION RÉNALE AIGUË Déclin brutal du taux de filtration glomérulaire résultant en une accumulation de déchets azotés et une incapacité à maintenir un équilibre liquidien normal. Bien que la lésion rénale aiguë (LRA) soit rare globalement, c'est un résultat fréquent d'une exposition à des néphrotoxiques ou suite à une lésion rénale. Souvent, les animaux avec LRA sont plus jeunes que ceux avec une maladie rénale chronique. Lésion rénale initiée par diverses causes (ex., ischémie, toxique, infection) ex-éthylène glycol, plantes (ex., lys de Pâques, raisins secs, raisins), métaux lourds, médicaments (ex., aminoglycosides, amphotéricine B, cisplatine, sulfamides, tétracyclines, anti-inflammatoires non stéroïdiens, pigmenturie (hémoglobinurie, myoglobinurie), leptospirose.\n• SUBJECTIF-Certains ou tous peuvent être présents : oligurique ou anurique. Léthargie, dépression, vomissements, diarrhée, anorexie, haleine ou ulcères urémiques, déshydratation.\n• Inconfort abdominal/général\n• Augmentation du volume rénal à la palpation/radiographies\n• Polydipsie, polyurie d'apparition récente\n• Absence de miction (aucune production d'urine et aucune tentative d'uriner)\n• Plusieurs animaux dans le même foyer développant une LRA est compatible avec une exposition à une toxine, particulièrement d'origine alimentaire. Toute cause connue d'exposition à une toxine ou un médicament, une procédure médicale ou\nchirurgicale récente, et oligurie/anurie.\n• OBJECTIF-• Fréquent : - déshydratation, halitose, débris/sécrétions de la cavité buccale,\nptyalisme, reins de taille normale/augmentée\n• Peut aussi inclure :\n• Petite vessie\n• Douleur abdominale/rénale, reins augmentés de volume\n• Ulcérations muqueuses buccales (urémiques), haleine urémique.\n• Tachycardie, tachypnée. Injection sclérale.\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=• Diagnostic différentiel de l'azotémie :\n• Azotémie prérénale* (déshydratation, saignement gastro-intestinal)\n• Insuffisance rénale (aiguë ou chronique, ou aiguë sur chronique) Azotémie postrénale (occlusion des voies urinaires, rupture des voies urinaires)\n• PLAN- DIAGNOSTICS=NFS : normal, mais l'anémie (qui caractérise souvent la maladie rénale\nchronique) est typiquement absente ; d'autres changements liés à la cause de la LRA (ex- la leptospirose\npeut être associée à une fièvre inexpliquée + neutrophilie et/ou thrombopénie)\npeuvent être identifiés et devraient inciter à un test diagnostique pour la leptospirose.\nL'azotémie est une constatation constante (↑ urée, créatinine), ↑ hématocrite, protéines totales dues à la déshydratation.\nHyperphosphatémie L'hyperkaliémie survient avec oligurie/anurie, l'acidose métabolique est fréquente.\nHypocalcémie (ex. LRA induite par l'éthylène glycol) Cristallurie d'oxalate de calcium monohydraté\nHypercalcémie (ex. raticides contenant du cholécalciférol) est parfois\nnotée. PCR leptospirose-doxycycline ?\n• ⇨Analyse d'urine :-DSU ≤ 1,020 La présence d'une urine mal concentrée\n(densité spécifique 1,007–1,030)/isosthénurie, malgré déshydratation ET azotémie suggère un dysfonctionnement rénal. cylindres tubulaires (fréquents), pyurie (associée à la pyélonéphrite), +/− protéinurie, +/− hématurie, +/− bactériurie.\n• Radiographies abdominales : une augmentation du volume rénal est souvent présente (contraste avec les petits reins souvent identifiés dans la maladie rénale chronique).\n• Échographie abdominale : augmentation du volume rénal ; dilatation du bassinet rénal en association avec une pyélonéphrite ; altérations de l'échogénicité du parenchyme rénal souvent identifiées ; perte de la distinction cortico-médullaire souvent identifiée ; cortex hyperéchogène (associé à la toxicité de l'éthylène glycol mais aussi vu chez certains chats sains)\n• Électrocardiogramme -altéré par une hyperkaliémie prononcée (bradycardie [plus fréquente chez le chien que le chat], ondes P absentes, complexes QRS larges)\n• Mesure de la production d'urine : évaluer suite à une réhydratation complète. Bien qu'une LRA polyurique puisse survenir, la présentation classique est l'oligurie ou l'anurie. En contraste, l'insuffisance rénale chronique est associée à des volumes d'urine normaux ou excessifs.\nTHÉRAPEUTIQUE=➭ Fluidothérapie cristalloïde isotonique :\nRésoudre la déshydratation dans les premières 6 à 12 heures. Pourcentage de déshydratation (exprimé en décimal [c.-à-d., 10% = 0,1]) × poids corporel (kg) = déficit (litres) Compenser pour les pertes continues estimées (ex., vomissements, halètement). Fournir les fluides d'entretien (60 mL/kg/j). Promouvoir la diurèse en augmentant le débit de fluide au-dessus de l'entretien. Pratiquement, deux à trois fois le débit d'entretien sont appropriés, en supposant une production d'urine adéquate. Chez les animaux oliguriques/anuriques, les débits de fluides d'entretien peuvent être excessifs, donc surveiller la surhydratation. Éviter la surhydratation.\n• Promouvoir la production d'urine avec des médicaments si la production d'urine reste < 0,5 mL/kg/h malgré une réhydratation/fluidothérapie appropriée.\nFurosémide 2-6 mg/kg en bolus IV. Si l'oligurie persiste, répéter le bolus. Si la production d'urine > 1 mL/kg/h après le traitement en bolus, instaurer une perfusion à débit constant (0,25-1 mg/kg/h). Mannitol 250-500 mg/kg IV une fois. Attention : un volume vasculaire augmenté peut entraîner un œdème pulmonaire en cas de surhydratation.\n• Traiter les troubles acido-basiques et électrolytiques : Si le potassium > 7 mEq/L : traiter l'hyperkaliémie Si le pH < 7,1, instaurer un traitement au bicarbonate de sodium. ([0,3] ×[poids kg] × [déficit de base]).\nAdministrer 1/2 du déficit en fluides intraveineux sur 6 heures. Gluconate de calcium : 50-150 mg/kg (= 0,5-1,5 mL/kg de solution à 10%) IV lentement sur 10-20 minutes, avec\nune surveillance clinique et électrocardiographique constante. Insuline régulière et glucose, donner 0,25-0,5 unités d'insuline/kg IV, couvrant chaque unité d'insuline\nadministrée avec 2 g de dextrose (2 g = 4 mL de dextrose 50%) Bicarbonate de sodium 12 mEq/kg en bolus IV\n• Surveiller la pression artérielle.\n• Une hypertension systémique (pression systolique > 170 mm Hg) peut accompagner la LRA. Une hypertension persistante doit être traitée médicalement (amlodipine 0,025 mg/kg q 24\nh)\n• Traitement médical pour diminuer l'acidité gastrique Famotidine 0,5-1 mg/kg PO, IM, IV q 12-24h, ou oméprazole 0,5-1 mg/kg PO q 24h;\nefficacité retardée (jours)\n• Traitement antiémétique au besoin :\n• Maropitant 1-2 mg/kg SC ou PO q 24h pendant jusqu'à 5 jours consécutifs, ou métoclopramide 0,1-0,5 mg/kg PO, IM, SC q 6-8h ou 0,01-0,02 mg/kg/h en perfusion IV à débit constant,\n• La restriction en protéines et en phosphore est idéale, mais pas au détriment de l'appétit/\nde la palatabilité.\nSURVEILLANCE-▪ Jusqu'à ce que l'azotémie se résolve, la production d'urine soit >1 mg/kg/h, et l'animal boive volontairement ▪Urée/créatinine sériques q 24-48h ▪Poids corporel q 6-12h ▪Électrolytes (Na, K, Cl), statut acido-basique, et pression artérielle q 6-24h ▪Hématocrite et protéines totales q 24h ▪Mesurer la production d'urine- Les cathéters urinaires à demeure prédisposent à l'infection urinaire et ne doivent pas être laissés en place plus longtemps que nécessaire.\nFréquence et effort respiratoires q 1-4h\n• Poids corporel q 6-12h ■Une perte de poids représente une perte liquidienne ou une fonte musculaire. ■Un gain de poids chez un animal hydraté implique une rétention liquidienne (c.-à-d., surhydratation).\n• Pour les animaux hospitalisés avec LRA, surveiller la production d'urine tant pour les volumes diminués que\naugmentés est crucial.\n• Surveiller la fréquence et l'effort respiratoires des animaux avec LRA est essentiel.\nPRONOSTIC=Court terme : mauvais (taux de mortalité de 60% toutes causes de LRA confondues) PRÉVENTION-Si l'on envisage des médicaments à potentiel néphrotoxique, s'assurer d'abord de l'hydratation et surveiller la fonction\nrénale. Éduquer les propriétaires concernant les néphrotoxiques."}]},{"id":"uroperitoine","nom":"Uropéritoine","sys":"Urinaire","urg":true,"resume":"Fuite d'urine (rein, uretère, vessie, urètre) : dépression, vomissements, abdomen douloureux, azotémie/hyperkaliémie. Comparer créatinine/potassium du liquide abdominal à ceux du sang.","src":["Urgences (uropéritoine)"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":""},{"d":"buprenorphine","r":"S","n":""},{"d":"gluconate_ca","r":"U","n":"Si hyperkaliémie avec arythmie (ECG)"}],"maj":"Drainage péritonéal, sonde urétrale/cystostomie; stabiliser avant la chirurgie; pas d'AINS en cas d'azotémie.","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"fluides","r":"U","n":""},{"d":"buprenorphine","r":"S","n":""}],"maj":"Chat : petites fuites parfois gérées médicalement avec drainage; chirurgie si échec.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau des urgences — Uropéritoine (p.2041)","fields":[{"k":"Signes cliniques / examen physique","t":"Dépression, vomissements, +/- hématurie, déshydratation, douleur abdominale, ecchymoses ventrales, les chats peuvent avoir une hyperkaliémie sévère sans bradycardie"},{"k":"Diagnostic différentiel","t":"Abdomen aigu (pancréatite, obstruction GI), ascite : hypoalbuminémique, cardiogénique, hémorragique, IRA"},{"k":"Diagnostic","t":"BUN, créatinine et hyperkaliémie, HCO3 bas, échographie : liquide abdominal libre, radiographies abdominales : perte de détail séreux. Abdominocentèse : créatinine et K augmentés (deux fois) vs sérum"},{"k":"Traitement (Rx)","t":"NaCl 0,9 % : entretien + déshydratation, traitement de l'hyperkaliémie, analgésie et sédation, mise en place d'un cathéter de drainage péritonéal, sonde urétrale, pas d'AINS en cas d'azotémie, si infection urinaire antibiotique, sonde d'alimentation. Les chats avec de petites fuites peuvent répondre au traitement médical sans chirurgie. + Corriger l'hyperkaliémie"},{"k":"Pronostic / prévention","t":"bon avec un diagnostic précoce, une prise en charge d'urgence agressive et une réparation définitive"},{"k":"Surveillance / examens complémentaires","t":"signes vitaux, PA, électrolytes, ECG, production urinaire, BUN/créat, équilibre acido-basique, gaz sanguin veineux, PCV, vomissements, cathéters, poids corporel"}]},{"label":"Tableau des urgences — uropéritoine (VIN)","fields":[{"k":"Signes cliniques / examen physique","t":"causé par une fuite d'urine des reins, des uretères, de la vessie ou de l'urètre proximal. Dépression, vomissements, traumatisme ou urolithiase, abdomen douloureux, bradycardie due à l'hyperkaliémie ; la capacité d'uriner n'exclut pas une rupture des voies urinaires ou un uropéritoine ; le patient peut présenter ou non de l'hématurie. La palpation de la vessie n'exclut pas le diagnostic. hématurie, dysurie, strangurie, anurie, déshydratation, douleur abdominale, distension abdominale, ecchymoses, enflure périnéale ou sous-cutanée, réticence à marcher, dépression, léthargie, anorexie, vomissements, hypothermie, fièvre et arythmies cardiaques"},{"k":"Diagnostic différentiel","t":"Insuffisance rénale aiguë\nPéritonite bactérienne\nPéritonite biliaire\nHémoabdomen\nNéoplasie intra-abdominale ou des voies urinaires\nAutres causes d'épanchement abdominal\nInfection des voies urinaires\nUrolithiase"},{"k":"Diagnostic","t":"Radiographies abdominales : perte de détail séreux ; échographie : liquide libre ; drainage péritonéal, avec créatinine et potassium du liquide augmentés par rapport au sérum. Urée du liquide péritonéal similaire à celle du plasma\n Ratio créatinine du liquide abdominal / créatinine sérique > 2:1\n Ratio potassium du liquide abdominal / potassium sanguin > 1,4:1"},{"k":"Traitement (Rx)","t":"Soluté IV + traitement de l'hyperkaliémie + abdominocentèse + drainage abdominal ou dérivation urinaire par sonde urétrale ou tube de cystotomie. Après stabilisation : prise en charge chirurgicale. Antibiotiques après la chirurgie."},{"k":"Pronostic / prévention","t":"le pronostic est bon avec un diagnostic précoce, une prise en charge d'urgence agressive et une réparation définitive. Si récidivant, possible néoplasie"},{"k":"Surveillance / examens complémentaires","t":"production urinaire, électrolytes sériques, BUN, créat, ECG"}]}]},{"id":"chat_bloque","nom":"Obstruction urétrale du chat (« chat bloqué »)","sys":"Urinaire","urg":true,"resume":"Strangurie, léchage de la région génitale, vocalisations, vessie distendue, hyperkaliémie et acidose; peut être léthargique/hypothermique. Stabilisation (potassium, ECG) avant désobstruction. CPE : cas 9 (chat K 8,9 mmol/L).","src":["Urgences (chat bloqué)","Cas CPE 9"],"img":[],"sp":{"chat":{"tx":[{"d":"fluides","r":"U","n":"NaCl 0,9 %; corriger l'hyperkaliémie"},{"d":"gluconate_ca","r":"U","n":"Hyperkaliémie avec arythmie (+ ECG)"},{"d":"insuline_reguliere","r":"U","n":"Avec dextrose, pour l'hyperkaliémie"},{"d":"buprenorphine","r":"S","n":"Analgésie"},{"d":"lorazepam","r":"2","n":"Prévention de la récidive (étude 2026; substance contrôlée)"},{"d":"prazosine","r":"2","n":"Alternative à la phénoxybenzamine"},{"d":"tamsulosine","r":"2","n":""},{"d":"amitriptyline","r":"S","n":"Cystite idiopathique associée"}],"maj":"Désobstruction sous sédation/anesthésie. Étude randomisée 2026 (80 chats) : aucune récidive d'obstruction avec le lorazépam pendant 1 mois (0 %) vs 15,7 % avec placebo; données à confirmer. Les lignes directrices iCatCare 2025 couvrent FIC, urolithiases, IU et obstruction.","qc":"","al":"La phénoxybenzamine citée dans vos notes n'est pas commercialisée au Canada (BDPP) : prazosine ou tamsulosine.","gl":["et_lorazepam_2026","icatcare_lutd_2025"]}},"notes":[{"label":"Tableau des urgences — Chat bloqué (obstruction urétrale) (p.2029 p.1241)","fields":[{"k":"Signes cliniques / examen physique","t":"Strangurie, hématurie, léchage du prépuce ou de la vulve, vocalisations, vessie distendue, inconfort abdominal"},{"k":"Diagnostic différentiel","t":"IRA anurique, atonie du détrusor, MVAS/FLUTD, traumatisme, néoplasie"},{"k":"Diagnostic","t":"Biochimie : azotémie, hyperkaliémie. Cathétérisme urétral, radiographie. ECG : signes d'hyperkaliémie (ondes P absentes, complexes QRS larges, bradycardie)"},{"k":"Traitement (Rx)","t":"Soluté IV pour corriger la déshydratation et donner du gluconate de Ca 10 % 1,5 mL/kg en 15 min + ECG, insuline régulière 0,5 U/kg + dextrose 2 g/U ; buprénorphine 0,01 mg/kg, décompression par sonde urétrale : sous sédation ou anesthésie, lavage urétral rétrograde ; phénoxybenzamine 5 mg/kg PO q24h (diminue le tonus du sphincter)"},{"k":"Pronostic / prévention","t":"si l'obstruction est levée et les électrolytes corrigés - bon (excepté néoplasie), récidive"},{"k":"Surveillance / examens complémentaires","t":"K, glycémie q4, équilibre acido-basique, production urinaire, ECG aux 3 h, diète Hill's s/d"},{"k":"Commentaires","t":"Une urétrostomie périnéale est envisagée pour les chats mâles avec obstruction récidivante"}]},{"label":"Cas CPE 9","fields":[{"k":"Cas clinique","t":"Cas 9 – Chapitre 15. • Ivan est un chat d'intérieur mâle castré de 6 ans (6,2 kg – NEC 5/9) présenté pour léthargie et inappétence depuis 3 jours. Il n'avait pas présenté de vomissements ni de diarrhée, et les propriétaires n'avaient remarqué aucun changement dans ses habitudes urinaires. À la présentation, le patient était déshydraté à 7 % et était calme, alerte et réactif. Les TPR étaient les suivants : 98,6 °F, 180 bpm et 60 bpm. La pression artérielle systolique (Doppler) était de 140 mmHg. Une vessie volumineuse, turgescente et douloureuse a été détectée à la palpation abdominale et n'a pas pu être expulsée par une pression douce. Les anomalies électrolytiques initiales étaient : Na : 136 mmol/L (intervalle, 147–162), K : 8,9 mmol/L (intervalle, 2,9–4,2), BUN : > 140 mg/dL (intervalle, 15–34) et créatinine : 8,5 mg/dL (intervalle, 0,8–2,4). Le pH était de 7,151 (intervalle, 7,25–7,4). Le propriétaire a accepté l'hospitalisation et a autorisé toutes les mesures nécessaires durant le séjour. "},{"k":"Évaluation initiale et prise en charge","t":"• Chat bloqué\nDiagnostics différentiels.\n• Obstruction urétrale\n• Cystite\n• Obstruction vésicale (calculs)\n• Néoplasie\nPrise en charge.\nImmédiatement :\n• Bolus IV : RL (50 ml), gluconate de calcium à 10 % (3 ml), dextrose à 25 % (6 ml) et 1 unité d'insuline\nrégulière. Anesthésier les patients (prémédication de buprénorphine et de midazolam IV; induction au\npropofol; sévoflurane pour l'entretien). Placer une sonde urinaire (Slippery Sam Tomcat 3,5 Fr, 14 cm) pour\ndécomprimer la vessie.\n• Surveiller l'ECG pour détecter des ondes T anormalement hautes\nPost-intervention\n• Radiographies abdominales, NFS, bilan biochimique et analyse d'urine (+ culture)\n• Fluidothérapie d'entretien : Plasma-Lyte : 10 ml/h avec 5 % de dextrose\n• Buprénorphine : 0,09 mg q8h IV\n• Prazosine : 0,5 mg q12h PO\n• Envisager la chirurgie – urétrostomie périnéale (en attente de l'approbation du propriétaire).\nSurveiller – ECG, FC, FR, poids, pression artérielle, MM, bilan biochimique, température, débit urinaire, perméabilité\nde la sonde urinaire, attitude"},{"k":"Ordonnance (Rx)","t":"Marbofloxacine (2 mg/kg PO SID); Méloxicam (0,1 mg/kg PO SID); Prazosine (0,5 mg PO BID)"}]}]},{"id":"flutd","nom":"Maladie des voies urinaires inférieures du chat (FLUTD / cystite idiopathique)","sys":"Urinaire","urg":false,"resume":"Strangurie, hématurie, dysurie, pollakiurie, périurie. Causes : cystite idiopathique (≈ 2/3), urolithiase, infection, obstruction. Analyse d'urine + imagerie.","src":["SAM1 — MVAS (FLUTD)","SAM 2 — FLUTD"],"img":[],"sp":{"chat":{"tx":[{"d":"diete_therapeutique","r":"1","n":"Alimentation humide, hydratation"},{"d":"meloxicam","r":"1","n":"AINS pour la douleur (court terme)"},{"d":"robenacoxib","r":"1","n":"Onsior®"},{"d":"buprenorphine","r":"S","n":""},{"d":"gabapentine","r":"S","n":""},{"d":"fluoxetine","r":"2","n":"Troubles comportementaux (Reconcile® — chien; usage hors AMM chez le chat)"},{"d":"amitriptyline","r":"2","n":"Cas chroniques"}],"maj":"Modification multimodale de l'environnement (enrichissement, jeu, bacs, réduction du stress) : souvent suffisante. Les antibiotiques ne sont pas indiqués sans culture positive (ISCAID 2019). iCatCare 2025.","qc":"","al":"","gl":["icatcare_lutd_2025","iscaid_iu_2019"]}},"notes":[{"label":"Tableau SAM1 — MVAS (FLUTD) (p.716)","fields":[{"k":"Signes cliniques / examen physique","t":"strangurie, hématurie, dysurie, pollakiurie, périurie"},{"k":"Diagnostic différentiel","t":"Urolithiase, trouble comportemental (marquage territorial), anomalie anatomique des voies urinaires, IU peu fréquente ; carcinome à cellules transitionnelles"},{"k":"Diagnostic","t":"Analyse d'urine : hématurie, DS > 1,035, protéinurie +/− cristallurie, C&S urinaire : infection rare, radiographies abdominales"},{"k":"Traitement (Rx)","t":"enrichissement de l'environnement (souvent suffisant pour ↓ les SC) : possibilités de se cacher, regarder dehors, structures sur lesquelles grimper, périodes de jeu régulières. Phéromones (Feliway), Prozac - troubles comportementaux (buprénorphine, prazosine q8h)"},{"k":"Pronostic / prévention","t":"bon si non obstructif, peut récidiver"},{"k":"Surveillance / examens complémentaires","t":"La plupart des cas de MVAS idiopathique non obstructive sont spontanément résolutifs en 5–10 jours."}]},{"label":"SAM 2 (notes détaillées)","text":"MALADIE DES VOIES URINAIRES INFÉRIEURES FÉLINES (FLUTD) /\nSYNDROME UROLOGIQUE FÉLIN/CYSTITE IDIOPATHIQUE FÉLINE\nLes signes des voies urinaires inférieures (LUTS) incluent stranguries, hématurie, dysurie (miction difficile ou douloureuse), pollakiurie (émission fréquente de petites quantités d'urine), et périurie (miction en des endroits inappropriés). Ces signes peuvent survenir avec une maladie des voies urinaires inférieures (LUTD) de toute cause. La LUTD féline idiopathique se réfère aux LUTS en l'absence de cause connue et est un diagnostic d'exclusion (voir diagnostic différentiel, ci-dessous) et la cause la plus fréquente de LUTS\nchez le chat.\n• SUBJECTIF-L'anamnèse fréquente est un début brutal de LUTS chez un jeune chat adulte par ailleurs en bonne santé (2-6 ans). Souvent, les chats atteints sont logés entièrement en intérieur et sont stérilisés. Les chats mâles avec LUTD obstructive ont des stranguries non productives, peuvent vocaliser, vomir, et devenir progressivement déprimés/obtus.\n• OBJECTIF-Souvent anxieux, peut être agressif ou craintif Vessie typiquement petite et difficile à palper= (non obstruée) Peut être grande, douloureuse, tendue, et non exprimable= (obstruée)\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx= Urolithiase Infection urinaire Néoplasie vésicale (rare ; le carcinome à cellules transitionnelles est le type de tumeur le plus souvent identifié) Trouble comportemental (ex., marquage territorial)\n• PLAN- DIAGNOSTICS= L'analyse d'urine avec examen du sédiment révélera souvent une hématurie, une hypersthénurie (DSU > 1,035), une protéinurie +/− cristallurie. (aide à écarter une cystite) Culture et antibiogramme urinaires. Radiographie de l'ensemble des voies urinaires inférieures (incluant l'urètre distal) pour identifier des calculs radio-opaques. (aide à écarter des calculs)\n(Pour les chats avec une présentation typique de première fois, aucun test diagnostique supplémentaire n'est peut-être nécessaire.)\nTHÉRAPEUTIQUE=Traitement général aigu\nSi le chat est obstrué, le soulagement de l'obstruction, le rétablissement du débit urinaire, et la correction des déséquilibres liquidiens, électrolytiques, et acido-basiques sont de première importance. Établir un accès IV et fournir une analgésie appropriée. Soumettre des échantillons pour bilan biochimique sérique, NFS, et analyse d'urine. Bien que tous puissent fournir des informations utiles, la concentration sérique de potassium est de la plus haute\nimportance pour les chats avec occlusion urétrale.\nRéanimer les chats moribonds avec des fluides intraveineux (IV), et corriger les perturbations électrolytiques\net acido-basiques sérieuses avant l'anesthésie pour la pose d'un cathéter urinaire.\n• Obtenir un électrocardiogramme (ECG) chez tous les chats systémiquement malades avec occlusion urétrale. Les effets cardiotoxiques d'une hyperkaliémie prononcée peuvent devoir être traités même avant le retour des valeurs de laboratoire pour le potassium sérique (K+) si des arythmies sont présentes. 1. Envisager de décomprimer la vessie par cystocentèse avant de tenter de passer un cathéter urinaire (urétral). 2. Plusieurs méthodes sont décrites pour le soulagement de l'occlusion urétrale. 3. Gérer les chats médicalement sauf en cas d'occlusions récurrentes. Pour la plupart, des analgésiques (voir tableau) et une fluidothérapie appropriée sont indiqués. Les médicaments alpha-bloquants (ex., phénoxybenzamine, prazosine) n'ont pas montré d'efficacité.\n• Surveiller fréquemment la production d'urine chez les chats très malades. Une diurèse post-obstructive (>2 mL/kg/h) peut survenir peu après le soulagement de l'obstruction et la réhydratation. Pendant cette période, il est essentiel de donner suffisamment de fluides IV pour remplacer le volume perdu en urine. La diurèse diminue en 2-5 jours.\nPRONOSTIC=La plupart des cas de LUTS félins idiopathiques, non obstructifs, sont spontanément résolutifs, se résolvant habituellement en 5-10 jours. Cependant, des épisodes récurrents, incluant une occlusion des voies urinaires, surviennent avec une fréquence variable. Le pronostic global dépend du chat, du propriétaire, et de l'environnement : (Comme la cause de la cystite interstitielle féline est inconnue, le but du traitement est de réduire la sévérité et la fréquence des épisodes de cystite. Les considérations thérapeutiques incluent la réduction du stress par des changements environnementaux, des ajustements alimentaires (ex., utilisation de préparations en conserve), des phéromones appliquées topiquement dans l'environnement, et des analgésiques (ex., butorphanol, 0,2–0,4 mg/kg, PO, bid-tid). D'autres médicaments (ex.,\nAmitriptyline, 5–12,5 mg/chat, PO, une ou deux fois par jour ; Clomipramine, 0,5 mg/kg/jour, PO ;\nFluoxétine, 1 mg/kg/jour, PO) ont donné des résultats mitigés).\nTraitement chronique=ÉTAPE 1- Fournir au moins une gamelle de nourriture, un bol d'eau, et une litière par chat, plus une. Placer ces ressources dans des endroits calmes où le chat n'est pas effrayé pendant l'utilisation.\nFournir des opportunités pour que le chat se cache en sécurité et explore son environnement. Placer des « perchoirs » aux fenêtres pour que le chat puisse regarder dehors et des structures sur lesquelles le chat peut grimper semblent être des parties importantes de l'enrichissement environnemental. Des espaces extérieurs sécurisés (ex., enclos clôturés) offrent d'excellentes opportunités d'enrichissement. ÉTAPE 2 = étape 1 plus envisager l'utilisation de phéromones (Feliway). Si inefficace, passer à l'étape 3. ÉTAPE 3 = étapes 1 et 2 plus envisager l'utilisation d'un agent antidépresseur tricyclique (ATC) (ex., clomipramine ou amitriptyline) ou d'un inhibiteur sélectif de la recapture de la sérotonine (ISRS; ex., fluoxétine) à la dose efficace la plus basse possible Une urétrostomie périnéale peut être nécessaire dans les cas obstructifs récurrents sévères."}]},{"id":"struvite","nom":"Urolithiase à struvite","sys":"Urinaire","urg":false,"resume":"Forme rectangulaire en « couvercle de cercueil ». Diagnostic : radiographies/échographie, analyse d'urine + culture. Prévenir les récidives (diète, hydratation).","src":["SAM1 — struvites","SAM 2 — urolithiase"],"img":["sam2_p54_1"],"sp":{"chien":{"tx":[{"d":"amox_clav","r":"1","n":"Selon culture (calculs d'infection), traitement prolongé"},{"d":"diete_therapeutique","r":"1","n":"Diète de dissolution (S/O) — 1 mois après la disparition radiographique"}],"maj":"Chien : le plus souvent calculs d'infection (uréase). Dissolution médicale possible; culture d'urine initiale obligatoire. ACVIM 2016.","qc":"","al":"","gl":["acvim_uroliths_2016","iscaid_iu_2019"]},"chat":{"tx":[{"d":"diete_therapeutique","r":"1","n":"Diète de dissolution (stérile) 3–5 semaines"}],"maj":"Chat : struvite le plus souvent stérile; dissolution diététique rapide. Contrôle radiographique/échographique.","qc":"","al":"","gl":["acvim_uroliths_2016"]}},"notes":[{"label":"Tableau SAM1 — Struvites (p.2049)","fields":[{"k":"Signes cliniques / examen physique","t":"phosphate ammoniaco-magnésien, peut se retrouver dans l'urine normale"},{"k":"Diagnostic différentiel","t":"infection urinaire, néoplasie, prostatite, cause neurologique"},{"k":"Diagnostic","t":"radiographies abdominales et échographie, analyse d'urine, C&S"},{"k":"Traitement (Rx)","t":"Clavamox 12–25 mg/kg PO q 8–12h, non dissous/dissous (2 mois) (CHIEN), Royal Canin S/O 1 mois après la disparition radiographique, favoriser la consommation d'eau"},{"k":"Pronostic / prévention","t":"bon, récidive"},{"k":"Surveillance / examens complémentaires","t":"diète à long terme pour le chat, analyse d'urine et culture 7 j après le début des antibiotiques et après l'arrêt pour détecter une récidive. Objectif : pH < 7,0"}]},{"label":"SAM 2 (notes détaillées)","text":"Struvite forme rectangulaire caractéristique en « couvercle de cercueil ».\n• SUBJECTIF-\n• OBJECTIF-\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=\n• PLAN- DIAGNOSTICS=Le diagnostic est suspecté chez les chiens avec des calculs vésicaux\nradio-opaques/cristaux + urine alcaline + et/ou infection urinaire. Le diagnostic est suspecté chez les chats avec des\ncalculs vésicaux radio-opaques, une urine alcaline, et/ou une cristallurie de struvite.\n• NFS : sans particularité\n• Biochimie sérique (incluant électrolytes)=Sans particularité sauf occlusion des voies\nurinaires.\n• Analyse d'urine complète : pH neutre ou alcalin (fréquent), bactéries (particulièrement probables chez le chien), pyurie (particulièrement probable chez le chien), hématurie (inconstante), et cristallurie (inconstante) sont possibles. Le stockage de l'urine peut entraîner une précipitation de cristaux de struvite ; par conséquent, le sédiment urinaire doit être examiné dans l'heure suivant le prélèvement.\n• Culture d'urine (identifier l'uropathogène) et antibiogramme (influence le traitement antimicrobien)\n• Radiographies abdominales Test de confirmation- Analyse du calcul : les calculs récupérés doivent être soumis à une analyse quantitative\nTHÉRAPEUTIQUE=Bien que rare, l'occlusion des voies urinaires nécessite un soulagement immédiat. En l'absence\nd'occlusion urinaire, le traitement consiste soit en un régime de dissolution des calculs soit en un retrait manuel des calculs, et un traitement de l'infection urinaire.\n• Antibiotiques pour l'infection urinaire, basés sur les résultats de culture et d'antibiogramme. Généralement, le traitement antimicrobien est poursuivi jusqu'à ce que le calcul de struvite soit dissous ou retiré.\n• Choisir entre dissolution médicale et retrait mécanique des calculs : une occlusion urétrale doit être soulagée mécaniquement. Pour la dissolution médicale, des régimes calculolytiques et des antimicrobiens appropriés sont nécessaires :\n• Le temps moyen jusqu'à la dissolution est de 2-3 mois\n• L'analyse d'urine et la culture urinaire doivent être répétées 5-7 jours après le début du traitement médical. Les objectifs sont un pH urinaire < 7,0, une densité spécifique urinaire de 1,010-1,020, et une culture négative.\n• Le traitement médical est poursuivi 1 mois au-delà de la disparition radiographique des calculs. Surveillance recommandée\n• Répéter les radiographies toutes les 2-4 semaines pendant la dissolution médicale pour évaluer la taille et le nombre des calculs.\n• Si aucune amélioration n'est observée sur les radiographies après 4-8 semaines, un retrait mécanique est indiqué.\n• Répéter l'analyse d'urine 5-7 jours après le début du traitement de dissolution médicale pour\ns'assurer d'un pH entre 6,5 et 7, une densité spécifique entre 1,010 et 1,020, une absence de cristaux de struvite, et une absence de bactéries.\n• Idéalement, la culture d'urine est répétée 5-7 jours après le début du traitement de dissolution médicale pour s'assurer d'une urine stérile.\n• Répéter la culture d'urine 5-7 jours après l'arrêt des antibiotiques pour évaluer une récurrence de l'infection, puis à nouveau 3-4 semaines plus tard.\n• Si les causes prédisposantes de la cystite bactérienne ne peuvent être corrigées, ou chez les animaux avec urolithiase de struvite stérile, répéter les radiographies abdominales initialement tous les 3-6 mois pendant 1 an, puis tous les 6 mois ensuite.\nPrévention\n• Chiens : si l'infection urinaire peut être éliminée, un changement alimentaire à long terme n'est pas nécessaire.\n• Chats : l'utilisation à long terme de régimes en conserve de gestion de la struvite (ex., Royal Canin SO, Purina CNM UR St/Ox, ou Prescription Diet c/d Multicare) est préférable en cas de récurrence notée.\nPRONOSTIC=• Le pronostic pour la dissolution des calculs est bon.\n• La récurrence de l'urolithiase à struvite est fréquente."}]},{"id":"oxalate","nom":"Urolithiase à oxalate de calcium","sys":"Urinaire","urg":false,"resume":"Forme en « enveloppe » (octaèdres). Radio-opaque; urine acide; > 85 % des néphro-urétérolithes du chat. Chirurgie si signes cliniques.","src":["SAM1 — urolithiase à oxalate","SAM 2 — urolithiase (oxalate)"],"img":["sam2_p54_0"],"sp":{"chien":{"tx":[{"d":"diete_therapeutique","r":"1","n":"Diète d'urolithiase; favoriser la diurèse"},{"d":"citrate_k","r":"2","n":"Alcalinisation (citrate de potassium)"}],"maj":"Non dissolvable : retrait chirurgical ou endoscopique (lithotripsie, urohydropulsion); prévention par diète et hydratation. ACVIM 2016.","qc":"","al":"","gl":["acvim_uroliths_2016"]},"chat":{"tx":[{"d":"diete_therapeutique","r":"1","n":""},{"d":"citrate_k","r":"2","n":""}],"maj":"Chat : néphrolithes/urétérolithes fréquents; surveillance de la fonction rénale. Dérivation urétérale sous-cutanée (SUB) en cas d'obstruction urétérale (étude 2026 sur l'explantation).","qc":"","al":"","gl":["acvim_uroliths_2016"]}},"notes":[{"label":"Tableau SAM1 — Urolithiase à oxalate (p.2047)","fields":[{"k":"Signes cliniques / examen physique","t":"oxalate de calcium, > 85 % des néphro-urétérolithes, peut se retrouver dans l'urine normale"},{"k":"Diagnostic différentiel","t":"Infection urinaire, autres types d'urolithes, néoplasie des voies urinaires"},{"k":"Diagnostic","t":"Radiographies abdominales : radio-opaques, le plus souvent dans la vessie, parfois dans l'urètre, l'uretère, le bassin rénal."},{"k":"Traitement (Rx)","t":"Chirurgie si signes cliniques, antibiotiques si IU secondaire. Diètes ↓ protéines - favoriser la diurèse, alcaliniser l'urine Hill's u/d, w/d. Favoriser la consommation d'eau"},{"k":"Pronostic / prévention","t":"Répéter l'analyse d'urine q2 sem jusqu'à pH = 7,0–8,0 et absence de cristaux"},{"k":"Surveillance / examens complémentaires","t":"La récidive est fréquente. Éviter les suppléments de Ca, de vit. C et D, les diètes acidifiantes, les aliments riches en oxalates comme les légumes feuillus verts"}]},{"label":"SAM 2 (notes détaillées)","text":"UROLITHIASE\nOxalate (forme en « planches de clôture »)\n• SUBJECTIF-Les signes cliniques peuvent être absents. S'ils sont présents, ils peuvent inclure :\n• Hématurie\n• Pollakiurie\n• Dysurie\n• Stranguries\n• Élimination inappropriée (périurie)\n• Rarement, maladie systémique due à une occlusion urinaire\n• Les calculs de phosphate de calcium peuvent survenir secondairement à une hyperparathyroïdie primaire.\n• La cystinurie survient avec le syndrome de Fanconi\n• Polyurie/polydipsie si hypercalcémie concomitante, MRC, ou hyperadrénocorticisme\n• OBJECTIF- L'examen est souvent sans particularité. Les anomalies, si présentes, peuvent inclure :\n• Hématurie (taches sur le prépuce, la vulve, si présent, ou les jarrets)\n• Vessie urinaire douloureuse\n• Calculs vésicaux palpables\n• Calculs urétraux palpables (via examen rectal digital)\n• Vessie augmentée de volume et tendue, si occlusion urétrale\n• Augmentation du volume rénal, si hydronéphrose secondaire ou reins petits et irréguliers si MRC\n• Constatations associées à des facteurs prédisposants (ex., hyperadrénocorticisme : ventre ballonné, alopécie, hépatomégalie\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=• Infection urinaire\n• Autres types de calculs\n• Néoplasie des voies urinaires\n• PLAN- DIAGNOSTICS=Le diagnostic est suspecté chez les animaux avec des calculs vésicaux radio-opaques et une urine\nacide, ou chez les animaux avec des néphrolithes radio-opaques.\n• NFS : sans particularité\n• Biochimie sérique (incluant électrolytes)= Typiquement sans particularité\nAzotémie, hyperkaliémie, acidose métabolique SI occlusion des voies urinaires\n• Analyse d'urine : pH acide à neutre sauf infection urinaire ; cristallurie (inconstante) ; hématurie et/ou pyurie (occasionnelle)\n• Le stockage de l'urine peut entraîner une précipitation de cristaux d'oxalate (artefact) ; le sédiment urinaire doit être examiné dans l'heure suivant le prélèvement.\n• Culture bactérienne urinaire et antibiogramme pour écarter une infection secondaire\n• Radiographies abdominales : les calculs radio-opaques sont le plus souvent situés dans la vessie, parfois l'urètre, l'uretère, ou le bassinet rénal.\nTest de confirmation- • Analyse du calcul : les calculs récupérés doivent être soumis à une analyse quantitative pour déterminer le type de calcul.\n• Culture du calcul : si la culture urinaire par cystocentèse est négative\nTHÉRAPEUTIQUE=Une occlusion urétrale nécessite un soulagement immédiat. Les calculs d'oxalate ne peuvent pas être dissous par un traitement médical, donc les calculs dans la vessie ou l'urètre doivent être retirés mécaniquement s'ils causent des signes cliniques. La récurrence est fréquente (jusqu'à 50% en 3 ans chez le chien).\n• Soulager l'occlusion urétrale\n• Antibiotiques (choix basé sur culture et antibiogramme) si infection urinaire secondaire Retrait mécanique des calculs vésicaux/urétraux produisant des signes cliniques. Les radiographies doivent être répétées ensuite pour s'assurer du retrait complet : PRÉVENTION-Éviter les suppléments de calcium, les régimes acidifiants, et les aliments\nriches en oxalate comme les légumes à feuilles vertes. Nourrir avec des régimes réduits en protéines, qui favorisent la diurèse et la formation d'urine alcaline (ex., Hill's u/d ou w/d). Nourrir avec des aliments en conserve ou ajouter de l'eau aux aliments secs quand possible.\nSurveillance recommandée\n• Répéter l'analyse d'urine toutes les 2 semaines, en commençant 2 semaines après le retrait des calculs et le début des changements alimentaires jusqu'à ce que le pH urinaire = 7,0-8,0, la densité spécifique soit inférieure à 1,025, et aucun cristal d'oxalate de calcium ne soit trouvé. Si les objectifs ne sont pas atteints, envisager d'ajouter des thérapies supplémentaires.\n• Répéter les radiographies abdominales + analyse d'urine tous les 3-6 mois × la première année, puis tous les 6-12 mois ensuite, pour évaluer la récurrence des calculs.\n• Surveiller, traiter toute condition concomitante (ex., hypercalcémie, hyperadrénocorticisme).\nPRONOSTIC=La récurrence est fréquente ; par conséquent, une surveillance et des soins à long terme sont nécessaires."}]},{"id":"urate","nom":"Urolithiase à urates","sys":"Urinaire","urg":false,"resume":"Calculs radiotransparents; urine acide; chiens avec shunt portosystémique/dalmatiens.","src":["SAM 2 — urolithiase (urate)"],"img":[],"sp":{"chien":{"tx":[{"d":"allopurinol","r":"1","n":"Avec diète pauvre en purines"},{"d":"citrate_k","r":"S","n":"Alcalinisation"}],"maj":"Dalmatiens et chiens avec shunt portosystémique surreprésentés; radiotransparents. Prudence avec l'allopurinol (xanthine).","qc":"","al":"","gl":["acvim_uroliths_2016"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"Urate\n• Deuxième minéral le plus fréquent dans les calculs chez les chiens et chats néonataux (après la struvite induite par infection)\n• Chiens et chats néonataux/jeunes adultes avec des shunts porto-systémiques (SPS) ou une dysplasie microvasculaire hépatique (MVD).\n• Les dalmatiens à acide urique élevé (HUA) (non rétrocroisés) sont uniques dans leur excrétion d'acide urique au lieu d'allantoïne comme produit final du métabolisme des purines, mais seulement un sous-ensemble développe une urolithiase à l'urate. La tendance à former des calculs est héréditaire\n• En raison d'un SPS congénital, les schnauzers miniatures, les shih tzus, et les terriers du Yorkshire sont aussi\nsurreprésentés pour les calculs d'urate.\n• SUBJECTIF-Les signes cliniques sont souvent absents. Quand apparents, ils peuvent inclure:\n• Hématurie\n• Pollakiurie\n• Élimination inappropriée (périurie)\n• Dysurie\n• Stranguries\n• Si SPS et/ou MVD est présent, retard de croissance\n• Si un dysfonctionnement hépatique est présent, encéphalopathie et/ou hypoglycémie (ex. altération de l'état mental, convulsions)\n• Maladie systémique due à une occlusion urinaire\n• OBJECTIF-L'examen physique est habituellement sans particularité. Les anomalies peuvent inclure :\n• Hématurie (taches sur le prépuce, la vulve) • Calculs vésicaux palpables\n• Calculs urétraux palpables (via examen rectal digital chez le chien)\n• Vessie augmentée de volume et tendue si occlusion urétrale présente\n• +/− signes de SPS, MVD, encéphalopathie hépatique.\n• ÉVALUATION-\nLISTE DES PROBLÈMES= DDx=\n• PLAN- DIAGNOSTICS=Le diagnostic est suspecté chez les chiens avec des calculs radiotransparents et soit une\nprédisposition de race soit un dysfonctionnement hépatique. Le diagnostic chez les chats et les chiens sains d'autres races est habituellement basé sur une analyse quantitative du calcul\n• NFS : souvent sans particularité, mais le SPS est associé à une microcytose.\n• Bilan biochimique sérique : souvent sans particularité, mais peut suggérer un dysfonctionnement hépatique. Une occlusion des voies urinaires peut entraîner une azotémie, une hyperkaliémie, et une acidose métabolique.\n• Analyse d'urine : fréquemment aciduria ; des cristaux d'urate parfois identifiés ; une irritation physique et/ou une infection secondaire mènent parfois à une hématurie, une pyurie, ou une bactériurie\n• Culture d'urine et antibiogramme pour écarter une infection secondaire\n• Radiographies abdominales : les calculs d'urate sont souvent radiotransparents (radio-opacité : struvite ≥oxalate = CaPO4 = silice > cystine > urate). Si visibles, souvent quelques calculs lisses et ronds identifiés\n• La microhépatie est évocatrice de SPS, MVD, cirrhose.\n• Échographie abdominale : confirme l'urolithiase, qui peut être manquée sur les radiographies abdominales. Confirme la localisation des calculs dans les voies urinaires ; peut identifier un SPS, des anomalies hépatiques.\nTHÉRAPEUTIQUE=• Soulager l'occlusion des voies urinaires.\n• Si présente, traiter l'encéphalopathie hépatique.\n• Si présente, traiter l'infection urinaire.\n• Choisir entre dissolution médicale et retrait mécanique\n• Si l'urine reste acide après le changement de régime vers un régime pauvre en purines, envisager d'ajouter\ndu bicarbonate de sodium (25-50 mg/kg PO q 12h) ou du citrate de potassium (75 mg/kg PO q 12-24h), avec un ajustement de dose pour maintenir un pH urinaire de 7,0 à 7,5\n• Allopurinol 15 mg/kg PO q 12h, avec réduction de dose pour les chiens azotémiques, pour la dissolution\n• Animaux avec maladie hépatique :- La correction chirurgicale du SPS prévient la récurrence ; une cystotomie peut être utilisée pour retirer les calculs pendant la correction chirurgicale du shunt hépatique.\nSurveillance recommandée Bilan biochimique sérique et analyse d'urine 2 semaines après le changement de régime. L'objectif est un pH urinaire 7,0 à 8,0, une densité spécifique < 1,020, et une absence de cristaux. En supposant une fonction rénale adéquate et l'observance du régime, l'urée devrait être < 10 mg/dL. Surveiller l'analyse d'urine toutes les 2-4 semaines jusqu'à résolution des calculs et tous les 3-6 mois ensuite. Prévention\n• Éviter les régimes riches en protéines chez les chiens à risque (ex., dalmatien), mais des régimes sévèrement restreints en protéines ou l'allopurinol avant un premier épisode d'urolithiase à l'urate ne sont pas recommandés.\n• L'héritabilité de la tendance à former des calculs d'urate suggère que la reproduction des dalmatiens affectés doit être évitée.\n• Un traitement diététique à long terme +/− allopurinol (5-7 mg/kg PO q 12h) est indiqué pour le dalmatien après un premier épisode d'urolithiase.\nPRONOSTIC=bon"}]},{"id":"iu","nom":"Infection urinaire bactérienne","sys":"Urinaire","urg":false,"resume":"Plus fréquente chez la femelle; dysurie, pollakiurie, hématurie. Analyse d'urine + culture par cystocentèse; traiter selon sporadique vs récurrente/compliquée.","src":["SAM1 — infection urinaire"],"img":[],"sp":{"chien":{"tx":[{"d":"amoxicilline","r":"1","n":"Première ligne (cystite sporadique non compliquée)"},{"d":"sulfa_tmp","r":"2","n":"Triméthoprime-sulfa (alternative)"},{"d":"meloxicam","r":"S","n":"Douleur/inconfort (ISCAID : AINS en attendant la culture)"},{"d":"enrofloxacine","r":"2","n":"Réservé aux cas compliqués (culture)"}],"maj":"ISCAID 2019 : cystite sporadique = 3–5 jours (amoxicilline ou TMS); ne pas traiter la bactériurie subclinique (même avec pyurie). Une revue systématique 2025 souligne le manque de données comparant durées courtes et longues (lacune de connaissances).","qc":"","al":"Vos notes : amoxicilline-clavulanate 7–10 jours — ⚠ dépassé : amoxicilline seule en 1re ligne et 3–5 jours pour la cystite sporadique; culture si récidive.","gl":["iscaid_iu_2019","rs_iu_duree_2025"]},"chat":{"tx":[{"d":"amoxicilline","r":"1","n":"Chez le chat, éviter les antibiotiques empiriques sans culture"},{"d":"meloxicam","r":"S","n":""},{"d":"robenacoxib","r":"S","n":""}],"maj":"Chez le chat, les signes urinaires bas sont rarement d'origine bactérienne : confirmer par culture avant d'antibiothérapie (ISCAID 2019; iCatCare 2025).","qc":"","al":"Vos notes : amoxicilline-clavulanate 10 jours — à réévaluer (voir ISCAID 2019).","gl":["iscaid_iu_2019","icatcare_lutd_2025"]}},"notes":[{"label":"Tableau SAM1 — Infection urinaire (IU) (p.518, 523)","fields":[{"k":"Signes cliniques / examen physique","t":"Plus fréquente chez les femelles que chez les mâles. Plus chez les chiens que chez les chats"},{"k":"Diagnostic différentiel","t":"urolithes, prostatite, néoplasie des voies urinaires inférieures, MVAS/FLUTD, uropathie obstructive"},{"k":"Diagnostic","t":"analyse d'urine, C&S"},{"k":"Traitement (Rx)","t":"amoxicilline/acide clavulanique 62,5 mg/CHAT PO q12h 10 jours. Chiens : 12,5 mg/kg PO q12h 7 jours. Augmenter la consommation d'eau, antiseptiques urinaires"},{"k":"Pronostic / prévention","t":"bon si non compliquée (pas de pyélonéphrite ni d'urolithiase)"},{"k":"Surveillance / examens complémentaires","t":"cas compliqués d'IU : au moins 4 sem d'antibiotiques et vérifier la prostate, la pyélonéphrite et la formation de struvites"}]}]},{"id":"pyelonephrite","nom":"Pyélonéphrite","sys":"Urinaire","urg":false,"resume":"Infection rénale (bactéries ascendantes ou hématogènes) : fièvre, douleur rénale, azotémie, leucocytose. Culture avant antibiotiques.","src":["SAM 2 — pyélonéphrite"],"img":[],"sp":{"chien":{"tx":[{"d":"enrofloxacine","r":"1","n":"En attendant la culture/sensibilité (usage réservé)"},{"d":"amox_clav","r":"2","n":"Selon culture"},{"d":"fluides","r":"S","n":""}],"maj":"ISCAID 2019 : traitement 10–14 jours selon la réponse et la culture; urocultures de contrôle. Rechercher une cause favorisante (calculs, anomalies anatomiques).","qc":"","al":"","gl":["iscaid_iu_2019"]},"chat":{"tx":[{"d":"amox_clav","r":"1","n":"Selon culture"},{"d":"fluides","r":"S","n":""},{"d":"maropitant","r":"S","n":""}],"maj":"Chat : élévation de SAA/KIM-1 urinaire étudiée (2026); culture indispensable.","qc":"","al":"","gl":["iscaid_iu_2019"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"PYÉLONÉPHRITE-infection rénale due à des bactéries ascendantes ou une dissémination hématogène.\nles femelles sont prédisposées; plus fréquente chez les animaux âgés L'animal peut présenter une douleur rénale/du flanc/lombaire, de la fièvre, un malaise, parfois des vomissements, PU/PD, une déshydratation, une augmentation du volume rénal. Culture et antibiogramme urinaires : avant traitement chaque fois qu'une suspicion de pyélonéphrite existe. Échographie abdominale : la dilatation du bassinet rénal est fréquente. L'analyse d'urine montre une protéinurie, une pyurie, une bactériurie, ou une hématurie. Des cylindres de globules blancs peuvent être présents dans le sédiment urinaire frais. La pyélonéphrite est traitée agressivement avec des antibiotiques à large spectre basés sur culture et antibiogramme pendant 4-8 semaines. Amoxicilline + Enrofloxacine. La fluidothérapie peut prévenir la progression de la pyélonéphrite aiguë vers une lésion rénale aiguë azotémique. Pronostic-réservé à bon selon la capacité à corriger la cause prédisposante et\nla sensibilité antimicrobienne du pathogène."}]},{"id":"incontinence","nom":"Incontinence urinaire (insuffisance du sphincter urétral)","sys":"Urinaire","urg":false,"resume":"Écoulement goutte à goutte d'urine, y compris pendant le sommeil; irritation du périnée. NMI/NMS à exclure; culture d'urine; cystouréthrographie/endoscopie.","src":["SAM1 — incontinence urinaire"],"img":[],"sp":{"chien":{"tx":[{"d":"ppa","r":"1","n":"Phénylpropanolamine (Proin®, Propalin®) — surveiller la PA"},{"d":"estriol","r":"2","n":"Estriol (Incurin®) : non commercialisé au Canada (magistral)"}],"maj":"Chienne stérilisée (IMSU) : PPA = premier choix; options chirurgicales/injection de collagène si échec; exclure IU, uretères ectopiques, causes neurologiques.","qc":"","al":"Estriol (Incurin®) : non répertorié dans la BDPP canadienne.","gl":[]}},"notes":[{"label":"Tableau SAM1 — Incontinence urinaire (p.1076, 2036)","fields":[{"k":"Signes cliniques / examen physique","t":"Écoulement goutte à goutte d'urine, y compris pendant le sommeil, irritation du périnée, déficits neurologiques, épaississement de l'urètre au toucher rectal"},{"k":"Diagnostic différentiel","t":"NMI/NMS, incompétence du mécanisme du sphincter urétral (chiennes adultes), uretère(s) ectopique(s), sténose vaginale, prostatite"},{"k":"Diagnostic","t":"NMS : vessie difficile à exprimer, NMI : vessie facile à exprimer ; ↓ tonus anal, sensibilité périnéale, douleur au soulèvement de la queue en cas de maladie lombosacrée, douleur à la palpation de la colonne, ataxie, déficits proprioceptifs en cas de maladie de la moelle épinière. Analyse d'urine : pyurie - inflammation, hématurie - inflammation/néoplasie. Culture d'urine pour exclure une infection. Cystouréthrographie, endoscopie"},{"k":"Traitement (Rx)","t":"IMSU : comprimés de phénylpropanolamine (PPA) 1–2 mg/kg q8h, vérifier la PA, comprimés d'estriol (Incurin)"},{"k":"Pronostic / prévention","t":"Le traitement est généralement efficace en cas d'IMSU"},{"k":"Surveillance / examens complémentaires","t":"un ajustement de la dose est souvent nécessaire et les infections urinaires doivent être identifiées et traitées - recommander culture et antibiogramme"}]}]},{"id":"cystite_fongique","nom":"Cystite fongique","sys":"Urinaire","urg":false,"resume":"Infection urinaire à Candida (levures); cytologie, culture fongique.","src":["SAM1 — cystite fongique"],"img":[],"sp":{"chien":{"tx":[{"d":"fluconazole","r":"1","n":"Candida albicans : 4–6 semaines"}],"maj":"Rare : rechercher une cause favorisante (diabète, antibiotiques/immunosuppresseurs prolongés, sonde).","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"fluconazole","r":"1","n":""}],"maj":"Même approche; confirmation par culture fongique.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau SAM1 — Cystite fongique (p.526)","fields":[{"k":"Diagnostic différentiel","t":"IU bactérienne, MVAS/FLUTD"},{"k":"Diagnostic","t":"visible dans le sédiment, culture fongique de l'urine"},{"k":"Traitement (Rx)","t":"C. albicans : fluconazole 5–10 mg/kg PO q 12–24h pendant 4–6 semaines"}]}]},{"id":"prostatite","nom":"Prostatite bactérienne","sys":"Urinaire","urg":false,"resume":"Aiguë : ténesme, dysurie, démarche raide, fièvre; chronique : IU récidivantes. Palpation rectale, échographie, culture du liquide prostatique.","src":["SAM1 — prostatite"],"img":[],"sp":{"chien":{"tx":[{"d":"enrofloxacine","r":"1","n":"4–6 semaines (pénétration prostatique)"},{"d":"sulfa_tmp","r":"2","n":""},{"d":"finasteride","r":"S","n":"Réduction de volume de la prostate"},{"d":"clindamycine","r":"2","n":"Si bactéries à Gram positif sensibles"}],"maj":"ISCAID 2019 : antibiotiques liposolubles (fluoroquinolones, TMS) pendant plusieurs semaines; culture du liquide prostatique/urine; castration. Dépistage de Brucella canis chez le mâle entier reproducteur.","qc":"","al":"","gl":["iscaid_iu_2019"]}},"notes":[{"label":"Tableau SAM1 — Prostatite (p.1648)","fields":[{"k":"Signes cliniques / examen physique","t":"Aiguë : ténesme, dysurie, démarche raide, hématurie. Chron. : infections urinaires récidivantes, écoulement préputial, ténesme, dysurie, prostate N/↑, douloureuse. Abcès : prostatomégalie asymétrique, signes systémiques"},{"k":"Diagnostic différentiel","t":"abcès/kyste/néoplasie prostatique, hyperplasie prostatique bénigne, calculs urétraux, cystite, colite, carcinome à cellules transitionnelles"},{"k":"Diagnostic","t":"FSC : inflammation possible. Analyse d'urine : inflammation. Sédiment - C&S. Radiographies, radiographies abdominales, échographie abdominale détecte la prostatomégalie. Analyse du liquide prostatique (massage prostatique) : ↑ GB (bactéries), GR. PAF/biopsie de la prostate si hypertrophiée"},{"k":"Traitement (Rx)","t":"enrofloxacine 5 mg/kg PO q12–24h pendant 4–6 semaines, castration ou réduction du volume de la prostate avec finastéride 5 mg/CHIEN PO q 24h (10–40 kg de poids corporel), drainage de l'abcès. Dépistage de B. canis"},{"k":"Pronostic / prévention","t":"passable"},{"k":"Surveillance / examens complémentaires","t":"palpation rectale q2 sem pendant le traitement. Culture et cytologie du liquide prostatique/urine 2 sem après la fin des antibiotiques, puis 4 semaines plus tard"},{"k":"Commentaires","t":"Un chien avec une hypertrophie de la prostate a souvent des antécédents d'efforts pour uriner ou déféquer. De plus, certains chiens atteints d'une maladie prostatique auront du sang dans l'urine ; cependant, l'urine sanglante n'est pas spécifique d'une maladie prostatique"}]}]},{"id":"hbp","nom":"Hypertrophie prostatique bénigne (HBP)","sys":"Urinaire","urg":false,"resume":"Mâle entier âgé : prostatomégalie symétrique, ténesme ± hématurie. Pronostic excellent pour l'HBP.","src":["SAM 2 — hypertrophie prostatique"],"img":[],"sp":{"chien":{"tx":[{"d":"finasteride","r":"1","n":"Usage hors AMM (Proscar®)"},{"d":"osaterone","r":"2","n":"Non commercialisé au Canada (BDPP)"}],"maj":"La castration est curative; finastéride si reproduction souhaitée. Exclure prostatite, kystes et néoplasie.","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"HYPERTROPHIE PROSTATIQUE\n• Augmentation de volume de la prostate due à des causes stériles, non néoplasiques. Chez le chien, ce sont l'hyperplasie bénigne de la prostate (HBP), les kystes prostatiques, et la métaplasie squameuse. Chiens mâles adultes, presque exclusivement entiers sexuellement (exception : néoplasie prostatique)\n• SUBJECTIF-• La prostatomégalie due à toute cause peut être une découverte fortuite, ou elle\npeut causer un ténesme.\n• L'HBP ne cause souvent aucun signe clinique. Quand c'est le cas, les signes le plus souvent rapportés sont le ténesme et un écoulement urétral sanguinolent pas nécessairement associé à la miction. Contrairement à la situation chez l'homme, l'HBP cause rarement des stranguries ou une rétention urinaire chez le chien car la prostate augmente de volume en s'éloignant de l'urètre plutôt qu'en l'empiétant.\n• Les kystes paraprostatiques ne causent souvent aucun signe clinique (découvertes fortuites). Quand présents, les signes cliniques sont associés à une interférence mécanique avec les viscères abdominaux.\n• La métaplasie squameuse de la prostate peut être asymptomatique ou causer des signes similaires à l'HBP +/− des signes d'hyperœstrogénisme.\n• OBJECTIF-➭Palpation rectale et abdominale minutieuse de la prostate.\n• Une prostatomégalie chez un chien castré doit immédiatement inciter à rechercher une néoplasie prostatique ou la possibilité de testicule(s) cryptorchide(s).\n• HBP : augmentation de volume symétrique, non douloureuse de la prostate ± écoulement urétral (préputial) sanguinolent. Adulte entier par ailleurs en bonne santé\n• Kystes prostatiques :\n• Kyste paraprostatique : grande masse abdominale moyenne ou caudale ; par ailleurs en bonne santé\n• Kyste intraprostatique : comme pour l'HBP +/− asymétrie si volumineux\n• Métaplasie squameuse de la prostate :\n• Prostate symétrique, non douloureuse. L'hyperœstrogénisme cause l'augmentation de volume de la glande prostatique chez le chien.\n• Masse testiculaire avec atrophie du testicule controlatéral\n• ± Alopécie, pigmentation, gynécomastie, prépuce et scrotum pendulaires, ou autres constatations (ex., suppression médullaire) causées par l'hyperœstrogénisme\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=\n• PLAN- DIAGNOSTICS=➭Constatations d'examen physique de prostatomégalie et présence des testicules :\n• Palpation rectale quand une prostatomégalie symétrique, non douloureuse est une découverte fortuite d'examen physique chez un mâle entier âgé par ailleurs normal et en bonne santé, un diagnostic provisoire d'HBP est justifié. L'échographie serait confirmatoire, mais il n'y a habituellement pas d'urgence. Une surveillance attentive serait aussi raisonnable.\n• La prochaine étape diagnostique est de palper le scrotum pour la présence de testicules ± une tumeur testiculaire\n• Échographie :\n• L'HBP cause une prostatomégalie symétrique avec une capsule lisse et une échotexture mixte homogène du parenchyme ± quelques petits kystes (<10 mm). L'urètre est normal.\n• Un liquide anéchogène dans les kystes intra- et para-prostatiques ± une HBP concomitante sont fréquents. Les kystes paraprostatiques sont souvent très volumineux (ex., >15 cm de diamètre) et peuvent mimer la vessie urinaire en apparence échographique.\n• Aucune lymphadénopathie, qui pourrait être présente avec une infection prostatique ou une néoplasie\n• Échographie des testicules si une tumeur sécrétant des œstrogènes est suspectée mais non palpable.\n• Des radiographies abdominales sont indiquées si un ténesme est présent :\n• L'HBP, le kyste intraprostatique, et la métaplasie squameuse causent une prostatomégalie ± déplacement dorsal du côlon.\n• Le kyste paraprostatique apparaît comme une masse de tissu mou abdominale moyenne ou caudale, parfois avec calcification. Déplacement du côlon et/ou de la vessie. Sur des radiographies simples seules, peut être difficile à différencier de la vessie.\n• Aucune preuve de métastase osseuse dans le bassin ou les vertèbres lombaires, qui pourrait être présente avec une néoplasie prostatique\n• Analyse d'urine et culture urinaire indiquées si des signes urinaires sont présents :\n• Une hématurie macroscopique ou microscopique peut être trouvée.\n• Résultats de culture négatifs. Des résultats de culture positifs indiquent une infection urinaire concomitante et/ou une prostatite bactérienne.\nTHÉRAPEUTIQUE=\n• La castration est le traitement de choix (curatif) pour les chiens avec des signes cliniques dus à l'HBP, des kystes prostatiques, ou des tumeurs testiculaires sécrétant des œstrogènes.\n• Finastéride (Proscar, Propecia) 0,1-0,2 mg/kg PO q 24h, ou 5 mg/CHIEN/j PO ; usage hors AMM\nPRONOSTIC=Excellent pour l'HBP et les kystes intraprostatiques"}]},{"id":"pyometre","nom":"Pyomètre","sys":"Urinaire","urg":true,"resume":"Diœstrus (2–4 semaines après les chaleurs), non stérilisée : léthargie, vomissements, PU/PD, écoulement vulvaire; leucocytose; utérus distendu (écho). Stabiliser puis OVH.","src":["Urgences (pyomètre)","SAM 2 — pyomètre"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":""},{"d":"amox_clav","r":"1","n":"Antibiothérapie à large spectre"},{"d":"cefazoline","r":"1","n":"Péri-opératoire"},{"d":"buprenorphine","r":"S","n":""},{"d":"maropitant","r":"S","n":""}],"maj":"Ovariohystérectomie = traitement de choix. Le traitement médical (prostaglandines, aglépristone) est réservé aux animaux de reproduction stables; aglépristone non répertoriée dans la BDPP canadienne.","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"fluides","r":"U","n":""},{"d":"amox_clav","r":"1","n":""},{"d":"cefazoline","r":"1","n":""},{"d":"buprenorphine","r":"S","n":""}],"maj":"Chatte : plus rare que chez la chienne; même urgence chirurgicale.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau des urgences — Pyomètre (VIN)","fields":[{"k":"Signes cliniques / examen physique","t":"était en chaleur il y a 2–4 sem (diœstrus), non stérilisée, léthargie, vomissements, constipation aiguë, PU/PD, distension abdominale, écoulements vulvaires si ouvert, fièvre, MM congestionnées ou pâles"},{"k":"Diagnostic différentiel","t":"Vaginite\nMucomètre\nHydromètre\nHématomètre\nNéoplasie utérine\nMétrite"},{"k":"Diagnostic","t":"FSC : anémie + neutrophilie (neutropénie possible). Biochimie : augmentation des paramètres rénaux et hépatiques. Analyse d'urine. Radiographie"},{"k":"Traitement (Rx)","t":"LRS, corriger l'hydratation et l'entretien, bolus possible (30 ml/kg) + traitement de soutien + OVH ++ Antibiotiques : céfazoline 22 mg/kg IM, IV q 8 h"},{"k":"Pronostic / prévention","t":"Bon avec chirurgie ou traitement médical (PGF2a)"},{"k":"Surveillance / examens complémentaires","t":"Signes vitaux + hydratation + coagulation. Une surveillance des signes de choc, de déshydratation, de sepsie, de déséquilibres électrolytiques/acido-basiques, d'hypoprotéinémie, d'hypoglycémie et d'anémie est requise pendant au moins 24–48 heures après la chirurgie."},{"k":"Commentaires","t":"Culture et antibiogramme utérins + stériliser avant le premier œstrus"}]},{"label":"SAM 2 (notes détaillées)","text":"PYOMÈTRE Maladie utérine fréquente chez les chiennes et chattes d'âge moyen à âgé, caractérisée par une accumulation de matériel purulent dans la lumière utérine ou le moignon utérin\n• SUBJECTIF-Diœstrus ou anœstrus (de quelques semaines suivant la fin de l'œstrus jusqu'à quelques mois)\n• Anorexie, vomissements\n• Léthargie, dépression\n• Polyurie et polydipsie (PU/PD)\n• Distension abdominale (moins fréquent)\n• Un écoulement vulvaire peut être rapporté par le propriétaire.\n• Femelle entière ou antécédent d'ovariohystérectomie incomplète\n• Traitement antérieur pour induire un avortement ou une mise bas\n• Chez la chatte, la maladie est généralement plus subaiguë ou chronique et associée à peu de signes cliniques mais des cycles irréguliers, un écoulement vulvaire, et/ou une distension abdominale.\n• OBJECTIF- Un écoulement vulvaire purulent est fréquent et devrait toujours inciter à considérer un pyomètre. L'absence d'écoulement vulvaire n'écarte pas un pyomètre. Palpation abdominale douce : signes de douleur abdominale, utérus augmenté de volume (peut être difficile à palper si l'augmentation est seulement modérée et/ou l'abdomen est tendu), distension abdominale Déshydratation Fièvre (ou hypothermie si sévère, comme dans le choc septique) Muqueuses rouges (stade hyperdynamique du sepsis) ou muqueuses pâles (choc septique) Pouls et auscultation cardiaque normaux ou tachycardie, pouls faible, et extrémités froides possibles avec choc septique Respiration normale ou hyperpnée\n• ÉVALUATION-\nLISTE DES PROBLÈMES= DDx= Mucomètre (lumière utérine remplie de sécrétions glandulaires endométriales mucoïdes sans infection ; aucun signe systémique ou leucocytose attendu)\n• HEK\n• Gestation\n• Vaginite\n• Infection urinaire purulente\n• Tumeurs du tractus reproducteur • Torsion utérine\n• Métrite du post-partum\n• PLAN- DIAGNOSTICS=•\n➪NFS:- Anémie normocytaire, normochrome légère à modérée (hématocrite 30%-35%) Leucocytose avec déviation gauche et/ou changements toxiques. Hyperglobulinémie, hyperprotéinémie, hypoalbuminémie, hypercholestérolémie, azotémie Approximativement 25% des leucogrammes sont dans les limites normales dans les cas de pyomètre. ➪Bilan biochimique sérique : valeurs hépatiques et rénales élevées possibles. ➪Les valeurs de lactate plasmatique sont plus élevées chez les chiennes avec pyomètre que chez les chiennes saines\n(pas de différence entre pyomètre fermé ou ouvert). ➪Examen cytologique vaginal : présence de nombreux neutrophiles dégénérés ➪Analyse d'urine:-isosthénurie, bactériurie, glucosurie, et protéinurie peuvent être trouvées. ➪Radiographies abdominales- viscère distendu compatible avec un utérus augmenté de volume, rempli de liquide. Note : les radiographies abdominales ne différencieront pas entre pyomètre, gestation de < 45 jours, ou mucomètre. Les radiographies abdominales peuvent ne pas détecter un utérus légèrement augmenté de volume. ➪Examen échographique -utérus augmenté de volume, rempli de liquide : Note : se différencie facilement de la gestation ; l'échographie abdominale est la méthode de choix pour établir un diagnostic de pyomètre.\nTHÉRAPEUTIQUE=➩Traitement systémique général- fluidothérapie IV\n• Traitement antibiotique à large spectre : amoxicilline avec acide clavulanique 20 mg/kg PO q 8-12h; ou\nEnrofloxacine 5 mg/kg PO ou diluée 1:1 avec du sérum physiologique et donnée lentement (sur 5 minutes) IV q 6-12h au besoin (maximum 5 mg/kg q 24h chez le chat); ou\nCéphalexine 22-30 mg/kg PO q 8h\n• Gestion de la douleur (ex., buprénorphine 0,01-0,03 mg/kg SC, IM, ou IV q 6-12h PRN)\n• Prostaglandine F2 alpha (PGF2a, dinoprost [Lutalyse]) Quand utilisée seule, des doses élevées sont nécessaires (>0,1 mg/kg SC)\n• Le pyomètre fermé peut être traité en sécurité avec la PGF2a, en commençant à 0,01 mg/kg SC q 5-8h le jour 1, puis 0,025 mg/kg SC q 5-8h le jour 2, puis 0,05 mg/kg q 5-8h\n• Traitement chirurgical du pyomètre : ovariohystérectomie.\nSurveillance recommandée\n• Soins intensifs/critiques.\n• Soutien cardiovasculaire avec fluidothérapie IV.\n• Gestion de la douleur.\n• Surveiller la CIVD (NFS, numération plaquettaire, bilan de coagulation, test D-dimères)\n• Surveiller le SIRS\n• Surveiller l'insuffisance hépatique et rénale avec un bilan biochimique\n• Examen échographique de l'utérus tous les deux jours pendant le traitement pour surveiller la réponse.\nPRONOSTIC=Toujours réservé selon la présence de sepsis et de lésion hépatique ou rénale ; sinon bon."}]},{"id":"icc_aigue","nom":"Insuffisance cardiaque congestive aiguë","sys":"Cardio-respiratoire","urg":true,"resume":"Dyspnée, tachypnée, toux, intolérance à l'exercice; crépitements, gallop, épanchement pleural (chat). Radiographie thoracique + échocardiographie. Éviter les fluides IV/SC.","src":["Urgences (ICC aiguë)","SAM 2 — insuffisance cardiaque congestive aiguë"],"img":["sam2_p86_0","sam2_p86_1"],"sp":{"chien":{"tx":[{"d":"furosemide","r":"1","n":"IV en bolus répétés ou perfusion; surveiller fréquence respiratoire"},{"d":"pimobendane","r":"1","n":"Vetmedin® : voir la monographie pour la dose quotidienne totale répartie en 2 prises"},{"d":"nitroglycerine","r":"2","n":"Peu de données"},{"d":"dobutamine","r":"2","n":"Soutien inotrope"},{"d":"butorphanol","r":"S","n":"Sédation/anxiolyse"},{"d":"dopamine","r":"2","n":""}],"maj":"Oxygène, repos, furosémide + pimobendane = base. ACVIM 2019 (MVM) : traitement du stade C; une étude rétrospective multicentrique 2026 (sous-puissante) rapporte une survie plus courte après l'apparition de l'ICC chez les chiens ayant reçu du pimobendane préclinique (168 vs 359 jours) : à interpréter avec prudence, le traitement préclinique restant considéré comme bénéfique globalement.","qc":"","al":"Dose de pimobendane : vos notes donnent 0,5 mg/kg q24h (ICC aiguë) et 0,1–0,3 mg/kg q12h (chronique) : vérifier la monographie (dose totale quotidienne répartie en deux prises).","gl":["acvim_mmvd_2019","acvim_mmvd_2026c","et_pimo_preclin_2026"]},"chat":{"tx":[{"d":"furosemide","r":"1","n":"IV; thoracocentèse si épanchement pleural important"},{"d":"butorphanol","r":"S","n":""},{"d":"pimobendane","r":"2","n":"Hors AMM chez le chat (étude JVECC 2026)"},{"d":"clopidogrel","r":"P","n":"Prévention de la thromboembolie si atrium gauche dilaté"}],"maj":"Chez le chat, les fluides IV/SC sont généralement contre-indiqués; thoracocentèse pour épanchement pleural. Étude 2026 sur la tolérance des traitements chez des chats en insuffisance cardiaque aiguë.","qc":"","al":"","gl":["acvim_cm_chat_2020","et_icc_chat_2026"]}},"notes":[{"label":"Tableau des urgences — Insuffisance cardiaque congestive aiguë (VIN)","fields":[{"k":"Signes cliniques / examen physique","t":"Antécédents de maladie cardiaque. Effort respiratoire accru/dyspnée, toux, tachypnée et intolérance à l'exercice sont les signes les plus fréquents. Dans les cas sévères, cyanose et orthopnée possibles. La toux est fréquente chez les chiens avec œdème pulmonaire (productive) et dilatation de l'oreillette gauche (non productive)."},{"k":"Diagnostic différentiel","t":"Dirofilariose, collapsus trachéal, bronchite, œdème pulmonaire, toux de chenil, hypertension pulmonaire"},{"k":"Diagnostic","t":"Anamnèse, SC. Azotémie/urémie, peptide natriurétique de type B (BNP) augmenté. Radiographie : cardiomégalie, œdème pulmonaire, trachée surélevée. Échocardiographie. ECG anormal"},{"k":"Traitement (Rx)","t":"Oxygénothérapie. Furosémide : 2 mg/kg IV q 1–6 h. Onguent de nitroglycérine 2 % : 0,5 cm par 10 kg de poids corporel q 6 h. Dopamine (2–25 µg/kg/min IV). Sédation et gestion de la douleur : butorphanol. Pimobendane 0,5 mg/kg PO q 24 h."},{"k":"Pronostic / prévention","t":"Les patients avec ICC gauche ont un pronostic à long terme passable à réservé. Les patients qui répondent bien au traitement, surtout si les signes cliniques sont absents ou bien contrôlés, peuvent avoir une qualité de vie prolongée et bonne."},{"k":"Surveillance / examens complémentaires","t":"état hémodynamique et signes vitaux. ECG, pression artérielle et tachycardie."},{"k":"Commentaires","t":"Pas de fluidothérapie. La fluidothérapie est contre-indiquée en cas de maladie cardiaque et d'œdème pulmonaire."}]},{"label":"SAM 2 (notes détaillées)","text":"INSUFFISANCE CARDIAQUE CONGESTIVE (aiguë)\nL'insuffisance cardiaque congestive (IC) aiguë (ou décompensée) est caractérisée par un début soudain de signes cliniques associés à un œdème pulmonaire ou des épanchements cavitaires dus à une maladie cardiaque. L'IC aiguë/décompensée est une cause fréquente de détresse respiratoire et résulte habituellement d'une aggravation de la performance cardiaque chez des patients avec une maladie cardiaque chronique.\n• SUBJECTIF-➸ Les signes respiratoires prédominent. Spécifiquement, les manifestations caractéristiques incluent tachypnée, dyspnée, toux. L'insuffisance cardiaque cause rarement de la toux chez le chat.\n• Les propriétaires peuvent rapporter que le patient semble inconfortable, agité, ou réticent à se coucher.\n• OBJECTIF-•➸ La tachycardie est une constatation relativement constante, bien que non spécifique, chez le chien\navec IC. Les fréquences cardiaques des chats avec IC aiguë diffèrent peu de celles des chats sains. Certains chats avec IC aiguë ont une bradycardie.\n• Chez le chien, la présence d'une arythmie sinusale respiratoire rend un diagnostic d'IC aiguë pratiquement intenable ; d'autres explications pour les signes cliniques doivent être considérées.\n• Chez les patients avec œdème pulmonaire, la tachypnée et la détresse respiratoire sont habituellement apparentes à l'examen physique.\n• Les chiens avec IC aiguë due à une maladie valvulaire myxomateuse ont un souffle cardiaque ; habituellement le souffle est fort (≥III/VI).\n• Un troisième ou quatrième bruit cardiaque audible, de basse fréquence—un galop—reflète des pressions auriculaires élevées et une compliance ventriculaire réduite. Marqueur relativement spécifique d'IC aiguë chez le chien.\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=Autres causes de détresse respiratoire et/ou toux:\n• Bronchite chronique\n• Collapsus trachéal\n• Maladie allergique des voies aériennes\n• Épanchement pleural non cardiogénique • Masse intrathoracique\n• Pneumonie\n• Pneumothorax\n• PLAN- DIAGNOSTICS=L'insuffisance cardiaque est un diagnostic clinique ou radiographique.\n• L'insuffisance cardiaque gauche est définie par la présence d'opacités pulmonaires radiographiques en association avec un agrandissement de l'oreillette gauche. L'insuffisance cardiaque droite est définie par la découverte d'ascite en association avec une distension veineuse jugulaire et/ou des signes d'agrandissement de l'oreillette/ventricule droit à l'imagerie.\n• Radiographies thoraciques : des constatations radiographiques d'agrandissement de l'oreillette gauche avec des opacités pulmonaires sont diagnostiques d'IC gauche.\n• L'électrocardiographie (ECG) est indiquée quand des arythmies compliquent la présentation.\n• Bilan biochimique sérique et analyse d'urine : dans tous les cas, de préférence avant de débuter le traitement\nSurveillance recommandée\n• Surveillance fréquente des signes vitaux, des muqueuses, du poids corporel\n• ECG si arythmies\n• Un cathétérisme de l'artère pulmonaire dirigé par flux (Swan-Ganz) et/ou une canule artérielle peuvent être envisagés pour\nune surveillance hémodynamique des chiens sévèrement atteints admis en unité de soins intensifs ; rarement effectué.\nTHÉRAPEUTIQUE= (Le but du traitement est de restaurer la fonction ventilatoire en éliminant l'œdème pulmonaire ou l'épanchement pleural, et dans certains cas, d'améliorer la performance cardiaque.)\nOxygène supplémentaire Thoracocentèse si les constatations physiques ou radiographiques indiquent qu'un épanchement pleural est probablement responsable de la détresse respiratoire Furosémide : diurétique de choix dans l'IC aiguë-Initialement : dose relativement élevée (2-6 mg/kg IV, IM)\nLes patients avec dysfonction systolique et signes de débit cardiaque diminué au repos peuvent bénéficier d'une administration intraveineuse\nde nitroprussiate (0,5-15 mcg/kg/min) et/ou de dobutamine (2-15 mcg/kg/min) en perfusion à débit constant.\nUne surveillance attentive est nécessaire.\nPRONOSTIC= La plupart des patients présentés pour un premier traitement d'IC aiguë répondent rapidement à\nun traitement conservateur consistant en repos, oxygène supplémentaire, et furosémide.\n• Malgré une réponse initiale favorable, l'IC est généralement associée à un mauvais pronostic à long terme\nà moins que le trouble causal soit curable.\n*L'administration de fluides IV ou SC est généralement contre-indiquée."}]},{"id":"icc_chronique","nom":"Insuffisance cardiaque chronique","sys":"Cardio-respiratoire","urg":false,"resume":"Détresse respiratoire, syncope, léthargie, perte de poids, souffle, arythmie. Furosémide + pimobendane + IECA + spironolactone; restreindre l'activité et le sodium.","src":["SAM1 — insuffisance cardiaque chronique"],"img":[],"sp":{"chien":{"tx":[{"d":"pimobendane","r":"1","n":"Stade B2 (cardiomégalie) et stade C"},{"d":"furosemide","r":"1","n":"Dose la plus faible efficace; surveiller créatinine/électrolytes"},{"d":"benazepril","r":"2","n":"IECA (Fortekor®)"},{"d":"spironolactone","r":"2","n":"Cardalis® : bénazépril + spironolactone"},{"d":"torasemide","r":"2","n":"Diurétique de l'anse alternatif (magistral)"},{"d":"diete_therapeutique","r":"S","n":"Restriction sodique modérée; maintenir l'appétit"}],"maj":"ACVIM 2019 : stade B2 → pimobendane; stade C → furosémide + pimobendane ± IECA + spironolactone; suivi de la fréquence respiratoire au repos. Un commentaire invité sur ces lignes directrices a été publié en 2026 (J Vet Cardiol) : vérifier si une version révisée est parue.","qc":"Vetmedin®, Salix®, Fortekor®, Cardalis® sont répertoriés au Canada (BDPP).","al":"","gl":["acvim_mmvd_2019","acvim_mmvd_2026c","et_pimo_preclin_2026"]},"chat":{"tx":[{"d":"furosemide","r":"1","n":""},{"d":"clopidogrel","r":"P","n":"Prévention de la thromboembolie artérielle"},{"d":"benazepril","r":"2","n":""},{"d":"spironolactone","r":"2","n":"Prudence : dermatite faciale ulcérative possible"},{"d":"pimobendane","r":"2","n":"Hors AMM (insuffisance cardiaque féline)"}],"maj":"ACVIM 2020 : classification des cardiomyopathies félines (stades A–D) et traitement par stade.","qc":"","al":"","gl":["acvim_cm_chat_2020"]}},"notes":[{"label":"Tableau SAM1 — Insuffisance cardiaque chronique (p.856, 854)","fields":[{"k":"Signes cliniques / examen physique","t":"détresse respiratoire, syncope, léthargie, perte de poids, souffle, arythmie"},{"k":"Diagnostic différentiel","t":"pneumonie, embolie pulmonaire, dirofilariose, collapsus trachéal, néoplasie"},{"k":"Diagnostic","t":"NT-proBNP, radiographies thoraciques, échocardiographie, ECG, PA et T4 chez les chats"},{"k":"Traitement (Rx)","t":"Furosémide 1 mg/kg PO q 12h, énalapril 0,5 mg/kg PO q 12h, pimobendane 0,1–0,3 mg/kg PO q 12h, spironolactone 1 mg/kg PO q 12h. Restreindre l'activité, Na"},{"k":"Pronostic / prévention","t":"mauvais pronostic à long terme"},{"k":"Surveillance / examens complémentaires","t":"BUN et créatinine, électrolytes, ECG, PA, effort respiratoire"}]}]},{"id":"cmd","nom":"Cardiomyopathie dilatée (CMD)","sys":"Cardio-respiratoire","urg":false,"resume":"CMD occulte vs ICC vs arythmies (syncope). Faiblesse, toux, distension abdominale, pouls fémoraux hypokinétiques. Survie de 3–24 mois après le diagnostic selon vos notes.","src":["SAM 2 — cardiomyopathie dilatée"],"img":[],"sp":{"chien":{"tx":[{"d":"pimobendane","r":"1","n":""},{"d":"furosemide","r":"1","n":""},{"d":"benazepril","r":"2","n":""},{"d":"spironolactone","r":"2","n":""},{"d":"sotalol","r":"S","n":"Arythmies ventriculaires (produit humain)"},{"d":"taurine","r":"S","n":"Si déficit documenté (carnitine/taurine)"}],"maj":"Races prédisposées (dobermans, grands danois, boxers) : dépistage précoce (Holter, écho). Penser à la CMD d'origine alimentaire (régimes sans grains/riches en légumineuses) et à la caren
