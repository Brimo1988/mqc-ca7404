jours.\nÉducation du client – Les complications postopératoires à long terme incluent l'uvéite antérieure, le glaucome\nsecondaire et le décollement de la rétine."},{"k":"Ordonnance (Rx)","t":"Carprofène PO (2,2 mg/kg BID) pendant 5 jours.; Amoxicilline/acide clavulanique PO (13,75 mg/kg BID) pendant 2 semaines."}]}]},{"id":"kcs","nom":"Kératoconjonctivite sèche (KCS)","sys":"Ophtalmologie","urg":false,"resume":"Œil rouge, sécrétions mucopurulentes; Schirmer < 15 mm/min; ulcération cornéenne secondaire fréquente (fluorescéine).","src":["SAM 2 — KCS"],"img":[],"sp":{"chien":{"tx":[{"d":"ciclosporine","r":"1","n":"Optimmune® ou formulations topiques"},{"d":"tacrolimus","r":"2","n":"Tacrolimus topique composé"},{"d":"tobramycine","r":"S","n":"Antibiotique topique si surinfection"}],"maj":"Test de Schirmer; traitement lacrymomimétique à vie; tacrolimus 0,03 % composé : étude 2026 chez des chiens avec sécheresse oculaire évaporative (amélioration de la surface oculaire).","qc":"","al":"","gl":["et_tacrolimus_2026"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"KCS\nUne affection inflammatoire fréquente de la cornée et de la conjonctive secondaire à une déficience de la portion aqueuse du film lacrymal\n• SUBJECTIF-• « Œil » rouge\n• Douleur oculaire\n• Écoulement oculaire mucoïde à mucopurulent\n• OBJECTIF-• Systémique : généralement sans particularité\n• Ophtalmique:-Écoulement oculaire mucoïde à mucopurulent○ Hyperémie conjonctivale et chémosis\n• Blépharospasme\n• Protrusion de la troisième paupière\n• Aspect cornéen sec/terne\n• Signes de kératite avec la chronicité : vascularisation cornéenne, pigmentation cornéenne, ulcération cornéenne\n• Blépharite\n• Dermatite péri-oculaire secondaire aux exsudats et/ou à l'auto-traumatisme\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=• Conjonctivite\n• Vascularisation ou pigmentation cornéenne\n• Exposition cornéenne (ex., lagophtalmie); cause fréquente de mauvais diagnostic de « KCS » • Ulcération cornéenne\n• Blépharite Chez le chat, autres causes de kératoconjonctivite:\n• Conjonctivite/kératite à FHV-1\n• Kératoconjonctivite proliférative (éosinophilique)\n• PLAN- DIAGNOSTICS=➭Examen ophtalmique complet\n• Test de Schirmer (STT)\n• Normal : ≥15 mm/min chez le chien; variable chez le chat\n• KCS précoce ou subclinique : 11-14 mm/min\n• KCS légère à modérée : 6-10 mm/min\n• KCS sévère : ≤5 mm/min\n• Application de fluorescéine : une ulcération cornéenne secondaire est fréquente.\n• Pression intraoculaire (PIO) : valeurs normales de PIO; les PIO normales vont de 15-25 mm Hg (chien et chat)\nTHÉRAPEUTIQUE= ➩Lacrymostimulant= Ciclosporine-A (CsA) pommade 0,2% ou solution 0,5%-2%\npar voie topique sur l'œil/les yeux affecté(s) q 8-12h\n• Tacrolimus pommade 0,02-0,03% ou suspension aqueuse 12h\n• Anti-inflammatoire-si conjonctivite ou inflammation sévère -(stéroïde topique)\nDexaméthasone solution 0,1% par voie topique 6-8h. en l'absence d'ulcère\n• Antibiotique topique à large spectre (ex., solution antibiotique bacitracine-néomycine-polymyxine)\nsur l'œil/les yeux affecté(s) q 6-8h. Antibiotiques à large spectre—pommade topique q 6-8h pendant 3-4 semaines;\nindiqué pour une surinfection bactérienne secondaire.\nPRONOSTIC=variable selon la cause sous-jacente. Prévention-Races prédisposées au KCS : éviter de faire reproduire les chiens affectés ou étroitement apparentés."}]},{"id":"uveite","nom":"Uvéite antérieure","sys":"Ophtalmologie","urg":false,"resume":"Œil rouge douloureux, myosis, flare aqueux, hypotonie; causes infectieuses, immunitaires, néoplasiques.","src":["SAM 2 — uvéite antérieure","SAM1 — uvéite chez les chats"],"img":[],"sp":{"chien":{"tx":[{"d":"prednisolone_oph","r":"1","n":"Corticoïde topique en l'absence d'ulcère"},{"d":"atropine_oph","r":"S","n":"Mydriatique (si PIO normale/basse)"},{"d":"flurbiprofene_oph","r":"2","n":"AINS topique"},{"d":"meloxicam","r":"S","n":"AINS systémique"}],"maj":"Rechercher la cause : infectieuse (Ehrlichia, Leptospira…), immunitaire, néoplasique, hypertension.","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"prednisolone_oph","r":"1","n":""},{"d":"atropine_oph","r":"S","n":"Prudence (hypersalivation)"},{"d":"clindamycine","r":"S","n":"Toxoplasmose"},{"d":"meloxicam","r":"S","n":""}],"maj":"Chat : tester FeLV/FIV, PIF, toxoplasmose, Bartonella; mesurer la pression artérielle.","qc":"","al":"","gl":["abcd_toxo_2013"]}},"notes":[{"label":"Tableau SAM1 — Uvéite chez les chats","fields":[{"k":"Signes cliniques / examen physique","t":"https://www.vetweb.com.br/newgaleria/gallery/admin/rest/arquivos_agenda/Feline%20Uveites.pdf"}]},{"label":"SAM 2 (notes détaillées)","text":"UVÉITE ANTÉRIEURE-les causes incluent-infection (bactérienne, virale, fongique), uvéite à médiation immunitaire, néoplasie, hypertension, traumatisme. Etc. 50% idiopathique. Hyphéma (sang dans la chambre antérieure)+précipités kératiques (dépôts cellulaires inflammatoires)+signes spécifiques. Elle se présente cliniquement comme une photophobie aiguë, douleur, blépharospasme, PIO réduite, conjonctive rouge congestionnée, œdème cornéen, myosis, effet Tyndall aqueux (niveau augmenté de protéines et cellules inflammatoires dans l'humeur aqueuse) jusqu'à un hypopyon et hyphéma francs. Rx- Mydriatiques atropine + antibiotiques topiques et systémiques + corticostéroïdes +AINS Pronostic -bon pour l'aigu, réservé pour le chronique."}]},{"id":"ahim","nom":"Anémie hémolytique à médiation immune (AHIM)","sys":"Hématologie","urg":true,"resume":"Anémie régénérative, ictère, urines foncées, splénomégalie, thromboembolie; Coombs/autoagglutination, sphérocytes. Transfusion + immunosuppression + antithrombotique.","src":["Urgences (AHIM)","SAM 2 — AHMI"],"img":[],"sp":{"chien":{"tx":[{"d":"dexamethasone","r":"1","n":"Glucocorticoïde immunosuppresseur initial"},{"d":"prednisolone","r":"1","n":""},{"d":"ciclosporine","r":"2","n":"Second immunosuppresseur"},{"d":"mycophenolate","r":"2","n":""},{"d":"azathioprine","r":"2","n":""},{"d":"clopidogrel","r":"1","n":"Prophylaxie antithrombotique"},{"d":"dalteparine","r":"2","n":"HBPM"},{"d":"colloides","r":"U","n":"Culots globulaires si nécessaire"},{"d":"famotidine","r":"S","n":""}],"maj":"ACVIM 2019 : glucocorticoïde ± second agent, traitement antithrombotique, transfusion; les lignes directrices CURATIVE (2022) encadrent l'antithrombotique. Chez le chat, exclure l'hémoplasmose et les infections.","qc":"","al":"","gl":["acvim_imha_dx_2019","acvim_imha_tx_2019","curative_2022"]}},"notes":[{"label":"Tableau des urgences — AHIM (anémie hémolytique à médiation immune) (p.157)","fields":[{"k":"Signes cliniques / examen physique","t":"Signes d'anémie, faiblesse, tachypnée, collapsus, vomissements, urine décolorée, ictère, dyspnée avec EP (embolie pulmonaire). MM pâles, tachycardie, pouls bondissant, souffle cardiaque, hépatosplénomégalie, sphérocytes"},{"k":"Diagnostic différentiel","t":"Infectieux : anaplasma, babesia, médicaments/toxines : céphalosporines, griséofulvine, anémie par perte sanguine, maladie de la moelle osseuse (aplasie pure de la lignée rouge), intoxication au zinc (AH)"},{"k":"Diagnostic","t":"FSC : ↓PCV, Hb, sphérocytose, polychromasie. Biochimie : ↑ bilirubine, enzymes hépatiques, BUN, albumine. Test d'auto-agglutination sur lame, test de Coombs (pour Ac). Coag : thrombocytopénie, ↑PT, APTT, CIVD, radiographies à la recherche de métastases, 4Dx"},{"k":"Traitement (Rx)","t":"Transfusion sanguine + immunosuppression + traitement antithrombotique. Culots globulaires, soluté IV, dexaméthasone 0,25 mg/kg IV q12h 2 mg/ml, anticoagulant : héparine de bas poids moléculaire (150 UI/kg q 6–8h), famotidine. Traitement antiplaquettaire : clopidogrel (1 mg/kg PO q24h, disponible en comprimés de 75 mg). Renvoyer à la maison avec : prednisone 2 mg/kg q24h PO, azathioprine 2 mg/kg q24h PO"},{"k":"Pronostic / prévention","t":"réservé ; 90 % des chiens survivant 2 semaines ont une bonne survie à long terme. 20 % des chiens peuvent rechuter dans l'année"},{"k":"Surveillance / examens complémentaires","t":"pour thromboembolie, PCV q 8–12h, bilan de coagulation"},{"k":"Commentaires","t":"Les chats répondent mal"}]},{"label":"SAM 2 (notes détaillées)","text":"AHMI\n• SUBJECTIF-Signes d'anémie, incluant léthargie, faiblesse progressive, tachypnée; collapsus, dyspnée, signes de dysfonctionnement du système nerveux central si anémie aiguë sévère Début aigu d'inappétence, anorexie, dépression, faiblesse Vomissements Urine décolorée (bilirubinurie ou hémoglobinurie due à la bilirubine/Hb qu'elle contient) Ictère Détresse respiratoire avec thromboembolie pulmonaire aiguë (TEP)\n• OBJECTIF-L'un ou l'autre des éléments suivants peut être identifié, en plus des signes notés ci-dessus dans l'anamnèse, motif de\nconsultation : muqueuses pâles/ictère tachycardie/souffle cardiaque pouls bondissant\nHémorragies pétéchiales Hépatosplénomégalie\n• ÉVALUATION-\nLISTE DES PROBLÈMES=\nDDx=Mycoplasma haemocanis (organismes sur les globules rouges), Ehrlichia canis, Babesia chez le chien, Mycoplasma haemofelis chez le chat. Ingestion de zinc, d'oignons. Maladie hépatique (valeurs ALT) Toxicité aux raticides (bilan de coagulation)\n• PLAN- DIAGNOSTICS=NFS-hématocrite (HCT) bas, hématocrite (PCV), numération des globules rouges,\nhémoglobine. (mais concentration protéique sanguine normale)\nSignes caractéristiques du diagnostic d'AHMI : sphérocytose, auto-agglutination, polychromasie, réticulocytose, test de Coombs positif\nChimie-↑ bilirubine, enzymes hépatiques, urée sanguine, et hypoalbuminémie (qui est associée à un risque accru de thromboembolie)\nTHÉRAPEUTIQUE=➩Transfusion de globules rouges si hématocrite <18%\n• Oxygénothérapie si respiration difficile.\n• Fluides IV-NaCl 0,9%\n• Médicaments immunosuppresseurs- Prednisolone 2-4 mg/kg PO q 24h OU dexaméthasone 0,15-0,25 mg/kg IV q 12h Cyclosporine à 5–10 mg/kg/jour\n• Héparine 150 UI/kg SC q 8-12h, ou aspirine à faible dose à 0,5 mg/kg/jour ou clopidogrel\n(1-2 mg/kg PO q 24h)\n• Protecteur gastrique : anti-H2 (ex., famotidine 0,5 mg/kg IV ou PO q 12-24h)\n• Traitement antibiotique selon infection confirmée ou suspectée\n• Si l'hématocrite reste stable, envisager un entretien avec 1-2 mg/kg par jour\n• Azathioprine (2 mg/kg PO q 24h pendant 10 jours, puis q 48h) (chiens), ou ciclosporine A -5 mg/kg q 12h; surveiller le taux sanguin\nPRONOSTIC=si l'hématocrite, les paramètres vitaux, l'appétit de l'animal s'améliorent alors bon. Pendant la crise aiguë, l'état mental et l'effort respiratoire doivent être évalués régulièrement et fréquemment. L'hématocrite doit être évalué toutes les 8-12h. Prévention-restriction de l'exercice."}]},{"id":"tim","nom":"Thrombocytopénie à médiation immune (TIM)","sys":"Hématologie","urg":false,"resume":"Saignement (nez, bouche, mélæna), pétéchies, muqueuses pâles; plaquettes très basses. Exclure causes secondaires (Ehrlichia, Anaplasma, néoplasie).","src":["SAM1 — TIM","SAM 2 — thrombopénie à médiation immunitaire"],"img":[],"sp":{"chien":{"tx":[{"d":"prednisolone","r":"1","n":"Immunosuppresseur initial"},{"d":"vincristine","r":"2","n":"Dose unique hebdomadaire jusqu'à plaquettes > 50 000"},{"d":"azathioprine","r":"2","n":""},{"d":"ciclosporine","r":"2","n":""},{"d":"mycophenolate","r":"2","n":""},{"d":"colloides","r":"S","n":"Transfusion si nécessaire"}],"maj":"ACVIM 2024 (diagnostic + traitement) : glucocorticoïdes en première ligne; second agent (azathioprine, ciclosporine, mycophénolate), vincristine ou IgIV/agonistes du récepteur de la TPO pour les cas sévères/réfractaires.","qc":"","al":"","gl":["acvim_itp_dx_2024","acvim_itp_tx_2024"]},"chat":{"tx":[{"d":"prednisolone","r":"1","n":""},{"d":"ciclosporine","r":"2","n":""},{"d":"chlorambucil","r":"2","n":""}],"maj":"Chat : rare; exclure FeLV/FIV, hémoplasmes, néoplasie. Même consensus ACVIM 2024.","qc":"","al":"","gl":["acvim_itp_dx_2024","acvim_itp_tx_2024"]}},"notes":[{"label":"Tableau SAM1 — Thrombocytopénie à médiation immune « TIM » (p.1954)","fields":[{"k":"Signes cliniques / examen physique","t":"saignement du nez ou de la bouche, méléna, pétéchies, MM pâles, fièvre < 20 %"},{"k":"Diagnostic différentiel","t":"rodenticide, traumatisme, ehrlichiose, anaplasmose, FTRM, néoplasie splénique, torsion, médicaments : chimiothérapie, antibiotiques, œstrogènes, AINS, griséofulvine ; CIVD,"},{"k":"Diagnostic","t":"FSC : thrombocytes < 25 000/microL. Analyse d'urine : éviter la cystocentèse. Biochimie, coag./profil (CIVD), radiographie, échographie (néoplasie) - test SNAP 4Dx (ehrlichia/anaplasma), IFA/PCR (FTRM)"},{"k":"Traitement (Rx)","t":"minimiser l'activité, min. 4 mois : prednisone (dex) 2,2 q24h, dégression après normalisation des thrombocytes, vincristine IV q1sem jusqu'à thrombocytes > 50 000, transfusion sanguine au besoin."},{"k":"Pronostic / prévention","t":"Réservé, passable à bon une fois la numération plaquettaire normalisée"},{"k":"Surveillance / examens complémentaires","t":"Numération plaquettaire q2j jusqu'à > 50 000, puis q1sem jusqu'à la normale. Limiter les vaccins à ceux qui sont absolument essentiels, éviter le stress (rechute)"}]},{"label":"SAM 2 (notes détaillées)","text":"THROMBOPÉNIE À MÉDIATION IMMUNITAIRE-La thrombopénie survient quand un animal a un nombre anormalement bas de plaquettes. Même des blessures mineures peuvent causer un saignement incontrôlable, résultant en une perte de globules rouges (anémie). Les signes les plus fréquents sont un saignement et des ecchymoses de la peau et des muqueuses. Un saignement anormal dans les selles ou l'urine ainsi que des saignements de nez peuvent survenir. La thrombopénie à médiation immunitaire est causée par la destruction des plaquettes (thrombocytes) par le système immunitaire. Rx-La prednisone 2,2 mg/kg PO q 24h ou divisée q 12h est le traitement immunosuppresseur initial de choix.\nDes transfusions de globules rouges (sang total frais, culots globulaires) données au besoin La ciclosporine (5-10 mg/kg divisée q12h) s'est montrée un agent immunosuppresseur efficace"}]},{"id":"anemie_infectieuse_feline","nom":"Anémie infectieuse féline (Mycoplasma haemofelis)","sys":"Hématologie","urg":false,"resume":"Anémie hémolytique aiguë chez un chat sain (muqueuses pâles, fièvre, tachypnée, splénomégalie) ou forme chronique (léthargie, perte de poids). Frottis : organismes à la surface des érythrocytes.","src":["SAM 2 — anémie infectieuse féline"],"img":[],"sp":{"chat":{"tx":[{"d":"doxycycline","r":"1","n":"Traitement de première ligne (≥ 2 semaines)"},{"d":"pradofloxacine","r":"2","n":"Veraflox® (vétérinaire)"},{"d":"prednisolone","r":"S","n":"Si composante immunitaire"},{"d":"colloides","r":"U","n":"Transfusion si anémie sévère"}],"maj":"Diagnostic par PCR; tester FeLV/FIV. Le portage persiste souvent même après traitement.","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"ANÉMIE INFECTIEUSE FÉLINE- M. haemofelis, qui cause une anémie hémolytique aiguë chez les chats sains. L'anémie peut être sévère et occasionnellement fatale. Aigu : mort subite, faiblesse, léthargie, collapsus, muqueuses pâles, tachypnée, anorexie, ± vomissements, signes neurologiques aigus\nChronique : léthargie, anorexie, perte de poids Aigu : muqueuses pâles, fièvre, tachypnée, tachycardie, obtusion, faiblesse, splénomégalie, souffle cardiaque systolique dû à l'anémie, rarement ictère\nLe diagnostic a été fait sur la base de la détection d'organismes sur des frottis sanguins colorés au Wright de routine, sur lesquels ils apparaissent comme de petites structures (0,5-3 μm), basophiles, rondes, en bâtonnet, ou en forme d'anneau présentes sur les érythrocytes individuellement ou en chaînes, ou parfois vues libres dans l'arrière-plan. NFS : anémie régénérative, macrocytose, normoblastose, ± neutrophilie légère à modérée et monocytose sont typiques. Les tests PCR sont considérés comme la référence pour le diagnostic. Pour les infections aiguës, les tétracyclines (doxycycline, oxytétracycline) ont été le pilier du traitement."}]},{"id":"anaphylaxie","nom":"Anaphylaxie / réaction allergique aiguë","sys":"Hématologie","urg":true,"resume":"Réaction d'hypersensibilité aiguë (type I) : urticaire, œdème facial, vomissements, collapsus, dyspnée. Épinéphrine, fluides, antihistaminiques.","src":["SAM 2 — anaphylaxie"],"img":[],"sp":{"chien":{"tx":[{"d":"epinephrine","r":"1","n":"Voie et dose à confirmer (RECOVER 2026)"},{"d":"fluides","r":"U","n":""},{"d":"diphenhydramine","r":"S","n":"H1 (+ H2 famotidine)"},{"d":"famotidine","r":"S","n":""},{"d":"dexamethasone","r":"S","n":""},{"d":"vasopressine","r":"2","n":"Hypotension réfractaire"}],"maj":"RECOVER 2026 : lignes directrices dédiées à l'allergie aiguë et à l'anaphylaxie chez le chien et le chat (voie IM/IV de l'épinéphrine, adjuvants).","qc":"","al":"Vos notes : épinéphrine 0,01–0,02 mg/kg IV — à comparer aux recommandations RECOVER 2026.","gl":["recover_allergie_2026"]},"chat":{"tx":[{"d":"epinephrine","r":"1","n":""},{"d":"fluides","r":"U","n":""},{"d":"diphenhydramine","r":"S","n":""},{"d":"dexamethasone","r":"S","n":""}],"maj":"Chat : choc par bronchoconstriction/hypotension; mêmes principes.","qc":"","al":"","gl":["recover_allergie_2026"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"ANAPHYLAXIE- (Réaction allergique, réaction/choc anaphylactique, hypersensibilité de type I)\nUne réaction d'hypersensibilité aiguë résultant en une libération généralisée de médiateurs inflammatoires par les basophiles et mastocytes. Cette réaction allergique systémique engageant le pronostic vital peut entraîner un collapsus cardiovasculaire rapide, une détresse respiratoire, et la mort. Urticaire+angio-œdème. Rx- ➢Dose de choc de fluides 90 ml/kg\n• Épinéphrine 0,01-0,02 mg/kg IV\n• Aminophylline:(pour bronchodilatation) Chien : 5-10 mg/kg IM ou IV lente sur plusieurs minutes\nChat : 5 mg/kg IM ou IV lente sur plusieurs minutes\n• Traitement vasopresseur si l'hypotension persiste malgré la fluidothérapie et l'épinéphrine\nVasopressine 0,5-2 U en bolus IV répété jusqu'à 3 fois au besoin Dopamine 10-20 mcg/kg/min IV Traitement chronique-➣Traitement aux glucocorticoïdes (dexaméthasone/prednisone) +\n• Antihistaminiques (H1 diphenhydramine+H2 famotidine). Surveiller=Fréquence cardiaque, fréquence respiratoire, effort respiratoire, fréquence du pouls, qualité du pouls, état mental, couleur des muqueuses, temps de recoloration capillaire, température,○ Pression artérielle."}]},{"id":"septicemie","nom":"Sepsis / septicémie","sys":"Hématologie","urg":true,"resume":"Critères SIRS (T°, FC, FR, leucocytes) avec infection suspectée; hypotension, lactates, dysfonction d'organe. Surveillance FC, pouls, PA, PVC, état mental, FR.","src":["SAM 2 — septicémie"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":""},{"d":"ampicilline","r":"1","n":"Antibiothérapie IV précoce à large spectre (produit humain)"},{"d":"enrofloxacine","r":"2","n":"Réservé : culture/sensibilité"},{"d":"norepinephrine","r":"2","n":"Vasopresseur si hypotension réfractaire"},{"d":"vasopressine","r":"2","n":""},{"d":"dopamine","r":"2","n":""},{"d":"buprenorphine","r":"S","n":""}],"maj":"Consensus 2026 : définition et critères cliniques du sepsis chez le chien et le chat; contrôler la source, antibiotiques précoces, réanimation hémodynamique ciblée.","qc":"","al":"","gl":["sepsis_2026"]},"chat":{"tx":[{"d":"fluides","r":"U","n":""},{"d":"ampicilline","r":"1","n":"IV précoce"},{"d":"enrofloxacine","r":"2","n":"Réservé : culture/sensibilité"},{"d":"norepinephrine","r":"2","n":""}],"maj":"Chat : bradycardie et hypothermie possibles au lieu de tachycardie/fièvre.","qc":"","al":"","gl":["sepsis_2026"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"SEPTICÉMIE-identifiée cliniquement chez un animal qui remplit les critères du syndrome de réponse inflammatoire systémique (SIRS) et présente des preuves d'infection documentées cytologiquement, histopathologiquement, ou par culture bactérienne. Fièvre, tachycardie (chien), bradycardie possible chez le chat. Muqueuses injectées/rouges et pouls bondissant (phase hyperdynamique) OU pâleur, temps de recoloration capillaire lent (>2 secondes), pouls faible (phase hypodynamique) La NFS montre une neutrophilie. Thrombopénie si CIVD. Une élévation du lactate sanguin (>2 mmol/L) est un marqueur important de choc chez les chiens avec sepsis. Rx- Antibiotiques à large spectre Fluidothérapie (choc, entretien) Vasopresseurs si hypotension. Si une dépression myocardique est présente, dobutamine (2-20 mcg/kg/min [chiens], 1-5 mcg/kg/min [chats]) Oxygène supplémentaire si hypoxémie.\nSurveillance- Fréquence cardiaque, qualité du pouls, pression artérielle, pression veineuse centrale, état mental, fréquence/effort respiratoire, et température : en continu, toutes les heures, ou selon l'évolution du cas"}]},{"id":"carre","nom":"Maladie de Carré","sys":"Infectiologie","urg":true,"resume":"Fièvre, écoulements oculo-nasaux, toux, vomissements/diarrhée, kératite; signes neurologiques tardifs (myoclonies). Pronostic réservé.","src":["Urgences (Carré)","SAM 2 — maladie de Carré"],"img":[],"sp":{"chien":{"tx":[{"d":"fluides","r":"U","n":""},{"d":"amox_clav","r":"S","n":"Surinfection bactérienne"},{"d":"diazepam","r":"U","n":"Convulsions"},{"d":"levetiracetam","r":"S","n":""},{"d":"maropitant","r":"S","n":""},{"d":"vaccin","r":"P","n":"Vaccin essentiel (core)"}],"maj":"Aucun antiviral spécifique : soins de soutien, isolement, traitement des surinfections et des convulsions. Prévention par vaccination (AAHA 2022/2024; WSAVA 2024).","qc":"Cas surtout chez des chiots non vaccinés, refuges ou chiens importés.","al":"","gl":["aaha_vacc_2022","wsava_vacc_2024"]}},"notes":[{"label":"Tableau des urgences — Virus de la maladie de Carré (Morbillivirus, Paramyxoviridae)","fields":[{"k":"Signes cliniques / examen physique","t":"Fièvre, écoulements oculaire et nasal, toux, inappétence, vomissements, diarrhée, kératite, conjonctivite, uvéite, bruits respiratoires forts, déshydratation, cachexie, aux stades avancés signes du SNC (convulsions « mâchonnement de gomme »)"},{"k":"Diagnostic différentiel","t":"Trachéobronchite infectieuse canine, entérite parvovirale"},{"k":"Diagnostic","t":"FSC : lymphopénie absolue possible, rarement corps d'inclusion éosinophiliques intracytoplasmiques, inclusions du CDV dans les GB et GR, radiographies thoraciques : motif interstitiel, ↑ titres d'IgM sériques chez les animaux non vaccinés confirment une exposition récente ou une infection en cours"},{"k":"Traitement (Rx)","t":"Isoler, soluté IV, ampicilline 22 mg/kg IV q8h + enrofloxacine (pas chez les chiots en croissance), nébulisation si pneumonie à la radiographie, lopéramide (antidiarrhéique), Cerenia, famotidine, diazépam en cas de convulsions"},{"k":"Pronostic / prévention","t":"réservé en cas d'immunité inadéquate"},{"k":"Surveillance / examens complémentaires","t":"Très contagieux. Vaccin ML-CDV chiots q 3–4 sem de 6 à 16 sem, rappel à 1 an, puis q 3 ans"}]},{"label":"SAM 2 (notes détaillées)","text":"MALADIE DE CARRÉ-Avec la forme généralisée de la maladie, la présentation initiale inclut typiquement un ou plusieurs des éléments suivants : léthargie, écoulement oculaire et nasal (séreux ou mucopurulent), toux, inappétence, vomissements, diarrhée. Un patient avec une forme plus avancée de la maladie a souvent un antécédent de signes neurologiques (convulsions, ataxie, etc.). Rx- ➣Antibiotiques à large spectre (parentéraux initialement) comme l'ampicilline 22 mg/kg IV q 8h\n• Réanimation liquidienne IV pour corriger la déshydratation et les perturbations électrolytiques\n• Nébulisation et clapping si une pneumonie est apparente radiographiquement\n• Signes G.I.=Antidiarrhéiques (ex., lopéramide 0,1-0,2 mg/kg PO jusqu'à q 8h), antiémétiques (ex., dolasétron 0,3-0,6 mg/kg IV ou SC q 12-24h; ou métoclopramide 0,2-0,4 mg/kg SC q 8h), et protecteurs gastro-intestinaux (ex., oméprazole 0,7 mg/kg PO q 24h) au besoin.\n• Diazépam ou midazolam si un contrôle aigu des convulsions est nécessaire (0,5 mg/kg IV ou 1 mg/kg par voie rectale PRN jusqu'à 4 fois en 2 heures)"}]},{"id":"ehrlichiose","nom":"Ehrlichiose canine","sys":"Infectiologie","urg":false,"resume":"Fièvre, lymphadénopathie, splénomégalie, épistaxis, pétéchies; thrombocytopénie. Test SNAP 4Dx Plus, PCR. Doxycycline.","src":["SAM1 — ehrlichiose","SAM 2 — ehrlichiose"],"img":[],"sp":{"chien":{"tx":[{"d":"doxycycline","r":"1","n":"Posologie de vos notes : 5–10 mg/kg q12h × 28 jours"}],"maj":"Suivi sérologique/PCR. Au Québec, les maladies transmises par les tiques les plus fréquentes sont la borréliose de Lyme et l'anaplasmose (Ixodes scapularis); l'ehrlichiose canine concerne surtout des chiens ayant voyagé ou importés. Pour Lyme, ACVIM 2018 et une critique 2026 de la durée de 28 jours.","qc":"Prévention : isoxazolines (Bravecto®, NexGard®, Simparica®, Credelio®) selon l'étiquette; inspection des tiques; test 4Dx annuel.","al":"","gl":["acvim_lyme_2018","et_lyme_doxy_2026"]}},"notes":[{"label":"Tableau SAM1 — Ehrlichiose  E. canis dans les lymphocytes, macrophages (p.628)","fields":[{"k":"Signes cliniques / examen physique","t":"Berger allemand : incidence accrue, léthargie, anorexie, perte de poids, fièvre, lymphadénopathie, splénomégalie, saignements, complications : boiterie, signes neurologiques, PU/PD"},{"k":"Diagnostic différentiel","t":"Ehrlichia sp., Anaplasma sp., Bartonella sp., Rickettsia sp., polyarthrite à médiation immune, méningite, glomérulonéphrite, leucémie lymphoïde, myélome multiple"},{"k":"Diagnostic","t":"Aigu : cytopénies, hyperglobulinémie. Chron. : thrombocytopénie, anémie, hyperglobulinémie ; hypoalbuminémie, ↑ enzymes hépatiques et BUN (glomérulonéphrite). ELISA SNAP 4Dx Plus"},{"k":"Traitement (Rx)","t":"Doxycycline 5–10 mg/kg PO, q 12h × 28 jours"},{"k":"Pronostic / prévention","t":"bon\nPrévention des tiques"},{"k":"Surveillance / examens complémentaires","t":"CIVD, FSC jusqu'à résolution des cytopénies, analyse d'urine pour les protéines"}]},{"label":"SAM 2 (notes détaillées)","text":"EHRLICHIOSE- maladie transmise par les tiques fréquente causée par une infection par Ehrlichia canis\nLes constatations physiques fréquentes incluent fièvre, lymphadénopathie, splénomégalie, épistaxis, et pétéchies. Les plaintes les plus fréquentes sont non spécifiques et incluent léthargie, anorexie, perte de poids, et tendances hémorragiques. Diagnostic-NFS, bilan biochimique sérique : cytopénies et hyperglobulinémie sont les signes caractéristiques d'une infection aiguë. Thrombopénie, anémie. DDx=Hémangiosarcome\nThrombopénie à médiation immunitaire Toxicité aux raticides Fièvre pourprée des montagnes Rocheuses (Rickettsia rickettsii), Babesia Maladie hépatique.\nLED ELISA sérique en clinique (SNAP 4Dx Plus) : détecte les anticorps contre E. canis, PCR\nRx=Doxycycline 5-10 mg/kg PO, q 12h × 28 jours.\nLe pronostic de guérison complète est bon pour les animaux avec infections aiguës ou maladie chronique légère."}]},{"id":"fpmr","nom":"Fièvre pourprée des montagnes Rocheuses (Rickettsia rickettsii)","sys":"Infectiologie","urg":false,"resume":"Fièvre, dépression/anorexie, vomissements, douleur musculaire, démarche raide, pétéchies, thrombocytopénie.","src":["SAM1 — FTRM","SAM 2 — fièvre pourprée des montagnes Rocheuses"],"img":[],"sp":{"chien":{"tx":[{"d":"doxycycline","r":"1","n":"14 jours"},{"d":"prednisolone","r":"S","n":"Vasculite sévère (selon vos notes)"},{"d":"fluides","r":"S","n":""}],"maj":"Transmise par des tiques (Dermacentor); très rare au Québec; penser à d'autres infections vectorielles.","qc":"Peu fréquente au Québec; discuter la prévention des tiques.","al":"","gl":[]}},"notes":[{"label":"Tableau SAM1 — FTRM (fièvre pourprée des montagnes Rocheuses) rickettsie transmise par les tiques (p.1781)","fields":[{"k":"Signes cliniques / examen physique","t":"fièvre, dépression/anorexie, vomissements, douleur musculaire, démarche raide, épistaxis, pétéchies, œdème, dyspnée/toux (pneumonite interstitielle). Oculaire : uvéite/choriorétinite ; neuro : inclinaison de la tête. Splénomégalie, lymphadénopathie"},{"k":"Diagnostic différentiel","t":"babésiose, borréliose, leptospirose, TIM, maladie de Carré, pneumonie"},{"k":"Diagnostic","t":"FSC : thrombocytopénie ; leucopénie ou leucocytose (déviation à gauche possible, toxique) ; anémie. Biochimie : hypoalbuminémie, azotémie, Na/Cl/K/Ca bas, ↑ enzymes hépatiques. Analyse d'urine : protéinurie due à la vasculite/glomérulonéphrite. IFA (2 sérums) : augmentation de quatre fois ; la PCR est moins sensible"},{"k":"Traitement (Rx)","t":"Soluté IV, doxycycline 5–10 mg/kg PO, IV q 12h pendant 14 jours, prednisolone (1–4 mg/kg PO q 24h) pour la vasculite"},{"k":"Pronostic / prévention","t":"Excellent, immunité à vie"},{"k":"Surveillance / examens complémentaires","t":"plaquettes, coagulation, CIVD. Contrôle des tiques"}]},{"label":"SAM 2 (notes détaillées)","text":"FIÈVRE POURPRÉE DES MONTAGNES ROCHEUSES- Rickettsia rickettsii. Ces pathogènes sont transmis principalement par les morsures de tiques infectées (Dermacentor). Une maladie rickettsienne aiguë, transmise par les tiques, potentiellement engageant le pronostic vital, affectant les chiens et les humains Les signes initiaux sont habituellement vagues; dépression, anorexie, douleur musculo-squelettique, et vomissements sont souvent notés. Preuve de douleur (arthralgie/myalgie, douleur abdominale) Dyspnée/toux (pneumopathie interstitielle). Lésions cutanées : hémorragies pétéchiales/ecchymotiques (particulièrement sur les muqueuses), œdème, hyperémie, vésicules, et macules sont tous possibles. Anomalies oculaires (uvéite/choriorétinite) et/ou neurologiques (ex., inclinaison de la tête) Splénomégalie, lymphadénopathie\nNFS : thrombopénie la plus fréquente; leucopénie ou leucocytose (déviation gauche possible, changements toxiques); anémie légère à sévère Bilan biochimique sérique : hypoalbuminémie, azotémie, Na/Cl/K/Ca bas, enzymes hépatiques augmentées. Protéinurie due à une vascularite/glomérulonéphrite Tests PCR (sang/tissu) pour la FPMR et autres rickettsies Rx-Doxycycline 5-10 mg/kg PO, IV q 12h pendant 7-14 jours; ou tétracycline 22 mg/kg PO, IV q 8h pendant 7-14 jours"}]},{"id":"leptospirose","nom":"Leptospirose","sys":"Infectiologie","urg":false,"resume":"Fièvre, PU/PD, vomissements, hypovolémie, sensibilité musculaire, ictère, insuffisance rénale aiguë; souvent urbaine, après eau stagnante/rongeurs. MAT/PCR.","src":["SAM1 — leptospirose"],"img":[],"sp":{"chien":{"tx":[{"d":"doxycycline","r":"1","n":"2 semaines"},{"d":"ampicilline","r":"S","n":"IV en phase aiguë si vomissements"},{"d":"fluides","r":"U","n":""},{"d":"vaccin","r":"P","n":"Vaccin 4 sérovars, rappel annuel"}],"maj":"ACVIM 2023 (mise à jour) : maladie répandue chez les chiens, y compris les petites races en milieu urbain; vaccination et protection du personnel (zoonose). Les formes rénale/hépatique/pulmonaire sont à traiter selon la gravité.","qc":"Zoonose : gants, désinfection; prévenir le personnel et les propriétaires.","al":"","gl":["acvim_lepto_2023","aaha_vacc_2022"]}},"notes":[{"label":"Tableau SAM1 — Leptospirose ZOONOTIQUE À DÉCLARATION OBLIGATOIRE dans certains États (p.1153)","fields":[{"k":"Signes cliniques / examen physique","t":"fièvre, polyurie, vomissements, hypovolémie, sensibilité musculaire, réticence à bouger, douleur abdominale. Signes d'atteinte rénale, hépatique, pulmonaire, oculaire."},{"k":"Diagnostic différentiel","t":"IRA : toxines, pyélonéphrite. Vasculite : sepsie, rickettsiose, pancréatite. LHA : cholangiohépatite bactérienne, toxines"},{"k":"Diagnostic","t":"neutrophilie, lymphopénie, anémie non régénérative, thrombocytopénie, acidose métabolique, hypoalbuminémie due à la vasculite et à l'insuffisance hépatique, signes rénaux et hépatiques. Test de micro-agglutination (MAT), PCR"},{"k":"Traitement (Rx)","t":"Doxycycline 5 mg/kg PO ou IV q 12h pendant 2 semaines"},{"k":"Pronostic / prévention","t":"bon\nContrôle des rongeurs, assainissement/drainage adéquats ; vacciner tous les chiens à risque"},{"k":"Surveillance / examens complémentaires","t":"CIVD, insuffisance respiratoire, paramètres rénaux, hépatiques et électrolytiques, PA, production urinaire"}]}]},{"id":"toxoplasmose","nom":"Toxoplasmose féline","sys":"Infectiologie","urg":false,"resume":"Uvéite antérieure, choriorétinite, signes neurologiques, respiratoires ou digestifs; zoonose.","src":["SAM1 — toxoplasmose"],"img":[],"sp":{"chat":{"tx":[{"d":"clindamycine","r":"1","n":"2–4 semaines"},{"d":"fluides","r":"S","n":""},{"d":"prednisolone_oph","r":"S","n":"Uvéite (topique)"}],"maj":"ABCD 2013 : traitement à la clindamycine; éviter les glucocorticoïdes/immunosuppresseurs systémiques; zoonose (femmes enceintes).","qc":"Zoonose : gants pour la litière, éviter la viande crue; informer les clientes enceintes.","al":"","gl":["abcd_toxo_2013"]}},"notes":[{"label":"Tableau SAM1 — Toxoplasmose ZOONOTIQUE (coccidie intracellulaire obligatoire)","fields":[{"k":"Signes cliniques / examen physique","t":"Oculaire : uvéite antérieure, choriorétinite ; SNC : convulsions, ataxie, paralysie ; signes GI, ictère, douleur musculaire"},{"k":"Diagnostic différentiel","t":"Maladie rétrovirale, rage, PIF, maladie hépatique, pancréatite, maladie fongique,"},{"k":"Diagnostic","t":"anémie, leucopénie/leucocytose, ↑ CK et enzymes hépatiques. Titres appariés IgM et IgG par ELISA, ↑ de 4x des IgG ou ↑ IgM - infection active"},{"k":"Traitement (Rx)","t":"Clindamycine 12,5 mg/kg PO q12h pendant 2–4 sem, soluté/électrolytes, pas de stéroïdes/immunosuppresseurs"},{"k":"Pronostic / prévention","t":"bon. Garder à l'intérieur, empêcher l'accès aux rongeurs, ne pas donner de viande crue, les oocystes sont infectieux en 24 h"}]}]},{"id":"teigne","nom":"Teigne (dermatophytose)","sys":"Dermatologie","urg":false,"resume":"Jeunes, refuges : alopécie circulaire, squames, lésions croûteuses; lampe de Wood (M. canis), culture. Zoonose.","src":["SAM1 — teigne"],"img":[],"sp":{"chien":{"tx":[{"d":"itraconazole","r":"1","n":"Itrafungol® (chat)"},{"d":"enilconazole","r":"S","n":"Imaverol®: bains"},{"d":"terbinafine","r":"2","n":"Oral (humain)"}],"maj":"Traiter systématiquement l'environnement; contrôle mycologique avant d'arrêter (2 cultures négatives); zoonose.","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"itraconazole","r":"1","n":"Itrafungol® (solution orale féline)"},{"d":"enilconazole","r":"S","n":""},{"d":"terbinafine","r":"2","n":""}],"maj":"Chat : bains au soufre calcique ou à l'énilconazole + antifongique oral; isolement des chats infectés.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau SAM1 — Teigne ZOONOTIQUE Microsporum canis, Trichophyton spp. (p.548, 553)","fields":[{"k":"Signes cliniques / examen physique","t":"jeune, refuges"},{"k":"Diagnostic différentiel","t":"Pyodermite staphylococcique, démodécie, acariens, dermatite miliaire, allergie, frottement sur quelque chose"},{"k":"Diagnostic","t":"Examen à la lampe de Wood (M. canis), examen microscopique de poils arrachés, culture fongique, raclage cutané pour exclure Demodex."},{"k":"Traitement (Rx)","t":"bains de soufre calcique sur tout le corps, deux fois par semaine, itraconazole PO q 24h une semaine sur deux jusqu'à deux cultures fongiques négatives consécutives (tests hebdomadaires)"},{"k":"Pronostic / prévention","t":"Bon"},{"k":"Surveillance / examens complémentaires","t":"isoler, désinfecter l'environnement"}]}]},{"id":"gale","nom":"Gale (sarcoptique) et acariens du conduit auditif","sys":"Dermatologie","urg":false,"resume":"Gale sarcoptique : prurit intense, bords des oreilles, coudes, jarrets; réflexe otopodal. Otodectes : prurit auriculaire, cérumen noir.","src":["SAM1 — gale","SAM 2 — acariose/gale"],"img":[],"sp":{"chien":{"tx":[{"d":"selamectine","r":"1","n":"Revolution®"},{"d":"fluralaner","r":"1","n":"Bravecto®"},{"d":"afoxolaner","r":"2","n":"NexGard®"},{"d":"sarolaner","r":"2","n":"Simparica®"},{"d":"cephalexine","r":"S","n":"Pyodermite secondaire"},{"d":"prednisolone","r":"S","n":"Prurit sévère, courtes cures"}],"maj":"Traiter même si les raclages sont négatifs; traiter tous les chiens en contact. Les isoxazolines sont efficaces contre la gale (utilisation selon l'étiquette ou hors AMM).","qc":"","al":"","gl":["wavd_demodecie_2020"]},"chat":{"tx":[{"d":"selamectine","r":"1","n":"Revolution®"},{"d":"fluralaner","r":"1","n":"Bravecto®"},{"d":"lotilaner","r":"2","n":"Credelio Cat®"},{"d":"esafoxolaner","r":"2","n":"NexGard Combo® (vérifier les indications de l'étiquette)"}],"maj":"Otodectes cynotis (gale de l'oreille) : traitement acaricide + nettoyage.","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau SAM1 — Gale ZOONOTIQUE transitoire (p.1797)","fields":[{"k":"Signes cliniques / examen physique","t":"bords des oreilles, coudes/jarrets, ventre, réaction d'hypersensibilité --> prurit intense"},{"k":"Diagnostic différentiel","t":"Ectoparasites, allergie aux piqûres de puces, dermatite atopique, réaction alimentaire, pyodermite, dermatite à Malassezia"},{"k":"Diagnostic","t":"réflexe pinna-pédal positif chez 80 %, raclage cutané superficiel (bords des oreilles, coude/jarret, papules non excoriées) - difficile à trouver"},{"k":"Traitement (Rx)","t":"traiter même si les raclages cutanés sont négatifs, tous les chiens en contact. Sélamectine (Revolution) ou fluralaner (Bravecto), céphalexine en cas de pyodermite, en cas de prurit sévère prednisone 0,5–1 mg/kg PO q 24h pendant 3–4 jours, puis sevrage progressif"},{"k":"Pronostic / prévention","t":"excellent"},{"k":"Surveillance / examens complémentaires","t":"Raclages cutanés de suivi si les SC persistent 1–2 mois après. 2–4 sem pour une résolution complète, possible aggravation les premiers jours"},{"k":"Commentaires","t":"zoonotique"}]},{"label":"SAM 2 (notes détaillées)","text":"ACARIOSE-GALE 1-Démodécie-Raclages cutanés profonds d'au moins trois sites pour la plupart des espèces d'acariens Demodex.○\nPresser la peau pour extruder les acariens des follicules pileux immédiatement avant et/ou pendant le raclage; continuer le raclage jusqu'à voir un léger saignement capillaire. Rx-➣ Démodécie localisée= ne nécessite pas de traitement; des agents antimicrobiens topiques comme le gel de peroxyde de benzoyle ou la mupirocine peuvent être utilisés.\n• Le traitement de la démodécie canine généralisée nécessite plusieurs mois et un engagement de la part du propriétaire. Tous les traitements doivent continuer au moins 30 jours après deux séries consécutives de raclages cutanés négatifs. Ex-bains à l'amitraz, ivermectine-efficace à 0,3-0,6 mg/kg PO q 24h\n• Traitement antibiotique systémique (ex., céphalexine 22 mg/kg q 12h pendant > 4 semaines) pour traiter la pyodermite secondaire.\n• Dans la démodécie juvénile localisée, le pronostic est excellent. Le pronostic pour les cas juvéniles généralisés est bon, mais une petite proportion ne peut être guérie et nécessite un traitement à long terme.\n• Dans la démodécie de l'adulte, le pronostic est réservé.\n2-Gale otodectique-Infestation acarienne contagieuse, principalement auriculaire, causée par Otodectes cynotis.\nPrurit auriculaire/péri-auriculaire mis en évidence par des secouements de tête et des grattages d'oreille. Otite externe caractérisée par un érythème et un exsudat otique brun foncé, cérumineux (« marc de café ») Rx- Sélamectine (Revolution/Stronghold; appliquer dans la région interscapulaire) chez les chiens dès l'âge de 6 semaines et les chats dès l'âge de 8 semaines. Deux doses administrées à 30 jours d'intervalle pour un contrôle optimal. Ou ivermectine hors AMM, moxidectine par voie orale.\n3.Gale sarcoptique-Une infestation cutanée non saisonnière, hautement contagieuse, intensément prurigineuse causée par un petit acarien fouisseur obligatoire, Sarcoptes scabiei var. canis. La plainte principale est le prurit. Typiquement, les bords des oreilles, les coudes et les jarrets, l'abdomen ventral, le thorax, et éventuellement les membres (le dos est habituellement épargné) montreront un prurit intense, des papules, un érythème, des croûtes, des excoriations, et une alopécie. Un réflexe pinnal-pédal positif est observé chez ≈80% des chiens. Rx-➣ La sélamectine (Revolution/Stronghold) et moxidectine/imidaclopride (Advantage Multi/Advocate) sont approuvés comme scabicides topiques une fois q 30 jours pour deux traitements, bien que beaucoup de dermatologues vétérinaires recommandent un minimum de trois traitements q 2 semaines.\n• Un traitement antibiotique concomitant (ex., céphalexine 22-30 mg/kg PO q 12h pendant 30 jours) peut être requis si une pyodermite secondaire est présente.\n• Un traitement corticostéroïde à court terme peut être requis chez les chiens sévèrement prurigineux (ex., prednisone 0,5-1 mg/kg PO q 24h pendant 3-4 jours puis sevrage progressif) Le pronostic avec un traitement approprié est excellent."}]},{"id":"demodecie","nom":"Démodécie","sys":"Dermatologie","urg":false,"resume":"Perte de poils, prurit si pyodermite secondaire; raclages cutanés profonds (≥ 3 sites). Juvénile localisée : bon pronostic; adulte : rechercher une cause sous-jacente.","src":["SAM1 — démodécie","SAM 2 — démodécie"],"img":[],"sp":{"chien":{"tx":[{"d":"fluralaner","r":"1","n":"Isoxazoline (Bravecto®)"},{"d":"afoxolaner","r":"1","n":"NexGard®"},{"d":"sarolaner","r":"1","n":"Simparica®"},{"d":"lotilaner","r":"1","n":"Credelio®"},{"d":"moxidectine","r":"2","n":"Advantage Multi® (indication à vérifier sur l'étiquette)"},{"d":"cephalexine","r":"S","n":"Pyodermite secondaire"},{"d":"chlorhexidine","r":"S","n":"Shampoing"}],"maj":"WAVD 2020 : les isoxazolines sont efficaces; l'amitraz n'est pas commercialisé au Canada (BDPP) et n'est plus la référence. Traiter jusqu'à deux raclages négatifs consécutifs; ISCAID 2025 pour la pyodermite associée.","qc":"","al":"Amitraz (cité dans vos notes) : aucun produit vétérinaire répertorié dans la BDPP.","gl":["wavd_demodecie_2020","iscaid_pyoderme_2025"]},"chat":{"tx":[{"d":"fluralaner","r":"2","n":"Hors AMM"},{"d":"moxidectine","r":"2","n":"Advantage Multi®"}],"maj":"Démodécie féline rare : rechercher une maladie sous-jacente (FeLV/FIV, diabète).","qc":"","al":"","gl":["wavd_demodecie_2020"]}},"notes":[{"label":"Tableau SAM1 — Démodécie (P.545)","fields":[{"k":"Signes cliniques / examen physique","t":"Perte de poils, prurit en cas de pyodermite secondaire"},{"k":"Diagnostic différentiel","t":"Chiens : folliculite bactérienne, teigne, dermatomyosite, pemphigus foliacé. Chats : sarcoptes, gale otodectique, teigne, CGE, alopécie psychogène"},{"k":"Diagnostic","t":"Raclages cutanés profonds d'au moins trois sites (pincer la peau)"},{"k":"Traitement (Rx)","t":"généralisée : tondre les poils longs, bain au peroxyde de benzoyle, puis bains d'amitraz q14j chez les chiens > 4 mois, 30 j après 2 raclages « - » consécutifs q4 sem. Céphalexine en cas de pyodermite. Advantage Multi."},{"k":"Pronostic / prévention","t":"bon pour les juvéniles (< 18 mois), réservé pour l'apparition à l'âge adulte (> 4 ans)"},{"k":"Surveillance / examens complémentaires","t":"L'amitraz peut causer des effets secondaires de vomissements et de sédation"},{"k":"Commentaires","t":"Il existe quelques autres médicaments oraux pouvant être utilisés hors indication pour traiter l'acarien Demodex. Ceux-ci incluent la milbémycine oxime (Interceptor® et Sentinel®), l'afoxolaner (NexGard®) et le fluralaner (Bravecto®)."}]},{"label":"SAM 2 (notes détaillées)","text":"ACARIOSE-GALE 1-Démodécie-Raclages cutanés profonds d'au moins trois sites pour la plupart des espèces d'acariens Demodex.○\nPresser la peau pour extruder les acariens des follicules pileux immédiatement avant et/ou pendant le raclage; continuer le raclage jusqu'à voir un léger saignement capillaire. Rx-➣ Démodécie localisée= ne nécessite pas de traitement; des agents antimicrobiens topiques comme le gel de peroxyde de benzoyle ou la mupirocine peuvent être utilisés.\n• Le traitement de la démodécie canine généralisée nécessite plusieurs mois et un engagement de la part du propriétaire. Tous les traitements doive is traitements q 2 semaines.\n• Un traitement antibiotique concomitant (ex., céphalexine 22-30 mg/kg PO q 12h pendant 30 jours) peut être requis si une pyodermite secondaire est présente.\n• Un traitement corticostéroïde à court terme peut être requis chez les chiens sévèrement prurigineux (ex., prednisone 0,5-1 mg/kg PO q 24h pendant 3-4 jours puis sevrage progressif) Le pronostic avec un traitement approprié est excellent."}]},{"id":"puces","nom":"Puces et dermatite allergique aux piqûres de puces (DAPP)","sys":"Dermatologie","urg":false,"resume":"Dermatite miliaire prurigineuse, alopécie en région lombosacrée, pyodermite secondaire. Contrôle des puces + traitement du prurit.","src":["SAM1 — puces","SAM 2 — dermatite allergique aux puces"],"img":[],"sp":{"chien":{"tx":[{"d":"fluralaner","r":"1","n":"Bravecto®"},{"d":"afoxolaner","r":"1","n":"NexGard®"},{"d":"sarolaner","r":"1","n":"Simparica®"},{"d":"lotilaner","r":"1","n":"Credelio®"},{"d":"selamectine","r":"1","n":"Revolution®"},{"d":"nitenpyram","r":"S","n":"Capstar® : action rapide"},{"d":"prednisolone","r":"S","n":"Prurit : 5–7 jours"},{"d":"hydrocortisone_topique","r":"S","n":"Cortavance®"},{"d":"oclacitinib","r":"2","n":"Apoquel®"}],"maj":"AAHA 2023 : lutte antipuces rigoureuse (animaux + environnement) = base du traitement.","qc":"","al":"","gl":["aaha_allergie_2023"]},"chat":{"tx":[{"d":"lotilaner","r":"1","n":"Credelio Cat®"},{"d":"fluralaner","r":"1","n":"Bravecto®"},{"d":"selamectine","r":"1","n":"Revolution®"},{"d":"nitenpyram","r":"S","n":"Capstar®"},{"d":"prednisolone","r":"S","n":"Prurit : prednisolone 2,2 mg/kg selon vos notes"}],"maj":"Chat : tous les chats du foyer doivent être traités.","qc":"","al":"","gl":["aaha_allergie_2023"]}},"notes":[{"label":"Tableau SAM1 — Puces (p.729)","fields":[{"k":"Signes cliniques / examen physique","t":"Dermatite miliaire prurigineuse, pyodermite bactérienne secondaire"},{"k":"Diagnostic différentiel","t":"Ectoparasites, allergie aux piqûres de puces, sarcoptes, teigne, dermatite atopique, alimentaire, parasites GI, médicaments, pyodermite, Malassezia (chien), maladie des sacs anaux (chat)"},{"k":"Diagnostic","t":"Peignage antipuces, réponse à l'éradication des puces"},{"k":"Traitement (Rx)","t":"prednisone 1 (chien) – 2,2 (chat) mg/kg PO die pendant 5–7 jours, puis dégression, spray d'hydrocortisone topique (chien), TFA : sélamectine (Revolution), imidaclopride (Advantage), fipronil, oral : Bravecto (3 mois de protection), Capstar"},{"k":"Pronostic / prévention","t":"Bon avec un contrôle continu des puces"},{"k":"Surveillance / examens complémentaires","t":"Contrôle environnemental : nettoyage/aspiration fréquente, retrait des débris organiques à l'extérieur, évitable, non curable, traiter tous les animaux"}]},{"label":"SAM 2 (notes détaillées)","text":"DERMATITE ALLERGIQUE AUX PUCES-Développement de réaction(s) d'hypersensibilité et lésions cutanées prurigineuses subséquentes en réponse à l'exposition aux antigènes salivaires de puces. Chiens : prednisone/prednisolone 1 mg/kg PO quotidiennement pendant 5-7 jours, puis diminution progressive;\nChats : prednisolone 2,2 mg/kg PO quotidiennement pendant 5-7 jours, puis diminution progressive. Adulticide antipuce topique- spray/spot-on de perméthrine, fipronil (Frontline), sélamectine (Revolution)"}]},{"id":"atopie","nom":"Dermatite atopique","sys":"Dermatologie","urg":false,"resume":"IgE contre allergènes environnementaux : prurit du museau, régions périoculaires, pattes, aisselles, otites récidivantes. Diagnostic d'exclusion (puces, aliment, gale).","src":["SAM1 — atopie"],"img":[],"sp":{"chien":{"tx":[{"d":"oclacitinib","r":"1","n":"Apoquel® (inhibiteur de JAK)"},{"d":"lokivetmab","r":"1","n":"Cytopoint® (anticorps anti-IL-31)"},{"d":"ilunocitinib","r":"1","n":"Zenrelia®"},{"d":"atinvicitinib","r":"1","n":"Numelvi®"},{"d":"ciclosporine","r":"2","n":"Atopica® : longue durée"},{"d":"prednisolone","r":"2","n":"Cures courtes"},{"d":"hydrocortisone_topique","r":"S","n":"Cortavance®"},{"d":"acide_gras","r":"S","n":""},{"d":"diphenhydramine","r":"S","n":"Antihistaminiques : effet modeste"}],"maj":"ICADA 2026 : approche réactive (résoudre le prurit/lésions) puis proactive (maintenir la rémission). AAHA 2023 : démarche complète (puces, aliment, atopie). Plusieurs inhibiteurs de JAK (Apoquel®, Zenrelia®, Numelvi®) sont commercialisés au Canada; Cytopoint® (produit biologique) : vérifier auprès du fournisseur.","qc":"","al":"","gl":["icada_dac_2026","aaha_allergie_2023"]},"chat":{"tx":[{"d":"prednisolone","r":"1","n":""},{"d":"ciclosporine","r":"1","n":"Atopica for Cats®"},{"d":"diphenhydramine","r":"S","n":""},{"d":"hydroxyzine","r":"S","n":""},{"d":"acide_gras","r":"S","n":""}],"maj":"Atopie féline (dermatite miliaire, prurit facial, alopécie symétrique, granulome éosinophilique) : prednisolone ou ciclosporine; immunothérapie allergénique possible.","qc":"","al":"","gl":["aaha_allergie_2023"]}},"notes":[{"label":"Tableau SAM1 — Atopie (p.213)","fields":[{"k":"Signes cliniques / examen physique","t":"IgE contre des allergènes environnementaux. Prurit du museau, de la région périoculaire, des conduits auditifs/pavillons, des espaces interdigités, des aisselles et de l'aine"},{"k":"Diagnostic différentiel","t":"Sarcoptes, Demodex, puces, Malassezia, dermatophytose, alimentaire, contact, médicament"},{"k":"Diagnostic","t":"raclages profonds, trichographie, cytologie, culture fongique"},{"k":"Traitement (Rx)","t":"antihistaminiques aident 30 % : diphenhydramine (chien), chlorphéniramine (chat), AGE oméga-3 (20 %), prednisone, cyclosporine (Atopica) caps. q1j, puis q2j (50 %), désensibilisation basée sur l'IDST (70 %)"},{"k":"Pronostic / prévention","t":"bon avec une bonne observance du client et un traitement individualisé."},{"k":"Surveillance / examens complémentaires","t":"problème à vie, le but est de minimiser l'exposition aux allergènes. Ne pas faire reproduire"}]}]},{"id":"pemphigus","nom":"Complexe des pemphigus","sys":"Dermatologie","urg":false,"resume":"Maladies auto-immunes : pustules/croûtes sur le museau, pavillons, coussinets. Biopsie.","src":["SAM1 — pemphigus"],"img":[],"sp":{"chien":{"tx":[{"d":"prednisolone","r":"1","n":""},{"d":"azathioprine","r":"2","n":""},{"d":"ciclosporine","r":"2","n":""}],"maj":"Biopsie cutanée pour confirmer; association d'un immunosuppresseur d'épargne.","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"prednisolone","r":"1","n":""},{"d":"chlorambucil","r":"2","n":"Pas d'azathioprine chez le chat"},{"d":"ciclosporine","r":"2","n":""}],"maj":"Chat : pas d'azathioprine (myélosuppression).","qc":"","al":"","gl":[]}},"notes":[{"label":"Tableau SAM1 — Complexe des pemphigus","fields":[{"k":"Diagnostic","t":"Cytologie du contenu de pustules intactes ou de l'exsudat sous une croûte : neutrophiles intacts, éosinophiles, amas de kératinocytes acantholytiques"},{"k":"Traitement (Rx)","t":"prednisone +/- azathioprine (pas chez les chats - myélosuppression) ou cyclosporine"},{"k":"Pronostic / prévention","t":"PF : passable à bon ; PV : 39 % de mortalité ou d'euthanasie"},{"k":"Surveillance / examens complémentaires","t":"nature chronique de la maladie, effets secondaires potentiels du traitement immunosuppresseur"}]}]},{"id":"cellulite_juvenile","nom":"Cellulite juvénile (pyodermite stérile du chiot)","sys":"Dermatologie","urg":false,"resume":"Chiots : gonflement/pustules du visage, des pavillons auriculaires, des glandes sous-maxillaires; raclages négatifs pour Demodex; bon pronostic.","src":["SAM 2 — cellulite juvénile"],"img":[],"sp":{"chien":{"tx":[{"d":"prednisolone","r":"1","n":"Jusqu'à résolution (≈ 1–4 semaines)"},{"d":"cephalexine","r":"S","n":"Si surinfection"},{"d":"ciclosporine","r":"2","n":"Cas récalcitrants"}],"maj":"Maladie vésiculopustuleuse à granulomateuse stérile : traiter tôt pour éviter les cicatrices.","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"CELLULITE JUVÉNILE-Une maladie cutanée vésiculopustuleuse à granulomateuse stérile du visage, des pavillons auriculaires, et des ganglions lymphatiques sous-mandibulaires affectant principalement les chiens de < 4 mois. Frottis d'empreinte et évaluation cytologique de la pustule= Nombreux neutrophiles et macrophages (inflammation pyogranulomateuse) sans bactéries.\n• Raclages cutanés : négatifs pour l'acarien Demodex\nRx- ➣Prednisone ou prednisolone (2 mg/kg PO q 24h, ou la dose totale peut être divisée q 12h) jusqu'à résolution des lésions (≈1-4 semaines), puis réduire à 2 mg/kg PO q 48h pendant 2 semaines, puis diminuer progressivement la prednisone sur les 2-3 semaines suivantes.\n• Antibiotiques bactéricides pendant 3-4 semaines requis si preuve cytologique ou clinique de pyodermite secondaire présente\n• Trempages à l'eau tiède pour retirer les croûtes et exsudats\n• La ciclosporine orale peut être combinée avec la prednisone orale dans les cas récalcitrants. pronostic-bon"}]},{"id":"granulome_eosinophilique","nom":"Complexe du granulome éosinophilique","sys":"Dermatologie","urg":false,"resume":"Plaque éosinophilique, ulcère indolent, granulome linéaire; prurit; souvent secondaire à une allergie.","src":["SAM1 — granulome éosinophilique","SAM 2 — granulome éosinophilique"],"img":[],"sp":{"chat":{"tx":[{"d":"prednisolone","r":"1","n":"1–2 mg/kg q12h puis dégression"},{"d":"ciclosporine","r":"2","n":"Atopica for Cats® — répertorié au Canada"},{"d":"fluralaner","r":"S","n":"Lutte antipuces"},{"d":"diete_therapeutique","r":"S","n":"Diète hypoallergénique"}],"maj":"Atopica for Cats® est commercialisé au Canada selon la BDPP (vos notes le décrivaient comme « récemment approuvé »); rechercher la cause sous-jacente (puces, aliment, atopie).","qc":"","al":"","gl":["aaha_allergie_2023"]}},"notes":[{"label":"Tableau SAM1 — Complexe du granulome éosinophilique (p.652)","fields":[{"k":"Signes cliniques / examen physique","t":"jeunes chats, granulome éosinophilique, ulcère indolent, plaque éosinophilique"},{"k":"Diagnostic différentiel","t":"CCE pour tous les GE et plaques : lymphome, MCT, Demodex, teigne, pyodermite bactérienne, mycobactérie/infection. UI : herpèsvirus/calicivirus, FeLV, Cryptococcus. Lésions des lèvres/de la bouche : fibrosarcome, inflammation due à un corps étranger, traumatisme"},{"k":"Diagnostic","t":"Examen microscopique de poils arrachés, raclage cutané, peignage antipuces pour exclure les ectoparasites ou traitement ectoparasiticide empirique, culture (myco)bactérienne, cytologie de surface : ↑ éosinophiles, prolifération bactérienne/de Malassezia. Biopsie : infiltrat dermique éosinophilique"},{"k":"Traitement (Rx)","t":"Prednisone 1–2 mg/kg PO q 12h au départ, dégression jusqu'à la plus faible dose efficace, ou cyclosporine (Atopica pour chats), contrôle des puces, diètes hypoallergéniques, désensibilisation"},{"k":"Pronostic / prévention","t":"La plupart des cas répondent bien au traitement médical. La récidive est fréquente ; un traitement intermittent à vie est donc nécessaire dans de nombreux cas"},{"k":"Surveillance / examens complémentaires","t":"Les effets secondaires des corticostéroïdes ne sont habituellement pas significatifs chez les chats, mais une utilisation prolongée peut causer des effets secondaires tels qu'une prise de poids."}]},{"label":"SAM 2 (notes détaillées)","text":"COMPLEXE GRANULOME ÉOSINOPHILIQUE\n1)Le granulome collagénolytique-aussi connu comme granulome éosinophilique/granulome linéaire. Lésions cutanées linéaires érythémateuses, alopéciques, surélevées sur le thorax latéral, l'épaule latérale, ou l'aspect caudal des cuisses; prurit et douleur variables○ Nodules dans la cavité buccale (surfaces dorsale et latérale de la langue, palais dur et mou, plis glosso-pharyngiens) ou au menton; la surface est souvent tachetée de petites zones blanches denses. 2)Plaque éosinophilique-○ Lésions cutanées érythémateuses, surélevées, en forme de plaque, communément sur l'abdomen ventral, et les cuisses médiales; prurit et douleur variables. Aspect en pavé et souvent prurigineux. 3)Ulcère éosinophilique- ulcère indolent, survenant typiquement sur la lèvre supérieure avec des bords surélevés entourant une surface ulcérée rose-jaune. Diagnostic-Biopsie Investiguer en premier=Les troubles d'hypersensibilité (allergie aux puces, à la nourriture, ou aux inhalants) doivent être investigués en instaurant un contrôle strict des puces, en testant les allergènes environnementaux (intradermique ou in vitro), et en menant des essais d'élimination alimentaire. La désensibilisation, le contrôle continu des insectes, et la gestion alimentaire doivent être utilisés le cas échéant. Rx- Antibiotique + ciclosporine + traitement aux glucocorticoïdes. L'excision chirurgicale et la thérapie laser peuvent être tentées pour les lésions orales isolées.\n• Glucocorticostéroïdes oraux : 1-2 mg/kg de prednisone ou prednisolone PO q 12h initialement, puis diminuer progressivement à la dose efficace la plus basse.\n• La ciclosporine orale (Atopica pour chats) récemment approuvée pour le traitement de la dermatite allergique chez le chat. Indiquée à une posologie de 7 mg/kg PO q 24h initialement, puis diminuer progressivement à q 48h à 72h selon la réponse clinique.\n• Traiter l'infection secondaire et la cause sous-jacente le cas échéant."}]},{"id":"otite_externe","nom":"Otite externe","sys":"Dermatologie","urg":false,"resume":"Conduit auriculaire inflammé : prurit, secouements de la tête, cérumen/pus, odeur. Antifongique + antibiotique + anti-inflammatoire topiques.","src":["SAM 2 — otite externe"],"img":[],"sp":{"chien":{"tx":[{"d":"otique_triple","r":"1","n":"Mometamax®, Otomax®, Osurnia®, etc."},{"d":"miconazole_chlorhex","r":"S","n":"Nettoyants/antiseptiques"},{"d":"prednisolone","r":"2","n":"Cas sévères, après exclusion d'infection profonde"}],"maj":"Cytologie à chaque cas; traiter la cause primaire (allergie, corps étranger, endocrinopathie); proactive hydrocortisone topique étudiée pour l'otite allergique (étude 2026).","qc":"","al":"","gl":["aaha_allergie_2023"]},"chat":{"tx":[{"d":"otique_triple","r":"1","n":"Selon l'étiquette — certains produits ne sont pas indiqués chez le chat"},{"d":"selamectine","r":"S","n":"Otodectes"}],"maj":"Chat : vérifier la présence d'Otodectes; polypes, otite moyenne.","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"OTITE EXTERNE- Un traitement efficace pour l'otite externe non compliquée est un antifongique, antibiotique, et anti-inflammatoire/stéroïde. Ex- Tresaderm (thiabendazole, néomycine, dexaméthasone)"}]},{"id":"arthrose","nom":"Arthrose (ostéoarthrite)","sys":"Orthopédie","urg":false,"resume":"Dégénérescence progressive du cartilage : boiterie, raideur, réticence à sauter. AINS, anti-NGF, perte de poids, réadaptation; chondroprotecteurs en adjuvant.","src":["SAM 2 — ostéoarthrite / maladie articulaire dégénérative"],"img":[],"sp":{"chien":{"tx":[{"d":"carprofene","r":"1","n":"Rimadyl®"},{"d":"meloxicam","r":"1","n":"Metacam®"},{"d":"firocoxib","r":"1","n":"Previcox®"},{"d":"grapiprant","r":"1","n":"Galliprant®"},{"d":"bedinvetmab","r":"1","n":"Librela® (anti-NGF)"},{"d":"izenivetmab","r":"1","n":"Lenivia® (anti-NGF à longue durée)"},{"d":"gabapentine","r":"S","n":""},{"d":"amantadine","r":"S","n":"Avec un AINS"},{"d":"psgag","r":"S","n":"Adequan®"},{"d":"pentosane","r":"S","n":"Cartrophen®"},{"d":"tramadol","r":"2","n":"Efficacité limitée chez le chien"},{"d":"glucosamine","r":"S","n":"Faible niveau de preuve"}],"maj":"AAHA 2022 : approche multimodale (poids, rééducation, AINS, anti-NGF). Les anticorps anti-NGF (Librela®, Lenivia®) sont commercialisés au Canada; un article 2026 (JAVMA) soulève des préoccupations de sécurité (arthrose rapidement progressive) et appelle à la vigilance et à la déclaration des effets indésirables.","qc":"","al":"Tramadol : preuves d'efficacité limitées chez le chien dans les essais récents.","gl":["aaha_douleur_2022","et_bedinvetmab_2026"]},"chat":{"tx":[{"d":"meloxicam","r":"1","n":"Dose chronique à la plus faible dose efficace"},{"d":"robenacoxib","r":"1","n":"Onsior®"},{"d":"frunevetmab","r":"1","n":"Solensia® (anti-NGF)"},{"d":"relfovetmab","r":"1","n":"Portela® (anti-NGF à longue durée)"},{"d":"gabapentine","r":"S","n":""},{"d":"amantadine","r":"S","n":""}],"maj":"Chat : arthrose très sous-diagnostiquée; surveiller la fonction rénale lors d'un usage d'AINS; anticorps anti-NGF félins commercialisés au Canada.","qc":"","al":"","gl":["aaha_douleur_2022"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"OSTÉOARTHRITE/MALADIE ARTICULAIRE DÉGÉNÉRATIVE-Détérioration progressive, non inflammatoire, irréversible du cartilage articulaire Radiographie : sclérose sous-chondrale, rétrécissement de l'espace articulaire, ostéophytose, enthésiophytose, épaississement de la capsule articulaire, attrition osseuse sous-chondrale, corps calcifiés intra-articulaires, calcification des tissus mous ou kystes sous-chondraux, remodelage osseux, épanchement articulaire. Arthrocentèse et analyse du liquide synovial : numération cellulaire totale < 5000 cellules nucléées/mcL; les cellules mononucléées/macrophages prédominent, < 10% de cellules polymorphonucléaires; le liquide est clair, trouble, ou jaune pâle avec une viscosité normale à diminuée.\n• AINS pour réduire les médiateurs inflammatoires et la douleur. Carprofène : 2,2 mg/kg PO q 12h ou\nméloxicam : 0,1 mg/kg PO q 24h ou firocoxib : 5 mg/kg PO q 24h\n• Un agent chondroprotecteur : glycosaminoglycane polysulfaté : 5 mg/kg IM une fois par semaine pendant 4-6 semaines (chiens)\n• Pentosane polysulfate : 3 mg/kg SC une fois par semaine (chiens) Formulations orales (glucosamine, sulfate de chondroïtine, hyaluronane) : selon la formulation/les instructions de l'étiquette\n• Tramadol 2-5 mg/kg PO q 8-12h) si nécessaire pour diminuer la douleur\n• Antagoniste du récepteur NMDA : amantadine 3-5 mg/kg PO q 24h donné avec un AINS L'ostéoarthrite est typiquement une maladie irréversible, lentement progressive."}]},{"id":"osteochondrose","nom":"Ostéochondrose","sys":"Orthopédie","urg":false,"resume":"Grands/géants à croissance rapide (4–8 mois) : boiterie, gonflement articulaire. Épaule bon pronostic après traitement; coude/jarret plus réservés.","src":["SAM 2 — ostéochondrose"],"img":["sam2_p96_0","sam2_p96_1"],"sp":{"chien":{"tx":[{"d":"carprofene","r":"1","n":""},{"d":"meloxicam","r":"1","n":""},{"d":"firocoxib","r":"1","n":""},{"d":"psgag","r":"S","n":"Adequan®"},{"d":"pentosane","r":"S","n":""}],"maj":"Repos 6 semaines; arthroscopie/arthrotomie pour retirer les lambeaux de cartilage; surveillance de l'arthrose.","qc":"","al":"","gl":["aaha_douleur_2022"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"OSTÉOCHONDROSE- L'ostéochondrose est une anomalie de l'ossification endochondrale qui produit un épaississement non douloureux du cartilage. Chez les chiens de grande et géante race à croissance rapide, les premiers signes peuvent apparaître au taux de croissance maximal (4-8 mois d'âge). La plainte principale est habituellement une boiterie, de degré et durée variables- peut être unilatérale ou bilatérale.\nDouleur articulaire, gonflement, crépitement, amplitude de mouvement diminuée pendant la flexion et l'extension. Rx- Restriction de l'exercice pendant 6 semaines.\nAINS- Carprofène 2,2 mg/kg PO q 12h ou firocoxib 5 mg/kg PO q 24h ou méloxicam 0,1\nmg/kg PO q 24h Arthrotomie ou arthroscopie pour retirer le cartilage lâche, décoloré, épaissi, ou dévitalisé, les lambeaux de cartilage, et les fragments ostéochondraux intra-articulaires Glycosaminoglycanes polysulfatés (PSGAG) : 4,4 mg/kg IM, q 3-4 jours jusqu'à 4 semaines\n(maximum de 8 injections) OU pentosane polysulfate : intra-articulaire (5-10 mg/articulation par semaine); IM ou SC (3 mg/kg une fois par semaine pendant 4 semaines); ou PO (10 mg/kg par semaine pendant 4 semaines, répété tous les 3 mois) OU hyaluronane : 3-5 mg intra-articulaire, une fois par semaine.\n• PRONOSTIC-Épaule : bon après traitement. Coude : passable à bon quand les dommages cartilagineux sont minimes chez les jeunes animaux Grasset : variable; une grande lésion chez un jeune animal peut avoir un mauvais pronostic. Jarret : passable; l'épaississement de la capsule articulaire aide à stabiliser l'articulation."}]},{"id":"hod","nom":"Ostéodystrophie hypertrophique","sys":"Orthopédie","urg":false,"resume":"Gonflement douloureux des métaphyses distales (radius, ulna, tibia); fièvre; ligne radiotransparente métaphysaire.","src":["SAM 2 — ostéodystrophie hypertrophique"],"img":["sam2_p97_0"],"sp":{"chien":{"tx":[{"d":"carprofene","r":"1","n":""},{"d":"prednisolone","r":"2","n":"Chez les Weimaraners (selon vos notes)"},{"d":"buprenorphine","r":"S","n":"Douleur sévère"}],"maj":"Maladie métaphysaire du jeune chien à croissance rapide; soutien : repos, confinement, litière douce.","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"OSTÉODYSTROPHIE HYPERTROPHIQUE-Ostéopathie métaphysaire.\nUne maladie des os longs des jeunes chiens à croissance rapide, causant une perturbation des travées métaphysaires; habituellement bilatérale. Plainte-début aigu d'un gonflement des membres antérieurs distaux ou occasionnellement des membres postérieurs distaux. Les métaphyses (le plus souvent du radius, de l'ulna, et du tibia distaux) sont gonflées, chaudes, modérément douloureuses. Les radiographies montrent une ligne radiotransparente anormale dans la métaphyse. Rx- AINS ex., carprofène. Repos, confinement, literie molle, retournement toutes les 4-6 heures si non ambulatoire\nLes corticostéroïdes doivent être utilisés chez les Weimaraners."}]},{"id":"panosteite","nom":"Panostéite","sys":"Orthopédie","urg":false,"resume":"Boiterie aiguë, parfois alternante, douleur à la palpation profonde de la diaphyse; opacité médullaire.","src":["SAM 2 — panostéite"],"img":["sum_7"],"sp":{"chien":{"tx":[{"d":"carprofene","r":"1","n":""},{"d":"meloxicam","r":"1","n":""},{"d":"tramadol","r":"S","n":"Rarement nécessaire"},{"d":"butorphanol","r":"S","n":"Rarement nécessaire"}],"maj":"Maladie auto-limitante du jeune chien (bergers allemands) : boiterie « migratrice »; répéter les radiographies si doute; analgésie.","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"PANOSTÉITE-Une affection spontanée, spontanément résolutive, douloureuse des portions diaphysaires et métaphysaires des os longs, fréquente chez les jeunes chiens. Le berger allemand est à plus haut risque. La plainte caractéristique est une boiterie aiguë de sévérité variable, dans un seul os ou membre, ou comme une boiterie récurrente « à bascule ». Une douleur à la palpation profonde (ferme) des portions diaphysaires et métaphysaires distales des os affectés est caractéristique. Rx- Les AINS fournissent une analgésie adéquate.\nL'utilisation d'analgésiques opioïdes pour l'inconfort est rarement nécessaire mais peut être envisagée chez les patients ayant une contre-indication à l'utilisation des AINS.\n• Butorphanol : 1-4 mg/kg PO q 4-6h, ou\n• Tramadol : 1-4 mg/kg PO q 6-8h Le pronostic à long terme est très bon."}]},{"id":"osteomyelite","nom":"Ostéomyélite","sys":"Orthopédie","urg":false,"resume":"Infection osseuse aiguë ou chronique (hématogène, traumatique/post-opératoire) : boiterie, douleur, fièvre; culture et antibiogramme.","src":["SAM 2 — ostéomyélite"],"img":[],"sp":{"chien":{"tx":[{"d":"amox_clav","r":"1","n":"Staphylococcus fréquents; culture"},{"d":"cefazoline","r":"1","n":"IV"},{"d":"clindamycine","r":"2","n":""},{"d":"cloxacilline","r":"2","n":"IV"},{"d":"itraconazole","r":"2","n":"Ostéomyélite fongique"},{"d":"fluconazole","r":"2","n":""}],"maj":"Culture et antibiogramme (osseuse) pour guider le traitement; durée prolongée; radiographies q4–6 semaines.","qc":"","al":"","gl":[]},"chat":{"tx":[{"d":"amox_clav","r":"1","n":""},{"d":"clindamycine","r":"2","n":""},{"d":"cefazoline","r":"1","n":""}],"maj":"Chat : morsures, Pasteurella.","qc":"","al":"","gl":[]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"OSTÉOMYÉLITE-Un processus inflammatoire aigu ou chronique de l'os secondaire à une infection hématogène ou traumatique par des organismes pyogènes. Une chirurgie orthopédique, un traumatisme, ou un voyage (infection fongique systémique) peuvent figurer dans l'anamnèse récente. Le propriétaire peut avoir noté léthargie, anorexie, boiterie, gonflement, signes de douleur, ou trajets fistuleux cutanés. CONSTATATIONS À L'EXAMEN PHYSIQUE-Ostéomyélite aiguë : fièvre, léthargie, anorexie, gonflement/douleur du membre ou de l'articulation, boiterie. Ostéomyélite chronique : trajets fistuleux, normothermie, atrophie musculaire de non-usage, boiterie, déformation du membre. L'ostéomyélite aiguë nécessite 4-6 semaines d'antimicrobiens basés sur les résultats de culture et antibiogramme.\nComme Staphylococcus spp. est le plus fréquent,\nle traitement initial peut inclure : acide clavulanique/amoxicilline : 10-20 mg/kg PO q12h, ou\ncéfazoline : 10-30 mg/kg SC, IM, ou IV q8h; ou\nclindamycine : 5-10 mg/kg PO q 12h; ou cloxacilline : 20-40 mg/kg PO q 8h\n• Les choix pour l'ostéomyélite fongique incluent itraconazole, kétoconazole, amphotéricine B, et fluconazole. Surveillance recommandée\n• Radiographies à intervalles de 4-6 semaines pour évaluer la guérison\n• Les cliniciens peuvent aspirer et recultiver si l'animal montre des signes de récidive. Bilan initial\n• NFS, bilan biochimique sérique Radiographies craniocaudales et médiolatérales de l'os affecté Arthrocentèse avec examen cytologique, culture et antibiogramme si atteinte articulaire présente."}]},{"id":"lcc","nom":"Rupture du ligament croisé crânial (LCC)","sys":"Orthopédie","urg":false,"resume":"Boiterie postérieure aiguë ou progressive; tiroir crânial, test de compression tibiale; épanchement et épaississement capsulaire.","src":["SAM 2 — rupture du LCC"],"img":[],"sp":{"chien":{"tx":[{"d":"carprofene","r":"1","n":""},{"d":"meloxicam","r":"1","n":""},{"d":"gabapentine","r":"S","n":""},{"d":"buprenorphine","r":"S","n":""}],"maj":"Repos + AINS à court terme; la chirurgie (TPLO, TTA, suture latérale) est recommandée pour la plupart des chiens de grande taille.","qc":"","al":"","gl":["aaha_douleur_2022"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"RUPTURE DU LCC- Boiterie variable d'un ou des deux membres postérieurs; début aigu ou progressif. Le membre postérieur affecté peut être maintenu levé ou en décharge quand l'animal est debout. La boiterie peut s'aggraver avec l'exercice et s'améliorer avec le repos. Épanchement de l'articulation du grasset et épaississement de la capsule articulaire, souvent le plus prononcé sur l'aspect médial du tibia proximal (formation du renfort médial) Rx- Repos + carprofène 2 mg/kg PO q 12h; Chirurgie-TPLO, avancement de la tubérosité tibiale (TTA) : la fonction à long terme pour les patients ayant subi une procédure reconstructive est bonne."}]},{"id":"rotule","nom":"Luxation de la rotule","sys":"Orthopédie","urg":false,"resume":"Grade 1–2 : « saute-mouton » transitoire; grade 3–4 : boiterie persistante, déformation. Palpation de la rotule, radiographies.","src":["SAM 2 — luxation de la rotule"],"img":["sam2_p99_0"],"sp":{"chien":{"tx":[{"d":"carprofene","r":"1","n":""},{"d":"meloxicam","r":"1","n":""},{"d":"psgag","r":"S","n":""}],"maj":"Luxation médiale la plus fréquente (petites races) : chirurgie pour les grades 3–4 ou les cas symptomatiques; une boiterie brusque évoque une rupture du LCC associée.","qc":"","al":"","gl":["aaha_douleur_2022"]}},"notes":[{"label":"SAM 2 (notes détaillées)","text":"LUXATION DE LA ROTULE-La luxation patellaire médiale (LPM) est la forme la plus fréquente. Luxation de bas grade : démarche transitoire en « sautillement » (maintien du membre postérieur fléchi et en décharge pendant quelques pas à la fois) en marchant ou courant; la luxation de grade 2 peut être associée à une claudication constante.\n• Luxation de haut grade : boiterie soutenue due à une déformation secondaire du membre\n• Faiblesse pour sauter ou réticence à sauter • Une boiterie soudaine ou une augmentation de la boiterie dans un grasset avec luxation patellaire chronique suggère une rupture récente du ligament croisé crânial. La rotule peut être déplacée manuellement dans et hors de la gouttière trochléaire pendant la flexion et l'extension avec les luxations de grades 1 et 2; un crépitement peut être palpable avec le grade 2.\n• Avec des grades plus élevés, la rotule peut parfois être palpée médialement ou latéralement au condyle fémoral; la gouttière trochléaire peut être palpable Rx-AINS, chirurgie= incisions de relâchement fascial, imbrication de la capsule articulaire, approfondissement de la gouttière trochléaire, résection cunéiforme, transposition de la crête tibiale."}]}],"drugs":{"maropitant":{"id":"maropitant","dci":"maropitant","classe":"Antiémétique (antagoniste des récepteurs NK1)","pa":"citrate de maropitant","tag":"vet","note":"","vet":[{"b":"Cerenia","c":"Zoetis Canada Inc"},{"b":"Emavert","c":"Dechra Regulatory Bv"},{"b":"Emavert Tablets","c":"Felix Pharmaceuticals Pvt. Ltd."},{"b":"Maropikare Tablets","c":"Felix Pharmaceuticals Pvt. Ltd."}],"hum":[],"use":[{"m":"corps_etranger","s":"chien","r":"S"},{"m":"corps_etranger","s":"chat","r":"S"},{"m":"invagination","s":"chien","r":"S"},{"m":"invagination","s":"chat","r":"S"},{"m":"gastro_enterite","s":"chien","r":"1"},{"m":"gastro_enterite","s":"chat","r":"1"},{"m":"vomissement","s":"chien","r":"1"},{"m":"vomissement","s":"chat","r":"1"},{"m":"parvovirose","s":"chien","r":"1"},{"m":"panleucopenie","s":"chat","r":"1"},{"m":"gastroenterite_hemorragique","s":"chien","r":"1"},{"m":"pancreatite","s":"chien","r":"1"},{"m":"pancreatite","s":"chat","r":"1"},{"m":"lipidose","s":"chat","r":"S"},{"m":"insuffisance_hepatique","s":"chien","r":"S"},{"m":"chocolat","s":"chien","r":"S"},{"m":"marijuana","s":"chien","r":"S"},{"m":"marijuana","s":"chat","r":"S"},{"m":"ethylene_glycol","s":"chien","r":"S"},{"m":"coup_chaleur","s":"chien","r":"S"},{"
